  ['home','plans','approval','dashboard'].forEach(k => { const b = document.getElementById('mnav-' + k); if (b) b.classList.toggle('active', k === 'approval'); });
}

// ---------- Month helpers ----------
function ymNow() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function ymAdd(ym, n) { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function ymLabel(ym) { return ym.substring(5, 7) + '/' + ym.substring(0, 4); }
function ymShort(ym) { return 'T' + Number(ym.substring(5, 7)) + '/' + ym.substring(2, 4); }
function ymList(from, to) { const a = []; let c = from; while (c <= to && a.length < 40) { a.push(c); c = ymAdd(c, 1); } return a; }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function daysBetween(a, b) { const x = parseLocalDate(a), y = parseLocalDate(b); return (x && y) ? Math.round((y - x) / 86400000) : 0; }

function kpiPeriod(v) {
  const [t, a] = String(v).split(':'); const cur = ymNow();
  if (t === 'm') return { from: a, to: a, label: 'Tháng ' + ymLabel(a), prev: { from: ymAdd(a, -1), to: ymAdd(a, -1) }, prevLabel: 'so với tháng trước' };
  if (t === 'q') {
    const [y, q] = a.split('-').map(Number); const from = y + '-' + String((q - 1) * 3 + 1).padStart(2, '0');
    return { from, to: ymAdd(from, 2), label: 'Quý ' + q + '/' + y, prev: { from: ymAdd(from, -3), to: ymAdd(from, -1) }, prevLabel: 'so với quý trước' };
  }
  if (t === 'y') {
    const from = a + '-01', to = (a === cur.substring(0, 4)) ? cur : a + '-12';
    return { from, to, label: 'Năm ' + a + (to === cur ? ' (đến nay)' : ''), prev: { from: ymAdd(from, -12), to: ymAdd(to, -12) }, prevLabel: 'so với cùng kỳ năm trước' };
  }
  const n = Number(a) || 12, from = ymAdd(cur, -(n - 1));
  return { from, to: cur, label: n + ' tháng gần nhất', prev: { from: ymAdd(from, -n), to: ymAdd(cur, -n) }, prevLabel: 'so với ' + n + ' tháng trước đó' };
}

function kpiPeriodOptions(sel) {
  const cur = ymNow(), y = +cur.substring(0, 4); let q = Math.floor((+cur.substring(5, 7) - 1) / 3) + 1, yy = y;
  const opt = (v, l) => `<option value="${v}" ${v === sel ? 'selected' : ''}>${l}</option>`;
  let o = '<optgroup label="Tháng">';
  for (let i = 0; i < 12; i++) { const ym = ymAdd(cur, -i); o += opt('m:' + ym, 'Tháng ' + ymLabel(ym) + (i === 0 ? ' (hiện tại)' : '')); }
  o += '</optgroup><optgroup label="Quý">';
  for (let i = 0; i < 5; i++) { o += opt('q:' + yy + '-' + q, 'Quý ' + q + '/' + yy); q--; if (q < 1) { q = 4; yy--; } }
  o += '</optgroup><optgroup label="Năm / khác">' + opt('y:' + y, 'Năm ' + y + ' (đến nay)') + opt('y:' + (y - 1), 'Năm ' + (y - 1)) + opt('r:12', '12 tháng gần nhất') + '</optgroup>';
  return o;
}

// ---------- Number formatting ----------
function fM(n) { // gọn: 12,5 tr · 850k
  n = Number(n) || 0; const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(2).replace('.', ',') + ' tỷ';
  if (a >= 1e6) return (n / 1e6).toFixed(1).replace('.', ',') + ' tr';
  if (a >= 1e3) return Math.round(n / 1e3) + 'k';
  return a ? String(Math.round(n)) : '0';
}
function fN(n) { return n == null || isNaN(n) ? '—' : Math.round(n).toLocaleString('vi-VN'); }
function fP(x) { return x == null || isNaN(x) ? '—' : Math.round(x * 100) + '%'; }
function fX(x) { return x == null || isNaN(x) || !isFinite(x) ? '—' : x.toFixed(1).replace('.', ',') + 'x'; }
function rateCls(x) { return x == null ? '' : x >= 0.8 ? 'k-good' : x >= 0.5 ? 'k-warn' : 'k-bad'; }

// ---------- Data ----------
async function loadKpiDashboard(force) {
  const el = document.getElementById('dash-content'); if (!el) return;
  setDashTitle('📊 Dashboard KPI');
  if (!kpiData || force) {
    el.innerHTML = KPI_LOADER;
    try {
      if (force) Object.keys(_apiCache).forEach(k => { if (k.indexOf('getDashboardKPI') !== -1) delete _apiCache[k]; });
      const res = await api('GET', { action: 'getDashboardKPI', months: 24 });
      if (!res || !res.success) throw new Error((res && res.error) || 'Không tải được dữ liệu');
      kpiData = res;
    } catch (e) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-text">Lỗi tải dashboard</div><div class="empty-sub">${e.message || e}</div><button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="loadKpiDashboard(true)">Thử lại</button></div>`;
      return;
    }
  }
  if (!kpiState.period) kpiState.period = 'm:' + ymNow();
  renderKpi();
}

function kpiSet(k, v) {
  kpiState[k] = v;
  const sc = document.getElementById('dash-content'), top = sc ? sc.scrollTop : 0;
  renderKpi();
  if (sc) sc.scrollTop = top;
}

function kpiInScope(p) {
  return (kpiState.ch === 'all' || p.ch === kpiState.ch) && (kpiState.vg === 'all' || p.vg === kpiState.vg);
}
function kpiFilter(from, to) { return (kpiData.plans || []).filter(p => p.m >= from && p.m <= to && kpiInScope(p)); }

function kpiAgg(list) {
  const a = { plans: 0, kh: 0, ht: 0, htPlans: 0, huy: 0, tas: 0, sal: 0,
              pg: 0, lc: 0, sc: 0, gf: 0, tc: 0, actDays: 0, tcDone: 0, pgd: 0, pgh: 0, sq: 0 };
  list.forEach(p => {
    if (KPI_VOID.includes(p.st)) { if (p.st === 'da_huy') a.huy++; return; }
    a.plans++; a.kh += p.nd; a.tas += p.tas; a.sal += p.sal;
    if (p.st === 'hoan_thanh') { a.ht += p.nd; a.htPlans++; a.tcDone += p.tc; }
    if (KPI_ACTIVE.includes(p.st)) {
      a.pg += p.pg; a.lc += p.lc; a.sc += p.sc; a.gf += p.gf; a.tc += p.tc;
      a.actDays += p.nd; a.pgd += p.pgd; a.pgh += p.pgh; a.sq += p.sq;
    }
  });
  a.rate = a.kh ? a.ht / a.kh : null;            // tỉ lệ hoàn thành (theo buổi)
  a.avg  = a.ht ? a.tas / a.ht : null;           // người thử / buổi HT
  a.cpp  = a.tas ? a.tcDone / a.tas : null;      // CP / người thử (buổi HT)
  a.roi  = a.tcDone ? a.sal / a.tcDone : null;   // doanh số / chi phí (buổi HT)
  a.cpb  = a.actDays ? a.tc / a.actDays : null;  // chi phí / buổi
  return a;
}

/** Các phân khúc kênh · vùng có trong dữ liệu (đã áp bộ lọc). */
function kpiSegments(list) {
  const set = {};
  list.forEach(p => { set[p.ch + '|' + p.vg] = 1; });
  const ord = (x, arr) => { const i = arr.indexOf(x); return i < 0 ? 99 : i; };
  return Object.keys(set).map(k => { const [ch, vg] = k.split('|'); return { key: k, ch, vg }; })
    .sort((a, b) => ord(a.ch, KPI_CH) - ord(b.ch, KPI_CH) || a.ch.localeCompare(b.ch) || ord(a.vg, KPI_VG) - ord(b.vg, KPI_VG));
}

// ---------- Render ----------
function renderKpi() {
  const el = document.getElementById('dash-content'); if (!el || !kpiData) return;
  const P = kpiPeriod(kpiState.period);
  const cur = kpiFilter(P.from, P.to);
  const prevOk = P.prev.from >= (kpiData.from || '0000-00');
  const prev = prevOk ? kpiFilter(P.prev.from, P.prev.to) : null;
  const A = kpiAgg(cur), B = prev ? kpiAgg(prev) : null;

  const vgPresent = KPI_VG.filter(v => (kpiData.plans || []).some(p => p.vg === v));
  const seg = (k, v, label) => `<button class="${kpiState[k] === v ? 'on' : ''}" onclick="kpiSet('${k}','${v}')">${label}</button>`;

  let h = `<div class="k-wrap fade-in">
  <div class="k-toolbar">
    <select class="k-select" onchange="kpiSet('period',this.value)">${kpiPeriodOptions(kpiState.period)}</select>
    <div class="k-seg">${seg('ch', 'all', 'Tất cả kênh')}${KPI_CH.map(c => seg('ch', c, c)).join('')}</div>
    <div class="k-seg">${seg('vg', 'all', 'Toàn bộ vùng')}${vgPresent.map(v => seg('vg', v, v === 'Toàn quốc' ? 'Toàn quốc' : 'Miền ' + v)).join('')}</div>
    <div class="k-upd">Dữ liệu lúc ${kpiData.generatedAt || '—'}<button class="k-icon-btn" title="Tải lại" onclick="loadKpiDashboard(true)">↻</button></div>
  </div>
  <div class="k-period">${P.label}${prev ? ` <span>· ${P.prevLabel}</span>` : ''}</div>`;

  h += kpiCardsHtml(A, B);
  h += kpiBox('📍 So sánh theo kênh · vùng', 'Kế hoạch & hoàn thành tính theo <b>buổi</b> (1 ngày sampling = 1 buổi). Hiệu quả tính trên buổi đã hoàn thành.', kpiSegmentTable(cur));
  h += kpiBox('📅 Buổi sampling theo tháng', 'Ma trận tháng × kênh · vùng — ô càng đậm, giá trị càng cao.', kpiMatrix(P));
  h += kpiBox('💰 Chi phí chi tiết', 'Chi phí cam kết = kế hoạch đã duyệt + hoàn thành. Mẫu thử = SL thực dùng (hoặc SL duyệt nếu chưa báo cáo) × giá MT/GT.', kpiCostTable(cur));
  h += `<div class="k-grid2">
    ${kpiBox('🏆 Điểm bán tốt nhất / cần xem lại', 'Chỉ tính điểm có buổi đã hoàn thành & có báo cáo.', kpiTopBottom(cur))}
    ${kpiBox('⚠️ Việc cần xử lý', 'Theo kênh · vùng đang lọc, không phụ thuộc kỳ.', kpiAlerts(cur))}
  </div>
  <div class="k-grid2">
    ${kpiBox('📦 SKU sampling', 'SL mẫu dùng trong kỳ (kế hoạch đã duyệt + hoàn thành).', kpiSkuTable(cur))}
    ${kpiBox('👥 Nhân sự thực hiện', 'Mỗi buổi tính cho từng người thực hiện.', kpiStaffTable(cur))}
  </div>
  <div class="k-foot">tr = triệu đồng · k = nghìn đồng · CP/người = chi phí buổi HT ÷ người thử · DS/CP = doanh số ÷ chi phí buổi HT · Vùng lấy theo người tạo kế hoạch.</div>
  </div>`;
  el.innerHTML = h;
}

function kpiBox(title, sub, body) {
  return `<section class="k-box"><div class="k-box-h"><h3>${title}</h3>${sub ? `<p>${sub}</p>` : ''}</div>${body}</section>`;
}

function kpiDelta(cur, prev, invert) {
  if (prev == null || cur == null || !prev) return '';
  const pct = (cur - prev) / Math.abs(prev);
  if (!isFinite(pct) || Math.abs(pct) < 0.005) return '<span class="k-delta">＝</span>';
  const up = pct > 0, good = invert ? !up : up;
  return `<span class="k-delta ${good ? 'up' : 'down'}">${up ? '▲' : '▼'} ${Math.abs(pct * 100).toFixed(0)}%</span>`;
}

function kpiCardsHtml(A, B) {
  const card = (cls, label, val, sub, d) => `<div class="k-card ${cls}"><div class="k-card-l">${label}</div><div class="k-card-v">${val}</div><div class="k-card-s">${sub}${d}</div></div>`;
  const pgShare = A.tc ? Math.round(A.pg / A.tc * 100) : 0, scShare = A.tc ? Math.round(A.sc / A.tc * 100) : 0;
  return `<div class="k-cards">
    ${card('c-red',   'Buổi hoàn thành', fN(A.ht), `/ ${fN(A.kh)} KH · <b class="${rateCls(A.rate)}">${fP(A.rate)}</b> `, kpiDelta(A.ht, B && B.ht))}
    ${card('c-green', 'Người thử', fN(A.tas), `TB ${fN(A.avg)}/buổi `, kpiDelta(A.tas, B && B.tas))}
    ${card('c-teal',  'Doanh số', fM(A.sal), `${fN(A.htPlans)} kế hoạch HT `, kpiDelta(A.sal, B && B.sal))}
    ${card('c-navy',  'Chi phí cam kết', fM(A.tc), `PG ${pgShare}% · Mẫu ${scShare}% `, kpiDelta(A.tc, B && B.tc, true))}
    ${card('c-yellow','CP / người thử', A.cpp == null ? '—' : fN(A.cpp) + 'đ', 'buổi đã HT ', kpiDelta(A.cpp, B && B.cpp, true))}
    ${card('c-purple','DS / Chi phí', fX(A.roi), `${A.huy} kế hoạch hủy `, kpiDelta(A.roi, B && B.roi))}
  </div>`;
}

function kpiBar(v, max, cls) {
  const w = max > 0 ? Math.max(Math.round(v / max * 100), v > 0 ? 3 : 0) : 0;
  return `<div class="k-bar ${cls || ''}"><i style="width:${w}%"></i></div>`;
}

function kpiSegmentTable(list) {
  if (!list.length) return '<div class="k-empty">Không có kế hoạch trong kỳ này</div>';
  const segs = kpiSegments(list);
  const rows = segs.map(s => ({ s, a: kpiAgg(list.filter(p => p.ch === s.ch && p.vg === s.vg)) }));
  const maxSal = Math.max(...rows.map(r => r.a.sal), 1), maxTas = Math.max(...rows.map(r => r.a.tas), 1);
  const line = (label, a, cls) => `<tr class="${cls || ''}">
      <td class="k-l">${label}</td>
      <td>${fN(a.kh)}</td><td><b>${fN(a.ht)}</b></td>
      <td><span class="k-pill ${rateCls(a.rate)}">${fP(a.rate)}</span></td>
      <td>${fN(a.tas)}${cls ? '' : kpiBar(a.tas, maxTas, 'g')}</td>
      <td>${fN(a.avg)}</td>
      <td>${fM(a.sal)}${cls ? '' : kpiBar(a.sal, maxSal, 't')}</td>
      <td>${fM(a.tc)}</td>
      <td>${a.cpp == null ? '—' : fN(a.cpp)}</td>
      <td>${fX(a.roi)}</td>
    </tr>`;
  let body = '';
  KPI_CH.concat([...new Set(segs.map(s => s.ch))].filter(c => !KPI_CH.includes(c))).forEach(ch => {
    const chRows = rows.filter(r => r.s.ch === ch);
    if (!chRows.length) return;
    if (chRows.length > 1) body += line(`<b>${ch}</b>`, kpiAgg(list.filter(p => p.ch === ch)), 'k-sub');
    chRows.forEach(r => { body += line(chRows.length > 1 ? `<span class="k-ind">${r.s.vg}</span>` : `<b>${ch}</b> · ${r.s.vg}`, r.a); });
  });
  body += line('<b>Tổng</b>', kpiAgg(list), 'k-total');
  return `<div class="k-tbl-wrap"><table class="k-tbl">
    <thead><tr><th class="k-l">Kênh · Vùng</th><th>Buổi KH</th><th>Buổi HT</th><th>% HT</th><th>Người thử</th><th>TB/buổi</th><th>Doanh số</th><th>Chi phí</th><th>CP/người</th><th>DS/CP</th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

function kpiMatrix(P) {
  let months = ymList(P.from, P.to);
  if (months.length < 3) months = ymList(ymAdd(P.to, -5), P.to);
  months = months.filter(m => m >= (kpiData.from || '0000'));
  const list = (kpiData.plans || []).filter(p => months.includes(p.m) && kpiInScope(p));
  if (!list.length) return '<div class="k-empty">Không có dữ liệu</div>';
  const segs = kpiSegments(list);
  const metrics = { ht: 'Buổi HT', tas: 'Người thử', sal: 'Doanh số', tc: 'Chi phí' };
  const val = a => kpiState.mx === 'ht' ? a.ht : kpiState.mx === 'tas' ? a.tas : kpiState.mx === 'sal' ? a.sal : a.tc;
  const show = a => kpiState.mx === 'ht' ? `<b>${fN(a.ht)}</b><small>/${fN(a.kh)}</small>` : kpiState.mx === 'tas' ? fN(a.tas) : fM(val(a));
  const grid = months.map(m => segs.map(s => kpiAgg(list.filter(p => p.m === m && p.ch === s.ch && p.vg === s.vg))));
  let max = 0; grid.forEach(r => r.forEach(a => { max = Math.max(max, val(a)); }));
  const heat = v => max ? `background:rgba(${kpiState.mx === 'tc' ? '27,58,87' : '14,117,68'},${(0.06 + 0.5 * v / max).toFixed(2)})` : '';
  const tabs = Object.entries(metrics).map(([k, l]) => `<button class="${kpiState.mx === k ? 'on' : ''}" onclick="kpiSet('mx','${k}')">${l}</button>`).join('');
  let h = `<div class="k-seg k-seg-sm" style="margin:0 0 10px;">${tabs}</div><div class="k-tbl-wrap"><table class="k-tbl k-mx"><thead><tr><th class="k-l">Tháng</th>`;
  h += segs.map(s => `<th>${s.ch}<br><small>${s.vg}</small></th>`).join('') + '<th>Tổng</th></tr></thead><tbody>';
  months.slice().reverse().forEach(m => {
    const i = months.indexOf(m);
    const tot = kpiAgg(list.filter(p => p.m === m));
    h += `<tr><td class="k-l">${ymShort(m)}</td>` + grid[i].map(a => `<td style="${heat(val(a))}">${(a.kh || val(a)) ? show(a) : '<span class="k-dim">·</span>'}</td>`).join('') + `<td class="k-totc">${show(tot)}</td></tr>`;
  });
  const colTot = segs.map(s => kpiAgg(list.filter(p => p.ch === s.ch && p.vg === s.vg)));
  h += `<tr class="k-total"><td class="k-l">Tổng</td>${colTot.map(a => `<td>${show(a)}</td>`).join('')}<td>${show(kpiAgg(list))}</td></tr>`;
  return h + '</tbody></table></div>';
}

function kpiCostTable(list) {
  const act = list.filter(p => KPI_ACTIVE.includes(p.st));
  if (!act.length) return '<div class="k-empty">Chưa có chi phí cam kết trong kỳ</div>';
  const segs = kpiSegments(act);
  const legend = `<div class="k-legend"><span><i class="s-pg"></i>PG</span><span><i class="s-lc"></i>Địa điểm</span><span><i class="s-sc"></i>Mẫu thử</span><span><i class="s-gf"></i>Quà tặng</span></div>`;
  const stack = a => a.tc ? `<div class="k-stack">${[['pg', a.pg], ['lc', a.lc], ['sc', a.sc], ['gf', a.gf]].map(([k, v]) => v > 0 ? `<i class="s-${k}" style="width:${(v / a.tc * 100).toFixed(1)}%" title="${Math.round(v / a.tc * 100)}%"></i>` : '').join('')}</div>` : '';
  const line = (label, a, cls) => `<tr class="${cls || ''}">
    <td class="k-l">${label}</td>
    <td>${fN(a.actDays)}</td>
    <td>${fM(a.pg)}<small class="k-sub-t">${fN(a.pgd)} PG-ngày · ${fN(a.pgh)}h</small></td>
    <td>${fM(a.lc)}</td>
    <td>${fM(a.sc)}<small class="k-sub-t">${fN(a.sq)} mẫu</small></td>
    <td>${fM(a.gf)}</td>
    <td><b>${fM(a.tc)}</b></td>
    <td>${fM(a.cpb)}</td>
    <td class="k-stack-c">${stack(a)}</td>
  </tr>`;
  let body = '';
  KPI_CH.concat([...new Set(segs.map(s => s.ch))].filter(c => !KPI_CH.includes(c))).forEach(ch => {
    const chSegs = segs.filter(s => s.ch === ch); if (!chSegs.length) return;
    if (chSegs.length > 1) body += line(`<b>${ch}</b>`, kpiAgg(act.filter(p => p.ch === ch)), 'k-sub');
    chSegs.forEach(s => { body += line(chSegs.length > 1 ? `<span class="k-ind">${s.vg}</span>` : `<b>${ch}</b> · ${s.vg}`, kpiAgg(act.filter(p => p.ch === s.ch && p.vg === s.vg))); });
  });
  body += line('<b>Tổng</b>', kpiAgg(act), 'k-total');
  return legend + `<div class="k-tbl-wrap"><table class="k-tbl"><thead><tr><th class="k-l">Kênh · Vùng</th><th>Buổi</th><th>PG</th><th>Địa điểm</th><th>Mẫu thử</th><th>Quà</th><th>Tổng</th><th>CP/buổi</th><th>Cơ cấu</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

function kpiTopBottom(list) {
  const done = list.filter(p => p.st === 'hoan_thanh' && p.rp > 0);
  const byLoc = {};
  done.forEach(p => {
    const k = p.loc || '—';
    const o = byLoc[k] || (byLoc[k] = { loc: k, ch: p.ch, vg: p.vg, ht: 0, tas: 0, sal: 0, tc: 0 });
    o.ht += p.nd; o.tas += p.tas; o.sal += p.sal; o.tc += p.tc;
  });
  const metrics = {
    sal: { l: 'Doanh số',  v: o => o.sal, f: fM, low: false },
    tas: { l: 'Người thử', v: o => o.tas, f: fN, low: false },
    cpp: { l: 'CP/người',  v: o => o.tas ? o.tc / o.tas : null, f: x => fN(x) + 'đ', low: true },
    roi: { l: 'DS/CP',     v: o => o.tc ? o.sal / o.tc : null, f: fX, low: false },
  };
  const M = metrics[kpiState.tb] || metrics.sal;
  const tabs = Object.entries(metrics).map(([k, m]) => `<button class="${kpiState.tb === k ? 'on' : ''}" onclick="kpiSet('tb','${k}')">${m.l}</button>`).join('');
  const arr = Object.values(byLoc).map(o => Object.assign(o, { val: M.v(o) })).filter(o => o.val != null);
  if (!arr.length) return `<div class="k-seg k-seg-sm">${tabs}</div><div class="k-empty">Chưa có buổi hoàn thành có báo cáo</div>`;
  arr.sort((a, b) => M.low ? a.val - b.val : b.val - a.val);
  const top = arr.slice(0, 5), bottom = arr.length > 5 ? arr.slice(-Math.min(5, arr.length - 5)).reverse() : [];
  const tbl = (items, cls) => `<table class="k-tbl k-rank"><tbody>${items.map((o, i) => `<tr>
      <td class="k-rk ${cls}">${i + 1}</td>
      <td class="k-l"><div class="k-loc">${o.loc}</div><small>${o.ch} · ${o.vg} · ${o.ht} buổi</small></td>
      <td><b>${M.f(o.val)}</b></td></tr>`).join('')}</tbody></table>`;
  return `<div class="k-seg k-seg-sm" style="margin-bottom:10px;">${tabs}</div>
    <div class="k-rank-grid">
      <div><div class="k-rank-h good">Tốt nhất</div>${tbl(top, 'good')}</div>
      <div><div class="k-rank-h bad">Cần xem lại</div>${bottom.length ? tbl(bottom, 'bad') : '<div class="k-empty">Chưa đủ điểm để so sánh (cần &gt; 5)</div>'}</div>
    </div>`;
}

function kpiAlerts(list) {
  const today = todayStr();
  const scope = (kpiData.plans || []).filter(kpiInScope);
  const overdue = scope.filter(p => p.st === 'da_duyet' && p.e < today && !p.rp).sort((a, b) => a.e.localeCompare(b.e));
  const pending = scope.filter(p => p.st === 'cho_duyet' && p.ca && daysBetween(p.ca, today) >= 2).sort((a, b) => a.ca.localeCompare(b.ca));
  const over    = list.filter(p => p.ov);
  const names = kpiData.users || {};
  const item = (p, tag, cls) => `<div class="k-alert-i" onclick="viewPlanDetail('${p.id}')"><span class="k-tag ${cls}">${tag}</span><div><b>${p.loc}</b><small>${fmtDate(p.d)} · ${p.ch} · ${p.vg} · ${names[p.cr] || p.cr}</small></div></div>`;
  let h = `<div class="k-alert-sum">
    <div class="${overdue.length ? 'bad' : ''}"><b>${overdue.length}</b><span>Quá hạn báo cáo</span></div>
    <div class="${pending.length ? 'warn' : ''}"><b>${pending.length}</b><span>Chờ duyệt ≥ 2 ngày</span></div>
    <div class="${over.length ? 'warn' : ''}"><b>${over.length}</b><span>Báo cáo vượt mẫu (kỳ)</span></div>
  </div>`;
  const rows = overdue.slice(0, 6).map(p => item(p, 'Trễ ' + daysBetween(p.e, today) + 'n', 'bad'))
    .concat(pending.slice(0, 4).map(p => item(p, 'Chờ ' + daysBetween(p.ca, today) + 'n', 'warn')))
    .concat(over.slice(0, 3).map(p => item(p, 'Vượt mẫu', 'warn')));
  h += rows.length ? `<div class="k-alert-list">${rows.join('')}</div>` : '<div class="k-empty">✅ Không có việc tồn đọng</div>';
  return h;
}

function kpiSkuTable(list) {
  const act = list.filter(p => KPI_ACTIVE.includes(p.st));
  const skus = kpiData.skus || {}, agg = {};
  act.forEach(p => (p.sk || []).forEach(([ma, q]) => {
    const s = skus[ma] || {}, price = p.ch === 'GT' ? (s.gt || s.mt || 0) : (s.mt || s.gt || 0);
    const o = agg[ma] || (agg[ma] = { ma, n: (s.n || ma), q: 0, v: 0, plans: 0 });
    o.q += q; o.v += q * price; o.plans++;
  }));
  const arr = Object.values(agg).sort((a, b) => b.q - a.q);
  if (!arr.length) return '<div class="k-empty">Chưa có dữ liệu mẫu</div>';
  const max = arr[0].q, totQ = arr.reduce((s, o) => s + o.q, 0), totV = arr.reduce((s, o) => s + o.v, 0);
  return `<div class="k-tbl-wrap k-scroll-y"><table class="k-tbl"><thead><tr><th class="k-l">SKU</th><th>SL mẫu</th><th>Giá trị</th><th>Số KH</th></tr></thead><tbody>
    ${arr.map(o => `<tr><td class="k-l"><div class="k-loc">${o.n}</div>${kpiBar(o.q, max, 'r')}</td><td><b>${fN(o.q)}</b></td><td>${fM(o.v)}</td><td>${o.plans}</td></tr>`).join('')}
    <tr class="k-total"><td class="k-l">Tổng</td><td>${fN(totQ)}</td><td>${fM(totV)}</td><td></td></tr>
  </tbody></table></div>`;
}

function kpiStaffTable(list) {
  const names = kpiData.users || {}, agg = {};
  list.filter(p => !KPI_VOID.includes(p.st)).forEach(p => (p.ex.length ? p.ex : [p.cr]).forEach(c => {
    const o = agg[c] || (agg[c] = { c, kh: 0, ht: 0, tas: 0, sal: 0, chs: {} });
    o.kh += p.nd; o.chs[p.ch + ' · ' + p.vg] = 1;
    if (p.st === 'hoan_thanh') { o.ht += p.nd; o.tas += p.tas; o.sal += p.sal; }
  }));
  const arr = Object.values(agg).sort((a, b) => b.ht - a.ht || b.kh - a.kh);
  if (!arr.length) return '<div class="k-empty">Chưa có dữ liệu</div>';
  const shown = kpiState.staffAll ? arr : arr.slice(0, 10);
  return `<div class="k-tbl-wrap"><table class="k-tbl"><thead><tr><th class="k-l">Nhân viên</th><th>KH</th><th>HT</th><th>% HT</th><th>Người thử</th><th>Doanh số</th></tr></thead><tbody>
    ${shown.map(o => { const r = o.kh ? o.ht / o.kh : null; return `<tr><td class="k-l"><div class="k-loc">${names[o.c] || userName(o.c)}</div><small>${Object.keys(o.chs).join(', ')}</small></td><td>${fN(o.kh)}</td><td><b>${fN(o.ht)}</b></td><td><span class="k-pill ${rateCls(r)}">${fP(r)}</span></td><td>${fN(o.tas)}</td><td>${fM(o.sal)}</td></tr>`; }).join('')}
  </tbody></table></div>
  ${arr.length > 10 ? `<button class="k-more" onclick="kpiSet('staffAll',${!kpiState.staffAll})">${kpiState.staffAll ? 'Thu gọn' : 'Xem tất cả ' + arr.length + ' người'}</button>` : ''}`;
}

let _showAllCancelled = false;

async function loadApprovalDirect() {
  const el = document.getElementById('dash-content');
  if (!el) return;
  setDashTitle('✅ Phê duyệt kế hoạch');
  el.innerHTML = `<div id="mgr-scroll"><div id="mgr-content">${KPI_LOADER}</div></div>`;
  try {
    const board = await api('GET', { action: 'getApprovalBoard' });
    const contentEl = document.getElementById('mgr-content');
    if (!contentEl) return;
    if (!board || !board.success) {
      contentEl.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">${(board && board.error) || 'Lỗi'}</div></div>`;
      return;
    }
    renderDashApproval(board, contentEl);
    applyApprovalBadges(board);
  } catch (e) {
    const contentEl = document.getElementById('mgr-content');
    if (contentEl) contentEl.innerHTML = '<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-text">Lỗi kết nối</div></div>';

}

function applyApprovalBadges(board) {
  const total = ((board && board.pending) || []).length + ((board && board.cancelRequests) || []).length;
  ['sidebar-approval-badge', 'approval-tab-badge', 'approval-badge'].forEach(id => {
    const b = document.getElementById(id);
    if (b) { b.textContent = total; b.style.display = total > 0 ? 'flex' : 'none'; }
  });
  updateMgrNavBadge(total);
}

async function syncApprovalBadgeToSidebar() {
  const isMgr = currentUser && (currentUser.role === 'Sales Manager' || currentUser.role === 'Marketing');
  if (!isMgr) return;
  try {
    const board = await api('GET', { action: 'getApprovalBoard' });
    if (board && board.success) applyApprovalBadges(board);
  } catch (e) {}
}
function loadApprovalBadge() { return syncApprovalBadgeToSidebar(); }

function renderDashApproval(board, el) {
  const plans = board.pending || [], cancelReqs = board.cancelRequests || [], cancelled = board.cancelled || [];
  window._lastApprovalPlansAll = plans;
  window._lastCancelReqsAll    = cancelReqs;
  window._lastCancelledAll     = cancelled;
  window._lastApprovalEl       = el;

  const all = plans.concat(cancelReqs, cancelled);
  const channels = [...new Set(all.map(p => p.region || '').filter(Boolean))].sort();
  const months = [...new Set(all.map(p => p.date ? String(p.date).substring(0, 7) : '').filter(Boolean))].sort().reverse();

  el.innerHTML = `
  <div class="ap-toolbar">
    <select class="k-select" id="approval-filter-month" onchange="_applyApprovalFilters()">
      <option value="">Tất cả tháng</option>${months.map(m => `<option value="${m}">Tháng ${m.substring(5, 7)}/${m.substring(0, 4)}</option>`).join('')}
    </select>
    <select class="k-select" id="approval-filter-channel" onchange="_applyApprovalFilters()">
      <option value="">Tất cả kênh</option>${channels.map(c => `<option value="${c}">${c}</option>`).join('')}
    </select>
    <div class="ap-counts" id="approval-count-label"></div>
    <div class="view-toggle-bar ap-view">
      <button class="view-toggle-btn ${_approvalView === 'kanban' ? 'active' : ''}" onclick="_approvalView='kanban';_rerenderApproval()">📋 Kanban</button>
      <button class="view-toggle-btn ${_approvalView === 'list' ? 'active' : ''}" onclick="_approvalView='list';_rerenderApproval()">☰ Danh sách</button>
    </div>
  </div>
  <div id="approval-content-area"></div><div class="spacer"></div>`;
  _applyApprovalFilters();
}

function _applyApprovalFilters() {
  const month   = (document.getElementById('approval-filter-month')   || {}).value || '';
  const channel = (document.getElementById('approval-filter-channel') || {}).value || '';
  const f = arr => (arr || []).filter(p =>
    (!month || (p.date && String(p.date).substring(0, 7) === month)) && (!channel || p.region === channel));
  window._lastApprovalPlans = f(window._lastApprovalPlansAll);
  window._lastCancelReqs    = f(window._lastCancelReqsAll);
  window._lastCancelled     = f(window._lastCancelledAll);
  const lbl = document.getElementById('approval-count-label');
  if (lbl) lbl.innerHTML =
    `<span class="ap-chip pending">⏳ ${window._lastApprovalPlans.length} chờ duyệt</span>` +
    `<span class="ap-chip cancel">🚫 ${window._lastCancelReqs.length} yêu cầu hủy</span>` +
    `<span class="ap-chip void">🗑 ${window._lastCancelled.length} đã hủy</span>`;
  _renderApprovalContent(window._lastApprovalPlans, window._lastCancelReqs, document.getElementById('approval-content-area'), window._lastCancelled);
}

function _rerenderApproval() {
  document.querySelectorAll('.ap-view .view-toggle-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.includes('Kanban') ? _approvalView === 'kanban' : _approvalView === 'list');
  });
  _renderApprovalContent(window._lastApprovalPlans || [], window._lastCancelReqs || [], document.getElementById('approval-content-area'), window._lastCancelled || []);
}

function _renderApprovalContent(plans, cancelReqs, el, cancelled) {
  if (!el) return;
  if (_approvalView === 'kanban') _renderApprovalKanban(plans, cancelReqs, el, cancelled || []);
  else _renderApprovalList(plans, cancelReqs, el, cancelled || []);
}

function _cancelNoteOf(p) {
  return (String(p.notes || '').split('\n').reverse().find(l => l.toLowerCase().includes('hủy')) || '')
    .replace(/\s*\[prev:[a-z_]+\]\s*/g, '');
}

/** Card kanban gọn — dùng chung cho tab Phê duyệt. mode: 'pending' | 'cancel' | 'void' */
function _apCard(p, mode) {
  const samples = (p.samples || []).map(s => {
    const prod = masterData.products.find(pr => pr.ma === s.ma);
    return `${prod ? prod.ten : s.ma} ×${s.so_luong}`;
  }).join(', ') || '—';
  const note = mode !== 'pending' ? _cancelNoteOf(p) : '';
  let actions = '';
  if (mode === 'pending') actions = `
      <button class="kc-btn kc-btn-approve" onclick="quickApprove('${p.id}')">✅ Duyệt</button>
      <button class="kc-btn kc-btn-edit" onclick="inlineEditModal('${p.id}')">✏️ Sửa</button>
      <button class="kc-btn kc-btn-reject" onclick="rejectModal('${p.id}')">❌</button>`;
  if (mode === 'cancel') actions = `
      <button class="kc-btn kc-btn-approve" onclick="confirmCancelPlan('${p.id}')">✅ Xác nhận hủy</button>
      <button class="kc-btn kc-btn-edit" onclick="rejectCancelPlan('${p.id}')">↩ Giữ lại</button>`;
  return `<div class="kanban-card kc-${p.status}" onclick="viewPlanDetail('${p.id}')">
    <div class="kc-top"><div class="kc-name">${p.locationName}</div><div class="kc-cost">${fM(p.totalEstCost)}</div></div>
    <div class="kc-meta"><span>📅 ${fmtDateRange(p)}</span><span>⏰ ${fmtTime(p.timeStart)}–${fmtTime(p.timeEnd)}</span></div>
    <div class="kc-meta"><span>👤 ${userName(p.creator)}</span><span class="kc-ch">${p.region || ''}</span>${p.hiresPg && p.pgCount > 0 ? `<span>👥 ${p.pgCount} PG</span>` : ''}</div>
    ${mode !== 'void' ? `<div class="kc-products">${samples}</div>` : ''}
    ${note ? `<div class="kc-note ${mode}">${note}</div>` : ''}
    ${actions ? `<div class="kc-actions" onclick="event.stopPropagation()">${actions}</div>` : ''}
  </div>`;
}

function _renderApprovalKanban(plans, cancelReqs, el, cancelled) {
  const voidShown = _showAllCancelled ? cancelled : cancelled.slice(0, 10);
  const cols = [
    { label: '⏳ Chờ duyệt',   cls: 'col-pending',   items: plans,      mode: 'pending', empty: 'Không có kế hoạch chờ duyệt 🎉' },
    { label: '🚫 Yêu cầu hủy', cls: 'col-cancelreq', items: cancelReqs, mode: 'cancel',  empty: 'Không có yêu cầu hủy' },
    { label: '🗑 Đã hủy',       cls: 'col-cancelled', items: voidShown,  mode: 'void',    empty: 'Không có', total: cancelled.length },
  ];
  el.innerHTML = '<div class="kanban-board">' + cols.map(col => `
    <div class="kanban-col ${col.mode === 'void' ? 'kanban-col-void' : ''}">
      <div class="kanban-col-header ${col.cls}"><span>${col.label}</span><span class="kanban-col-count">${col.total != null ? col.total : col.items.length}</span></div>
      <div class="kanban-col-body">
        ${col.items.length ? col.items.map(p => _apCard(p, col.mode)).join('') : `<div class="kanban-empty"><div class="kanban-empty-icon">✓</div>${col.empty}</div>`}
        ${col.mode === 'void' && cancelled.length > 10 ? `<button class="k-more" onclick="_showAllCancelled=!_showAllCancelled;_rerenderApproval()">${_showAllCancelled ? 'Thu gọn' : 'Xem thêm ' + (cancelled.length - 10) + ' kế hoạch'}</button>` : ''}
      </div>
    </div>`).join('') + '</div>';
}

function setupDashboardForRole() {
  if (!currentUser) return;
  const isMgr = currentUser.role === 'Sales Manager' || currentUser.role === 'Marketing';
  // Thanh tab cũ: ẩn cho mọi vai trò (Manager/Marketing dùng sidebar / bottom nav)
  const tabBar = document.getElementById('dash-outer-tab-bar');
  if (tabBar) tabBar.style.display = 'none';
  // Bộ lọc tháng cũ: chỉ Rep/Salesman dùng (Dashboard KPI có thanh lọc riêng)
  const fr = document.getElementById('dash-month-filter-row');
  if (fr) fr.style.display = isMgr ? 'none' : 'flex';
  const langParent = document.getElementById('lang-vi')?.parentElement;
  if (langParent) langParent.style.display = 'none';
  document.body.classList.toggle('kpi-role', isMgr);
  const roleLabels = {
    'Sales Manager':        mgrTab === 'approval' ? '✅ Phê duyệt kế hoạch' : '📊 Dashboard KPI',
    'Marketing':            mgrTab === 'approval' ? '✅ Phê duyệt kế hoạch' : '📊 Dashboard KPI',
    'Sales Representative': `📍 ${currentUser.name} · ${currentUser.channel || currentUser.region || ''}`,
    'Salesman':             `📋 ${currentUser.name} · ${currentUser.channel || currentUser.region || ''}`,
  };

}

async function loadDashboard() {
  const el = document.getElementById('dash-content');
  if (!el || !currentUser) return;
  setupDashboardForRole();
  const role = currentUser.role || '';
  if (role === 'Sales Manager' || role === 'Marketing') {
    if (mgrTab === 'approval' || mgrTab === 'approval_direct') return loadApprovalDirect();
    return loadKpiDashboard();
  }
  // Rep & Salesman: dashboard cá nhân — 1 call plan KÈM báo cáo
  const month = document.getElementById('dash-filter-month')?.value || '';
  el.innerHTML = KPI_LOADER;
  try {
    const res = await api('GET', { action: 'getMyPlansWithReports', userCode: currentUser.code, month });
    if (!res.success) throw new Error(res.error || 'API error');
    if (role === 'Sales Representative') renderRepDashV2(el, res.data || [], month);
    else renderSalesmanDashV2(el, res.data || [], month);
  } catch (e) {
    console.error('Dashboard load error:', e);
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-text">Lỗi kết nối. Thử lại sau.</div></div>';

}

function showDashTab(tab) { currentDashTab = tab; loadDashboard(); }

function _usersFor(channel, region) {
  return (masterData.users || []).filter(u => {
    const ch = String(u.channel || ''), reg = String(u.region || '');
    if (channel && ch !== channel && ch !== 'Nationwide' && ch !== 'Manager' && ch !== 'Marketing') return false;
    if (region && reg !== region && reg !== 'Nationwide') return false;
    return true;
  });
}

async function loadExecutorOptions() {
  try {
    if (!masterData.users || masterData.users.length === 0) await loadMasterData(true);
    const users    = _usersFor(currentUser.channel, currentUser.region);
    const allUsers = masterData.users || [];

    const chipsEl = document.getElementById('executor-chips');
    if (chipsEl) {
      const execUsers = users.filter(u => u.role === 'Salesman' || u.role === 'Sales Representative');
      chipsEl.innerHTML = execUsers.map(u =>
        `<div class="chip-option" data-code="${u.code}" onclick="toggleExecutor(this,'${u.code}')">
          ${u.name}${u.role === 'Sales Representative' ? ' <span style="font-size:10px;opacity:0.6;">(Rep)</span>' : ''}
        </div>`).join('');
      if (currentUser.role !== 'Sales Manager') {
        const self = chipsEl.querySelector(`[data-code="${currentUser.code}"]`);
        if (self && planFormData.executors.length === 0) planFormData.executors = [currentUser.code];
      }
      // Sửa kế hoạch: đánh dấu lại người đã chọn
      chipsEl.querySelectorAll('.chip-option').forEach(c => { if (planFormData.executors.includes(String(c.dataset.code))) c.classList.add('selected'); });
    }

    const supEl = document.getElementById('supervisor-chips');
    if (supEl) {
      const supUsers = allUsers.filter(u => u.role === 'Sales Representative' || u.role === 'Sales Manager' || u.role === 'Marketing');
      supEl.innerHTML = supUsers.map(u =>
        `<div class="chip-option ${String(planFormData.supervisorCode) === String(u.code) ? 'selected' : ''}" data-code="${u.code}" onclick="selectSupervisor(this,'${u.code}','${encodeURIComponent(u.name)}')">
          ${u.name}${u.role.includes('Manager') ? ' <span style="font-size:10px;opacity:0.6;">(Mgr)</span>' : u.role === 'Sales Representative' ? ' <span style="font-size:10px;opacity:0.6;">(Rep)</span>' : ''}
        </div>`).join('');
    }
  } catch (e) { console.error('loadExecutorOptions error:', e); }
}

async function reopenPlan(planId) {
  if (!confirm('Mở lại kế hoạch này để nhân viên tiếp tục báo cáo?')) return;
  loading(true, 'Đang xử lý...');
  try {
    // Reset status from hoan_thanh → da_duyet via requestEdit with special note
    const res = await api('POST', {
      action: 'reopenPlan', planId, userCode: currentUser.code,
    });
    if (res.success) {
      showToast('✅ Đã mở lại kế hoạch — nhân viên có thể báo cáo thêm', 'success', 4000);
      viewPlanDetail(planId);
    } else showToast(res.error || 'Có lỗi xảy ra', 'error');
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

// ============================================================
// CANCEL PLAN — Frontend Logic
// ============================================================

/**
 * Show cancel dialog — behavior depends on role + plan status
 */
async function initCancelPlan(planId, planStatus) {
  const isManager   = currentUser.role === 'Sales Manager';
  const isMarketing = currentUser.role === 'Marketing';
  const isRep       = currentUser.role === 'Sales Representative';

  // Determine if immediate cancel or needs confirmation
  const immediateCancel = isManager
    || (isRep && planStatus === 'cho_duyet');

  const modeNote = immediateCancel
    ? '⚡ Kế hoạch sẽ được hủy ngay sau khi xác nhận.'
    : '⏳ Yêu cầu hủy sẽ được gửi đến Manager/Marketing để xác nhận.\n\nCần ít nhất 1 người có thẩm quyền đồng ý trước khi hủy có hiệu lực.';

  const roleNote = isManager
    ? '🔑 Bạn là Sales Manager — hủy không cần xác nhận thêm.'
    : isMarketing
    ? '📣 Bạn là Marketing — cần Manager hoặc Sales Rep xác nhận.'
    : isRep && planStatus === 'cho_duyet'
    ? '📋 Kế hoạch chưa duyệt — bạn có thể tự hủy.'
    : '📋 Kế hoạch đã duyệt — cần Manager/Marketing xác nhận hủy.';

  showModal(
    '🚫 Hủy kế hoạch',
    `<div style="margin-bottom:12px;font-size:13px;color:var(--gray);line-height:1.6;">
       ${roleNote}
     </div>
     <div style="background:${immediateCancel?'var(--red-light)':'#fff3cd'};border-radius:8px;padding:10px 12px;font-size:12px;color:${immediateCancel?'var(--red)':'#856404'};margin-bottom:14px;white-space:pre-line;">
       ${modeNote}
     </div>
     <div class="form-field">
       <label class="required" style="font-size:13px;">Nguyên nhân hủy</label>
       <textarea id="cancel-reason-input" class="form-input" rows="3"
         placeholder="Ví dụ: Điểm bán không hợp tác, thay đổi kế hoạch kinh doanh..."
         style="resize:none;font-family:var(--font);"></textarea>
     </div>`,
    [
      {
        label: immediateCancel ? '🚫 Xác nhận hủy' : '📤 Gửi yêu cầu hủy',
        cls:   'btn-danger',
        action: `executeCancelPlan('${planId}', ${immediateCancel})`,
      },
      { label: 'Đóng', cls: 'btn-outline', action: 'closeModal()' },
    ]
  );

  // Focus textarea after modal renders
  setTimeout(() => {
    const ta = document.getElementById('cancel-reason-input');
    if (ta) ta.focus();
  }, 200);
}

async function executeCancelPlan(planId, isImmediate) {
  const reason = document.getElementById('cancel-reason-input')?.value?.trim();
  if (!reason) {
    // Shake the textarea
    const ta = document.getElementById('cancel-reason-input');
    if (ta) { ta.style.border = '2px solid var(--red)'; setTimeout(() => ta.style.border='', 1500); }
    showToast('Vui lòng nhập nguyên nhân hủy', 'error');
    return;
  }

  closeModal();
  loading(true, isImmediate ? 'Đang hủy kế hoạch...' : 'Đang gửi yêu cầu hủy...');

  try {
    const res = await api('POST', {
      action:   'cancelPlan',
      planId,
      reason,
      userCode: currentUser.code,
    });

    if (res.success) {
      const msg = res.immediate
        ? `✅ Kế hoạch ${planId} đã được hủy.`
        : `📤 Đã gửi yêu cầu hủy kế hoạch ${planId}. Chờ xác nhận.`;
      showToast(msg, 'success', 4000);
      // v2.6 #2 FIX: xóa cache plan cũ để mọi danh sách hiển thị đúng trạng thái mới
      if (window._planCache) delete window._planCache[planId];
      // Reload plan detail to reflect new status
      await viewPlanDetail(planId);
      // Nếu màn danh sách kế hoạch đang mở phía sau → refresh luôn
      try {
        const plansScreen = document.getElementById('screen-plans');
        if (plansScreen && plansScreen.classList.contains('active')) loadMyPlans();
      } catch(e) {}
    } else {
      showToast(res.error || 'Có lỗi xảy ra', 'error');
    }
  } catch(e) {
    showToast('Lỗi kết nối', 'error');
  } finally {
    loading(false);
  }
}

/** Manager/Marketing confirm a cancel request */
async function confirmCancelPlan(planId) {
  if (!confirm(`Xác nhận đồng ý HỦY kế hoạch ${planId}?\n\nHành động này không thể hoàn tác.`)) return;
  loading(true, 'Đang xác nhận hủy...');
  try {
    const res = await api('POST', { action: 'confirmCancel', planId, userCode: currentUser.code });
    if (res.success) {
      showToast(`✅ Đã xác nhận hủy kế hoạch ${planId}`, 'success', 3500);
      if (window._planCache) delete window._planCache[planId]; // v2.6 #2
      // Refresh approval list + plan detail
      if (document.getElementById('screen-dashboard').classList.contains('active')) {
        loadApprovalDirect();
      }
      showScreen('plans'); loadMyPlans();
    } else showToast(res.error || 'Lỗi', 'error');
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

/** Manager/Marketing reject a cancel request */
async function rejectCancelPlan(planId) {
  loading(true, 'Đang xử lý...');
  try {
    const res = await api('POST', { action: 'rejectCancel', planId, userCode: currentUser.code });
    if (res.success) {
      showToast(`Đã từ chối yêu cầu hủy — kế hoạch tiếp tục`, 'success', 3000);
      afterApprovalAction(planId);
    } else showToast(res.error || 'Lỗi', 'error');
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

// =====================================================
// ĐIỀU CHỈNH GIỚI HẠN (plan đã duyệt / đang chạy)
// Chỉ sửa: người thực hiện · ngày · giờ từng ngày · số PG (chỉ giảm)
// =====================================================
let adjustData = {};

async function initAdjustPlan(planId) {
  loading(true, 'Đang tải kế hoạch...');
  let p;
  try {
    const res = await api('GET', { action: 'getPlanDetail', planId });
    if (!res.success) { showToast(res.error || 'Không tải được kế hoạch', 'error'); return; }
    p = res.data;
  } catch (e) { showToast('Lỗi kết nối', 'error'); return; }
  finally { loading(false); }

  const startStr = toInputDate(p.date);
  const endStr   = p.dateEnd ? toInputDate(p.dateEnd) : startStr;
  const srcDays  = (Array.isArray(p.days) && p.days.length) ? p.days : null;
  const dates    = dateRange(startStr, endStr < startStr ? startStr : endStr);

  adjustData = {
    planId,
    maxPg:     Number(p.pgCount) || 0,
    pgCount:   Number(p.pgCount) || 0,
    executors: (p.executors || []).map(String),
    days: dates.map((ds, i) => {
      const s = srcDays ? (srcDays.find(d => toInputDate(d.date) === ds) || srcDays[i]) : null;
      return {
        date:      ds,
        timeStart: (s && s.timeStart) || p.timeStart || '09:00',
        timeEnd:   (s && s.timeEnd)   || p.timeEnd   || '12:00',
      };
    }),
  };
  renderAdjustModal(startStr, endStr);
}

function renderAdjustModal(startStr, endStr) {
  const users = (masterData.users || []).filter(u =>
    u.role === 'Salesman' || u.role === 'Sales Representative');
  const chips = users.map(u =>
    `<div class="chip-option ${adjustData.executors.includes(String(u.code)) ? 'selected' : ''}"
      data-code="${u.code}" onclick="toggleAdjustExec(this,'${u.code}')">${u.name}</div>`).join('') ||
    '<span style="font-size:12px;color:var(--gray2);">Không có nhân sự</span>';

  const body = `
    <div style="max-height:62vh;overflow:auto;text-align:left;padding:2px;">
      <div style="display:flex;gap:8px;">
        <div class="form-field" style="flex:1;">
          <label style="font-size:12px;">Ngày bắt đầu</label>
          <input class="form-input" type="date" id="adj-date-start" value="${startStr}" onchange="onAdjustDateChange()">
        </div>
        <div class="form-field" style="flex:1;">
          <label style="font-size:12px;">Ngày kết thúc</label>
          <input class="form-input" type="date" id="adj-date-end" value="${endStr}" onchange="onAdjustDateChange()">
        </div>
      </div>
      <div class="form-field">
        <label style="font-size:12px;">Giờ diễn ra từng ngày</label>
        <div id="adj-days"></div>
      </div>
      <div class="form-field">
        <label style="font-size:12px;">Người thực hiện</label>
        <div class="chip-select" id="adj-exec-chips">${chips}</div>
      </div>
      <div class="form-field">
        <label style="font-size:12px;">Số PG thực hiện — hiện tại <b>${adjustData.maxPg}</b> (chỉ được giảm/về 0)</label>
        <input class="form-input" type="number" id="adj-pg" min="0" max="${adjustData.maxPg}"
          value="${adjustData.pgCount}" oninput="onAdjustPgInput()">
        <div id="adj-pg-hint" style="font-size:11px;color:var(--gray2);margin-top:4px;"></div>
      </div>
      <div class="form-field">
        <label style="font-size:12px;">Lý do điều chỉnh (gửi người duyệt)</label>
        <textarea class="form-input" id="adj-reason" rows="2" placeholder="VD: 1 PG báo bận đột xuất, dời sang ngày khác..."></textarea>
      </div>
      <div class="info-banner" style="margin:4px 0 0;">ℹ️ Lưu xong kế hoạch chuyển về <b>"chờ duyệt"</b> để Trade/Manager duyệt lại.</div>
    </div>`;

  showModal('🔧 Điều chỉnh kế hoạch', body, [
    { label: '💾 Lưu & gửi duyệt lại', cls: 'btn-primary', action: `saveAdjustPlan('${adjustData.planId}')` },
    { label: 'Đóng',                   cls: 'btn-outline', action: 'closeModal()' },
  ]);
  renderAdjustDays();
  onAdjustPgInput();
}

function renderAdjustDays() {
  const el = document.getElementById('adj-days');
  if (!el) return;
  el.innerHTML = (adjustData.days || []).map((d, i) => {
    const dt = parseLocalDate(d.date);
    const wd = DAY_NAMES_VI[dt.getDay()];
    return `<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
      <div style="min-width:104px;font-size:12px;font-weight:600;color:var(--navy);">${wd}, ${fmtDate(d.date)}</div>
      <input class="form-input" type="time" value="${d.timeStart}" style="padding:8px;flex:1;"
        oninput="adjustData.days[${i}].timeStart=this.value">
      <span style="color:var(--gray2);">–</span>
      <input class="form-input" type="time" value="${d.timeEnd}" style="padding:8px;flex:1;"
        oninput="adjustData.days[${i}].timeEnd=this.value">
    </div>`;
  }).join('');
}

function onAdjustDateChange() {
  const s = document.getElementById('adj-date-start').value;
  let e   = document.getElementById('adj-date-end').value || s;
  if (!s) return;
  if (e < s) { e = s; document.getElementById('adj-date-end').value = s; }
  const dates = dateRange(s, e);
  const prev = {};
  (adjustData.days || []).forEach(d => { prev[d.date] = { timeStart: d.timeStart, timeEnd: d.timeEnd }; });
  adjustData.days = dates.map(ds => ({
    date:      ds,
    timeStart: (prev[ds] && prev[ds].timeStart) || '09:00',
    timeEnd:   (prev[ds] && prev[ds].timeEnd)   || '12:00',
  }));
  renderAdjustDays();
}

function toggleAdjustExec(el, code) {
  const i = adjustData.executors.indexOf(String(code));
  if (i >= 0) { adjustData.executors.splice(i, 1); el.classList.remove('selected'); }
  else        { adjustData.executors.push(String(code)); el.classList.add('selected'); }
}

function onAdjustPgInput() {
  const el = document.getElementById('adj-pg');
  const hint = document.getElementById('adj-pg-hint');
  if (!el) return;
  let v = Number(el.value);
  if (isNaN(v) || v < 0) v = 0;
  if (v > adjustData.maxPg) { v = adjustData.maxPg; el.value = v; showToast(`Chỉ được giảm — tối đa ${adjustData.maxPg} PG`, 'error'); }
  else el.value = v;
  adjustData.pgCount = v;
  if (hint) {
    hint.textContent = v === 0
      ? '→ Không thuê PG (chi phí PG = 0)'
      : (v < adjustData.maxPg ? `Giảm ${adjustData.maxPg - v} PG so với ban đầu` : 'Giữ nguyên số PG');
  }
}

async function saveAdjustPlan(planId) {
  if (!adjustData.executors || adjustData.executors.length === 0) {
    showToast('Chọn ít nhất 1 người thực hiện', 'error'); return;
  }
  const pg = Number(document.getElementById('adj-pg').value);
  if (pg > adjustData.maxPg) { showToast('Số PG không được tăng', 'error'); return; }
  for (const d of (adjustData.days || [])) {
    if (d.timeStart && d.timeEnd && d.timeStart >= d.timeEnd) {
      showToast(`Giờ ngày ${fmtDate(d.date)} chưa hợp lệ`, 'error'); return;
    }
  }
  const reason = (document.getElementById('adj-reason')?.value || '').trim();
  loading(true, 'Đang lưu điều chỉnh...');
  try {
    const res = await api('POST', {
      action: 'adjustPlan',
      planId,
      data: {
        date:    adjustData.days[0].date,
        dateEnd: adjustData.days[adjustData.days.length - 1].date,
        days:    adjustData.days,
        executors: adjustData.executors,
        pgCount: pg,
        adjustReason: reason,
      },
      userCode: currentUser.code,
    });
    if (res.success) {
      Object.keys(_apiCache).forEach(k => delete _apiCache[k]); // xóa cache để thấy trạng thái mới
      closeModal();
      showToast('✅ ' + (res.message || 'Đã điều chỉnh, chờ duyệt lại'), 'success');
      viewPlanDetail(planId);
    } else {
      showToast(res.error || 'Lỗi khi lưu', 'error');
    }
  } catch (e) { showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

function showModal(title, bodyHtml, actions=[]) {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  const actHtml = actions.map(a => `<button class="btn ${a.cls}" onclick="${a.action}">${a.label}</button>`).join('');
  content.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">${title}</div>
    ${bodyHtml}
    ${actHtml ? `<div class="modal-footer">${actHtml}</div>` : ''}
  `;
  overlay.classList.add('show');
  overlay.onclick = e => { if (e.target === overlay) closeModal(); };
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

// =====================================================
// INIT
// =====================================================
function goHome() {
  if (!currentUser) return;
  showScreen('home');
  sessionStorage.setItem('dgm_screen', 'home');
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('screen-' + name);
  if (el) el.classList.add('active');
  if (currentUser) sessionStorage.setItem('dgm_screen', name);
  updateSidebarActive();
  // Hide login sidebar
  const sidebar = document.getElementById('desktop-sidebar');
  if (sidebar) sidebar.style.display = (name === 'login' || !currentUser) ? 'none' : (isDesktop() ? 'flex' : 'none');
}

(function init() {
  // ── PWA Version Check — force reload when new version deployed ──
  const CURRENT_VERSION = '2.8.0';
  const storedVersion   = localStorage.getItem('dgm_app_version');
  if (storedVersion && storedVersion !== CURRENT_VERSION) {
    // New version detected — clear caches and reload
    localStorage.setItem('dgm_app_version', CURRENT_VERSION);
    // Clear all caches if Cache API available
    if ('caches' in window) {
      caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
    }
    window.location.reload(true); // hard reload
    return;
  }
  localStorage.setItem('dgm_app_version', CURRENT_VERSION);
  // Prevent pull-to-refresh on mobile — use CSS only, keep touch passive for iOS scroll performance
  document.addEventListener('touchstart', function(e){}, {passive:true});
  document.documentElement.style.overscrollBehavior = 'none';

  // Check session
  const saved = sessionStorage.getItem('dgm_user');
  const savedScreen = sessionStorage.getItem('dgm_screen');
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      loadMasterData().then(() => {
        setupHome();
        // Restore last screen (safe screens only)
        const safeScreens = ['home','plans','calendar','dashboard'];
        if (savedScreen && safeScreens.includes(savedScreen)) {
          showScreen(savedScreen);
          if (savedScreen === 'plans') loadMyPlans();
          else if (savedScreen === 'calendar') renderCalendar();
          else if (savedScreen === 'dashboard') loadDashboard();
        } else {
          showScreen('home');
        }
      });
    } catch(e) { sessionStorage.removeItem('dgm_user'); }
  }
  // v2.8: tải trước master data trong lúc người dùng gõ mật khẩu
  if (!saved) api('GET', { action:'getBootstrap', channel: '', region: '' }).catch(() => {});
  // Set today date min
  const today = new Date().toISOString().split('T')[0];
  document.querySelectorAll('input[type=date]').forEach(el => el.min = today);
})();
</script>
