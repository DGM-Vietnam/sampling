/** v2.10: kỳ 'toàn chương trình' cho chương trình đang lọc (nếu có ngày bắt đầu/kết thúc hoặc có dữ liệu). */
function kpiCampaignPeriod(cpName) {
  if (!cpName || cpName === 'all' || cpName === '__none') return '';
  const c = getCampaignByName(cpName);
  const ms = (kpiData && kpiData.plans || []).filter(p => p.cp === cpName).map(p => p.m).sort();
  const from = (c && c.from) ? c.from.substring(0, 7) : ms[0];
  const to   = (c && c.to)   ? c.to.substring(0, 7)   : ms[ms.length - 1];
  return from && to ? 'c:' + from + '|' + to : '';
}

function kpiSet(k, v) {
  kpiState[k] = v;
  if (k === 'cp') {
    const cpv = kpiCampaignPeriod(v), c = getCampaignByName(v);
    if (cpv && (!c || c.requiresPgSales !== false)) kpiState.period = cpv;
    else if (String(kpiState.period).startsWith('c:')) kpiState.period = 'm:' + ymNow();
  }
  const sc = document.getElementById('dash-content'), top = sc ? sc.scrollTop : 0;
  renderKpi();
  if (sc) sc.scrollTop = top;
}

function kpiInScope(p) {
  const cpOk = kpiState.cp === 'all' || (kpiState.cp === '__none' ? !p.cp : p.cp === kpiState.cp);
  return cpOk && (kpiState.ch === 'all' || p.ch === kpiState.ch) && (kpiState.vg === 'all' || p.vg === kpiState.vg);
}
function kpiFilter(from, to) { return (kpiData.plans || []).filter(p => p.m >= from && p.m <= to && kpiInScope(p)); }

function kpiAgg(list) {
  const a = { plans: 0, kh: 0, ht: 0, htPlans: 0, huy: 0, tas: 0, sal: 0, cs: 0, rc: 0, by: 0, pk: 0, kn: 0, xc: 0,
              pg: 0, ps: 0, lc: 0, sc: 0, gf: 0, tc: 0, actDays: 0, tcDone: 0, psDone: 0, tcRep: 0, psRep: 0, pgd: 0, psd: 0, pgh: 0, sq: 0 };
  list.forEach(p => {
    if (KPI_VOID.includes(p.st)) { if (p.st === 'da_huy') a.huy++; return; }
    a.plans++; a.kh += p.nd; a.tas += p.tas; a.sal += p.sal;
    a.cs += p.cs || 0; a.rc += p.rc || 0; a.by += p.by || 0; a.pk += p.pk || 0; a.kn += p.kn || 0; a.xc += p.xc || 0;
    if (p.st === 'hoan_thanh') { a.ht += p.nd; a.htPlans++; a.tcDone += p.tc; a.psDone += p.ps || 0; }
    // v2.10: chi phí của kế hoạch ĐÃ CÓ BÁO CÁO — cùng nguồn với số người / doanh số / số bịch
    if (KPI_ACTIVE.includes(p.st) && p.rp > 0) { a.tcRep += p.tc; a.psRep += p.ps || 0; }
    if (KPI_ACTIVE.includes(p.st)) {
      a.pg += p.pg; a.ps += p.ps || 0; a.lc += p.lc; a.sc += p.sc; a.gf += p.gf; a.tc += p.tc;
      a.actDays += p.nd; a.pgd += p.pgd; a.psd += p.psd || 0; a.pgh += p.pgh; a.sq += p.sq;
    }
  });
  const contacts = a.tas + a.rc;
  a.rate = a.kh ? a.ht / a.kh : null;
  a.avg  = a.ht ? contacts / a.ht : null;
  a.cpp  = contacts ? a.tcRep / contacts : null;
  a.roi  = a.tcRep ? a.sal / a.tcRep : null;
  a.cpb  = a.actDays ? a.tc / a.actDays : null;
  a.conv = a.rc ? a.by / a.rc : null;
  a.cpPack = a.pk ? a.psRep / a.pk : null;
  a.contacts = contacts;
  return a;
}

function kpiSegments(list) {
  const set = {};
  list.forEach(p => { set[p.ch + '|' + p.vg] = 1; });
  const ord = (x, arr) => { const i = arr.indexOf(x); return i < 0 ? 99 : i; };
  return Object.keys(set).map(k => { const [ch, vg] = k.split('|'); return { key: k, ch, vg }; })
    .sort((a, b) => ord(a.ch, KPI_CH) - ord(b.ch, KPI_CH) || a.ch.localeCompare(b.ch) || ord(a.vg, KPI_VG) - ord(b.vg, KPI_VG));
}

/** Dựng bảng theo kênh · vùng (dùng chung). lineFn(label, agg, cls) → <tr> */
function kpiSegmentRows(list, lineFn) {
  const segs = kpiSegments(list);
  let body = '';
  KPI_CH.concat([...new Set(segs.map(s => s.ch))].filter(c => !KPI_CH.includes(c))).forEach(ch => {
    const chSegs = segs.filter(s => s.ch === ch); if (!chSegs.length) return;
    if (chSegs.length > 1) body += lineFn(`<b>${ch}</b>`, kpiAgg(list.filter(p => p.ch === ch)), 'k-sub');
    chSegs.forEach(s => { body += lineFn(chSegs.length > 1 ? `<span class="k-ind">${s.vg}</span>` : `<b>${ch}</b> · ${s.vg}`, kpiAgg(list.filter(p => p.ch === s.ch && p.vg === s.vg))); });
  });
  return body + lineFn('<b>Tổng</b>', kpiAgg(list), 'k-total');
}

function renderKpi() {
  const el = document.getElementById('dash-content'); if (!el || !kpiData) return;
  const P = kpiPeriod(kpiState.period);
  const cur = kpiFilter(P.from, P.to);
  const prevOk = !P.noPrev && P.prev.from >= (kpiData.from || '0000-00');
  const prev = prevOk ? kpiFilter(P.prev.from, P.prev.to) : null;
  const A = kpiAgg(cur), B = prev ? kpiAgg(prev) : null;

  const vgPresent = KPI_VG.filter(v => (kpiData.plans || []).some(p => p.vg === v));
  const cpPresent = [...new Set((kpiData.plans || []).map(p => p.cp).filter(Boolean))].sort();
  const seg = (k, v, label) => `<button class="${kpiState[k] === v ? 'on' : ''}" onclick="kpiSet('${k}','${v}')">${label}</button>`;
  const cpSel = cpPresent.length ? `<select class="k-select" onchange="kpiSet('cp',this.value)">
      <option value="all" ${kpiState.cp === 'all' ? 'selected' : ''}>Tất cả chương trình</option>
      <option value="__none" ${kpiState.cp === '__none' ? 'selected' : ''}>Sampling thường</option>
      ${cpPresent.map(c => `<option value="${escHtml(c)}" ${kpiState.cp === c ? 'selected' : ''}>${escHtml(c)}</option>`).join('')}
    </select>` : '';

  let h = `<div class="k-wrap fade-in">
  <div class="k-toolbar">
    <select class="k-select" onchange="kpiSet('period',this.value)">${kpiPeriodOptions(kpiState.period)}</select>
    ${cpSel}
    <div class="k-seg">${seg('ch', 'all', 'Tất cả kênh')}${KPI_CH.map(c => seg('ch', c, c)).join('')}</div>
    <div class="k-seg">${seg('vg', 'all', 'Toàn bộ vùng')}${vgPresent.map(v => seg('vg', v, v === 'Toàn quốc' ? 'Toàn quốc' : 'Miền ' + v)).join('')}</div>
    <div class="k-upd">Dữ liệu lúc ${kpiData.generatedAt || '—'}<button class="k-icon-btn" title="Tải lại" onclick="loadKpiDashboard(true)">↻</button></div>
  </div>
  <div class="k-period">${P.label}${prev ? ` <span>· ${P.prevLabel}</span>` : ''}</div>`;

  const camp = (kpiState.cp !== 'all' && kpiState.cp !== '__none') ? getCampaignByName(kpiState.cp) : null;
  const salesCamp = (camp && camp.requiresPgSales) || (kpiState.cp !== 'all' && kpiState.cp !== '__none' && cur.some(p => p.md));
  if (salesCamp) {
    h += kpiCampaignSection(P, cur, camp || { name: kpiState.cp });
    h += '<div class="k-period" style="margin-top:6px;">Tổng quan chung <span>· tất cả hoạt động của chương trình (booth + xe đẩy)</span></div>';
  } else if (kpiState.cp === 'all') {
    const sc = (masterData.campaigns || []).filter(c => c.requiresPgSales && cpPresent.includes(c.name));
    sc.forEach(c => { h += `<div class="c-scope">🥥 <span>Đang có dữ liệu <b>${escHtml(c.name)}</b>.</span>
      <button class="btn btn-sm" style="background:var(--purple);color:#fff;margin-left:auto;" onclick="kpiSet('cp','${escHtml(c.name).replace(/'/g, "\\'")}')">📈 Mở khu theo dõi campaign</button></div>`; });
  }
  h += kpiCardsHtml(A, B);
  h += kpiBox('📍 So sánh theo kênh · vùng', 'Kế hoạch & hoàn thành tính theo <b>buổi</b> (1 ngày = 1 buổi). Người = người thử booth + người tiếp cận xe đẩy.', kpiSegmentTable(cur));
  h += kpiBox('📅 Buổi sampling theo tháng', 'Ma trận tháng × kênh · vùng — ô càng đậm, giá trị càng cao.', kpiMatrix(P));
  h += kpiBox('💰 Chi phí chi tiết', 'Chi phí cam kết = kế hoạch đã duyệt + hoàn thành. Mẫu thử = SL thực dùng (hoặc SL duyệt) × giá MT/GT.', kpiCostTable(cur));
  h += `<div class="k-grid2">
    ${kpiBox('🏆 Điểm bán tốt nhất / cần xem lại', 'Chỉ tính điểm có buổi đã hoàn thành & có báo cáo.', kpiTopBottom(cur))}
    ${kpiBox('⚠️ Việc cần xử lý', 'Theo bộ lọc đang chọn, không phụ thuộc kỳ.', kpiAlerts(cur))}
  </div>
  <div class="k-grid2">
    ${kpiBox('📦 SKU sampling', 'SL mẫu dùng trong kỳ (đã duyệt + hoàn thành).', kpiSkuTable(cur))}
    ${kpiBox('👥 Nhân sự thực hiện', 'Mỗi buổi tính cho từng người thực hiện.', kpiStaffTable(cur))}
  </div>
  <div class="k-foot">tr = triệu đồng · k = nghìn đồng · CP/người = chi phí các kế hoạch đã có báo cáo ÷ (người thử booth + hộ mở cửa nghe) · DS/CP = doanh số (booth + bán hàng) ÷ chi phí các kế hoạch đã có báo cáo · Vùng lấy theo người tạo kế hoạch.</div>
  </div>`;
  el.innerHTML = h;
}

// =====================================================
// v2.10 — KHU THEO DÕI CAMPAIGN (chương trình có PG bán hàng)
// Dữ liệu: kpiData.shifts = từng ca bán hàng đã báo cáo (ngày, xe, gõ cửa, mở cửa, mua, bịch, doanh số, chi phí ca)
// =====================================================
function cShiftAgg(list) {
  const a = { n: 0, xe: 0, kn: 0, rc: 0, by: 0, pk: 0, rv: 0, co: 0, knB: 0, xeB: 0, rcB: 0, days: {} };
  list.forEach(s => {
    a.n++; a.xe += s.xe; a.kn += s.kn; a.rc += s.rc; a.by += s.by; a.pk += s.pk; a.rv += s.rv; a.co += s.co;
    if (s.kn > 0) { a.knB += s.kn; a.xeB += s.xe; a.rcB += s.rc; }
    a.days[s.id + '|' + s.d] = 1;
  });
  a.nDays = Object.keys(a.days).length;
  a.reach = a.xeB ? a.knB / a.xeB : null;          // hộ gõ cửa / xe / ca
  a.open  = a.knB ? a.rcB / a.knB : null;          // mở cửa nghe / gõ cửa
  a.conv  = a.rc  ? a.by / a.rc   : null;          // người mua / mở cửa nghe
  a.pkXe  = a.xe  ? a.pk / a.xe   : null;          // bịch / xe-ca
  a.cpPk  = a.pk  ? a.co / a.pk   : null;          // chi phí PG thực tế / bịch
  a.roi   = a.co  ? a.rv / a.co   : null;          // doanh số / chi phí PG
  return a;
}
function cPill(v, st, txt) {
  const cls = st === 'low' ? 'k-bad' : (st === 'good' || st === 'over') ? 'k-good' : '';
  return `<span class="k-pill ${cls}">${txt != null ? txt : v}</span>`;
}
function cWeekStart(d) {
  const x = parseLocalDate(d); if (!x) return d;
  const dow = (x.getDay() + 6) % 7; x.setDate(x.getDate() - dow);
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
}
function cShiftType(s) {
  if (s.md !== '2ca') return '1 ca liên tục (≥ 6h)';
  return (hhmmToMin(s.s) != null && hhmmToMin(s.s) < 12 * 60) ? 'Ca sáng (2 ca ngắn)' : 'Ca chiều (2 ca ngắn)';
}
/** Các cột chỉ số dùng chung cho bảng tuần / ca / vùng / xếp hạng. */
function cMetricHead(extra) {
  return `${extra || ''}<th>Ca · xe-ca</th><th>Gõ cửa/xe/ca</th><th>% mở cửa</th><th>% mua</th><th>Bịch</th><th>Bịch/xe-ca</th><th>Doanh số</th><th>CP PG/bịch</th>`;
}
function cMetricCells(a, K) {
  return `<td>${fN(a.n)}<small>${fN(a.xe)} xe-ca</small></td>
    <td>${cPill(a.reach, kpiStatus(a.reach, K.reachMin, K.reachMax), a.reach == null ? '—' : Math.round(a.reach))}</td>
    <td>${cPill(a.open, kpiStatus(a.open, K.openMin, K.openMax), fP(a.open))}</td>
    <td>${cPill(a.conv, kpiStatus(a.conv, K.convMin, K.convMax), fP(a.conv))}</td>
    <td><b>${fN(a.pk)}</b></td><td>${a.pkXe == null ? '—' : a.pkXe.toFixed(1).replace('.', ',')}</td>
    <td>${fM(a.rv)}</td><td>${a.cpPk == null ? '—' : fN(a.cpPk) + 'đ'}</td>`;
}
function cGroupTable(groups, K, firstHead, sortFn) {
  const rows = Object.entries(groups).map(([k, list]) => ({ k, a: cShiftAgg(list) }));
  if (sortFn) rows.sort(sortFn);
  if (!rows.length) return '<div class="k-empty">Chưa có dữ liệu</div>';
  return `<div class="k-tbl-wrap"><table class="k-tbl"><thead><tr><th class="k-l">${firstHead}</th>${cMetricHead()}</tr></thead><tbody>
    ${rows.map(r => `<tr><td class="k-l">${r.k}</td>${cMetricCells(r.a, K)}</tr>`).join('')}
    </tbody></table></div>`;
}

function kpiCampaignSection(P, plansCur, camp) {
  const K = campaignKpi(camp);
  const planMap = {};
  (kpiData.plans || []).forEach(p => { planMap[p.id] = p; });
  if (!Array.isArray(kpiData.shifts))
    return kpiBox('🥥 ' + escHtml(camp.name), '', '<div class="k-empty">Máy chủ chưa trả dữ liệu theo ca — hãy cập nhật Code.gs v2.10 và Deploy bản mới.</div>', 'k-ncd');
  const list = kpiData.shifts.filter(s => s.m >= P.from && s.m <= P.to && planMap[s.id] && kpiInScope(planMap[s.id]));
  const A = cShiftAgg(list);
  const live = plansCur.filter(p => !KPI_VOID.includes(p.st));
  const booth = live.filter(p => p.tas > 0);
  const tasDays = booth.reduce((t, p) => t + p.nd, 0), tasSum = booth.reduce((t, p) => t + p.tas, 0);
  const taste = tasDays ? tasSum / tasDays : null;

  // ── 1. Scorecard 4 KPI ──
  const badge = { low: 'Dưới KPI', good: 'Đạt KPI', over: 'Vượt KPI', na: 'Chưa có số liệu' };
  const card = (v, txt, l, en, mn, mx, fmt) => { const st = kpiStatus(v, mn, mx);
    return `<div class="c-kpi ${st}"><div class="v">${v == null ? '—' : txt}</div><div class="l">${l}</div><div class="t">${en}</div>
      <div class="t">KPI: ${fmt(mn)}–${fmt(mx)}</div><span class="b">${badge[st]}</span></div>`; };
  const pc = x => Math.round(x * 100) + '%', nn = x => fN(x);
  let h = `<div class="c-scope">🥥 <span>Theo dõi <b>${escHtml(camp.name)}</b> · ${P.label}${kpiState.vg !== 'all' ? ' · Miền ' + kpiState.vg : ''}</span>
    <span style="margin-left:auto;">${fN(A.n)} ca đã báo cáo · ${fN(A.nDays)} ngày bán</span></div>`;
  h += kpiBox('🎯 KPI campaign', 'Gõ cửa/xe/ca = hộ đã gõ cửa ÷ số xe-ca · Mở cửa = hộ mở cửa nghe ÷ hộ gõ cửa · Chuyển đổi = người mua ÷ hộ mở cửa nghe · Thử booth = lượt thử ÷ số buổi có booth.',
    `<div class="c-score">
      ${card(A.reach, A.reach == null ? '' : fN(A.reach), 'hộ tiếp cận / xe / ca', 'households / cart / shift', K.reachMin, K.reachMax, nn)}
      ${card(A.open, A.open == null ? '' : pc(A.open), 'tỷ lệ mở cửa nghe', 'door-open rate', K.openMin, K.openMax, pc)}
      ${card(A.conv, A.conv == null ? '' : pc(A.conv), 'tỷ lệ chuyển đổi mua', 'purchase conversion', K.convMin, K.convMax, pc)}
      ${card(taste, taste == null ? '' : fN(taste), 'lượt thử tại booth / ca', 'booth tastings / shift', K.tasteMin, K.tasteMax, nn)}
    </div>
    <div class="c-mini">
      <div><span>Bịch đã bán</span><b>${fN(A.pk)}</b></div>
      <div><span>Doanh số</span><b>${fM(A.rv)}</b></div>
      <div><span>Bịch / xe-ca</span><b>${A.pkXe == null ? '—' : A.pkXe.toFixed(1).replace('.', ',')}</b></div>
      <div><span>CP PG thực tế / bịch</span><b>${A.cpPk == null ? '—' : fN(A.cpPk) + 'đ'}</b></div>
      <div><span>Doanh số / CP PG</span><b>${fX(A.roi)}</b></div>
    </div>`, 'k-ncd');

  // ── 2. Phễu ──
  const mx = Math.max(A.kn, A.rc, 1);
  const fr = (l, v, sub) => `<div class="c-fr"><div>${l}</div><div class="bar"><i style="width:${Math.max(Math.round(v / mx * 100), v ? 2 : 0)}%"></i></div><div class="n">${fN(v)}${sub ? `<small>${sub}</small>` : ''}</div></div>`;
  const funnel = A.n ? `<div class="c-funnel">
      ${fr('🚪 Hộ đã gõ cửa', A.kn, A.xe ? fN(A.kn / A.xe) + ' / xe-ca' : '')}
      ${fr('👂 Hộ mở cửa nghe', A.rc, A.open == null ? '' : fP(A.open) + ' mở cửa')}
      ${fr('🛍️ Người mua', A.by, A.conv == null ? '' : fP(A.conv) + ' chuyển đổi')}
      ${fr('📦 Bịch đã bán', A.pk, A.by ? (A.pk / A.by).toFixed(1).replace('.', ',') + ' bịch/người' : '')}
    </div>` : '<div class="k-empty">Chưa có ca nào được báo cáo trong kỳ</div>';

  // ── 3. Tiến độ pilot theo vùng ──
  const today = ymNow();
  const months = ymList(P.from, P.to).filter(m => m <= today);
  const regions = ['Bắc', 'Trung', 'Nam'].filter(v => kpiState.vg === 'all' || kpiState.vg === v);
  const runDays = {};   // 'm|vg' → {planId|day}
  list.forEach(s => { const p = planMap[s.id]; const k = s.m + '|' + p.vg; (runDays[k] = runDays[k] || {})[s.id + '|' + s.d] = 1; });
  // kế hoạch đã hoàn thành nhưng chưa có số liệu theo ca → vẫn tính số ngày
  live.filter(p => p.st === 'hoan_thanh' && !list.some(s => s.id === p.id)).forEach(p => {
    for (let i = 0; i < p.nd; i++) { const d = addDays(p.d, i); const k = d.substring(0, 7) + '|' + p.vg; (runDays[k] = runDays[k] || {})[p.id + '|' + d] = 1; }
  });
  const planned = {};
  live.forEach(p => { for (let i = 0; i < p.nd; i++) { const d = addDays(p.d, i); const k = d.substring(0, 7) + '|' + p.vg; planned[k] = (planned[k] || 0) + 1; } });
  const prog = months.length ? `<div class="k-tbl-wrap"><table class="k-tbl"><thead><tr><th class="k-l">Tháng</th>${regions.map(v => `<th>Miền ${v}<br><small>tối thiểu ${K.pilotDays[v] || 0} ngày</small></th>`).join('')}</tr></thead><tbody>
    ${months.slice().reverse().map(m => `<tr><td class="k-l">${ymShort(m)}${m === today ? ' <small>(đang chạy)</small>' : ''}</td>${regions.map(v => {
      const run = Object.keys(runDays[m + '|' + v] || {}).length, min = K.pilotDays[v] || 0, pl = planned[m + '|' + v] || 0;
      const r = min ? run / min : 0, cls = r >= 1 ? 'done' : r >= 0.5 ? 'mid' : '';
      return `<td><div class="c-prog ${cls}"><div><b>${run}</b>/${min} ngày</div><div class="bar"><i style="width:${Math.min(Math.round(r * 100), 100)}%"></i></div><small>đã lên KH ${pl} ngày</small></div></td>`;
    }).join('')}</tr>`).join('')}
    </tbody></table></div>` : '<div class="k-empty">Kỳ đã chọn chưa bắt đầu</div>';

  h += `<div class="k-grid2">
    ${kpiBox('🔻 Phễu bán hàng xe đẩy', 'Tổng các ca đã báo cáo trong kỳ.', funnel, 'k-ncd')}
    ${kpiBox('📆 Tiến độ pilot theo vùng', 'Ngày đã chạy (có báo cáo bán hàng hoặc đã hoàn thành) so với số ngày pilot tối thiểu mỗi tháng.', prog, 'k-ncd')}
  </div>`;

  // ── 4. Theo tuần ──
  const byWeek = {};
  list.forEach(s => { (byWeek[cWeekStart(s.d)] = byWeek[cWeekStart(s.d)] || []).push(s); });
  const wk = {};
  Object.keys(byWeek).sort().reverse().forEach(w => { wk[`${fmtDate(w).substring(0, 5)} → ${fmtDate(addDays(w, 6)).substring(0, 5)}`] = byWeek[w]; });
  h += kpiBox('📈 Diễn biến theo tuần', 'Tuần tính từ thứ 2. Ô xanh = đạt KPI, ô đỏ = dưới KPI.', cGroupTable(wk, K, 'Tuần'), 'k-ncd');

  // ── 5. So sánh ca & vùng ──
  const byType = {}, byReg = {};
  list.forEach(s => {
    (byType[cShiftType(s)] = byType[cShiftType(s)] || []).push(s);
    const p = planMap[s.id], rk = `<b>${p.ch}</b> · ${p.vg}`; (byReg[rk] = byReg[rk] || []).push(s);
  });
  h += `<div class="k-grid2">
    ${kpiBox('⏰ So sánh hình thức ca', 'Ca sáng / chiều (2 ca ngắn) và 1 ca liên tục — dùng để chọn cách xếp ca cho 2027.', cGroupTable(byType, K, 'Hình thức'), 'k-ncd')}
    ${kpiBox('📍 Theo kênh · vùng', 'Chi phí PG thực tế = số PG thực tế × đơn giá ca.', cGroupTable(byReg, K, 'Kênh · Vùng'), 'k-ncd')}
  </div>`;

  // ── 6. Xếp hạng điểm bán & nhân sự ──
  const sorts = { pk: ['Bịch', (a, b) => b.a.pk - a.a.pk], conv: ['% mua', (a, b) => (b.a.conv || 0) - (a.a.conv || 0)],
                  reach: ['Gõ cửa/xe/ca', (a, b) => (b.a.reach || 0) - (a.a.reach || 0)], cp: ['CP/bịch thấp', (a, b) => (a.a.cpPk == null ? 1e12 : a.a.cpPk) - (b.a.cpPk == null ? 1e12 : b.a.cpPk)] };
  const S = sorts[kpiState.cl] || sorts.pk;
  const tabs = Object.entries(sorts).map(([k, v]) => `<button class="${kpiState.cl === k ? 'on' : ''}" onclick="kpiSet('cl','${k}')">${v[0]}</button>`).join('');
  const byLoc = {}, byRep = {}, names = kpiData.users || {};
  list.forEach(s => {
    const p = planMap[s.id];
    const lk = `<div class="k-loc">${escHtml(p.loc)}</div><small>${p.ch} · ${p.vg}</small>`; (byLoc[lk] = byLoc[lk] || []).push(s);
    const rk = `<div class="k-loc">${escHtml(names[s.rp] || userName(s.rp))}</div>`; (byRep[rk] = byRep[rk] || []).push(s);
  });
  const top = g => { const o = {}; Object.entries(g).map(([k, l]) => ({ k, l, a: cShiftAgg(l) })).sort(S[1]).slice(0, 10).forEach(x => { o[x.k] = x.l; }); return o; };
  h += `<section class="k-box k-ncd"><div class="k-box-h"><h3>🏆 Xếp hạng điểm bán & nhân sự</h3><p>Top 10 theo tiêu chí đang chọn. Nhân sự = người báo cáo ca.</p></div>
    <div class="k-seg k-seg-sm" style="margin-bottom:10px;">${tabs}</div>
    <div class="k-grid2">
      <div><div class="k-rank-h good">Điểm bán</div>${cGroupTable(top(byLoc), K, 'Điểm bán', S[1])}</div>
      <div><div class="k-rank-h good">Nhân sự</div>${cGroupTable(top(byRep), K, 'Nhân sự', S[1])}</div>
    </div></section>`;

  h += `<div class="k-foot">KPI mục tiêu lấy từ sheet CHUONG_TRINH (cột K–U). Giá bán cố định ${fN((camp && camp.unitPrice) || 10000)}đ/${escHtml((camp && camp.unitLabel) || 'bịch')}.
    Chỉ số gõ cửa & mở cửa chỉ tính các ca có nhập số hộ gõ cửa (báo cáo từ v2.10). Lượt thử booth/ca tính theo số buổi có booth.</div>`;
  return h;
}

function kpiBox(title, sub, body, cls) {
  return `<section class="k-box ${cls || ''}"><div class="k-box-h"><h3>${title}</h3>${sub ? `<p>${sub}</p>` : ''}</div>${body}</section>`;
}

function kpiDelta(cur, prev, invert) {
  if (prev == null || cur == null || !prev) return '';
  const pct = (cur - prev) / Math.abs(prev);
  if (!isFinite(pct) || Math.abs(pct) < 0.005) return '<span class="k-delta">＝</span>';
  const up = pct > 0, good = invert ? !up : up;
  return `<span class="k-delta ${good ? 'up' : 'down'}">${up ? '▲' : '▼'} ${Math.abs(pct * 100).toFixed(0)}%</span>`;
}

function kpiCardsHtml(A, B) {
  const card = (cls, label, val, sub, d) => `<div class="k-card ${cls}"><div class="k-card-l">${label}</div><div class="k-card-v">${val}</div><div class="k-card-s">${sub}${d}</div></div>`;
  const pgShare = A.tc ? Math.round((A.pg + A.ps) / A.tc * 100) : 0, scShare = A.tc ? Math.round(A.sc / A.tc * 100) : 0;
  return `<div class="k-cards">
    ${card('c-red',   'Buổi hoàn thành', fN(A.ht), `/ ${fN(A.kh)} KH · <b class="${rateCls(A.rate)}">${fP(A.rate)}</b> `, kpiDelta(A.ht, B && B.ht))}
    ${card('c-green', 'Người thử + nghe GT', fN(A.contacts), `${fN(A.tas)} thử booth · ${fN(A.rc)} hộ mở cửa `, kpiDelta(A.contacts, B && B.contacts))}
    ${card('c-teal',  'Doanh số', fM(A.sal), `${A.pk ? fN(A.pk) + ' bịch · ' : ''}${fN(A.htPlans)} KH HT `, kpiDelta(A.sal, B && B.sal))}
    ${card('c-navy',  'Chi phí cam kết', fM(A.tc), `PG ${pgShare}% · Mẫu ${scShare}% `, kpiDelta(A.tc, B && B.tc, true))}
    ${card('c-yellow','CP / người', A.cpp == null ? '—' : fN(A.cpp) + 'đ', 'KH đã có báo cáo ', kpiDelta(A.cpp, B && B.cpp, true))}
    ${card('c-purple','DS / Chi phí', fX(A.roi), `${A.huy} kế hoạch hủy `, kpiDelta(A.roi, B && B.roi))}
  </div>`;
}

function kpiBar(v, max, cls) {
  const w = max > 0 ? Math.max(Math.round(v / max * 100), v > 0 ? 3 : 0) : 0;
  return `<div class="k-bar ${cls || ''}"><i style="width:${w}%"></i></div>`;
}

function kpiSalesTable(list) {
  const rel = list.filter(p => (p.ps || 0) > 0 || (p.rc || 0) > 0);
  if (!rel.length) return '<div class="k-empty">Chưa có kế hoạch có PG bán hàng trong kỳ</div>';
  const maxPk = Math.max(...kpiSegments(rel).map(s => kpiAgg(rel.filter(p => p.ch === s.ch && p.vg === s.vg)).pk), 1);
  const line = (label, a, cls) => `<tr class="${cls || ''}">
    <td class="k-l">${label}</td>
    <td>${fN(a.ht)}<small>/${fN(a.kh)} buổi</small></td>
    <td>${fN(a.psd)}</td>
    <td>${fN(a.rc)}</td>
    <td>${fN(a.by)}</td>
    <td><span class="k-pill ${a.conv == null ? '' : a.conv >= 0.3 ? 'k-good' : a.conv >= 0.15 ? 'k-warn' : 'k-bad'}">${fP(a.conv)}</span></td>
    <td><b>${fN(a.pk)}</b>${cls ? '' : kpiBar(a.pk, maxPk, 'p')}</td>
    <td>${fM(a.cs)}</td>
    <td>${fM(a.ps)}</td>
    <td>${a.cpPack == null ? '—' : fN(a.cpPack) + 'đ'}</td>
  </tr>`;
  return `<div class="k-tbl-wrap"><table class="k-tbl"><thead><tr>
    <th class="k-l">Kênh · Vùng</th><th>Buổi HT</th><th>PG-ca</th><th>Tiếp cận</th><th>Người mua</th><th>% mua</th><th>Số bịch</th><th>Doanh số BH</th><th>CP PG BH</th><th>CP/bịch</th>
  </tr></thead><tbody>${kpiSegmentRows(rel, line)}</tbody></table></div>`;
}

function kpiSegmentTable(list) {
  if (!list.length) return '<div class="k-empty">Không có kế hoạch trong kỳ này</div>';
  const segs = kpiSegments(list);
  const rows = segs.map(s => kpiAgg(list.filter(p => p.ch === s.ch && p.vg === s.vg)));
  const maxSal = Math.max(...rows.map(a => a.sal), 1), maxTas = Math.max(...rows.map(a => a.contacts), 1);
  const line = (label, a, cls) => `<tr class="${cls || ''}">
      <td class="k-l">${label}</td>
      <td>${fN(a.kh)}</td><td><b>${fN(a.ht)}</b></td>
      <td><span class="k-pill ${rateCls(a.rate)}">${fP(a.rate)}</span></td>
      <td>${fN(a.contacts)}${cls ? '' : kpiBar(a.contacts, maxTas, 'g')}</td>
      <td>${fN(a.avg)}</td>
      <td>${fM(a.sal)}${cls ? '' : kpiBar(a.sal, maxSal, 't')}</td>
      <td>${fM(a.tc)}</td>
      <td>${a.cpp == null ? '—' : fN(a.cpp)}</td>
      <td>${fX(a.roi)}</td>
    </tr>`;
  return `<div class="k-tbl-wrap"><table class="k-tbl">
    <thead><tr><th class="k-l">Kênh · Vùng</th><th>Buổi KH</th><th>Buổi HT</th><th>% HT</th><th>Người</th><th>TB/buổi</th><th>Doanh số</th><th>Chi phí</th><th>CP/người</th><th>DS/CP</th></tr></thead>
    <tbody>${kpiSegmentRows(list, line)}</tbody></table></div>`;
}

function kpiMatrix(P) {
  let months = ymList(P.from, P.to);
  if (months.length < 3) months = ymList(ymAdd(P.to, -5), P.to);
  months = months.filter(m => m >= (kpiData.from || '0000'));
  const list = (kpiData.plans || []).filter(p => months.includes(p.m) && kpiInScope(p));
  if (!list.length) return '<div class="k-empty">Không có dữ liệu</div>';
  const segs = kpiSegments(list);
  const metrics = { ht: 'Buổi HT', tas: 'Người', sal: 'Doanh số', tc: 'Chi phí' };
  const val = a => kpiState.mx === 'ht' ? a.ht : kpiState.mx === 'tas' ? a.contacts : kpiState.mx === 'sal' ? a.sal : a.tc;
  const show = a => kpiState.mx === 'ht' ? `<b>${fN(a.ht)}</b><small>/${fN(a.kh)}</small>` : kpiState.mx === 'tas' ? fN(a.contacts) : fM(val(a));
  const grid = months.map(m => segs.map(s => kpiAgg(list.filter(p => p.m === m && p.ch === s.ch && p.vg === s.vg))));
  let max = 0; grid.forEach(r => r.forEach(a => { max = Math.max(max, val(a)); }));
  const heat = v => max ? `background:rgba(${kpiState.mx === 'tc' ? '27,58,87' : '14,117,68'},${(0.06 + 0.5 * v / max).toFixed(2)})` : '';
  const tabs = Object.entries(metrics).map(([k, l]) => `<button class="${kpiState.mx === k ? 'on' : ''}" onclick="kpiSet('mx','${k}')">${l}</button>`).join('');
  let h = `<div class="k-seg k-seg-sm" style="margin:0 0 10px;">${tabs}</div><div class="k-tbl-wrap"><table class="k-tbl k-mx"><thead><tr><th class="k-l">Tháng</th>`;
  h += segs.map(s => `<th>${s.ch}<br><small>${s.vg}</small></th>`).join('') + '<th>Tổng</th></tr></thead><tbody>';
  months.slice().reverse().forEach(m => {
    const i = months.indexOf(m);
    const tot = kpiAgg(list.filter(p => p.m === m));
    h += `<tr><td class="k-l">${ymShort(m)}</td>` + grid[i].map(a => `<td style="${heat(val(a))}">${(a.kh || val(a)) ? show(a) : '<span class="k-dim">·</span>'}</td>`).join('') + `<td class="k-totc">${show(tot)}</td></tr>`;
  });
  const colTot = segs.map(s => kpiAgg(list.filter(p => p.ch === s.ch && p.vg === s.vg)));
  h += `<tr class="k-total"><td class="k-l">Tổng</td>${colTot.map(a => `<td>${show(a)}</td>`).join('')}<td>${show(kpiAgg(list))}</td></tr>`;
  return h + '</tbody></table></div>';
}

function kpiCostTable(list) {
  const act = list.filter(p => KPI_ACTIVE.includes(p.st));
  if (!act.length) return '<div class="k-empty">Chưa có chi phí cam kết trong kỳ</div>';
  const hasPs = act.some(p => (p.ps || 0) > 0);
  const legend = `<div class="k-legend"><span><i class="s-pg"></i>PG sampling</span>${hasPs ? '<span><i class="s-ps"></i>PG bán hàng</span>' : ''}<span><i class="s-lc"></i>Địa điểm</span><span><i class="s-sc"></i>Mẫu thử</span><span><i class="s-gf"></i>Quà tặng</span></div>`;
  const stack = a => a.tc ? `<div class="k-stack">${[['pg', a.pg], ['ps', a.ps], ['lc', a.lc], ['sc', a.sc], ['gf', a.gf]].map(([k, v]) => v > 0 ? `<i class="s-${k}" style="width:${(v / a.tc * 100).toFixed(1)}%" title="${Math.round(v / a.tc * 100)}%"></i>` : '').join('')}</div>` : '';
  const line = (label, a, cls) => `<tr class="${cls || ''}">
    <td class="k-l">${label}</td>
    <td>${fN(a.actDays)}</td>
    <td>${fM(a.pg)}<small class="k-sub-t">${fN(a.pgd)} PG-ngày · ${fN(a.pgh)}h</small></td>
    ${hasPs ? `<td>${fM(a.ps)}<small class="k-sub-t">${fN(a.psd)} PG-ca</small></td>` : ''}
    <td>${fM(a.lc)}</td>
    <td>${fM(a.sc)}<small class="k-sub-t">${fN(a.sq)} mẫu</small></td>
    <td>${fM(a.gf)}</td>
    <td><b>${fM(a.tc)}</b></td>
    <td>${fM(a.cpb)}</td>
    <td class="k-stack-c">${stack(a)}</td>
  </tr>`;
  return legend + `<div class="k-tbl-wrap"><table class="k-tbl"><thead><tr><th class="k-l">Kênh · Vùng</th><th>Buổi</th><th>PG sampling</th>${hasPs ? '<th>PG bán hàng</th>' : ''}<th>Địa điểm</th><th>Mẫu thử</th><th>Quà</th><th>Tổng</th><th>CP/buổi</th><th>Cơ cấu</th></tr></thead><tbody>${kpiSegmentRows(act, line)}</tbody></table></div>`;
}

function kpiTopBottom(list) {
  const done = list.filter(p => p.st === 'hoan_thanh' && p.rp > 0);
  const byLoc = {};
  done.forEach(p => {
    const k = p.loc || '—';
    const o = byLoc[k] || (byLoc[k] = { loc: k, ch: p.ch, vg: p.vg, ht: 0, tas: 0, sal: 0, tc: 0 });
    o.ht += p.nd; o.tas += p.tas + (p.rc || 0); o.sal += p.sal; o.tc += p.tc;
  });
  const metrics = {
    sal: { l: 'Doanh số',  v: o => o.sal, f: fM, low: false },
    tas: { l: 'Người',     v: o => o.tas, f: fN, low: false },
    cpp: { l: 'CP/người',  v: o => o.tas ? o.tc / o.tas : null, f: x => fN(x) + 'đ', low: true },
    roi: { l: 'DS/CP',     v: o => o.tc ? o.sal / o.tc : null, f: fX, low: false },
  };
  const M = metrics[kpiState.tb] || metrics.sal;
  const tabs = Object.entries(metrics).map(([k, m]) => `<button class="${kpiState.tb === k ? 'on' : ''}" onclick="kpiSet('tb','${k}')">${m.l}</button>`).join('');
  const arr = Object.values(byLoc).map(o => Object.assign(o, { val: M.v(o) })).filter(o => o.val != null);
  if (!arr.length) return `<div class="k-seg k-seg-sm">${tabs}</div><div class="k-empty">Chưa có buổi hoàn thành có báo cáo</div>`;
  arr.sort((a, b) => M.low ? a.val - b.val : b.val - a.val);
  const top = arr.slice(0, 5), bottom = arr.length > 5 ? arr.slice(-Math.min(5, arr.length - 5)).reverse() : [];
  const tbl = (items, cls) => `<table class="k-tbl k-rank"><tbody>${items.map((o, i) => `<tr>
      <td class="k-rk ${cls}">${i + 1}</td>
      <td class="k-l"><div class="k-loc">${escHtml(o.loc)}</div><small>${o.ch} · ${o.vg} · ${o.ht} buổi</small></td>
      <td><b>${M.f(o.val)}</b></td></tr>`).join('')}</tbody></table>`;
  return `<div class="k-seg k-seg-sm" style="margin-bottom:10px;">${tabs}</div>
    <div class="k-rank-grid">
      <div><div class="k-rank-h good">Tốt nhất</div>${tbl(top, 'good')}</div>
      <div><div class="k-rank-h bad">Cần xem lại</div>${bottom.length ? tbl(bottom, 'bad') : '<div class="k-empty">Chưa đủ điểm để so sánh (cần &gt; 5)</div>'}</div>
    </div>`;
}

function kpiAlerts(list) {
  const today = localToday();
  const scope = (kpiData.plans || []).filter(kpiInScope);
  const overdue = scope.filter(p => p.st === 'da_duyet' && p.e < today && !p.rp).sort((a, b) => a.e.localeCompare(b.e));
  const pending = scope.filter(p => p.st === 'cho_duyet' && p.ca && daysBetween(p.ca, today) >= 2).sort((a, b) => a.ca.localeCompare(b.ca));
  const over    = list.filter(p => p.ov);
  const names = kpiData.users || {};
  const item = (p, tag, cls) => `<div class="k-alert-i" onclick="viewPlanDetail('${p.id}')"><span class="k-tag ${cls}">${tag}</span><div><b>${escHtml(p.loc)}</b><small>${fmtDate(p.d)} · ${p.ch} · ${p.vg} · ${escHtml(names[p.cr] || p.cr)}${p.cp ? ' · ' + escHtml(p.cp) : ''}</small></div></div>`;
  let h = `<div class="k-alert-sum">
    <div class="${overdue.length ? 'bad' : ''}"><b>${overdue.length}</b><span>Quá hạn báo cáo</span></div>
    <div class="${pending.length ? 'warn' : ''}"><b>${pending.length}</b><span>Chờ duyệt ≥ 2 ngày</span></div>
    <div class="${over.length ? 'warn' : ''}"><b>${over.length}</b><span>Báo cáo vượt mẫu (kỳ)</span></div>
  </div>`;
  const rows = overdue.slice(0, 6).map(p => item(p, 'Trễ ' + daysBetween(p.e, today) + 'n', 'bad'))
    .concat(pending.slice(0, 4).map(p => item(p, 'Chờ ' + daysBetween(p.ca, today) + 'n', 'warn')))
    .concat(over.slice(0, 3).map(p => item(p, 'Vượt mẫu', 'warn')));
  h += rows.length ? `<div class="k-alert-list">${rows.join('')}</div>` : '<div class="k-empty">✅ Không có việc tồn đọng</div>';
  return h;
}

function kpiSkuTable(list) {
  const act = list.filter(p => KPI_ACTIVE.includes(p.st));
  const skus = kpiData.skus || {}, agg = {};
  act.forEach(p => (p.sk || []).forEach(([ma, q]) => {
    const s = skus[ma] || {}, price = p.ch === 'GT' ? (s.gt || s.mt || 0) : (s.mt || s.gt || 0);
    const o = agg[ma] || (agg[ma] = { ma, n: (s.n || ma), q: 0, v: 0, plans: 0 });
    o.q += q; o.v += q * price; o.plans++;
  }));
  const arr = Object.values(agg).sort((a, b) => b.q - a.q);
  if (!arr.length) return '<div class="k-empty">Chưa có dữ liệu mẫu</div>';
  const max = arr[0].q, totQ = arr.reduce((s, o) => s + o.q, 0), totV = arr.reduce((s, o) => s + o.v, 0);
  return `<div class="k-tbl-wrap k-scroll-y"><table class="k-tbl"><thead><tr><th class="k-l">SKU</th><th>SL mẫu</th><th>Giá trị</th><th>Số KH</th></tr></thead><tbody>
    ${arr.map(o => `<tr><td class="k-l"><div class="k-loc">${escHtml(o.n)}</div>${kpiBar(o.q, max, 'r')}</td><td><b>${fN(o.q)}</b></td><td>${fM(o.v)}</td><td>${o.plans}</td></tr>`).join('')}
    <tr class="k-total"><td class="k-l">Tổng</td><td>${fN(totQ)}</td><td>${fM(totV)}</td><td></td></tr>
  </tbody></table></div>`;
}

function kpiStaffTable(list) {
  const names = kpiData.users || {}, agg = {};
  list.filter(p => !KPI_VOID.includes(p.st)).forEach(p => (p.ex.length ? p.ex : [p.cr]).forEach(c => {
    const o = agg[c] || (agg[c] = { c, kh: 0, ht: 0, tas: 0, sal: 0, pk: 0, chs: {} });
    o.kh += p.nd; o.chs[p.ch + ' · ' + p.vg] = 1;
    if (p.st === 'hoan_thanh') { o.ht += p.nd; o.tas += p.tas + (p.rc || 0); o.sal += p.sal; o.pk += p.pk || 0; }
  }));
  const arr = Object.values(agg).sort((a, b) => b.ht - a.ht || b.kh - a.kh);
  if (!arr.length) return '<div class="k-empty">Chưa có dữ liệu</div>';
  const hasPk = arr.some(o => o.pk > 0);
  const shown = kpiState.staffAll ? arr : arr.slice(0, 10);
  return `<div class="k-tbl-wrap"><table class="k-tbl"><thead><tr><th class="k-l">Nhân viên</th><th>KH</th><th>HT</th><th>% HT</th><th>Người</th>${hasPk ? '<th>Bịch</th>' : ''}<th>Doanh số</th></tr></thead><tbody>
    ${shown.map(o => { const r = o.kh ? o.ht / o.kh : null; return `<tr><td class="k-l"><div class="k-loc">${escHtml(names[o.c] || userName(o.c))}</div><small>${Object.keys(o.chs).join(', ')}</small></td><td>${fN(o.kh)}</td><td><b>${fN(o.ht)}</b></td><td><span class="k-pill ${rateCls(r)}">${fP(r)}</span></td><td>${fN(o.tas)}</td>${hasPk ? `<td>${fN(o.pk)}</td>` : ''}<td>${fM(o.sal)}</td></tr>`; }).join('')}
  </tbody></table></div>
  ${arr.length > 10 ? `<button class="k-more" onclick="kpiSet('staffAll',${!kpiState.staffAll})">${kpiState.staffAll ? 'Thu gọn' : 'Xem tất cả ' + arr.length + ' người'}</button>` : ''}`;
}

let _showAllCancelled = false;

async function loadApprovalDirect() {
  const el = document.getElementById('dash-content');
  if (!el) return;
  setDashTitle('✅ Phê duyệt kế hoạch');
  el.innerHTML = `<div id="mgr-scroll"><div id="mgr-content">${KPI_LOADER}</div></div>`;
  try {
    const board = await api('GET', { action: 'getApprovalBoard' });
    const contentEl = document.getElementById('mgr-content');
    if (!contentEl) return;
    if (!board || !board.success) {
      contentEl.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">${(board && board.error) || 'Lỗi'}</div></div>`;
      return;
    }
    if (!window._planCache) window._planCache = {};
    (board.pending || []).concat(board.cancelRequests || []).forEach(p => { window._planCache[p.id] = Object.assign(window._planCache[p.id] || {}, p); });
    renderDashApproval(board, contentEl);
    applyApprovalBadges(board);
  } catch (e) {
    const contentEl = document.getElementById('mgr-content');
    if (contentEl) contentEl.innerHTML = '<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-text">Lỗi kết nối</div></div>';
  }
}

function applyApprovalBadges(board) {
  const total = ((board && board.pending) || []).length + ((board && board.cancelRequests) || []).length;
  ['sidebar-approval-badge', 'approval-badge'].forEach(id => {
    const b = document.getElementById(id);
    if (b) { b.textContent = total; b.style.display = total > 0 ? 'flex' : 'none'; }
  });
  updateMgrNavBadge(total);
}

async function syncApprovalBadgeToSidebar() {
  const isMgr = currentUser && (currentUser.role === 'Sales Manager' || currentUser.role === 'Marketing');
  if (!isMgr) return;
  try {
    const board = await api('GET', { action: 'getApprovalBoard' });
    if (board && board.success) applyApprovalBadges(board);
  } catch (e) {}
}
function loadApprovalBadge() { return syncApprovalBadgeToSidebar(); }

function renderDashApproval(board, el) {
  const plans = board.pending || [], cancelReqs = board.cancelRequests || [], cancelled = board.cancelled || [];
  window._lastApprovalPlansAll = plans;
  window._lastCancelReqsAll    = cancelReqs;
  window._lastCancelledAll     = cancelled;

  const all = plans.concat(cancelReqs, cancelled);
  const channels = [...new Set(all.map(p => p.region || '').filter(Boolean))].sort();
  const months = [...new Set(all.map(p => p.date ? String(p.date).substring(0, 7) : '').filter(Boolean))].sort().reverse();
  const cps = [...new Set(all.map(p => p.campaign || '').filter(Boolean))].sort();

  el.innerHTML = `
  <div class="ap-toolbar">
    <select class="k-select" id="approval-filter-month" onchange="_applyApprovalFilters()">
      <option value="">Tất cả tháng</option>${months.map(m => `<option value="${m}">Tháng ${m.substring(5, 7)}/${m.substring(0, 4)}</option>`).join('')}
    </select>
    <select class="k-select" id="approval-filter-channel" onchange="_applyApprovalFilters()">
      <option value="">Tất cả kênh</option>${channels.map(c => `<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('')}
    </select>
    ${cps.length ? `<select class="k-select" id="approval-filter-cp" onchange="_applyApprovalFilters()">
      <option value="">Tất cả chương trình</option><option value="__none">Sampling thường</option>${cps.map(c => `<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('')}
    </select>` : ''}
    <div class="ap-counts" id="approval-count-label"></div>
    <div class="view-toggle-bar ap-view">
      <button class="view-toggle-btn ${_approvalView === 'kanban' ? 'active' : ''}" onclick="_approvalView='kanban';_rerenderApproval()">📋 Kanban</button>
      <button class="view-toggle-btn ${_approvalView === 'list' ? 'active' : ''}" onclick="_approvalView='list';_rerenderApproval()">☰ Danh sách</button>
    </div>
  </div>
  <div id="approval-content-area"></div><div class="spacer"></div>`;
  _applyApprovalFilters();
}

function _applyApprovalFilters() {
  const month   = (document.getElementById('approval-filter-month')   || {}).value || '';
  const channel = (document.getElementById('approval-filter-channel') || {}).value || '';
  const cp      = (document.getElementById('approval-filter-cp')      || {}).value || '';
  const f = arr => (arr || []).filter(p =>
    (!month || (p.date && String(p.date).substring(0, 7) === month)) && (!channel || p.region === channel) &&
    (!cp || (cp === '__none' ? !p.campaign : p.campaign === cp)));
  window._lastApprovalPlans = f(window._lastApprovalPlansAll);
  window._lastCancelReqs    = f(window._lastCancelReqsAll);
  window._lastCancelled     = f(window._lastCancelledAll);
  const lbl = document.getElementById('approval-count-label');
  if (lbl) lbl.innerHTML =
    `<span class="ap-chip pending">⏳ ${window._lastApprovalPlans.length} chờ duyệt</span>` +
    `<span class="ap-chip cancel">🚫 ${window._lastCancelReqs.length} yêu cầu hủy</span>` +
    `<span class="ap-chip void">🗑 ${window._lastCancelled.length} đã hủy</span>`;
  _renderApprovalContent(window._lastApprovalPlans, window._lastCancelReqs, document.getElementById('approval-content-area'), window._lastCancelled);
}

function _rerenderApproval() {
  document.querySelectorAll('.ap-view .view-toggle-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.includes('Kanban') ? _approvalView === 'kanban' : _approvalView === 'list');
  });
  _renderApprovalContent(window._lastApprovalPlans || [], window._lastCancelReqs || [], document.getElementById('approval-content-area'), window._lastCancelled || []);
}

function _renderApprovalContent(plans, cancelReqs, el, cancelled) {
  if (!el) return;
  if (_approvalView === 'kanban') _renderApprovalKanban(plans, cancelReqs, el, cancelled || []);
  else _renderApprovalList(plans, cancelReqs, el, cancelled || []);
}

function _cancelNoteOf(p) {
  return (String(p.notes || '').split('\n').reverse().find(l => l.toLowerCase().includes('hủy')) || '')
    .replace(/\s*\[prev:[a-z_]+\]\s*/g, '');
}

function _apCard(p, mode) {
  const samples = (p.samples || []).map(s => {
    const prod = masterData.products.find(pr => pr.ma === s.ma);
    return `${prod ? prod.ten : s.ma} ×${s.so_luong}`;
  }).join(', ') || '—';
  const note = mode !== 'pending' ? _cancelNoteOf(p) : '';
  let actions = '';
  if (mode === 'pending') actions = `
      <button class="kc-btn kc-btn-approve" onclick="quickApprove('${p.id}')">✅ Duyệt</button>
      <button class="kc-btn kc-btn-edit" onclick="inlineEditModal('${p.id}')">✏️ Sửa</button>
      <button class="kc-btn kc-btn-reject" onclick="rejectModal('${p.id}')">❌</button>`;
  if (mode === 'cancel') actions = `
      <button class="kc-btn kc-btn-approve" onclick="confirmCancelPlan('${p.id}')">✅ Xác nhận hủy</button>
      <button class="kc-btn kc-btn-edit" onclick="rejectCancelPlan('${p.id}')">↩ Giữ lại</button>`;
  return `<div class="kanban-card kc-${p.status}" onclick="viewPlanDetail('${p.id}')">
    <div class="kc-top"><div class="kc-name">${escHtml(p.locationName)}</div><div class="kc-cost">${fM(p.totalEstCost)}</div></div>
    ${p.campaign ? `<div style="margin-top:2px;">${campaignChip(p)}</div>` : ''}
    <div class="kc-meta"><span>📅 ${fmtDateRange(p)}</span><span>⏰ ${fmtTime(p.timeStart)}–${fmtTime(p.timeEnd)}</span></div>
    <div class="kc-meta"><span>👤 ${userName(p.creator)}</span><span class="kc-ch">${escHtml(p.region || '')}</span>${p.hiresPg && p.pgCount > 0 ? `<span>👥 ${p.pgCount} PG sampling</span>` : ''}${p.pgSales && p.pgSales.count ? `<span style="color:var(--purple);font-weight:700;">🛒 ${p.pgSales.count} PG BH · ${p.pgSales.mode === '2ca' ? '2 ca' : '1 ca'}</span>` : ''}</div>
    ${mode !== 'void' ? `<div class="kc-products">${escHtml(samples)}</div>` : ''}
    ${note ? `<div class="kc-note ${mode}">${escHtml(note)}</div>` : ''}
    ${actions ? `<div class="kc-actions" onclick="event.stopPropagation()">${actions}</div>` : ''}
  </div>`;
}

function _renderApprovalKanban(plans, cancelReqs, el, cancelled) {
  const voidShown = _showAllCancelled ? cancelled : cancelled.slice(0, 10);
  const cols = [
    { label: '⏳ Chờ duyệt',   cls: 'col-pending',   items: plans,      mode: 'pending', empty: 'Không có kế hoạch chờ duyệt 🎉' },
    { label: '🚫 Yêu cầu hủy', cls: 'col-cancelreq', items: cancelReqs, mode: 'cancel',  empty: 'Không có yêu cầu hủy' },
    { label: '🗑 Đã hủy',       cls: 'col-cancelled', items: voidShown,  mode: 'void',    empty: 'Không có', total: cancelled.length },
  ];
  el.innerHTML = '<div class="kanban-board">' + cols.map(col => `
    <div class="kanban-col ${col.mode === 'void' ? 'kanban-col-void' : ''}">
      <div class="kanban-col-header ${col.cls}"><span>${col.label}</span><span class="kanban-col-count">${col.total != null ? col.total : col.items.length}</span></div>
      <div class="kanban-col-body">
        ${col.items.length ? col.items.map(p => _apCard(p, col.mode)).join('') : `<div class="kanban-empty"><div class="kanban-empty-icon">✓</div>${col.empty}</div>`}
        ${col.mode === 'void' && cancelled.length > 10 ? `<button class="k-more" onclick="_showAllCancelled=!_showAllCancelled;_rerenderApproval()">${_showAllCancelled ? 'Thu gọn' : 'Xem thêm ' + (cancelled.length - 10) + ' kế hoạch'}</button>` : ''}
      </div>
    </div>`).join('') + '</div>';
}

    'Sales Representative': `📍 ${currentUser.name} · ${currentUser.channel || currentUser.region || ''}`,

  };

async function loadDashboard() {
  const el = document.getElementById('dash-content');
  if (!el || !currentUser) return;
  setupDashboardForRole();

    renderPersonalDash(el, res.data || [], month);

    console.error('Dashboard load error:', e);
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-text">Lỗi kết nối. Thử lại sau.</div></div>';

}

function showDashTab(tab) { currentDashTab = tab; loadDashboard(); }

function _usersFor(channel, region) {
  return (masterData.users || []).filter(u => {
    const ch = String(u.channel || ''), reg = String(u.region || '');
    if (channel && ch !== channel && ch !== 'Nationwide' && ch !== 'Manager' && ch !== 'Marketing') return false;
    if (region && region !== 'Nationwide' && reg !== region && reg !== 'Nationwide') return false;
    return true;
  });
}

async function loadExecutorOptions() {
  try {
    if (!masterData.users || masterData.users.length === 0) await loadMasterData(true);
    const isMgr = currentUser.role === 'Sales Manager' || currentUser.role === 'Marketing';
    const users    = isMgr ? (masterData.users || []) : _usersFor(currentUser.channel, currentUser.region);
    const allUsers = masterData.users || [];

    const chipsEl = document.getElementById('executor-chips');
    if (chipsEl) {
      const execUsers = users.filter(u => u.role === 'Salesman' || u.role === 'Sales Representative');
      chipsEl.innerHTML = execUsers.map(u =>
        `<div class="chip-option" data-code="${u.code}" onclick="toggleExecutor(this,'${u.code}')">
          ${escHtml(u.name)}${u.role === 'Sales Representative' ? ' <span style="font-size:10px;opacity:0.6;">(Rep)</span>' : ''}
          ${isMgr && u.region ? ` <span style="font-size:10px;opacity:0.6;">· ${escHtml(u.region)}</span>` : ''}
        </div>`).join('') || '<div class="small text-gray">Không có nhân sự phù hợp</div>';
      if (!isMgr && planFormData.executors.length === 0 && chipsEl.querySelector(`[data-code="${currentUser.code}"]`))
        planFormData.executors = [String(currentUser.code)];
      chipsEl.querySelectorAll('.chip-option').forEach(c => { if (planFormData.executors.includes(String(c.dataset.code))) c.classList.add('selected'); });
    }

    const supEl = document.getElementById('supervisor-chips');
    if (supEl) {
      const supUsers = allUsers.filter(u => u.role === 'Sales Representative' || u.role === 'Sales Manager' || u.role === 'Marketing');
      supEl.innerHTML = supUsers.map(u =>
        `<div class="chip-option ${String(planFormData.supervisorCode) === String(u.code) || planFormData.supervisorName === u.name ? 'selected' : ''}" data-code="${u.code}" onclick="selectSupervisor(this,'${u.code}','${encodeURIComponent(u.name)}')">
          ${escHtml(u.name)}${u.role.includes('Manager') ? ' <span style="font-size:10px;opacity:0.6;">(Mgr)</span>' : u.role === 'Sales Representative' ? ' <span style="font-size:10px;opacity:0.6;">(Rep)</span>' : ''}
        </div>`).join('');
    }
  } catch (e) { console.error('loadExecutorOptions error:', e); }
}

// =====================================================
// REOPEN / CANCEL
// =====================================================
async function reopenPlan(planId) {
  if (!confirm('Mở lại kế hoạch này để nhân viên tiếp tục báo cáo?')) return;
  loading(true, 'Đang xử lý...');
  try {
    const res = await api('POST', { action: 'reopenPlan', planId, userCode: currentUser.code });
    if (res.success) {
      if (window._planCache) delete window._planCache[planId];
      showToast('✅ Đã mở lại kế hoạch — nhân viên có thể báo cáo thêm', 'success', 4000);
      viewPlanDetail(planId);
    } else showToast(res.error || 'Có lỗi xảy ra', 'error');
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

async function initCancelPlan(planId, planStatus) {
  const isManager   = currentUser.role === 'Sales Manager';
  const isMarketing = currentUser.role === 'Marketing';
  const isRep       = currentUser.role === 'Sales Representative';
  const immediateCancel = isManager || (isRep && planStatus === 'cho_duyet');
  const modeNote = immediateCancel
    ? '⚡ Kế hoạch sẽ được hủy ngay sau khi xác nhận.'
    : '⏳ Yêu cầu hủy sẽ được gửi đến Manager/Marketing để xác nhận.';
  const roleNote = isManager
    ? '🔑 Bạn là Sales Manager — hủy không cần xác nhận thêm.'
    : isMarketing ? '📣 Bạn là Marketing — cần Manager xác nhận.'
    : isRep && planStatus === 'cho_duyet' ? '📋 Kế hoạch chưa duyệt — bạn có thể tự hủy.'
    : '📋 Kế hoạch đã duyệt — cần Manager/Marketing xác nhận hủy.';

  showModal('🚫 Hủy kế hoạch',
    `<div style="margin-bottom:12px;font-size:13px;color:var(--gray);line-height:1.6;">${roleNote}</div>
     <div style="background:${immediateCancel?'var(--red-light)':'#fff3cd'};border-radius:8px;padding:10px 12px;font-size:12px;color:${immediateCancel?'var(--red)':'#856404'};margin-bottom:14px;">${modeNote}</div>
     <div class="form-field">
       <label class="required" style="font-size:13px;">Nguyên nhân hủy</label>
       <textarea id="cancel-reason-input" class="form-input" rows="3" placeholder="Ví dụ: Điểm bán không hợp tác, thay đổi kế hoạch kinh doanh..." style="resize:none;"></textarea>
     </div>`,
    [
      { label: immediateCancel ? '🚫 Xác nhận hủy' : '📤 Gửi yêu cầu hủy', cls: 'btn-danger', action: `executeCancelPlan('${planId}', ${immediateCancel})` },
      { label: 'Đóng', cls: 'btn-outline', action: 'closeModal()' },
    ]
  );
  setTimeout(() => { const ta = document.getElementById('cancel-reason-input'); if (ta) ta.focus(); }, 200);
}

async function executeCancelPlan(planId, isImmediate) {
  const reason = document.getElementById('cancel-reason-input')?.value?.trim();
  if (!reason) {
    const ta = document.getElementById('cancel-reason-input');
    if (ta) { ta.style.border = '2px solid var(--red)'; setTimeout(() => ta.style.border='', 1500); }
    showToast('Vui lòng nhập nguyên nhân hủy', 'error');
    return;
  }
  closeModal();
  loading(true, isImmediate ? 'Đang hủy kế hoạch...' : 'Đang gửi yêu cầu hủy...');
  try {
    const res = await api('POST', { action: 'cancelPlan', planId, reason, userCode: currentUser.code });
    if (res.success) {
      showToast(res.immediate ? `✅ Kế hoạch ${planId} đã được hủy.` : `📤 Đã gửi yêu cầu hủy kế hoạch ${planId}. Chờ xác nhận.`, 'success', 4000);
      if (window._planCache) delete window._planCache[planId];
      await viewPlanDetail(planId);
    } else showToast(res.error || 'Có lỗi xảy ra', 'error');
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

async function confirmCancelPlan(planId) {
  if (!confirm(`Xác nhận đồng ý HỦY kế hoạch ${planId}?\n\nHành động này không thể hoàn tác.`)) return;
  loading(true, 'Đang xác nhận hủy...');
  try {
    const res = await api('POST', { action: 'confirmCancel', planId, userCode: currentUser.code });
    if (res.success) { showToast(`✅ Đã xác nhận hủy kế hoạch ${planId}`, 'success', 3500); afterApprovalAction(planId); }
    else showToast(res.error || 'Lỗi', 'error');
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

async function rejectCancelPlan(planId) {
  loading(true, 'Đang xử lý...');
  try {
    const res = await api('POST', { action: 'rejectCancel', planId, userCode: currentUser.code });
    if (res.success) { showToast('Đã từ chối yêu cầu hủy — kế hoạch tiếp tục', 'success', 3000); afterApprovalAction(planId); }
    else showToast(res.error || 'Lỗi', 'error');
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

// =====================================================
// ĐIỀU CHỈNH GIỚI HẠN (plan đã duyệt / đang chạy)
// Chỉ sửa: người thực hiện · ngày · giờ từng ngày · số PG sampling & PG bán hàng (chỉ giảm)
// =====================================================
let adjustData = {};

async function initAdjustPlan(planId) {
  loading(true, 'Đang tải kế hoạch...');
  let p;
  try {
    const res = await api('GET', { action: 'getPlanDetail', planId });
    if (!res.success) { showToast(res.error || 'Không tải được kế hoạch', 'error'); return; }
    p = res.data;
  } catch (e) { showToast('Lỗi kết nối', 'error'); return; }
  finally { loading(false); }

  const startStr = toInputDate(p.date);
  const endStr   = p.dateEnd ? toInputDate(p.dateEnd) : startStr;
  const srcDays  = (Array.isArray(p.days) && p.days.length) ? p.days : null;
  const dates    = dateRange(startStr, endStr < startStr ? startStr : endStr);

  adjustData = {
    planId,
    campaign:  p.campaign || '',
    maxPg:     Number(p.pgCount) || 0,
    pgCount:   Number(p.pgCount) || 0,
    maxPgs:    (p.pgSales && Number(p.pgSales.count)) || 0,
    pgsCount:  (p.pgSales && Number(p.pgSales.count)) || 0,
    executors: (p.executors || []).map(String),
    days: dates.map((ds, i) => {
      const s = srcDays ? (srcDays.find(d => toInputDate(d.date) === ds) || srcDays[i]) : null;
      return { date: ds, timeStart: (s && s.timeStart) || p.timeStart || '09:00', timeEnd: (s && s.timeEnd) || p.timeEnd || '12:00' };
    }),
  };
  renderAdjustModal(startStr, endStr);
}

function renderAdjustModal(startStr, endStr) {
  const users = (masterData.users || []).filter(u => u.role === 'Salesman' || u.role === 'Sales Representative');
  const chips = users.map(u =>
    `<div class="chip-option ${adjustData.executors.includes(String(u.code)) ? 'selected' : ''}"
      data-code="${u.code}" onclick="toggleAdjustExec(this,'${u.code}')">${escHtml(u.name)}</div>`).join('') ||
    '<span style="font-size:12px;color:var(--gray2);">Không có nhân sự</span>';

  const body = `
    <div style="max-height:62vh;overflow:auto;text-align:left;padding:2px;">
      <div style="display:flex;gap:8px;">
        <div class="form-field" style="flex:1;">
          <label style="font-size:12px;">Ngày bắt đầu</label>
          <input class="form-input" type="date" id="adj-date-start" value="${startStr}" onchange="onAdjustDateChange()">
        </div>
        <div class="form-field" style="flex:1;">
          <label style="font-size:12px;">Ngày kết thúc</label>
          <input class="form-input" type="date" id="adj-date-end" value="${endStr}" onchange="onAdjustDateChange()">
        </div>
      </div>
      <div class="form-field" style="margin-top:8px;">
        <label style="font-size:12px;">Giờ diễn ra từng ngày</label>
        <div id="adj-days"></div>
      </div>
      <div class="form-field" style="margin-top:8px;">
        <label style="font-size:12px;">Người thực hiện</label>
        <div class="chip-select" id="adj-exec-chips">${chips}</div>
      </div>
      ${adjustData.maxPg > 0 ? `
      <div class="form-field" style="margin-top:8px;">
        <label style="font-size:12px;">Số PG sampling — hiện tại <b>${adjustData.maxPg}</b> (chỉ được giảm/về 0)</label>
        <input class="form-input" type="number" id="adj-pg" min="0" max="${adjustData.maxPg}" value="${adjustData.pgCount}" oninput="onAdjustPgInput()">
        <div id="adj-pg-hint" style="font-size:11px;color:var(--gray2);margin-top:4px;"></div>
      </div>` : ''}
      ${adjustData.maxPgs > 0 ? `
      <div class="form-field" style="margin-top:8px;">
        <label style="font-size:12px;">🛒 Số PG bán hàng — hiện tại <b>${adjustData.maxPgs}</b> (chỉ được giảm, tối thiểu 1)</label>
        <input class="form-input" type="number" id="adj-pgs" min="1" max="${adjustData.maxPgs}" value="${adjustData.pgsCount}" oninput="onAdjustPgsInput()">
      </div>` : ''}
      <div class="form-field" style="margin-top:8px;">
        <label style="font-size:12px;">Lý do điều chỉnh (gửi người duyệt)</label>
        <textarea class="form-input" id="adj-reason" rows="2" placeholder="VD: 1 PG báo bận đột xuất, dời sang ngày khác..."></textarea>
      </div>
      <div class="info-banner" style="margin:8px 0 0;">ℹ️ Lưu xong kế hoạch chuyển về <b>"chờ duyệt"</b> để Trade/Manager duyệt lại.</div>
    </div>`;

  showModal('🔧 Điều chỉnh kế hoạch', body, [
    { label: '💾 Lưu & gửi duyệt lại', cls: 'btn-primary', action: `saveAdjustPlan('${adjustData.planId}')` },
    { label: 'Đóng',                   cls: 'btn-outline', action: 'closeModal()' },
  ]);
  renderAdjustDays();
  onAdjustPgInput();
}

function renderAdjustDays() {
  const el = document.getElementById('adj-days');
  if (!el) return;
  el.innerHTML = (adjustData.days || []).map((d, i) => {
    const hol = adjustData.campaign && isHoliday(d.date);
    return `<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
      <div style="min-width:104px;font-size:12px;font-weight:600;color:${hol ? 'var(--red)' : 'var(--navy)'};">${getDayName(d.date)}, ${fmtDate(d.date)}${hol ? ' ⛔' : ''}</div>
      <input class="form-input" type="time" value="${d.timeStart}" style="padding:8px;flex:1;" oninput="adjustData.days[${i}].timeStart=this.value">
      <span style="color:var(--gray2);">–</span>
      <input class="form-input" type="time" value="${d.timeEnd}" style="padding:8px;flex:1;" oninput="adjustData.days[${i}].timeEnd=this.value">
    </div>`;
  }).join('');
}

function onAdjustDateChange() {
  const s = document.getElementById('adj-date-start').value;
  let e   = document.getElementById('adj-date-end').value || s;
  if (!s) return;
  if (e < s) { e = s; document.getElementById('adj-date-end').value = s; }
  const prev = {};
  (adjustData.days || []).forEach(d => { prev[d.date] = d; });
  adjustData.days = dateRange(s, e).map(ds => ({
    date: ds, timeStart: (prev[ds] && prev[ds].timeStart) || '09:00', timeEnd: (prev[ds] && prev[ds].timeEnd) || '12:00',
  }));
  renderAdjustDays();
}

function toggleAdjustExec(el, code) {
  const i = adjustData.executors.indexOf(String(code));
  if (i >= 0) { adjustData.executors.splice(i, 1); el.classList.remove('selected'); }
  else        { adjustData.executors.push(String(code)); el.classList.add('selected'); }
}

function onAdjustPgInput() {
  const el = document.getElementById('adj-pg');
  const hint = document.getElementById('adj-pg-hint');
  if (!el) return;
  let v = Number(el.value);
  if (isNaN(v) || v < 0) v = 0;
  if (v > adjustData.maxPg) { v = adjustData.maxPg; el.value = v; showToast(`Chỉ được giảm — tối đa ${adjustData.maxPg} PG`, 'error'); }
  adjustData.pgCount = v;
  if (hint) hint.textContent = v === 0 ? '→ Không thuê PG sampling (chi phí = 0)'
    : (v < adjustData.maxPg ? `Giảm ${adjustData.maxPg - v} PG so với ban đầu` : 'Giữ nguyên số PG');
}

function onAdjustPgsInput() {
  const el = document.getElementById('adj-pgs');
  if (!el) return;
  let v = Number(el.value);
  if (v > adjustData.maxPgs) { v = adjustData.maxPgs; el.value = v; showToast(`Chỉ được giảm — tối đa ${adjustData.maxPgs} PG bán hàng`, 'error'); }
  adjustData.pgsCount = v;
}

async function saveAdjustPlan(planId) {
  if (!adjustData.executors || adjustData.executors.length === 0) { showToast('Chọn ít nhất 1 người thực hiện', 'error'); return; }
  for (const d of (adjustData.days || [])) {
    if (d.timeStart && d.timeEnd && d.timeStart >= d.timeEnd) { showToast(`Giờ ngày ${fmtDate(d.date)} chưa hợp lệ`, 'error'); return; }
    if (adjustData.campaign && isHoliday(d.date)) { showToast(`"${adjustData.campaign}" không áp dụng ngày lễ/Tết (${fmtDate(d.date)})`, 'error'); return; }
  }
  if (adjustData.maxPgs > 0 && !(adjustData.pgsCount >= 1)) { showToast('Kế hoạch này bắt buộc có ít nhất 1 PG bán hàng', 'error'); return; }
  const pgEl = document.getElementById('adj-pg');
  const pg = pgEl ? Number(pgEl.value) : adjustData.maxPg;
  const reason = (document.getElementById('adj-reason')?.value || '').trim();
  loading(true, 'Đang lưu điều chỉnh...');
  try {
    const res = await api('POST', {
      action: 'adjustPlan', planId,
      data: {
        date: adjustData.days[0].date, dateEnd: adjustData.days[adjustData.days.length - 1].date,
        days: adjustData.days, executors: adjustData.executors,
        pgCount: pg, pgSalesCount: adjustData.maxPgs > 0 ? adjustData.pgsCount : null,
        adjustReason: reason,
      },
      userCode: currentUser.code,
    });
    if (res.success) {
      closeModal();
      if (window._planCache) delete window._planCache[planId];
      showToast('✅ ' + (res.message || 'Đã điều chỉnh, chờ duyệt lại'), 'success');
      viewPlanDetail(planId);
    } else showToast(res.error || 'Lỗi khi lưu', 'error', 5000);
  } catch (e) { showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

// =====================================================
// MODAL
// =====================================================
function showModal(title, bodyHtml, actions=[]) {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  const actHtml = actions.map(a => `<button class="btn ${a.cls}" onclick="${a.action}">${a.label}</button>`).join('');
  content.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">${title}</div>
    ${bodyHtml}
    ${actHtml ? `<div class="modal-footer">${actHtml}</div>` : ''}
  `;
  overlay.classList.add('show');
  overlay.onclick = e => { if (e.target === overlay) closeModal(); };
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); }

// =====================================================
// INIT
// =====================================================
function goHome() {
  if (!currentUser) return;
  showScreen('home');
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('screen-' + name);
  if (el) el.classList.add('active');
  if (currentUser) sessionStorage.setItem('dgm_screen', name);
  updateSidebarActive();
  const sidebar = document.getElementById('desktop-sidebar');
  if (sidebar) sidebar.style.display = (name === 'login' || !currentUser) ? 'none' : (isDesktop() ? 'flex' : 'none');
}

(function init() {
  const storedVersion = localStorage.getItem('dgm_app_version');
  if (storedVersion && storedVersion !== APP_VERSION) {
    localStorage.setItem('dgm_app_version', APP_VERSION);
    try { Object.keys(sessionStorage).filter(k => k.startsWith('dgm_masterdata')).forEach(k => sessionStorage.removeItem(k)); } catch (e) {}
    if ('caches' in window) caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
    window.location.reload();
    return;
  }
  localStorage.setItem('dgm_app_version', APP_VERSION);
  document.addEventListener('touchstart', function(){}, {passive:true});
  document.documentElement.style.overscrollBehavior = 'none';

  const saved = sessionStorage.getItem('dgm_user');
  const savedScreen = sessionStorage.getItem('dgm_screen');
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      loadMasterData().then(() => {
        setupHome();
        const safeScreens = ['home','plans','calendar','dashboard'];
        if (savedScreen && safeScreens.includes(savedScreen)) {
          showScreen(savedScreen);
          if (savedScreen === 'plans') loadMyPlans();
          else if (savedScreen === 'calendar') renderCalendar();
          else if (savedScreen === 'dashboard') loadDashboard();
        } else {
          showScreen('home');
        }
      });
    } catch(e) { sessionStorage.removeItem('dgm_user'); }
  }
  if (!saved) api('GET', { action:'getBootstrap', channel: '', region: '' }).catch(() => {});
})();
</script>
