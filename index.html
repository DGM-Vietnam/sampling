function onDateRangeChange() {
  const startStr = document.getElementById('f-date-start')?.value;
  const endStr   = document.getElementById('f-date-end')?.value;

  // Ensure end >= start
  const endEl = document.getElementById('f-date-end');
  if (endEl && startStr) endEl.min = startStr;
  if (endStr && startStr && endStr < startStr) {
    if (endEl) endEl.value = startStr;
  }

  const start = startStr;
  const end   = endEl?.value || startStr;

  if (!start) { renderDayCards([]); return; }
  const dates = dateRange(start, end || start);
  renderDayCards(dates);
}

function renderDayCards(dates) {
  const container = document.getElementById('day-cards-container');
  const summaryEl = document.getElementById('sampling-days-display');
  const summaryText = document.getElementById('sampling-days-text');
  if (!container) return;

  if (dates.length === 0) {
    container.innerHTML = '';
    if (summaryEl) summaryEl.style.display = 'none';
    planFormData.days = [];
    return;
  }

  // Preserve existing times when re-rendering
  const existingTimes = {};
  (planFormData.days || []).forEach(d => {
    existingTimes[d.date] = { timeStart: d.timeStart, timeEnd: d.timeEnd };
  });

  const channel = document.getElementById('f-region')?.value || currentUser?.channel || '';
  const today   = toInputDate(new Date().toISOString().split('T')[0]);

  container.innerHTML = dates.map(dateStr => {
    const d       = parseLocalDate(dateStr);
    const dayIdx  = d.getDay(); // 0=Sun, 6=Sat
    const dayName = DAY_NAMES_VI[dayIdx];
    const isWE    = dayIdx === 0 || dayIdx === 6;
    const isHol   = isHoliday(dateStr);
    const cardCls = isHol ? 'holiday' : isWE ? 'weekend' : '';
    const typeLbl = isHol ? '🎉 Ngày lễ' : isWE ? '📅 Cuối tuần' : '';
    const existing = existingTimes[dateStr] || {};
    const tStart  = existing.timeStart || '09:00';
    const tEnd    = existing.timeEnd   || '12:00';

    return `<div class="day-card ${cardCls}" id="day-card-${dateStr}">
      <div class="day-card-header">
        <div class="day-badge ${cardCls}">${dayName}</div>
        <div class="day-date-label">${fmtDate(dateStr)}</div>
        ${typeLbl ? `<div class="day-type-chip ${cardCls}">${typeLbl}</div>` : ''}
      </div>
      <div class="day-time-row">
        <div class="form-field">
          <label style="font-size:11px;">Giờ bắt đầu</label>
          <input class="form-input" type="time" value="${tStart}"
            id="day-start-${dateStr}"
            oninput="updateDayTime('${dateStr}')" style="padding:9px 10px;">
        </div>
        <div class="form-field">
          <label style="font-size:11px;">Giờ kết thúc</label>
          <input class="form-input" type="time" value="${tEnd}"
            id="day-end-${dateStr}"
            oninput="updateDayTime('${dateStr}')" style="padding:9px 10px;">
        </div>
      </div>
    </div>`;
  }).join('');

  // Update planFormData.days
  planFormData.days = dates.map(dateStr => ({
    date:      dateStr,
    timeStart: existingTimes[dateStr]?.timeStart || '09:00',
    timeEnd:   existingTimes[dateStr]?.timeEnd   || '12:00',
  }));
  planFormData.date = dates[0]; // backward compat

  // Summary badge
  if (summaryEl) summaryEl.style.display = 'flex';
  if (summaryText) summaryText.textContent = `${dates.length} ngày thực hiện`;

  // Trigger PG cost recalc for first day
  onPgTimeChange();
}

function updateDayTime(dateStr) {
  const tStart = document.getElementById(`day-start-${dateStr}`)?.value;
  const tEnd   = document.getElementById(`day-end-${dateStr}`)?.value;
  const day = (planFormData.days || []).find(d => d.date === dateStr);
  if (day) { day.timeStart = tStart; day.timeEnd = tEnd; }
  // Recalc cost if PG is on (use first day for rate)
  if (planFormData.hiresPg) onPgTimeChange();

function onPgTimeChange() {
  const pgStart = document.getElementById('f-pg-start')?.value;
  const pgEnd   = document.getElementById('f-pg-end')?.value;
  const pgCount = parseInt(document.getElementById('f-pg-count')?.value) || 1;
  const channel = document.getElementById('f-region')?.value || currentUser?.channel || '';

  const pgStartEl = document.getElementById('f-pg-start');
  const pgEndEl   = document.getElementById('f-pg-end');
  if (pgStartEl) pgStartEl.dataset.manuallyChanged = '1';
  if (pgEndEl)   pgEndEl.dataset.manuallyChanged   = '1';

  const hoursPerDay = calcHoursDiff(pgStart, pgEnd);
  if (hoursPerDay <= 0) {
    const rateDisp = document.getElementById('pg-rate-display');
    if (rateDisp) rateDisp.style.display = 'none';
    planFormData._pgHours = 0; planFormData._pgRate = 0; planFormData._pgTotalCost = 0;
    calcCost(); return;
  }

  // Multi-day support: count days and detect if ANY day is holiday
  const days = planFormData.days || [];
  const numDays = Math.max(days.length, 1);
  // Use first day for rate reference; if any day is a holiday, flag it
  const firstDateStr = days.length > 0 ? days[0].date : (document.getElementById('f-date-start')?.value || '');
  const hasHoliday   = days.some(d => isHoliday(d.date));
  // Override dateStr passed to getPgRate to reflect holiday status
  const dateStrForRate = hasHoliday
    ? '2026-04-30' // known holiday to trigger holiday rate
    : (firstDateStr || '');

  // hourly rate based on channel + date holiday check
  const { hourlyRate, label, note, dayType, channel: ch, rateSource } = getPgRate(hoursPerDay, dateStrForRate, channel);

  // Tiền PG = Số PG × Giờ/ngày × Đơn giá/giờ × Số ngày
  const totalPgCost = pgCount * hoursPerDay * hourlyRate * numDays;

  const rateDisp = document.getElementById('pg-rate-display');
  if (rateDisp) rateDisp.style.display = 'block';

  const el = (id) => document.getElementById(id);
  const multiDayLabel = numDays > 1 ? ` × ${numDays} ngày` : '';
  if (el('pg-rate-label')) el('pg-rate-label').textContent =
    `Đơn giá/giờ/PG (${dayType}${ch ? ' · ' + ch : ''}):`;
  if (el('pg-rate-value')) el('pg-rate-value').textContent = fmtCurrency(hourlyRate) + '/giờ';
  if (el('pg-hours-calc')) el('pg-hours-calc').textContent =
    pgCount + ' PG × ' + hoursPerDay.toFixed(1) + 'h' + (numDays > 1 ? '/ngày × ' + numDays + ' ngày' : '') + ' × ' + fmtCurrency(hourlyRate) + '/giờ';
  if (el('pg-cost-calc'))  el('pg-cost-calc').textContent  = fmtCurrency(totalPgCost) + (numDays > 1 ? ` (${numDays} ngày)` : '');
  if (el('pg-rate-note'))  {
    el('pg-rate-note').textContent   = note + (hasHoliday && numDays > 1 ? ' ⚠️ Có ngày lễ trong kỳ' : '');
    el('pg-rate-note').style.display = note ? 'block' : 'none';
  }

  const dayBadge = el('pg-day-badge');
  if (dayBadge) {
    const colors = { 'Ngày thường': 'var(--teal)', 'Lễ/Tết': 'var(--red)' };
    dayBadge.textContent      = hasHoliday ? 'Có ngày Lễ/Tết' : dayType;
    dayBadge.style.background = hasHoliday ? 'var(--red)' : (colors[dayType] || 'var(--gray2)');
    dayBadge.style.display    = 'inline-flex';
  }

  planFormData._pgHours     = hoursPerDay;
  planFormData._pgNumDays   = numDays;
  planFormData._pgRate      = hourlyRate;
  planFormData._pgTotalCost = totalPgCost;
  planFormData._pgStart     = pgStart;
  planFormData._pgEnd       = pgEnd;
  planFormData._pgChannel   = channel;
  planFormData._pgDayType   = dayType;
  calcCost();
}

function getUserOptions() { return ''; } // chips loaded async

async function loadExecutorOptions() {
  try {
    const res = await api('GET', { action:'getUsers', channel: currentUser.channel, region: currentUser.region });
    if (!res.success) return;
    const users = res.data;

    // Executor chips
    const chipsEl = document.getElementById('executor-chips');
    if (chipsEl) {
      // Only Salesman/Rep in executor chips
      const execUsers = users.filter(u => u.role === 'Salesman' || u.role === 'Sales Representative');
      chipsEl.innerHTML = execUsers.map(u =>
        `<div class="chip-option" data-code="${u.code}" onclick="toggleExecutor(this,'${u.code}')">
          ${u.name}${u.role === 'Sales Representative' ? ' <span style="font-size:10px;opacity:0.6;">(Rep)</span>' : ''}
        </div>`
      ).join('');
      // Auto-select self if salesman/rep
      if (currentUser.role !== 'Sales Manager') {
        const self = chipsEl.querySelector(`[data-code="${currentUser.code}"]`);
        if (self) { self.classList.add('selected'); planFormData.executors = [currentUser.code]; }
      }
    }

    // Supervisor chips — single select, all users including managers
    const supEl = document.getElementById('supervisor-chips');
    if (supEl) {
      // Also include managers/marketing for supervisor role
      const allRes = await api('GET', { action:'getUsers', channel: '', region: '' });
      const allUsers = allRes.success ? allRes.data : users;
      // Supervisor = Rep, Manager, Marketing (not Salesman)
      const supUsers = allUsers.filter(u =>
        u.role === 'Sales Representative' || u.role === 'Sales Manager' || u.role === 'Marketing'
      );
      supEl.innerHTML = supUsers.map(u =>
        `<div class="chip-option" data-code="${u.code}" onclick="selectSupervisor(this,'${u.code}','${encodeURIComponent(u.name)}')">
          ${u.name}${u.role.includes('Manager') ? ' <span style="font-size:10px;opacity:0.6;">(Mgr)</span>' : u.role === 'Sales Representative' ? ' <span style="font-size:10px;opacity:0.6;">(Rep)</span>' : ''}
        </div>`
      ).join('');
    }
  } catch(e) { console.error('loadExecutorOptions error:', e); }
}

function selectSupervisor(el, code, encodedName) {
  document.querySelectorAll('#supervisor-chips .chip-option').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  planFormData.supervisorCode = code;
  try { planFormData.supervisorName = decodeURIComponent(encodedName); }
  catch(e) { planFormData.supervisorName = encodedName; }
}

function toggleExecutor(el, code) {
  el.classList.toggle('selected');
  if (el.classList.contains('selected')) {
    planFormData.executors.push(code);
  } else {
    planFormData.executors = planFormData.executors.filter(c => c !== code);
  }
}

function toggleProduct(ma) {
  const check = document.querySelector(`#prod-${ma} .product-check`);
  const qtyWrap = document.getElementById(`qty-wrap-${ma}`);
  const isChecked = check.classList.toggle('checked');
  qtyWrap.style.display = isChecked ? 'block' : 'none';
  if (isChecked) {
    document.getElementById(`qty-${ma}`).value = 1;
    planFormData.samples = planFormData.samples.filter(s => s.ma !== ma);
    planFormData.samples.push({ ma, so_luong: 1 });
  } else {
    planFormData.samples = planFormData.samples.filter(s => s.ma !== ma);
    document.getElementById(`qty-${ma}`).value = '';
  }
  calcCost();
}

function updateSample(ma) {
  const qty = parseInt(document.getElementById(`qty-${ma}`).value) || 1;
  const idx = planFormData.samples.findIndex(s => s.ma === ma);
  if (idx >= 0) planFormData.samples[idx].so_luong = qty;
}

function addDish() {
  const el = document.getElementById('dishes-list');
  const idx = planFormData.dishes.length;
  planFormData.dishes.push({ ten: '', tu_mau: '' });
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;gap:6px;align-items:center;';
  div.innerHTML = `
    <input class="form-input" type="text" placeholder="Tên món ăn..." style="flex:1;"
      oninput="planFormData.dishes[${idx}].ten = this.value">
    <button class="btn btn-secondary btn-sm" style="width:36px;padding:0;font-size:18px;" onclick="this.parentElement.remove();planFormData.dishes.splice(${idx},1)">×</button>`;
  el.appendChild(div);
}

function addGift() {
  const el = document.getElementById('gifts-list');
  const idx = planFormData.gifts.length;
  planFormData.gifts.push({ ten: '', so_luong: 0, gia_tri: 0 });
  const div = document.createElement('div');
  div.style.cssText = 'display:grid;grid-template-columns:1fr 60px 80px 32px;gap:6px;align-items:center;';
  div.innerHTML = `
    <input class="form-input" type="text" placeholder="Tên quà..." oninput="planFormData.gifts[${idx}].ten=this.value;calcCost()">

    <input class="form-input" type="number" placeholder="Giá trị" min="0" oninput="planFormData.gifts[${idx}].gia_tri=+this.value;calcCost()">
    <button class="btn btn-danger btn-sm" style="width:32px;padding:0;font-size:16px;" onclick="this.parentElement.remove();planFormData.gifts.splice(${idx},1);calcCost()">×</button>`;

function togglePg() {
  const tog = document.getElementById('toggle-pg');
  planFormData.hiresPg = !planFormData.hiresPg;
  tog.classList.toggle('on', planFormData.hiresPg);
  const fields = document.getElementById('pg-fields');
  fields.style.display = planFormData.hiresPg ? 'flex' : 'none';
  if (planFormData.hiresPg) {
    // Auto-fill PG times from first day card (date-range mode) or legacy f-start
    const days = planFormData.days || [];
    let sampStart = '09:00', sampEnd = '18:00';
    if (days.length > 0) {
      sampStart = days[0].timeStart || sampStart;
      sampEnd   = days[0].timeEnd   || sampEnd;
    } else {
      sampStart = document.getElementById('f-start')?.value || sampStart;
      sampEnd   = document.getElementById('f-end')?.value   || sampEnd;
    }
    const pgStartEl = document.getElementById('f-pg-start');
    const pgEndEl   = document.getElementById('f-pg-end');
    if (pgStartEl) { pgStartEl.value = sampStart; delete pgStartEl.dataset.manuallyChanged; }
    if (pgEndEl)   { pgEndEl.value   = sampEnd;   delete pgEndEl.dataset.manuallyChanged; }
    onPgTimeChange();
  }
  calcCost();
}
function togglePromo()   { const t = document.getElementById('toggle-promo');   planFormData.hasPromo   = !planFormData.hasPromo;   t.classList.toggle('on', planFormData.hasPromo); }
function toggleKiosk()   { const t = document.getElementById('toggle-kiosk');   planFormData.hasKiosk   = !planFormData.hasKiosk;   t.classList.toggle('on', planFormData.hasKiosk); }
function toggleInvoice() { const t = document.getElementById('toggle-invoice'); planFormData.hasInvoice = !planFormData.hasInvoice; t.classList.toggle('on', planFormData.hasInvoice); }

function updateLocationName(val) {
  const el = document.getElementById('f-location-name');
  if (el && val) el.value = val;
}

function calcCost() {
  // PG cost = Số PG × Số giờ × Đơn giá/giờ (pre-calculated in onPgTimeChange)
  const pgCost  = planFormData.hiresPg ? (planFormData._pgTotalCost || 0) : 0;
  const locCost = parseFloat(document.getElementById('f-location-cost')?.value) || 0;
  const giftQty = planFormData.hasGift ? (parseInt(document.getElementById('f-gift-qty')?.value) || 0) : 0;
  const giftVal2= planFormData.hasGift ? (parseFloat(document.getElementById('f-gift-value')?.value) || 0) : 0;
  const giftVal = giftQty * giftVal2;
  const total   = pgCost + locCost + giftVal;
  const set = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = fmtCurrency(val); };
  set('cs-pg', pgCost); set('cs-loc', locCost); set('cs-gift', giftVal); set('cs-total', total);
}

async function submitPlan() {
  const btn = document.getElementById('btn-submit-plan');
  // Collect all form values
  const data = {
    locationName:  document.getElementById('f-location-name')?.value?.trim()
                     || planFormData._locationName || '',
    region:        document.getElementById('f-region')?.value?.trim(),
    // Date range: use days array if available, else fall back to single date
    date:          planFormData.days?.length > 0
                     ? planFormData.days[0].date
                     : document.getElementById('f-date')?.value,
    dateEnd:       planFormData.days?.length > 1
                     ? planFormData.days[planFormData.days.length-1].date
                     : null,
    days:          planFormData.days?.length > 0 ? planFormData.days : null,
    timeStart:     planFormData.days?.length > 0
                     ? planFormData.days[0].timeStart
                     : document.getElementById('f-start')?.value,
    timeEnd:       planFormData.days?.length > 0
                     ? planFormData.days[0].timeEnd
                     : document.getElementById('f-end')?.value,
    executors:     planFormData.executors,
    supervisor:    planFormData.supervisorName || '',
    supervisorCode: planFormData.supervisorCode || '',
    hiresPg:       planFormData.hiresPg,
    pgCount:       parseInt(document.getElementById('f-pg-count')?.value) || 0,
    pgHours:       planFormData._pgHours     || 0,
    pgNumDays:     planFormData._pgNumDays   || Math.max((planFormData.days||[]).length, 1),
    pgStart:       planFormData._pgStart     || '',
    pgEnd:         planFormData._pgEnd       || '',
    pgRate:        planFormData._pgRate      || 0,  // hourly rate
    pgTotalCost:   planFormData._pgTotalCost || 0,  // Số PG × giờ/ngày × rate × numDays
    pgDayType:     planFormData._pgDayType   || 'Ngày thường',
    pgNote:        document.getElementById('f-pg-note')?.value?.trim(),
    locationCost:  parseFloat(document.getElementById('f-location-cost')?.value) || 0,
    costType:      document.getElementById('f-cost-type')?.value,
    hasInvoice:    planFormData.hasInvoice,
    costNote:      document.getElementById('f-cost-note')?.value?.trim(),
    hasPromo:      planFormData.hasPromo,
    postType:      document.getElementById('f-post-type')?.value,
    hasKiosk:      planFormData.hasKiosk,
    boothType:     document.getElementById('f-booth-type')?.value,
    samples:       planFormData.samples,
    dishes:        planFormData.dishes,
    hasGift:       planFormData.hasGift,
    gifts:         planFormData.hasGift ? [{
      so_luong:  parseInt(document.getElementById('f-gift-qty')?.value) || 0,
      gia_tri:   parseFloat(document.getElementById('f-gift-value')?.value) || 0,
      muc_dich:  document.getElementById('f-gift-purpose')?.value?.trim() || '',
      ghi_chu:   document.getElementById('f-gift-note')?.value?.trim() || '',
    }] : [],
    purpose:       document.getElementById('f-purpose')?.value?.trim(),
    estTasters:    parseInt(document.getElementById('f-est-tasters')?.value) || 0,
    estSales:      parseFloat(document.getElementById('f-est-sales')?.value) || 0,
    notes:         document.getElementById('f-notes')?.value?.trim(),
  };

  btn.disabled = true; btn.textContent = '⏳ Đang gửi...';
  loading(true, 'Đang lưu kế hoạch...');
  try {
    const action = currentPlanId ? 'updatePlan' : 'createPlan';
    const res = await api('POST', { action, data, userCode: currentUser.code, planId: currentPlanId });
    if (res.success) {
      showToast(res.message || 'Thành công!', 'success', 4000);
      showScreen('plans');
      loadMyPlans();
    } else {
      showToast(res.error || 'Có lỗi xảy ra', 'error');
    }
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { btn.disabled = false; btn.textContent = '📤 Gửi kế hoạch để duyệt'; loading(false); }
}

function initReport(planId) {
  currentPlanId = planId;
  reportFormData = { imgLocation:[], imgFood:[], imgOverview:[], imgOther:[], samplesUsed:[], markCompleted: false };
  const cachedPlan = window._planCache && window._planCache[planId];
  const locLabel = cachedPlan ? `${cachedPlan.locationName} · ${fmtDate(cachedPlan.date)}` : planId;
  document.getElementById('report-plan-id').textContent = locLabel;
  document.getElementById('report-plan-id').dataset.planId = planId;

  // Detect if this user has already submitted a report for this plan
  const existingReports = (cachedPlan && cachedPlan.reports) || [];
  const myPrevReports = existingReports.filter(r => String(r.reporter) === String(currentUser.code));
  const isFirstReport = myPrevReports.length === 0;

  renderReportForm(planId, isFirstReport);
  showScreen('report');
}

function imageUploadBlock(key, title, required, maxAdd) {
  const reqDot = required ? '<div class="required-dot"></div>' : '';
  const optTag = !required
    ? '<span style="font-size:10px;background:var(--gray3);color:var(--gray2);border-radius:4px;padding:1px 6px;font-weight:600;">Tùy chọn</span>'
    : '';
  // iOS-safe pattern: <label> directly wraps visible UI + hidden input inside same label
  // iOS Safari respects label→input association when input is a direct child of the tapped label
  // Key: input must NOT use display:none — use opacity:0 + size:0 + position:absolute within label
  return `
    <div class="img-upload-section">
      <div class="img-upload-title">
        ${reqDot}${title} ${optTag}
        <span class="small text-gray" style="margin-left:auto;" id="count-${key}">0 / ${maxAdd} ảnh</span>
      </div>
      <div class="img-preview-grid" id="preview-${key}" style="min-height:0;"></div>
      <label id="upload-area-${key}" class="img-upload-area" style="display:block;margin-top:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;">
        <span class="img-upload-icon">📷</span>
        <span class="img-upload-text" id="upload-text-${key}" style="display:block;margin-top:4px;">Chụp / Chọn từ thư viện</span>
        <span style="display:block;font-size:11px;color:var(--gray2);margin-top:2px;">Nhấn nhiều lần để thêm nhiều ảnh</span>
        <input type="file"
          id="file-input-${key}"
          accept="image/*"
          multiple
          style="width:0.1px;height:0.1px;opacity:0;overflow:hidden;position:absolute;"
          onchange="handleImageSelect(event,'${key}',${maxAdd})">
      </label>
    </div>`;
}

async function handleImageSelect(event, key, maxAdd) {
  const files = Array.from(event.target.files);
  if (!files.length) return;

  const current   = reportFormData[key].length;
  const remaining = maxAdd - current;
  if (remaining <= 0) {
    showToast(`Đã đạt tối đa ${maxAdd} ảnh cho mục này`, 'error');
    event.target.value = '';
    return;
  }

  const toProcess = files.slice(0, remaining);
  const countEl   = document.getElementById(`count-${key}`);
  const previewEl = document.getElementById(`preview-${key}`);

  // Show processing indicator
  const processingEl = document.createElement('div');
  processingEl.style.cssText = 'font-size:11px;color:var(--gray2);padding:4px 0;grid-column:1/-1;';
  processingEl.textContent   = `⏳ Đang xử lý ${toProcess.length} ảnh...`;
  previewEl.appendChild(processingEl);

  for (const file of toProcess) {
    const compressed = await compressImage(file, TARGET_IMG_KB);
    reportFormData[key].push({ dataUrl: compressed.dataUrl, name: file.name, size: compressed.size });
    const idx  = reportFormData[key].length - 1;
    const item = document.createElement('div');
    item.className = 'img-preview-item';
    item.innerHTML = `
      <img src="${compressed.dataUrl}" style="width:100%;height:72px;object-fit:cover;border-radius:6px;display:block;">
      <div class="img-remove" onclick="removeImage('${key}',${idx},this.parentElement)">×</div>
      <div style="font-size:9px;color:var(--gray2);margin-top:2px;text-align:center;">${Math.round(compressed.size)}KB</div>`;
    previewEl.insertBefore(item, processingEl);
  }
  processingEl.remove();

  const total = reportFormData[key].length;
  if (countEl) countEl.textContent = `${total} / ${maxAdd} ảnh`;

  // Always reset input value — allows selecting same photo again on iOS
  event.target.value = '';

  if (files.length > remaining) {
    showToast(`Chỉ thêm được ${remaining} ảnh nữa (tối đa ${maxAdd})`, 'error');
  }

  // Update button text
  const textEl = document.getElementById(`upload-text-${key}`);
  if (textEl) {
    textEl.textContent = total >= maxAdd ? `Đã đủ ${maxAdd} ảnh` : `Thêm ảnh (${total}/${maxAdd})`;
  }
}

function removeImage(key, idx, el) {
  reportFormData[key].splice(idx, 1);
  el.remove();
  const maxMap = { imgLocation: 10, imgFood: 20, imgOverview: 20, imgOther: 40 };
  const maxAdd = maxMap[key] || 40;
  const total  = reportFormData[key].length;
  const countEl = document.getElementById(`count-${key}`);
  if (countEl) countEl.textContent = `${total} / ${maxAdd} ảnh`;
  const textEl = document.getElementById(`upload-text-${key}`);
  if (textEl) textEl.textContent = total > 0 ? `Thêm ảnh (${total}/${maxAdd})` : 'Chụp / Chọn từ thư viện';
}

// Client-side image compression using Canvas
function compressImage(file, targetKB) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const maxDim = 1280;
        if (w > maxDim || h > maxDim) {
          const ratio = Math.min(maxDim/w, maxDim/h);
          w = Math.round(w * ratio); h = Math.round(h * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);

        let quality = 0.85;
        const tryCompress = () => {
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          const sizeKB = Math.round((dataUrl.length * 3) / 4 / 1024);
          if (sizeKB <= targetKB || quality <= 0.3) {
            resolve({ dataUrl, size: sizeKB });
          } else {
            quality -= 0.1;
            tryCompress();
          }
        };
        tryCompress();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function submitReport() {
  const btn = document.getElementById('btn-submit-report');

  const isFirst = reportFormData._isFirstReport !== false;
  if (isFirst && reportFormData.imgLocation.length === 0) { showToast('Bắt buộc có hình tên địa điểm', 'error'); return; }
  if (isFirst && reportFormData.imgFood.length === 0)     { showToast('Bắt buộc có hình món ăn', 'error'); return; }
  if (isFirst && reportFormData.imgOverview.length === 0) { showToast('Bắt buộc có hình toàn cảnh', 'error'); return; }
  const actualTasters = parseInt(document.getElementById('r-tasters')?.value) || 0;
  if (isFirst && !actualTasters) { showToast('Vui lòng nhập số người thử', 'error'); return; }
  if (!isFirst && reportFormData.imgLocation.length === 0 && reportFormData.imgFood.length === 0 &&
      reportFormData.imgOverview.length === 0 && reportFormData.imgOther.length === 0 && !actualTasters) {
    showToast('Vui lòng nhập ít nhất số người thử hoặc 1 hình ảnh', 'error'); return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ Đang gửi...';

  // ── STEP 1: Upload ảnh lên Drive ──────────────────────────
  const totalImgCount = reportFormData.imgLocation.length + reportFormData.imgFood.length +
                        reportFormData.imgOverview.length + reportFormData.imgOther.length;
  const hasImages = totalImgCount > 0;
  let imgFolderUrl = '';
  let imgLocationUrls = [], imgFoodUrls = [], imgOverviewUrls = [], imgOtherUrls = [];
  let uploadOk = !hasImages; // if no images, treat as ok

  if (hasImages) {
    loading(true, `📤 Đang tải ${totalImgCount} ảnh lên Drive...`);
    try {
      const uploadRes = await api('POST', {
        action:   'uploadReportImages',
        planId:   currentPlanId,
        userCode: currentUser.code,
        images: {
          imgLocation: reportFormData.imgLocation.map(i => ({ name: i.name, dataUrl: i.dataUrl })),
          imgFood:     reportFormData.imgFood.map(i => ({ name: i.name, dataUrl: i.dataUrl })),
          imgOverview: reportFormData.imgOverview.map(i => ({ name: i.name, dataUrl: i.dataUrl })),
          imgOther:    reportFormData.imgOther.map(i => ({ name: i.name, dataUrl: i.dataUrl })),
        },
      });
      if (uploadRes.success && uploadRes.folders) {
        imgFolderUrl    = uploadRes.folders.root        || '';
        imgLocationUrls = uploadRes.folders.imgLocation || [];
        imgFoodUrls     = uploadRes.folders.imgFood     || [];
        imgOverviewUrls = uploadRes.folders.imgOverview || [];
        imgOtherUrls    = uploadRes.folders.imgOther    || [];
        uploadOk        = true;
        const uploaded  = uploadRes.uploaded || 0;
        const total     = uploadRes.total    || totalImgCount;
        if (uploaded < total) {
          // Partial upload — warn but continue (some images made it)
          showToast(`⚠️ Chỉ tải được ${uploaded}/${total} ảnh lên Drive. Báo cáo vẫn được ghi nhận.`, 'error', 6000);
        }
      } else {
        // Full upload failure — stop here, do not submit report
        loading(false);
        btn.disabled    = false;
        btn.textContent = '📊 Gửi báo cáo';
        const errMsg = uploadRes.error || 'Lỗi không xác định';
        showToast(`❌ Upload ảnh thất bại: ${errMsg}\nVui lòng thử lại.`, 'error', 8000);
        return;
      }
    } catch(e) {
      loading(false);
      btn.disabled    = false;
      btn.textContent = '📊 Gửi báo cáo';
      showToast('❌ Lỗi kết nối khi upload ảnh. Vui lòng kiểm tra mạng và thử lại.', 'error', 8000);
      console.error('[submitReport] upload error:', e.message);
      return;
    }
  }

  // ── STEP 2: Submit báo cáo với links ảnh ─────────────────
  loading(true, '📊 Đang lưu báo cáo...');
  const data = {
    actualTasters: actualTasters,
    actualSales:   parseFloat(document.getElementById('r-sales')?.value) || 0,
    feedback:      document.getElementById('r-feedback')?.value?.trim(),
    notes:         document.getElementById('r-notes')?.value?.trim(),
    samplesUsed:   reportFormData.samplesUsed,
    markCompleted: reportFormData.markCompleted,
    imgLocation:   imgLocationUrls,
    imgFood:       imgFoodUrls,
    imgOverview:   imgOverviewUrls,
    imgOther:      imgOtherUrls,
    imgFolderUrl:  imgFolderUrl,
  };
  try {
    const res = await api('POST', { action:'submitReport', planId: currentPlanId, data, userCode: currentUser.code });
    if (res.success) {
      const folderLink = imgFolderUrl
        ? ` <a href="${imgFolderUrl}" target="_blank" style="color:var(--teal);">📁 Xem ảnh</a>`
        : '';
      showToast('Báo cáo đã được ghi nhận! 🎉' + folderLink, 'success', 5000);
      showScreen('plans');
      loadMyPlans();
    } else {
      showToast(res.error || 'Có lỗi xảy ra', 'error');
    }
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { btn.disabled = false; btn.textContent = '📊 Gửi báo cáo'; loading(false); }
}

async function renderCalendar() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const monthStr = `${y}-${String(m+1).padStart(2,'0')}`;
  document.getElementById('cal-month-label').textContent =
    calMonth.toLocaleDateString('vi-VN', {month:'long', year:'numeric'});

  const el = document.getElementById('calendar-content');
  el.innerHTML = '<div class="empty-state"><div class="ai-loader"></div><div class="empty-sub">Đang tải lịch...</div></div>';

  try {
    const res = await api('GET', { action:'getCalendar', userCode: currentUser.code, month: monthStr });
    if (res.success && res.data) {
      calendarData = {};
      const rawKeys = Object.keys(res.data);

      Object.entries(res.data).forEach(([key, plans]) => {
        let normKey = key.trim();
        // Handle DD/MM/YYYY format
        if (/^\d{2}\/\d{2}\/\d{4}/.test(normKey)) {
          const parts = normKey.split('/');
          normKey = `${parts[2]}-${parts[1]}-${parts[0]}`;
        }
        // Handle DD/MM/YYYY HH:mm format
        else if (/^\d{2}\/\d{2}\/\d{4}\s/.test(normKey)) {
          const parts = normKey.substring(0,10).split('/');
          normKey = `${parts[2]}-${parts[1]}-${parts[0]}`;
        }
        // Trim to YYYY-MM-DD
        normKey = normKey.substring(0, 10);
        // Validate format
        if (!/^\d{4}-\d{2}-\d{2}$/.test(normKey)) {
          console.warn('[Calendar] Unexpected key format after normalize:', key, '->', normKey);
          // Try parsing as date if it's something else
          try {
            const d = new Date(key);
            if (!isNaN(d)) {
              const y = d.getFullYear(), mo = String(d.getMonth()+1).padStart(2,'0'), dy = String(d.getDate()).padStart(2,'0');
              normKey = `${y}-${mo}-${dy}`;
            }
          } catch(e2) {}
        }
        calendarData[normKey] = (calendarData[normKey] || []).concat(plans);
      });

      // Check if any keys match this month
      const matchingKeys = Object.keys(calendarData).filter(k => k.startsWith(monthStr));
    } else {
      console.warn('[Calendar] API returned no data:', res);
      calendarData = {};
    }
  } catch(e) { console.error('[Calendar] Load error:', e); calendarData = {}; }

  const today       = new Date(); today.setHours(0,0,0,0);
  const firstDay    = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const adjustedFirst = (firstDay + 6) % 7; // Mon=0

  // Status → color class mapping
  // cho_duyet=yellow, da_duyet=blue, hoan_thanh=green, tu_choi=gray, yeu_cau_chinh_sua=orange
  const getCalClass = (plans) => {
    if (!plans || plans.length === 0) return '';
    const statuses = plans.map(p => p.status);
    if (statuses.every(s => s === 'hoan_thanh')) return 'has-plan done';
    if (statuses.some(s => s === 'da_duyet'))    return 'has-plan approved';
    if (statuses.some(s => s === 'cho_duyet'))   return 'has-plan pending';
    if (statuses.some(s => s === 'yeu_cau_chinh_sua')) return 'has-plan needs-edit';
    return 'has-plan';
  };

  let html = `<div class="cal-grid">
    ${['T2','T3','T4','T5','T6','T7','CN'].map(d => `<div class="cal-day-label">${d}</div>`).join('')}
    ${Array(adjustedFirst).fill('<div class="cal-day empty"></div>').join('')}`;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${monthStr}-${String(d).padStart(2,'0')}`;
    const plans   = calendarData[dateStr] || calendarData[dateStr.replace(/-/g,'/')] || [];
    const isToday = new Date(y,m,d).getTime() === today.getTime();
    const hasPlan = plans.length > 0;
    const calCls  = isToday ? 'today' : getCalClass(plans);

    html += `<div class="cal-day ${calCls}" onclick="showCalDay('${dateStr}',${d})">
      <span>${d}</span>
      ${hasPlan ? `<div class="cal-dot"></div>` : ''}
      ${hasPlan && plans.length > 1 ? `<div style="font-size:8px;opacity:0.8;">${plans.length}</div>` : ''}
    </div>`;
  }
  html += '</div>';

  // Legend with all statuses
  html += `<div style="padding:8px 16px 4px;font-size:11px;font-weight:700;color:var(--gray2);text-transform:uppercase;">Chú thích</div>
  <div style="display:flex;gap:8px;padding:0 16px 16px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;">
      <div style="width:12px;height:12px;border-radius:3px;background:var(--navy);"></div>Hôm nay
    </div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;">
      <div style="width:12px;height:12px;border-radius:3px;background:#fff3cd;border:1px solid #856404;"></div>Chờ duyệt
    </div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;">
      <div style="width:12px;height:12px;border-radius:3px;background:#d1e8ff;border:1px solid var(--teal);"></div>Đã duyệt
    </div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;">
      <div style="width:12px;height:12px;border-radius:3px;background:#d1f2eb;border:1px solid var(--green);"></div>Hoàn thành
    </div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;">
      <div style="width:12px;height:12px;border-radius:3px;background:#fff0e6;border:1px solid #c96a00;"></div>Cần chỉnh sửa
    </div>
  </div>`;

  el.innerHTML = html;
}

function prevMonth() { calMonth.setMonth(calMonth.getMonth()-1); renderCalendar(); }
function nextMonth() { calMonth.setMonth(calMonth.getMonth()+1); renderCalendar(); }

function showCalDay(dateStr, day) {
  const plans = calendarData[dateStr];
  if (!plans || plans.length === 0) return;
  const mon = calMonth.getMonth()+1;
  const yr  = calMonth.getFullYear();
  showModal(`📅 ${String(day).padStart(2,'0')}/${String(mon).padStart(2,'0')}/${yr}`,
    plans.map(p => `<div class="plan-card" style="margin:0 0 8px;" onclick="viewPlanDetail('${p.planId}');closeModal()">
      <div class="plan-card-top">
        <div>
          <div class="plan-card-name">${p.location || p.locationName || p.planId}</div>

// =====================================================
// DASHBOARD
// =====================================================
// =====================================================
// TIME FORMATTER
// =====================================================
function fmtTime(t) {
  if (!t) return '—';
  const s = String(t).trim();

  // Already plain HH:mm or H:mm — GAS rowToPlanObject returns this format
  if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(s)) return s.substring(0, 5);

  // ISO timestamp: "1899-12-30T15:06:00.000Z" — Sheet time stored as Date object,
  // NOT yet through rowToPlanObject's fmtT. Add 7h to recover GMT+7.
  if (s.includes('T')) {
    const match = s.match(/T(\d{2}):(\d{2})/);
    if (match) {
      let h = parseInt(match[1], 10) + 7;
      if (h >= 24) h -= 24;
      return String(h).padStart(2, '0') + ':' + match[2];
    }
  }

  return s.substring(0, 5);
}

// =====================================================
// DASHBOARD HELPERS
// =====================================================
function buildTrendBars(trend) {
  if (!trend || trend.length === 0) return '<div class="small text-gray" style="padding:8px 16px;">Chưa có dữ liệu trend</div>';
  const last6 = trend.slice(-6);
  const maxEv = Math.max(...last6.map(m => m.events), 1);
  return `<div class="trend-bars">` + last6.map((m, i) => {
    const h = Math.max(Math.round((m.events / maxEv) * 100), 4);
    const dim = i < 2 ? 'dim' : i < 4 ? 'mid' : '';
    const shortMon = m.month.substring(5,7) + '/' + m.month.substring(2,4);
    return `<div class="trend-bar-wrap" style="justify-content:flex-end;">
      <div class="trend-bar ${dim}" style="height:${h}%;"></div>
      <div class="trend-bar-label">${shortMon}</div>
    </div>`;
  }).join('') + `</div>`;
}

function buildTopLocations(items, limit) {
  limit = limit || 5;
  if (!items || items.length === 0) return '<div class="small text-gray" style="padding:0 16px 8px;">Chưa có dữ liệu</div>';
  const top = [...items].filter(p => p.status === 'hoan_thanh').sort((a,b)=>(b.actualTasters||0)-(a.actualTasters||0)).slice(0, limit);
  const medals = ['gold','silver','bronze'];
  return '<div class="rank-list">' + top.map((p, i) => `
    <div class="rank-item">
      <div class="rank-num ${medals[i]||''}">${i+1}</div>
      <div class="rank-info">
        <div class="rank-name">${p.locationName}</div>
        <div class="rank-sub">${fmtDate(p.date)} · ${p.region}</div>
      </div>
      <div class="rank-badge">${fmtNum(p.actualTasters)} người</div>
    </div>`).join('') + '</div>';
}

function buildSkuUsage(topSkus, products, channelBreakdown) {
  if (!topSkus || topSkus.length === 0) return '<div class="small text-gray" style="padding:0 16px 8px;">Chưa có dữ liệu</div>';
  return '<div style="padding:4px 16px 10px;display:flex;flex-wrap:wrap;">' +
    topSkus.slice(0,8).map(s => {
      const prod = (products||[]).find(p => p.ma === s.ma);
      const price= prod ? (prod.giaMT||prod.giaGT||0) : 0;
      const val  = price > 0 ? ` · ${fmtCurrency(s.qty * price)}` : '';
      return `<div class="sku-chip" style="cursor:default;" title="${prod?prod.ten:s.ma} — ${s.qty} cái${val}">${prod ? prod.ten : s.ma}<span class="qty">${s.qty}</span></div>`;
    }).join('') + '</div>';
}

function buildTop5Table(items, valueKey, valueLabel, valueColor, isCurrency, unit) {
  if (!items || items.length === 0) return '<div class="small text-gray" style="padding:0 16px 8px;">Chưa có dữ liệu</div>';
  unit = unit || '';
  return `<div style="background:var(--white);border-radius:var(--radius);margin:0 16px 8px;box-shadow:var(--shadow);">` +
    items.map((p, i) => {
      const val = p[valueKey] != null ? (isCurrency ? fmtCurrency(p[valueKey]) : fmtNum(p[valueKey]) + unit) : '—';
      const medals = ['gold','silver','bronze'];
      return `<div style="display:flex;align-items:center;padding:8px 12px;gap:10px;border-bottom:1px solid var(--gray3);">
        <div class="rank-num ${medals[i]||''}" style="flex-shrink:0;">${i+1}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.locationName}</div>
          <div style="font-size:10px;color:var(--gray2);">${fmtDate(p.date)} · ${p.region||''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <div style="font-size:14px;font-weight:800;color:${valueColor};">${val}</div>
          <div style="font-size:9px;color:var(--gray2);">${valueLabel}</div>
        </div>
      </div>`;
    }).join('') + '</div>';
}

function kpiCard(label, value, sub, accent, icon) {
  sub = sub || ''; accent = accent || ''; icon = icon || '';
  return `<div class="dash-kpi ${accent}">
    ${icon ? `<div class="dash-kpi-icon">${icon}</div>` : ''}
    <div class="dash-kpi-label">${label}</div>
    <div class="dash-kpi-value">${value}</div>
    ${sub ? `<div class="dash-kpi-sub">${sub}</div>` : ''}
  </div>`;
}

function sectionTitle(title) {
  return `<div class="section-title" style="padding-top:16px;">${title}</div>`;
}

    ${kpiCard('Khách tiếp cận', fmtNum(e.totalTasters), 'người thử mẫu', 'green', '👥')}
    ${kpiCard('Tổng chi phí', fmtCurrency(c.total), '', 'navy', '💰')}
    ${kpiCard('Chi phí/người thử', fmtCurrency(e.costPerContact), 'cost per contact', 'yellow', '🧮')}
  </div>`;
  html += `<div class="dash-kpi-grid four" style="padding-top:4px;">
    ${kpiCard('Doanh số', fmtCurrency(e.totalActualSales), 'trong sampling', 'teal', '📈')}
    ${kpiCard('TB/buổi', fmtNum(e.avgTastersPerEvent), '', '', '📊')}
    ${kpiCard('Chờ duyệt', s.cho_duyet||0, 'kế hoạch', '', '⏳')}
    ${kpiCard('Hoàn thành', s.hoan_thanh||0, 'kế hoạch', 'green', '✅')}
  </div>`;

  if (channels.length > 0) {
    html += sectionTitle('📊 Hiệu quả theo kênh');
    html += '<div class="compare-grid">';
    channels.forEach(ch => {
      const data = cb[ch];
      const eff = data.count > 0 && e.avgTastersPerEvent > 0 ? Math.round((data.tasters/Math.max(data.count,1))/Math.max(e.avgTastersPerEvent,1)*100) : 0;
      const cls = eff >= 90 ? 'best' : eff >= 60 ? 'warn' : 'poor';
      html += `<div class="compare-card ${cls}"><div class="compare-channel">${ch}</div><div class="compare-pct ${cls}">${eff}%</div><div class="compare-sub">${data.count} buổi · ${fmtNum(data.tasters)} người</div><div class="compare-sub" style="margin-top:2px;">${fmtCurrency(data.sales)} doanh số</div></div>`;
    });
    html += '</div>';
  }

  const total = c.total || 1;
  html += sectionTitle('💰 Phân bổ chi phí');
  html += `<div class="card" style="margin:0 16px 12px;"><div class="card-body">
    ${[['PG','var(--teal)',c.pg],['Địa điểm','var(--navy)',c.location],['Quà tặng','var(--yellow2)',c.gifts]].map(([nm,col,val]) =>
      `<div class="bar-row"><div class="bar-label">${nm}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round((val||0)/total*100)}%;background:${col};"></div></div><div class="bar-value">${Math.round((val||0)/total*100)}%</div></div><div style="font-size:11px;color:var(--gray2);padding:0 16px 6px;text-align:right;">${fmtCurrency(val)}</div>`
    ).join('')}
  </div></div>`;

  if (perf && perf.items && perf.items.length > 0) {
    html += sectionTitle('🏆 Top điểm bán hiệu quả'); html += buildTopLocations(perf.items, 5);
  }
  if (over && over.topSkus && over.topSkus.length > 0) {
    html += sectionTitle('📦 Top SKU sampling'); html += buildSkuUsage(over.topSkus, masterData.products);
  }
  if (over && over.monthlyTrend && over.monthlyTrend.length > 1) {
    html += sectionTitle('📈 Xu hướng theo tháng'); html += buildTrendBars(over.monthlyTrend);
  }
  html += `<div style="padding:4px 16px 12px;"><button class="btn btn-primary" onclick="showDashTab('approval');loadDashboard();">✅ Kế hoạch chờ duyệt (${s.cho_duyet||0})</button></div>`;
  if (channels.length > 1) {
    const sorted = channels.sort((a,b)=>(cb[b].tasters||0)-(cb[a].tasters||0));
    html += sectionTitle('💡 Đề xuất');
    html += `<div class="insight-card green"><div class="insight-title">✅ Kênh hiệu quả nhất: ${sorted[0]}</div><div class="insight-text">${cb[sorted[0]].tasters||0} người thử · ${cb[sorted[0]].count} buổi</div></div>`;
    if (sorted.length > 1) html += `<div class="insight-card yellow"><div class="insight-title">📈 Cần cải thiện: ${sorted[sorted.length-1]}</div><div class="insight-text">Hiệu quả thấp — xem xét điều chỉnh chiến lược sampling</div></div>`;
  }
  html += '<div class="spacer"></div></div>';
  el.innerHTML = html;
}

let mgrTab = 'overview';

async function loadManagerDashboard(el, month, channel) {
  const isDesk = isDesktop();

  // On desktop: sidebar IS the navigation → no need for inner mgr-tabs
  // Just render content directly based on mgrTab state
  if (isDesk) {
    el.innerHTML = `<div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:24px;" id="mgr-scroll">
      <div id="mgr-content"><div class="empty-state"><div class="ai-loader"></div></div></div>
    </div>`;
  } else {
    // Mobile: show inner tab bar
    el.innerHTML = `<div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;" id="mgr-scroll">
      <div class="mgr-tabs" id="mgr-tabs">
        <button class="mgr-tab active"  onclick="switchMgrTab('overview','${month}','${channel}')">📊 Tổng quan</button>
        <button class="mgr-tab"         onclick="switchMgrTab('staff',   '${month}','${channel}')">👥 Nhân sự</button>
        <button class="mgr-tab"         onclick="switchMgrTab('cost',    '${month}','${channel}')">💰 Chi phí</button>

// Direct approval loader — for manager sidebar "Phê duyệt" click
async function loadApprovalDirect() {
  const el = document.getElementById('dash-content');
  if (!el) return;
  el.innerHTML = `<div style="flex:1;overflow-y:auto;padding-bottom:24px;" id="mgr-scroll">
    <div id="mgr-content"><div class="empty-state"><div class="ai-loader"></div><div class="empty-sub">Đang tải...</div></div></div>
  </div>`;
  try {
    const res = await api('GET', { action: 'getPendingApprovals' });
    const contentEl = document.getElementById('mgr-content');
    if (!contentEl) return;
    if (res.success) {
      await renderDashApproval(res.data, contentEl);
      // Update badges
      const cnt = res.data.length;
      const badge = document.getElementById('sidebar-approval-badge');
      if (badge) { badge.textContent = cnt; badge.style.display = cnt > 0 ? 'flex' : 'none'; }
    } else {
      contentEl.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">${res.error||'Lỗi'}</div></div>`;
    }
  } catch(e) {
    const contentEl = document.getElementById('mgr-content');
    if (contentEl) contentEl.innerHTML = '<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-text">Lỗi kết nối</div></div>';
  }
}

async function switchMgrTab(tab, month, channel) {
  if (tab === 'approval_direct') { await loadApprovalDirect(); return; }
  mgrTab = tab;
  document.querySelectorAll('.mgr-tab').forEach((t,i) => {
    t.classList.toggle('active', ['overview','staff','cost','compare'][i] === tab);
  });
  // Update sidebar active state
  updateSidebarActive();
  const el = document.getElementById('mgr-content');
  if (!el) return;
  el.innerHTML = '<div class="empty-state"><div class="ai-loader"></div><div class="empty-sub">Đang tải...</div></div>';
  try {
    if (tab === 'overview') {
      const [ovR, pfR] = await Promise.all([
        api('GET', { action:'getDashboardOverview',    month, channel }),
        api('GET', { action:'getDashboardPerformance', month, channel }),
      ]);
      renderMgrOverview(el, ovR.success?ovR.data:null, pfR.success?pfR.data:null, month, channel);
    } else if (tab === 'staff') {
      const [pfR, usR, ovR] = await Promise.all([
        api('GET', { action:'getDashboardPerformance', month, channel }),
        api('GET', { action:'getUsers', channel:'', region:'' }),
        api('GET', { action:'getDashboardOverview', month, channel }),
      ]);
      renderMgrStaff(el, pfR.success?pfR.data:null, usR.success?usR.data:[], month, ovR.success?ovR.data:null);
    } else if (tab === 'cost') {
      const ovR = await api('GET', { action:'getDashboardOverview', month, channel });
      renderMgrCost(el, ovR.success?ovR.data:null, month);
    } else if (tab === 'compare') {
      const [ovR, pfR] = await Promise.all([
        api('GET', { action:'getDashboardOverview',    month, channel }),
        api('GET', { action:'getDashboardPerformance', month, channel }),
      ]);
      renderMgrCompare(el, ovR.success?ovR.data:null, pfR.success?pfR.data:null, month);
    }
  } catch(e) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-text">Lỗi kết nối</div></div>';
  }
}

function renderMgrStaff(el, perf, users, month, over) {
  const items    = perf ? perf.items || [] : [];
  const staffStats = over ? over.staffStats || {} : {};
  const byChannel  = staffStats.byChannel || {};

  // Build per-person map
  const staffMap = {};
  items.forEach(p => {
    (p.executors||[]).forEach(code => {
      if (!staffMap[code]) staffMap[code] = {events:0,tasters:0,sales:0,locations:new Set(),done:0};
      staffMap[code].events++;
      staffMap[code].tasters += p.actualTasters||0;
      staffMap[code].sales   += p.actualSales||0;
      staffMap[code].locations.add(p.locationName);
      if (p.status==='hoan_thanh') staffMap[code].done++;
    });
  });
  const staffList = Object.entries(staffMap).map(([code,d]) => {
    const user = (users||[]).find(u=>u.code===code);
    return {code, name:user?user.name:code, role:user?user.role:'', channel:user?user.channel:'', ...d, locCount:d.locations.size};
  }).sort((a,b)=>b.events-a.events);

  const totalDone    = items.filter(p=>p.status==='hoan_thanh').length;
  const totalPending = items.filter(p=>p.status==='cho_duyet'||p.status==='da_duyet').length;
  const compRate     = items.length>0?Math.round(totalDone/items.length*100):0;

  let html = '<div style="padding:8px 0 0;" class="fade-in">';

  // ── KPI Block 1: Nhân sự ──
  html += `<div class="dash-kpi-grid four">
    ${kpiCard('Nhân sự hoạt động', staffList.length, 'người trong kỳ', 'red', '👥')}
    ${kpiCard('Tổng PG đã dùng', fmtNum(staffStats.totalPgUsed||0), 'tổng lượt PG', 'teal', '🧑‍💼')}
    ${kpiCard('TB PG/buổi', staffStats.avgPgPerEvent||'—', 'TB số PG mỗi buổi', 'navy', '📊')}
    ${kpiCard('Tổng giờ PG', fmtNum(staffStats.totalPgHours||0), 'giờ thuê PG', 'yellow', '⏱️')}
  </div>`;

  // ── KPI Block 2: Buổi ──
  html += `<div class="dash-kpi-grid four" style="padding-top:4px;">
    ${kpiCard('Tổng buổi', items.length, 'kế hoạch ghi nhận', 'red', '📋')}
    ${kpiCard('Hoàn thành', totalDone, compRate+'% tỉ lệ', 'green', '✅')}
    ${kpiCard('Còn pending', totalPending, 'đã duyệt + chờ duyệt', 'yellow', '⏳')}
    ${kpiCard('Tỉ lệ hoàn thành', compRate+'%', totalDone+'/'+items.length, 'teal', '🎯')}
  </div>`;

  // ── Bảng thống kê theo kênh ──
  if (Object.keys(byChannel).length > 0) {
    html += sectionTitle('📊 Bảng thống kê theo kênh');
    const CH_ORDER = ['MT','GT South','GT Central','GT North'];
    const sortedCh = [...CH_ORDER.filter(c=>byChannel[c]), ...Object.keys(byChannel).filter(c=>!CH_ORDER.includes(c))];
    html += `<div style="overflow-x:auto;margin:0 16px 12px;border-radius:var(--radius);box-shadow:var(--shadow);">
    <table style="width:100%;border-collapse:collapse;background:var(--white);font-size:12px;">
      <thead>
        <tr style="background:var(--gray4);">
          <th style="text-align:left;padding:8px 10px;font-size:11px;font-weight:700;color:var(--gray2);border-bottom:2px solid var(--gray3);">Kênh / Vùng</th>
          <th style="text-align:right;padding:8px 10px;font-size:11px;font-weight:700;color:var(--gray2);border-bottom:2px solid var(--gray3);">Tổng buổi</th>
          <th style="text-align:right;padding:8px 10px;font-size:11px;font-weight:700;color:var(--gray2);border-bottom:2px solid var(--gray3);">Hoàn thành</th>
          <th style="text-align:right;padding:8px 10px;font-size:11px;font-weight:700;color:var(--gray2);border-bottom:2px solid var(--gray3);">Pending</th>
          <th style="text-align:right;padding:8px 10px;font-size:11px;font-weight:700;color:var(--gray2);border-bottom:2px solid var(--gray3);">PG dùng</th>
          <th style="text-align:right;padding:8px 10px;font-size:11px;font-weight:700;color:var(--gray2);border-bottom:2px solid var(--gray3);">Giờ PG</th>
          <th style="text-align:right;padding:8px 10px;font-size:11px;font-weight:700;color:var(--gray2);border-bottom:2px solid var(--gray3);">Tỉ lệ HT</th>
        </tr>
      </thead>
      <tbody>`;
    sortedCh.forEach(ch => {
      const d = byChannel[ch];
      const cr = d.completionRate || 0;
      const crColor = cr>=80?'var(--green)':cr>=50?'var(--yellow2)':'var(--red)';
      html += `<tr style="border-bottom:1px solid var(--gray3);">
        <td style="text-align:left;padding:8px 10px;font-weight:600;">${ch}</td>
        <td style="text-align:right;padding:8px 10px;font-weight:700;color:var(--navy);">${d.sessions}</td>
        <td style="text-align:right;padding:8px 10px;color:var(--green);font-weight:600;">${d.done}</td>
        <td style="text-align:right;padding:8px 10px;color:var(--yellow2);font-weight:600;">${d.pending}</td>
        <td style="text-align:right;padding:8px 10px;">${fmtNum(d.pgUsed)}</td>
        <td style="text-align:right;padding:8px 10px;">${fmtNum(d.pgHours)}</td>
        <td style="text-align:right;padding:8px 10px;font-weight:700;color:${crColor};">${cr}%</td>
      </tr>`;
    });
    // Totals row
    const totS   = sortedCh.reduce((s,c)=>s+(byChannel[c].sessions||0),0);
    const totD   = sortedCh.reduce((s,c)=>s+(byChannel[c].done||0),0);
    const totP   = sortedCh.reduce((s,c)=>s+(byChannel[c].pending||0),0);
    const totPG  = sortedCh.reduce((s,c)=>s+(byChannel[c].pgUsed||0),0);
    const totH   = sortedCh.reduce((s,c)=>s+(byChannel[c].pgHours||0),0);
    const totCR  = totS>0?Math.round(totD/totS*100):0;
    html += `<tr style="background:var(--gray4);font-weight:700;border-top:2px solid var(--gray3);">
      <td style="text-align:left;padding:8px 10px;">Tổng cộng</td>
      <td style="text-align:right;padding:8px 10px;color:var(--navy);">${totS}</td>
      <td style="text-align:right;padding:8px 10px;color:var(--green);">${totD}</td>
      <td style="text-align:right;padding:8px 10px;color:var(--yellow2);">${totP}</td>
      <td style="text-align:right;padding:8px 10px;">${fmtNum(totPG)}</td>
      <td style="text-align:right;padding:8px 10px;">${fmtNum(totH)}</td>
      <td style="text-align:right;padding:8px 10px;color:${totCR>=80?'var(--green)':totCR>=50?'var(--yellow2)':'var(--red)'};">${totCR}%</td>
    </tr>`;
    html += '</tbody></table></div>';
  }

  // ── Ranking nhân sự ──
  html += sectionTitle('🏅 Ranking nhân sự');
  html += `<div style="background:var(--white);border-radius:var(--radius);margin:0 16px 12px;box-shadow:var(--shadow);">
    <div style="padding:10px 16px 4px;display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;font-size:10px;font-weight:700;color:var(--gray2);text-transform:uppercase;border-bottom:1px solid var(--gray3);"><span>#</span><span>Nhân viên</span><span>Buổi</span><span>Khách</span></div>`;
  const medals = ['gold','silver','bronze'];
  staffList.forEach((s,i) => {
    const eff = s.events>0?Math.round((s.done/s.events)*100):0;
    html += `<div style="display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;padding:10px 16px;align-items:center;border-bottom:1px solid var(--gray3);">
      <div class="rank-num ${medals[i]||''}">${i+1}</div>
      <div><div style="font-size:13px;font-weight:600;">${s.name}</div><div style="font-size:10px;color:var(--gray2);">${s.role}${s.channel?' · '+s.channel:''} · ${s.locCount} điểm</div>
        <div style="margin-top:4px;height:4px;background:var(--gray3);border-radius:2px;overflow:hidden;"><div style="height:100%;width:${eff}%;background:${eff>=80?'var(--green)':eff>=50?'var(--yellow2)':'var(--red)'};border-radius:2px;"></div></div>
        <div style="font-size:10px;color:var(--gray2);margin-top:1px;">${eff}% hoàn thành</div>
      </div>
      <div style="text-align:right;"><div style="font-size:16px;font-weight:800;color:var(--red);">${s.events}</div><div style="font-size:10px;color:var(--gray2);">buổi</div></div>
      <div style="text-align:right;"><div style="font-size:13px;font-weight:600;">${fmtNum(s.tasters)}</div><div style="font-size:10px;color:var(--gray2);">người</div></div>
    </div>`;
  });
  if (staffList.length===0) html += '<div class="empty-state" style="padding:24px;"><div class="empty-icon">👥</div><div class="empty-text">Chưa có dữ liệu nhân sự</div></div>';
  html += '</div><div class="spacer"></div></div>';
  el.innerHTML = html;
}

function renderMgrCost(el, over, month) {
  const c  = over ? over.costs            ||{} : {};
  const cb = over ? over.channelBreakdown ||{} : {};
  const e  = over ? over.effectiveness   ||{} : {};
  const cd = over ? over.channelCostDetail||[] : [];
  const total = c.total || 1;

  let html = '<div style="padding:8px 0 0;" class="fade-in">';
  html += `<div class="dash-kpi-grid four">
    ${kpiCard('Tổng chi phí', fmtCurrency(c.total), 'tất cả hoạt động', 'red', '💰')}
    ${kpiCard('Chi phí PG', fmtCurrency(c.pg), Math.round((c.pg||0)/total*100)+'%', 'navy', '👥')}
    ${kpiCard('Chi phí địa điểm', fmtCurrency(c.location), Math.round((c.location||0)/total*100)+'%', 'teal', '📍')}
    ${kpiCard('Quà tặng', fmtCurrency(c.gifts), Math.round((c.gifts||0)/total*100)+'%', 'yellow', '🎁')}
  </div>`;
  html += `<div class="dash-kpi-grid four" style="padding-top:4px;">
    ${kpiCard('CP/người thử', fmtCurrency(e.costPerContact), 'cost per contact', 'green', '🧮')}
    ${kpiCard('Khách tiếp cận', fmtNum(e.totalTasters), '', '', '👤')}
    ${kpiCard('Doanh số', fmtCurrency(e.totalActualSales), '', '', '📈')}
    ${kpiCard('ROI ước tính', e.totalActualSales>0&&c.total>0?(e.totalActualSales/c.total).toFixed(1)+'x':'—', 'DS/CP', 'teal', '🎯')}
  </div>`;

  // ── Bảng chi tiết chi phí theo kênh/vùng ──
  if (cd.length > 0) {
    html += sectionTitle('📋 Chi tiết chi phí theo kênh / vùng');
    const CH_ORDER = ['MT','GT South','GT Central','GT North'];
    const sortedCd = [...cd].sort((a,b) => {
      const ai = CH_ORDER.indexOf(a.channel), bi = CH_ORDER.indexOf(b.channel);
      if (ai>=0&&bi>=0) return ai-bi;
      if (ai>=0) return -1; if (bi>=0) return 1;
      return b.total-a.total;
    });
    html += `<div style="overflow-x:auto;margin:0 16px 12px;border-radius:var(--radius);box-shadow:var(--shadow);">
    <table style="width:100%;border-collapse:collapse;background:var(--white);font-size:11px;">
      <thead>
        <tr style="background:var(--navy);">
          <th style="text-align:left;padding:8px 10px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;">Kênh / Vùng</th>
          <th style="text-align:right;padding:8px 10px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;">Số buổi</th>
          <th style="text-align:right;padding:8px 10px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;">CP Địa điểm</th>
          <th style="text-align:right;padding:8px 10px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;">CP PG</th>
          <th style="text-align:right;padding:8px 10px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;">Số PG dùng</th>
          <th style="text-align:right;padding:8px 10px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;">Tổng giờ PG</th>
          <th style="text-align:right;padding:8px 10px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;">CP mẫu thử</th>
          <th style="text-align:right;padding:8px 10px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;">Tổng cộng</th>
        </tr>
      </thead>
      <tbody>`;
    sortedCd.forEach(row => {
      html += `<tr style="border-bottom:1px solid var(--gray3);">
        <td style="text-align:left;padding:7px 10px;font-weight:700;white-space:nowrap;">${row.channel}</td>
        <td style="text-align:right;padding:7px 10px;">${row.sessions}</td>
        <td style="text-align:right;padding:7px 10px;">${fmtCurrency(row.costLocation)}</td>
        <td style="text-align:right;padding:7px 10px;">${fmtCurrency(row.costPg)}</td>
        <td style="text-align:right;padding:7px 10px;">${fmtNum(row.pgUsed)}</td>
        <td style="text-align:right;padding:7px 10px;">${fmtNum(row.pgHoursTotal)}</td>
        <td style="text-align:right;padding:7px 10px;">${fmtCurrency(row.costSample)}</td>
        <td style="text-align:right;padding:7px 10px;font-weight:700;color:var(--red);">${fmtCurrency(row.total)}</td>
      </tr>`;
    });
    // Totals
    const tS = sortedCd.reduce((s,r)=>s+r.sessions,0);
    const tL = sortedCd.reduce((s,r)=>s+r.costLocation,0);
    const tP = sortedCd.reduce((s,r)=>s+r.costPg,0);
    const tG = sortedCd.reduce((s,r)=>s+r.pgUsed,0);
    const tH = sortedCd.reduce((s,r)=>s+r.pgHoursTotal,0);
    const tM = sortedCd.reduce((s,r)=>s+r.costSample,0);
    const tT = sortedCd.reduce((s,r)=>s+r.total,0);
    html += `<tr style="background:var(--gray4);font-weight:700;border-top:2px solid var(--gray3);">
      <td style="text-align:left;padding:8px 10px;">Tổng cộng</td>
      <td style="text-align:right;padding:8px 10px;">${tS}</td>
      <td style="text-align:right;padding:8px 10px;">${fmtCurrency(tL)}</td>
      <td style="text-align:right;padding:8px 10px;">${fmtCurrency(tP)}</td>
      <td style="text-align:right;padding:8px 10px;">${fmtNum(tG)}</td>
      <td style="text-align:right;padding:8px 10px;">${fmtNum(tH)}</td>
      <td style="text-align:right;padding:8px 10px;">${fmtCurrency(tM)}</td>
      <td style="text-align:right;padding:8px 10px;color:var(--red);">${fmtCurrency(tT)}</td>
    </tr>`;
    html += '</tbody></table></div>';
  }

  html += sectionTitle('📊 Phân bổ chi phí');
  html += `<div class="card" style="margin:0 16px 12px;"><div class="card-body">
    ${[['PG','var(--teal)',c.pg],['Địa điểm','var(--navy)',c.location],['Quà tặng','var(--yellow2)',c.gifts]].map(([nm,col,val]) =>
      `<div class="bar-row"><div class="bar-label">${nm}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round((val||0)/total*100)}%;background:${col};"></div></div><div class="bar-value">${Math.round((val||0)/total*100)}%</div></div><div style="font-size:11px;color:var(--gray2);padding:0 16px 6px;text-align:right;">${fmtCurrency(val)}</div>`
    ).join('')}
  </div></div>`;
  if (Object.keys(cb).length > 0) {
    html += sectionTitle('💰 Chi phí theo kênh (bar chart)');
    const CHANNEL_ORDER = ['MT', 'GT South', 'GT Central', 'GT North', 'HCM', 'GT'];
    const maxCost = Math.max(...Object.values(cb).map(d=>d.cost||0), 1);
    html += `<div class="card" style="margin:0 16px 12px;"><div class="card-body">`;
    const sortedChannels = Object.entries(cb).sort((a,b) => {
      const ai = CHANNEL_ORDER.indexOf(a[0]);
      const bi = CHANNEL_ORDER.indexOf(b[0]);
      if (ai >= 0 && bi >= 0) return ai - bi;
      if (ai >= 0) return -1;
      if (bi >= 0) return 1;
      return (b[1].cost||0) - (a[1].cost||0);
    });
    sortedChannels.forEach(([ch, data]) => {
      const cpc = data.tasters>0?Math.round((data.cost||0)/data.tasters):0;
      html += `<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:4px;"><span>${ch}</span><span style="color:var(--red);">${fmtCurrency(data.cost||0)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.round((data.cost||0)/maxCost*100)}%;background:var(--red);"></div></div><div style="font-size:10px;color:var(--gray2);margin-top:3px;">${data.count} buổi · ${fmtCurrency(cpc)}/người thử</div></div>`;
    });
    html += '</div></div>';
  }
  if (over && over.monthlyTrend && over.monthlyTrend.length > 1) {
    const ct = over.monthlyTrend.slice(-6);
    const maxC = Math.max(...ct.map(m=>m.cost||0),1);
    html += sectionTitle('📈 Chi phí theo tháng');
    html += '<div class="card" style="margin:0 16px 12px;"><div class="card-body"><div style="display:flex;align-items:flex-end;gap:4px;height:70px;">'
      + ct.map((m,i)=>{const h=Math.max(Math.round(((m.cost||0)/maxC)*100),4);return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;"><div style="width:100%;height:'+h+'%;background:var(--navy);border-radius:3px 3px 0 0;opacity:'+(0.4+i*0.12)+';min-height:4px;"></div><div style="font-size:9px;color:var(--gray2);">'+m.month.substring(5,7)+'/'+m.month.substring(2,4)+'</div></div>';}).join('')
      + '</div></div></div>';
  }
  html += '<div class="spacer"></div></div>';
  el.innerHTML = html;
}

// =====================================================
// THEO KÊNH — Channel Matrix Table (replaces Compare)
// =====================================================
function renderMgrCompare(el, over, perf, month) {
  const cb       = over ? over.channelBreakdown ||{} : {};
  const s        = over ? over.statusBreakdown  ||{} : {};
  const e        = over ? over.effectiveness    ||{} : {};
  const channels = Object.keys(cb);

  // Channel display order
  const CH_ORDER = ['MT','GT South','GT Central','GT North'];
  const sorted   = [...CH_ORDER.filter(c => cb[c]), ...channels.filter(c => !CH_ORDER.includes(c))];

  // Compute totals across all channels from channelBreakdown
  const tot = sorted.reduce((acc, ch) => {
    const d = cb[ch] || {};
    acc.total    += d.count       || 0;
    acc.cho_duyet+= d.cho_duyet   || 0;
    acc.da_duyet += d.da_duyet    || 0;
    acc.hoan_thanh+=d.hoan_thanh  || 0;
    acc.tu_choi  += d.tu_choi     || 0;
    acc.tasters  += d.tasters     || 0;
    acc.sales    += d.sales       || 0;
    acc.cost     += d.cost        || 0;
    acc.pg       += d.costPg      || 0;
    acc.location += d.costLocation|| 0;
    acc.gifts    += d.costGifts   || 0;
    return acc;
  }, { total:0, cho_duyet:0, da_duyet:0, hoan_thanh:0, tu_choi:0,
       tasters:0, sales:0, cost:0, pg:0, location:0, gifts:0 });

  // --- helpers ---
  const th  = (txt, align='right') => `<th style="text-align:${align};padding:8px 10px;font-size:11px;font-weight:700;color:var(--gray2);white-space:nowrap;background:var(--gray4);border-bottom:2px solid var(--gray3);">${txt}</th>`;
  const td  = (txt, bold=false, color='', bg='') =>
    `<td style="text-align:right;padding:7px 10px;font-size:12px;${bold?'font-weight:700;':''}${color?`color:${color};`:''}${bg?`background:${bg};`:''}white-space:nowrap;border-bottom:1px solid var(--gray3);">${txt}</td>`;
  const tdL = (txt, bold=false) =>
    `<td style="text-align:left;padding:7px 10px;font-size:12px;font-weight:${bold?700:600};white-space:nowrap;border-bottom:1px solid var(--gray3);${bold?'background:var(--gray4);':''}position:sticky;left:0;background:${bold?'var(--gray4)':'var(--white)'};z-index:1;">${txt}</td>`;

  // --- Section 1: Trạng thái buổi sampling ---
  let statusRows = '';
  const statusDefs = [
    { key:'total',     label:'Tổng buổi',   color:'var(--navy)',   fn: d => d.count||0 },
    { key:'cho_duyet', label:'Chờ duyệt',   color:'var(--yellow2)',fn: d => d.cho_duyet||0 },
    { key:'da_duyet',  label:'Đã duyệt',    color:'var(--green)',  fn: d => d.da_duyet||0 },
    { key:'hoan_thanh',label:'Hoàn thành',  color:'var(--teal)',   fn: d => d.hoan_thanh||0 },
    { key:'tu_choi',   label:'Từ chối',     color:'var(--red)',    fn: d => d.tu_choi||0 },
  ];
  statusDefs.forEach(row => {
    const vals = sorted.map(ch => {
      const v = row.fn(cb[ch]||{});
      return td(v===0?'—':v, false, v>0?row.color:'var(--gray2)');
    });
    const totV = row.key==='total'?tot.total:row.key==='cho_duyet'?tot.cho_duyet:row.key==='da_duyet'?tot.da_duyet:row.key==='hoan_thanh'?tot.hoan_thanh:tot.tu_choi;
    statusRows += `<tr>${tdL(row.label)}${vals.join('')}${td(totV===0?'—':totV,true,row.color)}</tr>`;
  });

  // --- Section 2: Hiệu quả ---
  const effRows = [
    { label:'Người thử', fn: d => fmtNum(d.tasters||0),         totVal: fmtNum(tot.tasters), color:'' },
    { label:'TB/buổi',   fn: d => { const c=d.count||0; return c>0?fmtNum(Math.round((d.tasters||0)/c)):'—'; }, totVal: (tot.total>0?fmtNum(Math.round(tot.tasters/tot.total)):'—'), color:'' },
    { label:'Doanh số',  fn: d => fmtCurrency(d.sales||0),      totVal: fmtCurrency(tot.sales), color:'var(--teal)' },
    { label:'CP/người',  fn: d => { const t=d.tasters||0; return t>0?fmtCurrency(Math.round((d.cost||0)/t)):'—'; }, totVal: (tot.tasters>0?fmtCurrency(Math.round(tot.cost/tot.tasters)):'—'), color:'' },
  ].map(row => {
    const vals = sorted.map(ch => td(row.fn(cb[ch]||{}), false, row.color));
    return `<tr>${tdL(row.label)}${vals.join('')}${td(row.totVal,true,row.color)}</tr>`;
  }).join('');

  // --- Section 3: Chi phí ---
  const costDefs = [
    { label:'Tổng CP',      fn: d => fmtCurrency(d.cost||0),        totVal: fmtCurrency(tot.cost),     color:'var(--red)' },
    { label:'CP PG',        fn: d => fmtCurrency(d.costPg||0),      totVal: fmtCurrency(tot.pg),       color:'' },
    { label:'CP Địa điểm',  fn: d => fmtCurrency(d.costLocation||0),totVal: fmtCurrency(tot.location), color:'' },
    { label:'Quà tặng',     fn: d => fmtCurrency(d.costGifts||0),   totVal: fmtCurrency(tot.gifts),    color:'' },
  ].map(row => {
    const vals = sorted.map(ch => td(row.fn(cb[ch]||{}), false, row.color));
    return `<tr>${tdL(row.label)}${vals.join('')}${td(row.totVal,true,row.color)}</tr>`;
  }).join('');

  // --- Monthly trend table ---
  let trendTable = '';
  if (over && over.monthlyTrend && over.monthlyTrend.length > 0) {
    const t6 = over.monthlyTrend.slice(-6);
    const trendRows = t6.map((m, i) => {
      const isLast = i === t6.length - 1;
      return `<tr style="${isLast?'font-weight:700;background:var(--gray4);':''}">
        <td style="padding:7px 10px;font-size:12px;white-space:nowrap;border-bottom:1px solid var(--gray3);position:sticky;left:0;background:${isLast?'var(--gray4)':'var(--white)'};">${m.month.substring(5,7)}/${m.month.substring(2,4)}</td>
        <td style="text-align:right;padding:7px 10px;font-size:12px;border-bottom:1px solid var(--gray3);">${m.events||0}</td>
        <td style="text-align:right;padding:7px 10px;font-size:12px;border-bottom:1px solid var(--gray3);color:var(--teal);">${fmtNum(m.tasters)}</td>
        <td style="text-align:right;padding:7px 10px;font-size:12px;border-bottom:1px solid var(--gray3);">${fmtCurrency(m.sales)}</td>
        <td style="text-align:right;padding:7px 10px;font-size:12px;border-bottom:1px solid var(--gray3);color:var(--red);">${fmtCurrency(m.cost)}</td>
      </tr>`;
    }).join('');
    trendTable = `
      <div style="padding:4px 16px 0;">
        <div class="section-title" style="padding:12px 0 6px;">📅 Xu hướng theo tháng</div>
        <div style="background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;">
          <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
            <table style="width:100%;border-collapse:collapse;min-width:360px;">
              <thead><tr>
                ${th('Tháng','left')}
                ${th('Buổi')}
                ${th('Người thử')}
                ${th('Doanh số')}
                ${th('Chi phí')}
              </tr></thead>
              <tbody>${trendRows}</tbody>
            </table>
          </div>
        </div>
      </div>`;
  }

  // --- Insight row ---
  let insight = '';
  if (sorted.length > 1) {
    const bestCh  = sorted.slice().sort((a,b)=>(cb[b].tasters||0)-(cb[a].tasters||0))[0];
    const worstCh = sorted.slice().sort((a,b)=>(cb[a].tasters||0)-(cb[b].tasters||0))[0];
    if (bestCh) insight += `<div class="insight-card green"><div class="insight-title">✅ Kênh nhiều khách nhất: ${bestCh}</div><div class="insight-text">${cb[bestCh].count||0} buổi · ${fmtNum(cb[bestCh].tasters||0)} người thử</div></div>`;
    if (worstCh && worstCh !== bestCh) insight += `<div class="insight-card yellow"><div class="insight-title">📈 Kênh cần chú ý: ${worstCh}</div><div class="insight-text">Hiệu quả thấp hơn bình quân — xem xét điều chỉnh</div></div>`;
    if ((tot.cho_duyet||0) > 3) insight += `<div class="insight-card"><div class="insight-title">⏳ ${tot.cho_duyet} buổi đang chờ duyệt</div><div class="insight-text">Nên duyệt sớm để team chuẩn bị kịp thời</div></div>`;
  }

  // --- Assemble ---
  const colHdrs = sorted.map(ch => th(ch)).join('') + th('Tổng','right');
  const sectionHdr = (icon, label) => `
    <tr><td colspan="${sorted.length+2}" style="padding:10px 10px 4px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gray2);background:var(--gray4);border-bottom:1px solid var(--gray3);">${icon} ${label}</td></tr>`;

  const noData = sorted.length === 0;

  let html = `<div style="padding:8px 0 0;" class="fade-in">`;

  if (noData) {
    html += `<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">Chưa có dữ liệu kênh</div><div class="empty-sub">Thử chọn tháng khác</div></div>`;
  } else {
    // Month label
    const mLabel = month ? `Tháng ${month.substring(5,7)}/${month.substring(0,4)}` : 'Tất cả tháng';
    html += `<div style="padding:10px 16px 4px;display:flex;align-items:center;justify-content:space-between;">
      <div style="font-size:13px;font-weight:700;color:var(--navy);">Bảng thống kê theo kênh</div>
      <div style="font-size:11px;color:var(--gray2);background:var(--gray4);padding:3px 10px;border-radius:20px;">${mLabel}</div>
    </div>`;

    // Main matrix table
    html += `<div style="padding:0 16px 4px;">
      <div style="background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;">
        <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
          <table style="width:100%;border-collapse:collapse;min-width:${sorted.length*90+140}px;">
            <thead><tr>
              ${th('Chỉ số','left')}

/** Compute all stats from a list of plans + their reports */
function computePersonalStats(plans) {
  const stats = {
    total:        plans.length,
    done:         plans.filter(p => p.status === 'hoan_thanh').length,
    approved:     plans.filter(p => p.status === 'da_duyet').length,
    pending:      plans.filter(p => p.status === 'cho_duyet').length,
    needsEdit:    plans.filter(p => p.status === 'yeu_cau_chinh_sua').length,
    rejected:     plans.filter(p => p.status === 'tu_choi').length,
    locations:    new Set(plans.map(p => p.locationName)).size,

    // Cost aggregates (from plan estimates)
    totalCost:    0, pgCost: 0, locationCost: 0, giftCost: 0,

    // Effectiveness from reports
    totalTasters:  0, totalSales: 0, reportCount: 0,

    // By location: { name: { tasters, sales, events, cost } }
    byLocation: {},

    // Monthly breakdown: { 'YYYY-MM': { events, done, tasters, sales, cost } }
    byMonth: {},
  };

  plans.forEach(p => {
    const month = String(p.date || '').substring(0, 7);
    if (!stats.byMonth[month]) stats.byMonth[month] = { month, events:0, done:0, tasters:0, sales:0, cost:0 };
    stats.byMonth[month].events++;
    if (p.status === 'hoan_thanh') stats.byMonth[month].done++;

    const ch = (p.region||'').toUpperCase().startsWith('GT') ? 'GT' : 'MT';
    const pgRate = ch === 'GT' ? 50000 : 45000;
    const pCost  = p.hiresPg ? (p.pgCount||0)*(p.pgHours||0)*pgRate : 0;
    const lCost  = Number(p.locationCost) || 0;
    const gCost  = (p.gifts||[]).reduce((s,g)=>(s+(Number(g.so_luong||0)*Number(g.gia_tri||0))),0);
    const totC   = pCost + lCost + gCost;

    stats.pgCost       += pCost;
    stats.locationCost += lCost;
    stats.giftCost     += gCost;
    stats.totalCost    += totC;
    stats.byMonth[month].cost += totC;

    // Reports
    (p.reports || []).forEach(r => {
      const t = Number(r.actualTasters) || 0;
      const s = Number(r.actualSales)   || 0;
      stats.totalTasters  += t;
      stats.totalSales    += s;
      stats.reportCount++;
      stats.byMonth[month].tasters += t;
      stats.byMonth[month].sales   += s;
    });

    // By location
    const loc = p.locationName || '—';
    if (!stats.byLocation[loc]) stats.byLocation[loc] = { name:loc, events:0, tasters:0, sales:0, cost:0 };
    stats.byLocation[loc].events++;
    stats.byLocation[loc].cost += totC;
    (p.reports||[]).forEach(r => {
      stats.byLocation[loc].tasters += Number(r.actualTasters)||0;
      stats.byLocation[loc].sales   += Number(r.actualSales)||0;
    });
  });

  // Sort months
  stats.sortedMonths = Object.values(stats.byMonth).sort((a,b)=>a.month.localeCompare(b.month));

  // Top locations by tasters
  stats.topLocations = Object.values(stats.byLocation)
    .sort((a,b)=>b.tasters-a.tasters).slice(0, 8);

  // Effectiveness
  const donePlans = plans.filter(p => p.status === 'hoan_thanh');
  stats.effRate   = plans.length > 0 ? Math.round((stats.done/plans.length)*100) : 0;
  stats.avgTasters = donePlans.length > 0
    ? Math.round(stats.totalTasters / Math.max(stats.reportCount, donePlans.length)) : 0;
  stats.cpContact  = stats.totalTasters > 0
    ? Math.round(stats.totalCost / stats.totalTasters) : 0;

  return stats;
}
