  }

  if (p.status === 'hoan_thanh') {
    const cnt = (p.reports||[]).length;
    html += `<div class="info-banner" style="margin-top:8px;">
      ✅ Hoàn thành · ${cnt} báo cáo đã gửi${isMgrOrMkt ? ' · Có thể "Mở lại" để nhân viên báo cáo thêm' : ''}
    </div>`;
  }
  html += `<div class="spacer"></div>`;
  document.getElementById('plan-detail-content').innerHTML = html;
}
function dr(key, val) {
  return `<div class="detail-row"><span class="detail-key">${key}</span><span class="detail-value">${val}</span></div>`;
}

// =====================================================
// CREATE / EDIT PLAN FORM
// =====================================================
async function initCreatePlan(editPlanId = null) {
  currentPlanId = editPlanId;

  planFormData = {
    samples: [], dishes: [], gifts: [], executors: [], servingMethods: [],
    days: [], date: '', hiresPg: false, hasPromo: false, hasKiosk: false,
    hasInvoice: false, hasGift: false, _pgHours: 0, _pgRate: 0, _pgStart: '', _pgEnd: '',
    campaign: '', pgSales: null, _pgSalesCost: 0,
  };

  const todayStr = localToday();

  if (editPlanId) {
    loading(true, 'Đang tải kế hoạch...');
    try {
      const res = await api('GET', { action: 'getPlanDetail', planId: editPlanId });
      if (!res.success) { showToast(res.error || 'Không tải được kế hoạch', 'error'); loading(false); return; }
      const p = res.data;
      if (!window._planCache) window._planCache = {};
      window._planCache[editPlanId] = p;

      planFormData.samples   = p.samples   || [];
      planFormData.dishes    = p.dishes    || [];
      planFormData.gifts     = p.gifts     || [];
      planFormData.servingMethods = [];
      const _sm = String(p.servingMethod || '');
      if (_sm.includes('Nấu'))  planFormData.servingMethods.push('nau');
      if (_sm.includes('Khui')) planFormData.servingMethods.push('khui');
      planFormData.executors = (p.executors || []).map(String);
      planFormData.supervisorCode = p.supervisor || '';
      planFormData.supervisorName = userName(p.supervisor) || p.supervisor || '';
      planFormData.hiresPg   = p.hiresPg   || false;
      planFormData.hasPromo  = p.hasPromo  || false;
      planFormData.hasKiosk  = p.hasKiosk  || false;
      planFormData.hasInvoice= p.hasInvoice|| false;
      planFormData.hasGift   = (p.gifts || []).length > 0;
      planFormData.postType  = p.postType  || '';
      planFormData.boothType = p.boothType || '';
      planFormData.costType  = p.costType  || '';
      planFormData._pgHours  = p.pgHours   || 0;
      planFormData._pgStart  = p.pgStart   || '';
      planFormData._pgEnd    = p.pgEnd     || '';
      planFormData.campaign  = p.campaign  || '';
      planFormData.pgSales   = p.pgSales && p.pgSales.count ? {
        count: p.pgSales.count, mode: p.pgSales.mode || '1ca',
        shifts: (p.pgSales.shifts || []).map(s => ({ start: fmtTime(s.start), end: fmtTime(s.end) })),
      } : null;

      const dateStr = toInputDate(p.date);
      const endStr  = p.dateEnd ? toInputDate(p.dateEnd) : dateStr;
      planFormData.date          = dateStr;
      planFormData._region       = p.region       || '';
      planFormData._locationName = p.locationName || '';
      planFormData._pgCount      = p.pgCount       || 1;
      planFormData._pgNote       = p.pgNote        || '';
      planFormData._locationCost = p.locationCost  || '';
      planFormData._costNote     = p.costNote      || '';
      planFormData._purpose      = p.purpose       || '';
      planFormData._estTasters   = p.estTasters    || '';
      planFormData._estSales     = p.estSales      || '';
      planFormData._notes        = p.notes         || '';
      const _editDates = dateRange(dateStr, endStr || dateStr);
      const _srcDays = (Array.isArray(p.days) && p.days.length > 0) ? p.days : null;
      planFormData.days = _editDates.map((ds, i) => {
        const src = _srcDays ? (_srcDays.find(d => toInputDate(d.date) === ds) || _srcDays[i]) : null;
        return {
          date:      ds,
          timeStart: (src && src.timeStart) || p.timeStart || '09:00',
          timeEnd:   (src && src.timeEnd)   || p.timeEnd   || '12:00',
        };
      });

      document.getElementById('create-plan-subtitle').textContent = 'Chỉnh sửa: ' + editPlanId;
      document.getElementById('create-plan-title').textContent = 'Chỉnh sửa kế hoạch';
    } catch(e) {
      showToast('Lỗi kết nối', 'error'); loading(false); return;
    }
    loading(false);
  } else {
    document.getElementById('create-plan-subtitle').textContent = 'Kế hoạch mới';
    document.getElementById('create-plan-title').textContent = 'Lên kế hoạch sampling';
  }

  renderCreatePlanForm();
  showScreen('create-plan');

  const startEl = document.getElementById('f-date-start');
  const endEl   = document.getElementById('f-date-end');
  if (startEl) startEl.min = todayStr;
  if (endEl)   endEl.min   = todayStr;

  if (editPlanId && planFormData.days.length > 0) {
    const _days = planFormData.days;
    if (startEl) startEl.value = _days[0].date;
    if (endEl)   endEl.value   = _days[_days.length - 1].date;
    const locNameEl = document.getElementById('f-location-name');
    const regionEl  = document.getElementById('f-region');
    if (locNameEl) locNameEl.value = planFormData._locationName;
    if (regionEl && planFormData._region) regionEl.value = planFormData._region;
    setTimeout(() => {
      onDateRangeChange();
      restoreFormState();
    }, 80);
  } else {
    if (startEl) startEl.value = todayStr;
    if (endEl)   endEl.value   = todayStr;
    setTimeout(() => onDateRangeChange(), 50);
  }
}

/** Khôi phục trạng thái form khi chỉnh sửa kế hoạch */
function restoreFormState() {
  // Chương trình + PG bán hàng
  const cpEl = document.getElementById('f-campaign');
  if (cpEl && planFormData.campaign) {
    if (![...cpEl.options].some(o => o.value === planFormData.campaign)) {
      cpEl.insertAdjacentHTML('beforeend', `<option value="${escHtml(planFormData.campaign)}">${escHtml(planFormData.campaign)} (đã ngừng)</option>`);
    }
    cpEl.value = planFormData.campaign;
    onCampaignChange(true);
  }

  // Sản phẩm
  planFormData.samples.forEach(s => {
    const check   = document.querySelector(`#prod-${s.ma} .product-check`);
    const qtyWrap = document.getElementById(`qty-wrap-${s.ma}`);
    const qtyEl   = document.getElementById(`qty-${s.ma}`);
    if (check)   check.classList.add('checked');
    if (qtyWrap) qtyWrap.style.display = 'block';
    if (qtyEl)   qtyEl.value = s.so_luong || '';
  });

  // PG sampling
  if (planFormData.hiresPg) {
    const pgToggle = document.getElementById('toggle-pg');
    if (pgToggle) pgToggle.classList.add('on');
    const fields = document.getElementById('pg-fields');
    if (fields) fields.style.display = 'flex';
    const pgCount = document.getElementById('f-pg-count');
    if (pgCount) pgCount.value = planFormData._pgCount || 1;
    const pgNote = document.getElementById('f-pg-note');
    if (pgNote) pgNote.value = planFormData._pgNote || '';
    const pgStart = document.getElementById('f-pg-start');
    const pgEnd   = document.getElementById('f-pg-end');
    const d = planFormData.days[0] || {};
    if (pgStart) pgStart.value = planFormData._pgStart || d.timeStart || '09:00';
    if (pgEnd) {
      // khôi phục giờ kết thúc theo số giờ đã lưu
      const st = hhmmToMin(pgStart ? pgStart.value : '09:00');

// =====================================================
// TIME & PG SAMPLING CALCULATION
// =====================================================
function calcHoursDiff(startTime, endTime) {
  if (!startTime || !endTime) return 0;
  const [sh, sm] = startTime.split(':').map(Number);
  const [eh, em] = endTime.split(':').map(Number);
  const diff = (eh * 60 + em) - (sh * 60 + sm);
  return Math.max(0, diff / 60);
}

function isHoliday(dateStr) {
  if (!dateStr) return false;
  const s = String(dateStr).substring(0, 10);
  const d = parseLocalDate(s);
  if (!d || isNaN(d)) return false;
  const mm = d.getMonth() + 1, dd = d.getDate(), yr = d.getFullYear();
  if ([[1,1],[4,30],[5,1],[9,2]].some(([m, dy]) => mm === m && dd === dy)) return true;
  const gioToMap = { 2026: '2026-04-26', 2027: '2027-04-16', 2028: '2028-04-04' };
  if (gioToMap[yr] === s) return true;
  const tetRanges = {
    2026: ['2026-02-15', '2026-02-21'],
    2027: ['2027-02-05', '2027-02-11'],
    2028: ['2028-01-25', '2028-01-31'],
  };
  if (tetRanges[yr] && s >= tetRanges[yr][0] && s <= tetRanges[yr][1]) return true;
  return false;
}

/** Đơn giá PG SAMPLING (đứng booth) — chỉ đọc các dòng giá "PG sampling". */
function getPgRate(hours, dateStr, channel) {
  const pricing = (masterData.pgPricing || []).filter(r => r.pgType !== 'ban_hang');
  const isHol = isHoliday(dateStr);
  const dayType = isHol ? 'Lễ/Tết' : 'Ngày thường';
  const normCh = (s) => {
    const u = (s || '').toUpperCase().trim();
    if (u.startsWith('MT')) return 'MT';
    if (u.startsWith('GT')) return 'GT';
    return null;
  };
  const ch = normCh(channel);
  const FALLBACK = { MT: { normal: 45000, holiday: 67500 }, GT: { normal: 50000, holiday: 75000 } };

  let hourlyRate = 0, rateSource = 'default';
  if (pricing.length > 0) {
    const isHolRow = (row) => /lễ|lể|tết|tet/.test(String(row.note || '').toLowerCase());
    let match = pricing.find(row => normCh(row.channel || '') === ch && (isHol ? isHolRow(row) : !isHolRow(row)));
    if (!match) match = pricing.find(row => isHol ? isHolRow(row) : !isHolRow(row));
    if (match) { hourlyRate = Number(String(match.ratePerPg || 0).replace(/[^0-9]/g, '')) || 0; rateSource = 'sheet'; }
  }
  if (!hourlyRate) {
    const fb = ch ? FALLBACK[ch] : FALLBACK.MT;
    hourlyRate = isHol ? fb.holiday : fb.normal;
    rateSource = 'default';
  }
  const dayLabel = isHol ? '🎉 Lễ/Tết' : '📅 Ngày thường';
  const warnNote = rateSource === 'default' ? ' ⚠️ Dùng giá mặc định — kiểm tra sheet GIA_THUE_PG' : '';
  return {
    hourlyRate,
    label: `${hours.toFixed(1)}h × ${fmtCurrency(hourlyRate)}/giờ${ch ? ' · ' + ch : ''}`,
    note: `${dayLabel}${ch ? ' · Kênh ' + ch : ''}${warnNote}`,
    dayType, channel: ch, rateSource,
  };
}

function onDateRangeChange() {
  const startStr = document.getElementById('f-date-start')?.value;
  const endEl = document.getElementById('f-date-end');
  if (endEl && startStr) endEl.min = startStr;
  if (endEl && startStr && endEl.value && endEl.value < startStr) endEl.value = startStr;
  const end = endEl?.value || startStr;
  if (!startStr) { renderDayCards([]); return; }
  renderDayCards(dateRange(startStr, end || startStr));
}

function renderDayCards(dates) {
  const container = document.getElementById('day-cards-container');
  const summaryEl = document.getElementById('sampling-days-display');
  const summaryText = document.getElementById('sampling-days-text');
  if (!container) return;

  if (dates.length === 0) {
    container.innerHTML = '';
    if (summaryEl) summaryEl.style.display = 'none';
    planFormData.days = [];
    return;
  }

  const existingTimes = {};
  (planFormData.days || []).forEach(d => { existingTimes[d.date] = { timeStart: d.timeStart, timeEnd: d.timeEnd }; });

  container.innerHTML = dates.map(dateStr => {
    const d       = parseLocalDate(dateStr);
    const dayIdx  = d.getDay();
    const isWE    = dayIdx === 0 || dayIdx === 6;
    const isHol   = isHoliday(dateStr);
    const cardCls = isHol ? 'holiday' : isWE ? 'weekend' : '';
    const typeLbl = isHol ? '🎉 Ngày lễ' : isWE ? '📅 Cuối tuần' : '';
    const existing = existingTimes[dateStr] || {};
    const tStart  = existing.timeStart || '09:00';
    const tEnd    = existing.timeEnd   || '12:00';

    return `<div class="day-card ${cardCls}" id="day-card-${dateStr}">
      <div class="day-card-header">
        <div class="day-badge ${cardCls}">${DAY_NAMES_VI[dayIdx]}</div>
        <div class="day-date-label">${fmtDate(dateStr)}</div>
        ${typeLbl ? `<div class="day-type-chip ${cardCls}">${typeLbl}</div>` : ''}
      </div>
      <div class="day-time-row">
        <div class="form-field">
          <label style="font-size:11px;">Giờ bắt đầu</label>
          <input class="form-input" type="time" value="${tStart}" id="day-start-${dateStr}"
            oninput="updateDayTime('${dateStr}')" style="padding:9px 10px;">
        </div>
        <div class="form-field">
          <label style="font-size:11px;">Giờ kết thúc</label>
          <input class="form-input" type="time" value="${tEnd}" id="day-end-${dateStr}"
            oninput="updateDayTime('${dateStr}')" style="padding:9px 10px;">
        </div>
      </div>
    </div>`;
  }).join('');

  planFormData.days = dates.map(dateStr => ({
    date:      dateStr,
    timeStart: existingTimes[dateStr]?.timeStart || '09:00',
    timeEnd:   existingTimes[dateStr]?.timeEnd   || '12:00',
  }));
  planFormData.date = dates[0];

  if (summaryEl) summaryEl.style.display = 'flex';
  if (summaryText) summaryText.textContent = `${dates.length} ngày thực hiện`;

  onPgTimeChange();
  calcPgSalesUI();
}

function updateDayTime(dateStr) {
  const tStart = document.getElementById(`day-start-${dateStr}`)?.value;
  const tEnd   = document.getElementById(`day-end-${dateStr}`)?.value;
  const day = (planFormData.days || []).find(d => d.date === dateStr);
  if (day) { day.timeStart = tStart; day.timeEnd = tEnd; }
  if (planFormData.hiresPg) onPgTimeChange();
}

function onPgTimeChange() {
  const pgStart = document.getElementById('f-pg-start')?.value;
  const pgEnd   = document.getElementById('f-pg-end')?.value;
  const pgCount = parseInt(document.getElementById('f-pg-count')?.value) || 1;
  const channel = document.getElementById('f-region')?.value || currentUser?.channel || '';

  const hoursPerDay = calcHoursDiff(pgStart, pgEnd);
  if (hoursPerDay <= 0) {
    const rateDisp = document.getElementById('pg-rate-display');
    if (rateDisp) rateDisp.style.display = 'none';
    planFormData._pgHours = 0; planFormData._pgRate = 0; planFormData._pgTotalCost = 0;
    calcCost(); return;
  }

  const days = planFormData.days || [];
  const numDays = Math.max(days.length, 1);
  const firstDateStr = days.length > 0 ? days[0].date : (document.getElementById('f-date-start')?.value || '');
  const hasHoliday   = days.some(d => isHoliday(d.date));
  const holidayDay   = days.find(d => isHoliday(d.date));
  const dateStrForRate = hasHoliday ? holidayDay.date : (firstDateStr || '');

  const { hourlyRate, note, dayType, channel: ch } = getPgRate(hoursPerDay, dateStrForRate, channel);
  const totalPgCost = pgCount * hoursPerDay * hourlyRate * numDays;

  const rateDisp = document.getElementById('pg-rate-display');
  if (rateDisp) rateDisp.style.display = 'block';
  const el = (id) => document.getElementById(id);
  if (el('pg-rate-label')) el('pg-rate-label').textContent = `Đơn giá/giờ/PG (${dayType}${ch ? ' · ' + ch : ''}):`;
  if (el('pg-rate-value')) el('pg-rate-value').textContent = fmtCurrency(hourlyRate) + '/giờ';
  if (el('pg-hours-calc')) el('pg-hours-calc').textContent =
    pgCount + ' PG × ' + hoursPerDay.toFixed(1) + 'h' + (numDays > 1 ? '/ngày × ' + numDays + ' ngày' : '') + ' × ' + fmtCurrency(hourlyRate) + '/giờ';
  if (el('pg-cost-calc'))  el('pg-cost-calc').textContent  = fmtCurrency(totalPgCost) + (numDays > 1 ? ` (${numDays} ngày)` : '');
  if (el('pg-rate-note'))  {
    el('pg-rate-note').textContent   = note + (hasHoliday && numDays > 1 ? ' ⚠️ Có ngày lễ trong kỳ' : '');
    el('pg-rate-note').style.display = note ? 'block' : 'none';
  }
  const dayBadge = el('pg-day-badge');
  if (dayBadge) {
    dayBadge.textContent      = hasHoliday ? 'Có ngày Lễ/Tết' : dayType;
    dayBadge.style.background = hasHoliday ? 'var(--red)' : 'var(--teal)';
    dayBadge.style.display    = 'inline-flex';
  }

  planFormData._pgHours     = hoursPerDay;
  planFormData._pgNumDays   = numDays;
  planFormData._pgRate      = hourlyRate;
  planFormData._pgTotalCost = totalPgCost;
  planFormData._pgStart     = pgStart;
  planFormData._pgEnd       = pgEnd;
  planFormData._pgDayType   = dayType;
  calcCost();
}

  else ps.shifts = [{ start: minToHHmm(s0), end: minToHHmm(s0 + 180) }, { start: '15:00', end: '18:00' }];
  ps.mode = mode;
  renderPgsUI();
}

function calcPgSalesUI() {
  const box = document.getElementById('pgs-calc');
  const c = getCampaignByName(planFormData.campaign);
  if (!c || !c.requiresPgSales || !planFormData.pgSales) {
    planFormData._pgSalesCost = 0;
    if (box) box.innerHTML = '';
    calcCost();
    return;
  }
  const ps = planFormData.pgSales;
  const region = document.getElementById('f-region')?.value || currentUser.channel || 'GT';
  const numDays = Math.max((planFormData.days || []).length, 1);
  const err = validatePgSalesLocal(ps);
  const res = calcPgSalesLocal(ps, numDays, region);
  planFormData._pgSalesCost = res ? res.cost : 0;

  const warns = [];
  if (res) {
    res.shifts.forEach(s => {
      if (s.hours > 0 && s.hours < PGS_MIN_HOURS) warns.push(`Ca ${s.no} chỉ ${s.hours}h → tính tròn ${PGS_MIN_HOURS}h`);
    });
    if (ps.mode === '1ca' && res.shifts[0] && res.shifts[0].billedHours < 6)
      warns.push('Ca liên tục dưới 6 tiếng sẽ tính giá ca ngắn (' + fmtNum(getPgSalesRate(3, region)) + 'đ/giờ). Ca ≥ 6 tiếng mới tính ' + fmtNum(getPgSalesRate(6, region)) + 'đ/giờ.');
    if (ps.mode === '2ca' && res.shifts.some(s => s.billedHours >= 6))
      warns.push('Có ca ≥ 6 tiếng — ca đó tính giá ca dài.');
  }
  const holDays = (planFormData.days || []).filter(d => isHoliday(d.date));
  if (holDays.length) warns.unshift('⛔ Chương trình không áp dụng ngày lễ/Tết: ' + holDays.map(d => fmtDate(d.date)).join(', '));

  if (box) {
    let html = '';
    if (res) {
      html += res.shifts.map(s => `<div class="ln"><span>Ca ${s.no}: ${s.start || '--'}–${s.end || '--'} · ${s.hours}h${s.billedHours !== s.hours ? ' → tính ' + s.billedHours + 'h' : ''}</span>
        <span>${s.billedHours}h × ${fmtNum(s.rate)} = <b>${fmtNum(s.amount)}</b></span></div>`).join('');
      html += `<div class="ln"><span>Mỗi ngày: ${res.count} PG × ${fmtNum(res.perDay / res.count)}đ</span><span><b>${fmtCurrency(res.perDay)}</b></span></div>`;
      html += `<div class="ln tot"><span>Chi phí PG bán hàng${numDays > 1 ? ' (' + numDays + ' ngày)' : ''}</span><span>${fmtCurrency(res.cost)}</span></div>`;
    }
    if (err) html += `<div class="pgs-err">⚠️ ${err}</div>`;
    warns.forEach(w => { html += `<div class="${w.startsWith('⛔') ? 'pgs-err' : 'pgs-warn'}">${w}</div>`; });
    box.innerHTML = html;
  }
  calcCost();
}

function selectSupervisor(el, code, encodedName) {
  document.querySelectorAll('#supervisor-chips .chip-option').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  planFormData.supervisorCode = code;
  try { planFormData.supervisorName = decodeURIComponent(encodedName); }
  catch(e) { planFormData.supervisorName = encodedName; }
}

function toggleExecutor(el, code) {
  el.classList.toggle('selected');
  if (el.classList.contains('selected')) {
    if (!planFormData.executors.includes(code)) planFormData.executors.push(code);
  } else {
    planFormData.executors = planFormData.executors.filter(c => c !== code);
  }
}

function toggleProduct(ma) {
  const check = document.querySelector(`#prod-${ma} .product-check`);
  const qtyWrap = document.getElementById(`qty-wrap-${ma}`);
  if (!check || !qtyWrap) return;
  const isChecked = check.classList.toggle('checked');
  qtyWrap.style.display = isChecked ? 'block' : 'none';
  if (isChecked) {
    document.getElementById(`qty-${ma}`).value = 1;
    planFormData.samples = planFormData.samples.filter(s => s.ma !== ma);
    planFormData.samples.push({ ma, so_luong: 1 });
  } else {
    planFormData.samples = planFormData.samples.filter(s => s.ma !== ma);
    document.getElementById(`qty-${ma}`).value = '';
  }
  calcCost();
  refreshDishSampleOptions();
}

function updateSample(ma) {
  const qty = parseInt(document.getElementById(`qty-${ma}`).value) || 1;
  const idx = planFormData.samples.findIndex(s => s.ma === ma);
  if (idx >= 0) planFormData.samples[idx].so_luong = qty;
}

function addDish(initial) {
  const el = document.getElementById('dishes-list');
  const idx = planFormData.dishes.length;
  planFormData.dishes.push({ ten: (initial && initial.ten) || '', tu_mau: (initial && initial.tu_mau) || '' });
  const div = document.createElement('div');
  div.setAttribute('data-dish', '1');
  div.style.cssText = 'display:flex;flex-direction:column;gap:5px;border:1px solid var(--gray3);border-radius:8px;padding:8px;background:#fafbfc;';
  div.innerHTML = `
    <div style="display:flex;gap:6px;align-items:center;">
      <input class="form-input" type="text" placeholder="Tên món ăn..." style="flex:1;" value="${(initial && initial.ten) ? escHtml(initial.ten) : ''}"
        oninput="planFormData.dishes[${idx}].ten = this.value">
      <button class="btn btn-secondary btn-sm" style="width:36px;padding:0;font-size:18px;" onclick="removeDish(this, ${idx})">×</button>
    </div>
    <select class="form-input dish-sample-select" data-dish-idx="${idx}" style="font-size:12px;padding:6px 10px;"
      onchange="planFormData.dishes[${idx}].tu_mau = this.value">
      ${_dishSampleOptions((initial && initial.tu_mau) || '')}
    </select>`;
  el.appendChild(div);
}

function removeDish(btn, idx) {
  const row = btn.closest('div[data-dish]');
  if (row) row.remove();
  if (planFormData.dishes[idx]) planFormData.dishes[idx]._removed = true;
}

function _dishSampleOptions(selected) {
  const opts = ['<option value="">— Chọn SP mẫu cho món này —</option>'];
  (planFormData.samples || []).forEach(s => {
    const prod = masterData.products.find(p => p.ma === s.ma);
    const name = prod ? prod.ten : s.ma;
    opts.push(`<option value="${s.ma}" ${String(selected) === String(s.ma) ? 'selected' : ''}>${escHtml(name)}</option>`);
  });
  if ((planFormData.samples || []).length === 0)
    opts.push('<option value="" disabled>(Chưa chọn sản phẩm mẫu nào)</option>');
  return opts.join('');
}

function refreshDishSampleOptions() {
  document.querySelectorAll('.dish-sample-select').forEach(sel => {
    const i = Number(sel.getAttribute('data-dish-idx'));
    let cur = (planFormData.dishes[i] && planFormData.dishes[i].tu_mau) || '';
    if (cur && !(planFormData.samples || []).some(s => String(s.ma) === String(cur))) {
      cur = '';
      if (planFormData.dishes[i]) planFormData.dishes[i].tu_mau = '';
    }
    sel.innerHTML = _dishSampleOptions(cur);
  });
}

function toggleServingMethod(method) {
  planFormData.servingMethods = planFormData.servingMethods || [];
  const i = planFormData.servingMethods.indexOf(method);
  if (i >= 0) planFormData.servingMethods.splice(i, 1);
  else        planFormData.servingMethods.push(method);
  const tog = document.getElementById('toggle-serve-' + method);
  if (tog) tog.classList.toggle('on', planFormData.servingMethods.includes(method));
  const df = document.getElementById('dishes-field');
  if (df) df.style.display = planFormData.servingMethods.includes('nau') ? 'block' : 'none';
  const kn = document.getElementById('khui-note');
  if (kn) kn.style.display = (planFormData.servingMethods.includes('khui') && !planFormData.servingMethods.includes('nau')) ? 'block' : 'none';
}

function applyServingMethodsUI() {
  const methods = planFormData.servingMethods || [];
  ['nau','khui'].forEach(m => {
    const tog = document.getElementById('toggle-serve-' + m);
    if (tog) tog.classList.toggle('on', methods.includes(m));
  });
  const df = document.getElementById('dishes-field');
  if (df) df.style.display = methods.includes('nau') ? 'block' : 'none';
  const kn = document.getElementById('khui-note');
  if (kn) kn.style.display = (methods.includes('khui') && !methods.includes('nau')) ? 'block' : 'none';
  const list = document.getElementById('dishes-list');
  if (list && Array.isArray(planFormData.dishes) && planFormData.dishes.length) {
    const saved = planFormData.dishes.slice();
    planFormData.dishes = [];
    list.innerHTML = '';
    saved.forEach(d => addDish(d));
  }
}

function togglePg() {
  const tog = document.getElementById('toggle-pg');
  planFormData.hiresPg = !planFormData.hiresPg;
  tog.classList.toggle('on', planFormData.hiresPg);
  const fields = document.getElementById('pg-fields');
  fields.style.display = planFormData.hiresPg ? 'flex' : 'none';
  if (planFormData.hiresPg) {
    const days = planFormData.days || [];
    const sampStart = days.length > 0 ? (days[0].timeStart || '09:00') : '09:00';
    const sampEnd   = days.length > 0 ? (days[0].timeEnd   || '12:00') : '12:00';
    const pgStartEl = document.getElementById('f-pg-start');
    const pgEndEl   = document.getElementById('f-pg-end');
    if (pgStartEl) pgStartEl.value = sampStart;
    if (pgEndEl)   pgEndEl.value   = sampEnd;
    const cnt = document.getElementById('f-pg-count');
    if (cnt && !cnt.value) cnt.value = 1;
    onPgTimeChange();
  }
  calcCost();
}

function updateLocationName(val) {
  const el = document.getElementById('f-location-name');
  if (el && val) el.value = val;
}

function calcCost() {
  const pgCost  = planFormData.hiresPg ? (planFormData._pgTotalCost || 0) : 0;
  const c       = getCampaignByName(planFormData.campaign);
  const pgsCost = (c && c.requiresPgSales) ? (planFormData._pgSalesCost || 0) : 0;
  const locCost = parseFloat(document.getElementById('f-location-cost')?.value) || 0;
  const giftQty = planFormData.hasGift ? (parseInt(document.getElementById('f-gift-qty')?.value) || 0) : 0;
  const giftVal2= planFormData.hasGift ? (parseFloat(document.getElementById('f-gift-value')?.value) || 0) : 0;
  const giftVal = giftQty * giftVal2;
  const total   = pgCost + pgsCost + locCost + giftVal;
  const set = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = fmtCurrency(val); };
  set('cs-pg', pgCost); set('cs-pgs', pgsCost); set('cs-loc', locCost); set('cs-gift', giftVal); set('cs-total', total);
  const row = document.getElementById('cs-pgs-row');
  if (row) row.style.display = (c && c.requiresPgSales) ? 'flex' : 'none';
}

async function submitPlan() {
  const btn = document.getElementById('btn-submit-plan');
  const btnLabel = currentPlanId ? '📋 Gửi cập nhật để duyệt lại' : '📤 Gửi kế hoạch để duyệt';
  const camp = getCampaignByName(planFormData.campaign);

  const data = {
    campaign:      camp ? camp.name : '',
    locationName:  document.getElementById('f-location-name')?.value?.trim() || planFormData._locationName || '',
    region:        document.getElementById('f-region')?.value?.trim(),
    date:          planFormData.days?.length > 0 ? planFormData.days[0].date : '',
    dateEnd:       planFormData.days?.length > 1 ? planFormData.days[planFormData.days.length-1].date : null,
    days:          planFormData.days?.length > 0 ? planFormData.days : null,
    timeStart:     planFormData.days?.length > 0 ? planFormData.days[0].timeStart : '',
    timeEnd:       planFormData.days?.length > 0 ? planFormData.days[0].timeEnd : '',
    executors:     planFormData.executors,
    supervisor:    planFormData.supervisorName || '',
    supervisorCode: planFormData.supervisorCode || '',
    hiresPg:       planFormData.hiresPg,
    pgCount:       planFormData.hiresPg ? (parseInt(document.getElementById('f-pg-count')?.value) || 0) : 0,
    pgHours:       planFormData.hiresPg ? (planFormData._pgHours || 0) : 0,
    pgNumDays:     planFormData._pgNumDays || Math.max((planFormData.days||[]).length, 1),
    pgStart:       planFormData._pgStart     || '',
    pgEnd:         planFormData._pgEnd       || '',
    pgRate:        planFormData._pgRate      || 0,
    pgTotalCost:   planFormData.hiresPg ? (planFormData._pgTotalCost || 0) : 0,
    pgDayType:     planFormData._pgDayType   || 'Ngày thường',
    pgNote:        document.getElementById('f-pg-note')?.value?.trim(),
    pgSales:       (camp && camp.requiresPgSales && planFormData.pgSales) ? {
                     count: planFormData.pgSales.count,
                     mode:  planFormData.pgSales.mode,
                     shifts: planFormData.pgSales.shifts.slice(0, planFormData.pgSales.mode === '2ca' ? 2 : 1),
                   } : null,
    locationCost:  parseFloat(document.getElementById('f-location-cost')?.value) || 0,
    costType:      document.getElementById('f-cost-type')?.value,
    hasInvoice:    planFormData.hasInvoice,
    costNote:      document.getElementById('f-cost-note')?.value?.trim(),
    hasPromo:      planFormData.hasPromo,
    postType:      document.getElementById('f-post-type')?.value,
    hasKiosk:      planFormData.hasKiosk,
    boothType:     document.getElementById('f-booth-type')?.value,
    samples:       planFormData.samples,
    servingMethods: planFormData.servingMethods || [],
    dishes:        (planFormData.servingMethods || []).includes('nau')
                     ? (planFormData.dishes || []).filter(d => d && !d._removed && String(d.ten||'').trim())
                         .map(d => ({ ten: String(d.ten).trim(), tu_mau: d.tu_mau || '' }))
                     : [],
    hasGift:       planFormData.hasGift,
    gifts:         planFormData.hasGift ? [{
      so_luong:  parseInt(document.getElementById('f-gift-qty')?.value) || 0,
      gia_tri:   parseFloat(document.getElementById('f-gift-value')?.value) || 0,
      muc_dich:  document.getElementById('f-gift-purpose')?.value?.trim() || '',
      ghi_chu:   document.getElementById('f-gift-note')?.value?.trim() || '',
    }] : [],
    purpose:       document.getElementById('f-purpose')?.value?.trim(),
    estTasters:    parseInt(document.getElementById('f-est-tasters')?.value) || 0,
    estSales:      parseFloat(document.getElementById('f-est-sales')?.value) || 0,
    notes:         document.getElementById('f-notes')?.value?.trim(),
  };

  // ── Kiểm tra trước khi gửi ──
  if (!data.servingMethods.length) { showToast('Vui lòng chọn hình thức dùng thử (Nấu hoặc Khui nắp)', 'error'); return; }
  if (camp) {
    if (camp.channel && !String(data.region || '').toUpperCase().startsWith(camp.channel)) {
      showToast(`"${camp.name}" chỉ áp dụng kênh ${camp.channel}`, 'error'); return;
    }
    const hol = (planFormData.days || []).find(d => isHoliday(d.date));
    if (hol) { showToast(`"${camp.name}" không áp dụng ngày lễ/Tết (${fmtDate(hol.date)})`, 'error'); return; }
    if (camp.requiresPgSales) {
      const e = validatePgSalesLocal(data.pgSales);
      if (e) { showToast(e, 'error'); return; }
    }
  }

  btn.disabled = true; btn.textContent = '⏳ Đang gửi...';
  loading(true, 'Đang lưu kế hoạch...');
  try {
    const action = currentPlanId ? 'updatePlan' : 'createPlan';
    const res = await api('POST', { action, data, userCode: currentUser.code, planId: currentPlanId });
    if (res.success) {
      if (currentPlanId && window._planCache) delete window._planCache[currentPlanId];
      showToast(res.message || 'Thành công!', 'success', 4000);
      showScreen('plans');
      loadMyPlans();
    } else {
      showToast(res.error || 'Có lỗi xảy ra', 'error', 5000);
    }
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { btn.disabled = false; btn.textContent = btnLabel; loading(false); }
}

async function initReport(planId) {
  currentPlanId = planId;
  if (!window._planCache) window._planCache = {};
  let plan = window._planCache[planId];
  if (!plan || !Array.isArray(plan.reports)) {
    loading(true, 'Đang tải kế hoạch...');
    try {
      const res = await api('GET', { action: 'getPlanDetail', planId });
      if (res.success) { plan = res.data; window._planCache[planId] = plan; }
    } catch (e) {}
    finally { loading(false); }
  }
  plan = plan || { id: planId };

  const hasSales = !!(plan.pgSales && plan.pgSales.count > 0);
  const camp = getCampaignByName(plan.campaign);
  reportFormData = {
    imgLocation:[], imgFood:[], imgOverview:[], imgOther:[], imgCart:[],
    samplesUsed:[], markCompleted: false, salesShifts: [],
    _hasSales: hasSales, _plan: plan,
    _unitPrice: (camp && camp.unitPrice) || 10000, _unitLabel: (camp && camp.unitLabel) || 'bịch',
  };
  const locLabel = plan.locationName ? `${plan.locationName} · ${fmtDate(plan.date)}` : planId;
  document.getElementById('report-plan-id').textContent = locLabel;

  const myPrev = (plan.reports || []).filter(r => String(r.reporter) === String(currentUser.code));
  const isFirstReport = myPrev.length === 0;

  renderReportForm(planId, isFirstReport, plan, hasSales);
  showScreen('report');
}

/** v2.10: vẽ thẻ nhập cho từng ca của ngày đang chọn; ca đã có người báo cáo thì khóa lại. */
function renderSaleCards() {
  const R = reportFormData, el = document.getElementById('rs-cards');
  if (!el) return;
  const unit = R._unitLabel;
  R.salesShifts = R._planShifts.map(s => {
    const done = R._reported[R._salesDay + '|' + s.no];
    return Object.assign({}, s, { pgCount: R._pgCount, carts: R._pgCount, knocked: '', reached: '', buyers: '', packs: '', locked: done || null });
  });
  el.innerHTML = R.salesShifts.map((s, i) => {
    const head = `<div class="sale-card-h"><span>Ca ${s.no}</span><span style="font-weight:600;color:var(--gray2);">${s.start}–${s.end} · ${R._pgCount} PG duyệt</span></div>`;
    if (s.locked) {
      const x = s.locked.s;
      return `<div class="sale-card locked">${head}
        <div class="sale-lock">✅ Đã được ${escHtml(s.locked.name)} báo cáo</div>
        <div style="font-size:12px;color:var(--gray);margin-top:4px;">Gõ cửa ${fmtNum(x.knocked || 0)} · Mở cửa ${fmtNum(x.reached)} · Mua ${fmtNum(x.buyers)} · ${fmtNum(x.packs)} ${unit}</div>
      </div>`;
    }
    const f = (field, label, req, val) => `<div class="form-field"><label class="${req ? 'required' : ''}">${label}</label>
      <input class="form-input" type="number" min="0" inputmode="numeric" placeholder="0" value="${val}" oninput="onSaleInput(${i},'${field}',this.value)"></div>`;
    return `<div class="sale-card">${head}
      <div class="sale-grid">
        ${f('pgCount', 'Số PG thực tế', false, s.pgCount)}
        ${f('carts', 'Số xe đẩy', false, s.carts)}
        ${f('knocked', 'Hộ đã gõ cửa', true, '')}
        ${f('reached', 'Hộ mở cửa nghe (tờ rơi)', true, '')}
        ${f('buyers', 'Người mua (góc xé)', false, '')}
        ${f('packs', 'Số ' + unit + ' đã bán', false, '')}
        <div class="sale-rev" id="rs-rev-${i}">Doanh số: <b>0 đ</b></div>
      </div>
    </div>`;
  }).join('');
  updateSaleTotals();
}

function onSaleInput(i, field, val) {
  const s = reportFormData.salesShifts[i];
  if (!s || s.locked) return;
  s[field] = val === '' ? '' : Math.max(Math.floor(Number(val) || 0), 0);
  if (field === 'packs') {
    const el = document.getElementById('rs-rev-' + i);
    if (el) el.innerHTML = 'Doanh số: <b>' + fmtCurrency((Number(s.packs) || 0) * reportFormData._unitPrice) + '</b>';
  }
  updateSaleTotals();
}

/** Ca đã nhập số liệu (chưa khóa). */
function filledSaleShifts() {
  return (reportFormData.salesShifts || []).filter(s => !s.locked &&
    ((Number(s.knocked) || 0) > 0 || (Number(s.reached) || 0) > 0 || (Number(s.packs) || 0) > 0 || (Number(s.buyers) || 0) > 0));
}

function updateSaleTotals() {
  const el = document.getElementById('rs-total');
  if (!el) return;
  const R = reportFormData, K = campaignKpi(getCampaignByName(R._plan && R._plan.campaign));
  const list = filledSaleShifts();
  const t = list.reduce((a, s) => {
    a.kn += Number(s.knocked) || 0; a.rc += Number(s.reached) || 0; a.by += Number(s.buyers) || 0;
    a.pk += Number(s.packs) || 0; a.xe += (s.carts === '' ? 0 : Number(s.carts) || 0); return a;
  }, { kn: 0, rc: 0, by: 0, pk: 0, xe: 0 });
  if (!list.length) { el.innerHTML = '<div class="ln"><span>Chưa nhập số liệu ca nào</span></div>'; return; }
  const per = t.xe ? t.kn / t.xe : null, open = t.kn ? t.rc / t.kn : null, conv = t.rc ? t.by / t.rc : null;
  const tag = (v, mn, mx) => { const st = kpiStatus(v, mn, mx); return st === 'low' ? ' <span class="lo">▼ dưới KPI</span>' : (st === 'na' ? '' : ' <span class="ok">✓ đạt</span>'); };
  const errs = [];
  list.forEach(s => {
    const kn = Number(s.knocked) || 0, rc = Number(s.reached) || 0, by = Number(s.buyers) || 0, pk = Number(s.packs) || 0;
    if (!kn) errs.push(`Ca ${s.no}: chưa nhập số hộ gõ cửa`);
    if (rc > kn) errs.push(`Ca ${s.no}: mở cửa nghe lớn hơn gõ cửa`);
    if (by > rc) errs.push(`Ca ${s.no}: người mua lớn hơn mở cửa nghe`);
    if (pk < by) errs.push(`Ca ${s.no}: số ${R._unitLabel} ít hơn số người mua`);
  });
  el.innerHTML = `
    <div class="ln"><span>Hộ gõ cửa / xe / ca (KPI ${K.reachMin}–${K.reachMax})</span><b>${per == null ? '—' : Math.round(per)}${tag(per, K.reachMin, K.reachMax)}</b></div>
    <div class="ln"><span>Tỷ lệ mở cửa nghe (KPI ${Math.round(K.openMin*100)}–${Math.round(K.openMax*100)}%)</span><b>${open == null ? '—' : Math.round(open * 100) + '%'}${tag(open, K.openMin, K.openMax)}</b></div>
    <div class="ln"><span>Tỷ lệ chuyển đổi mua (KPI ${Math.round(K.convMin*100)}–${Math.round(K.convMax*100)}%)</span><b>${conv == null ? '—' : Math.round(conv * 100) + '%'}${tag(conv, K.convMin, K.convMax)}</b></div>
    <div class="ln"><span>Tổng ${R._unitLabel} bán · doanh số</span><b>${fmtNum(t.pk)} · ${fmtCurrency(t.pk * R._unitPrice)}</b></div>
    ${errs.length ? `<div style="margin-top:6px;color:#ffe140;font-weight:700;">⚠️ ${errs.join('<br>⚠️ ')}</div>` : ''}`;
}

async function loadApprovedSamplesForReport(planId) {
  try {
    const res = await api('GET', { action:'getPlanDetail', planId });
    const el = document.getElementById('samples-used-list');
    if (!res.success || !el) return;
    const p = res.data;
    const approvedSamples = (p.approval && p.approval.samples && p.approval.samples.length > 0)
      ? p.approval.samples : p.samples;
    if (!approvedSamples || approvedSamples.length === 0) {
      el.innerHTML = '<div class="small text-gray">Không có thông tin mẫu được duyệt</div>'; return;
    }
    reportFormData.samplesUsed = approvedSamples.map(s => ({ ma: s.ma, so_luong: Number(s.so_luong) || 0 }));
    el.innerHTML = approvedSamples.map((s, i) => {
      const prod = masterData.products.find(p => p.ma === s.ma);
      return `<div class="product-item">
        <div class="product-info">
          <div class="product-name">${escHtml(prod ? prod.ten : s.ma)}</div>
          <div class="product-price">Được duyệt: ${s.so_luong} lon/gói</div>
        </div>
        <div style="width:90px;">
          <input class="form-input" type="number" min="0" placeholder="0"
            value="${s.so_luong}" style="text-align:center;padding:8px 6px;"
            oninput="reportFormData.samplesUsed[${i}].so_luong=+this.value">
        </div>
      </div>`;
    }).join('');
  } catch(e) {}
}

const IMG_MAX = { imgLocation: 10, imgFood: 20, imgOverview: 20, imgOther: 40, imgCart: 20 };

async function handleImageSelect(event, key, maxAdd) {
  const files = Array.from(event.target.files);
  if (!files.length) return;
  const current   = reportFormData[key].length;
  const remaining = maxAdd - current;
  if (remaining <= 0) {
    showToast(`Đã đạt tối đa ${maxAdd} ảnh cho mục này`, 'error');
    event.target.value = '';
    return;
  }
  const toProcess = files.slice(0, remaining);
  const countEl   = document.getElementById(`count-${key}`);
  const previewEl = document.getElementById(`preview-${key}`);
  const processingEl = document.createElement('div');
  processingEl.style.cssText = 'font-size:11px;color:var(--gray2);padding:4px 0;grid-column:1/-1;';
  processingEl.textContent   = `⏳ Đang xử lý ${toProcess.length} ảnh...`;
  previewEl.appendChild(processingEl);

  for (const file of toProcess) {
    const compressed = await compressImage(file, TARGET_IMG_KB);
    const item = document.createElement('div');
    item.className = 'img-preview-item';
    const entry = { dataUrl: compressed.dataUrl, name: file.name, size: compressed.size };
    reportFormData[key].push(entry);
    item.innerHTML = `
      <img src="${compressed.dataUrl}" style="width:100%;height:72px;object-fit:cover;border-radius:6px;display:block;">
      <div class="img-remove">×</div>`;
    item.querySelector('.img-remove').onclick = () => removeImage(key, entry, item);
    previewEl.insertBefore(item, processingEl);
  }
  processingEl.remove();

  const total = reportFormData[key].length;
  if (countEl) countEl.textContent = `${total} / ${maxAdd} ảnh`;
  event.target.value = '';
  if (files.length > remaining) showToast(`Chỉ thêm được ${remaining} ảnh nữa (tối đa ${maxAdd})`, 'error');
  const textEl = document.getElementById(`upload-text-${key}`);
  if (textEl) textEl.textContent = total >= maxAdd ? `Đã đủ ${maxAdd} ảnh` : `Thêm ảnh (${total}/${maxAdd})`;
}

  if (textEl) textEl.textContent = total > 0 ? `Thêm ảnh (${total}/${maxAdd})` : 'Chụp / Chọn từ thư viện';
}

function compressImage(file, targetKB) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const maxDim = 1280;
        if (w > maxDim || h > maxDim) {
          const ratio = Math.min(maxDim/w, maxDim/h);
          w = Math.round(w * ratio); h = Math.round(h * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        let quality = 0.85;
        const tryCompress = () => {
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          const sizeKB = Math.round((dataUrl.length * 3) / 4 / 1024);
          if (sizeKB <= targetKB || quality <= 0.3) resolve({ dataUrl, size: sizeKB });
          else { quality -= 0.1; tryCompress(); }
        };
        tryCompress();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function submitReport() {
  const btn = document.getElementById('btn-submit-report');
  const R = reportFormData;
  const isFirst = R._isFirstReport !== false;
  const hasSales = !!R._hasSales;
  const actualTasters = parseInt(document.getElementById('r-tasters')?.value) || 0;
  const shifts = hasSales ? filledSaleShifts().map(s => ({
    no: s.no, day: R._salesDay || '', start: s.start, end: s.end,
    pgCount: Number(s.pgCount) || 0, carts: s.carts === '' ? '' : Number(s.carts) || 0,
    knocked: Number(s.knocked) || 0, reached: Number(s.reached) || 0, buyers: Number(s.buyers) || 0,
    packs: Number(s.packs) || 0,
  })) : [];

  if (isFirst) {
    if (R.imgLocation.length === 0) { showToast('Bắt buộc có hình tên địa điểm', 'error'); return; }
    if (R.imgOverview.length === 0) { showToast('Bắt buộc có hình toàn cảnh', 'error'); return; }
    if (hasSales) {
      if (R.imgCart.length === 0) { showToast('Bắt buộc có hình xe đẩy / PG bán hàng', 'error'); return; }
      if (!shifts.length && !actualTasters) { showToast('Vui lòng nhập số liệu ít nhất 1 ca bán hàng', 'error'); return; }
    } else {
      if (R.imgFood.length === 0) { showToast('Bắt buộc có hình món ăn', 'error'); return; }
      if (!actualTasters) { showToast('Vui lòng nhập số người thử', 'error'); return; }
    }
  } else {
    const anyImg = ['imgLocation','imgFood','imgOverview','imgOther','imgCart'].some(k => R[k].length > 0);
    if (!anyImg && !actualTasters && !shifts.length) {
      showToast('Vui lòng nhập ít nhất số người thử, số liệu bán hàng hoặc 1 hình ảnh', 'error'); return;
    }
  }
  for (const s of shifts) {
    if (!(s.knocked > 0))      { showToast(`Ca ${s.no}: vui lòng nhập số hộ đã gõ cửa`, 'error'); return; }
    if (s.reached > s.knocked) { showToast(`Ca ${s.no}: hộ mở cửa nghe không được lớn hơn hộ gõ cửa`, 'error'); return; }
    if (s.buyers > s.reached)  { showToast(`Ca ${s.no}: người mua không được lớn hơn hộ mở cửa nghe`, 'error'); return; }
    if (s.packs < s.buyers)    { showToast(`Ca ${s.no}: số ${R._unitLabel} không được ít hơn số người mua`, 'error'); return; }
  }

  btn.disabled = true;
  btn.textContent = '⏳ Đang gửi...';

  const groups = ['imgLocation','imgFood','imgOverview','imgOther','imgCart'];
  const totalImgCount = groups.reduce((s, k) => s + R[k].length, 0);
  let imgFolderUrl = '';
  const urls = { imgLocation: [], imgFood: [], imgOverview: [], imgOther: [], imgCart: [] };

  if (totalImgCount > 0) {
    loading(true, `📤 Đang tải ${totalImgCount} ảnh lên Drive...`);
    try {
      const images = {};
      groups.forEach(k => { images[k] = R[k].map(i => ({ name: i.name, dataUrl: i.dataUrl })); });
      const uploadRes = await api('POST', { action: 'uploadReportImages', planId: currentPlanId, userCode: currentUser.code, images });
      if (uploadRes.success && uploadRes.folders) {
        imgFolderUrl = uploadRes.folders.root || '';
        groups.forEach(k => { urls[k] = uploadRes.folders[k] || []; });
        const uploaded = uploadRes.uploaded || 0, total = uploadRes.total || totalImgCount;
        if (uploaded < total) showToast(`⚠️ Chỉ tải được ${uploaded}/${total} ảnh lên Drive. Báo cáo vẫn được ghi nhận.`, 'error', 6000);
      } else {
        loading(false); btn.disabled = false; btn.textContent = '📊 Gửi báo cáo';
        showToast(`❌ Upload ảnh thất bại: ${uploadRes.error || 'Lỗi không xác định'}\nVui lòng thử lại.`, 'error', 8000);
        return;
      }
    } catch(e) {
      loading(false); btn.disabled = false; btn.textContent = '📊 Gửi báo cáo';
      showToast('❌ Lỗi kết nối khi upload ảnh. Vui lòng kiểm tra mạng và thử lại.', 'error', 8000);
      return;
    }
  }

  loading(true, '📊 Đang lưu báo cáo...');
  const data = {
    actualTasters: actualTasters,
    actualSales:   parseFloat(document.getElementById('r-sales')?.value) || 0,
    feedback:      document.getElementById('r-feedback')?.value?.trim(),
    notes:         document.getElementById('r-notes')?.value?.trim(),
    samplesUsed:   R.samplesUsed,
    markCompleted: R.markCompleted,
    salesShifts:   hasSales ? shifts : [],
    imgLocation:   urls.imgLocation,
    imgFood:       urls.imgFood,
    imgOverview:   urls.imgOverview,
    imgOther:      urls.imgOther,
    imgCart:       urls.imgCart,
    imgFolderUrl:  imgFolderUrl,
  };
  try {
    let res = await api('POST', { action:'submitReport', planId: currentPlanId, data, userCode: currentUser.code });
    if (!res.success && res.requiresReason) {
      const reason = prompt(res.error + '\n\nNhập lý do vượt mẫu:');
      if (reason) {
        data.overuseReason = reason;
        res = await api('POST', { action:'submitReport', planId: currentPlanId, data, userCode: currentUser.code });
      }
    }
    if (res.success) {
      if (window._planCache) delete window._planCache[currentPlanId];
      showToast('Báo cáo đã được ghi nhận! 🎉', 'success', 4000);
      showScreen('plans');
      loadMyPlans();
    } else {
      showToast(res.error || 'Có lỗi xảy ra', 'error', 6000);
    }
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { btn.disabled = false; btn.textContent = '📊 Gửi báo cáo'; loading(false); }
}

async function renderCalendar() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const monthStr = `${y}-${String(m+1).padStart(2,'0')}`;
  document.getElementById('cal-month-label').textContent = `${String(m+1).padStart(2,'0')}/${y}`;

  const el = document.getElementById('calendar-content');
  el.innerHTML = '<div class="empty-state"><div class="ai-loader"></div><div class="empty-sub">Đang tải lịch...</div></div>';

  try {
    const res = await api('GET', { action:'getCalendar', userCode: currentUser.code, month: monthStr });
    calendarData = {};
    if (res.success && res.data) {
      Object.entries(res.data).forEach(([key, plans]) => {
        let normKey = key.trim();
        if (/^\d{2}\/\d{2}\/\d{4}/.test(normKey)) {
          const parts = normKey.substring(0,10).split('/');
          normKey = `${parts[2]}-${parts[1]}-${parts[0]}`;
        }
        normKey = normKey.substring(0, 10);
        calendarData[normKey] = (calendarData[normKey] || []).concat(plans);
      });
    }
  } catch(e) { console.error('[Calendar] Load error:', e); calendarData = {}; }

  const today       = new Date(); today.setHours(0,0,0,0);
  const firstDay    = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const adjustedFirst = (firstDay + 6) % 7;

  const getCalClass = (plans) => {
    if (!plans || plans.length === 0) return '';
    const statuses = plans.map(p => p.status);
    if (statuses.every(s => s === 'hoan_thanh')) return 'has-plan done';
    if (statuses.some(s => s === 'da_duyet'))    return 'has-plan approved';
    if (statuses.some(s => s === 'cho_duyet'))   return 'has-plan pending';
    if (statuses.some(s => s === 'yeu_cau_chinh_sua')) return 'has-plan needs-edit';
    return 'has-plan';
  };

  let html = `<div class="cal-grid">
    ${['T2','T3','T4','T5','T6','T7','CN'].map(d => `<div class="cal-day-label">${d}</div>`).join('')}
    ${Array(adjustedFirst).fill('<div class="cal-day empty"></div>').join('')}`;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${monthStr}-${String(d).padStart(2,'0')}`;
    const plans   = calendarData[dateStr] || [];
    const isToday = new Date(y,m,d).getTime() === today.getTime();
    const hasPlan = plans.length > 0;
    const calCls  = isToday ? 'today' : getCalClass(plans);
    html += `<div class="cal-day ${calCls}" onclick="showCalDay('${dateStr}',${d})">
      <span>${d}</span>
      ${hasPlan ? `<div class="cal-dot"></div>` : ''}
      ${hasPlan && plans.length > 1 ? `<div style="font-size:8px;opacity:0.8;">${plans.length}</div>` : ''}
    </div>`;
  }
  html += '</div>';

  html += `<div style="padding:8px 16px 4px;font-size:11px;font-weight:700;color:var(--gray2);text-transform:uppercase;">Chú thích</div>
  <div style="display:flex;gap:8px;padding:0 16px 16px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;"><div style="width:12px;height:12px;border-radius:3px;background:var(--navy);"></div>Hôm nay</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;"><div style="width:12px;height:12px;border-radius:3px;background:#fff3cd;border:1px solid #856404;"></div>Chờ duyệt</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;"><div style="width:12px;height:12px;border-radius:3px;background:#d1e8ff;border:1px solid var(--teal);"></div>Đã duyệt</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;"><div style="width:12px;height:12px;border-radius:3px;background:#d1f2eb;border:1px solid var(--green);"></div>Hoàn thành</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;"><div style="width:12px;height:12px;border-radius:3px;background:#fff0e6;border:1px solid #c96a00;"></div>Cần chỉnh sửa</div>
  </div>`;
  el.innerHTML = html;
}

function fmtTime(t) {
  if (!t) return '—';
  const s = String(t).trim();
  const hm = s.match(/^(\d{1,2}):(\d{2})/);
  if (hm) return ('0' + hm[1]).slice(-2) + ':' + hm[2];
  const iso = s.match(/T(\d{1,2}):(\d{2})/);
  if (iso) return ('0' + iso[1]).slice(-2) + ':' + iso[2];
  return s.substring(0, 5);
}

function computePersonalStats(plans) {
  const stats = {
    total: plans.length,
    done:      plans.filter(p => p.status === 'hoan_thanh').length,
    approved:  plans.filter(p => p.status === 'da_duyet').length,
    pending:   plans.filter(p => p.status === 'cho_duyet').length,
    needsEdit: plans.filter(p => p.status === 'yeu_cau_chinh_sua').length,
    rejected:  plans.filter(p => p.status === 'tu_choi').length,
    locations: new Set(plans.map(p => p.locationName)).size,
    totalCost: 0, pgCost: 0, pgSalesCost: 0, locationCost: 0, giftCost: 0,
    totalTasters: 0, totalSales: 0, reportCount: 0,
    totalReached: 0, totalBuyers: 0, totalPacks: 0, campaignSales: 0,
    byLocation: {}, byMonth: {},
  };
  const active = ['da_duyet', 'hoan_thanh'];

  plans.forEach(p => {
    const month = String(p.date || '').substring(0, 7);
    if (!stats.byMonth[month]) stats.byMonth[month] = { month, events:0, done:0, tasters:0, sales:0, cost:0 };
    stats.byMonth[month].events++;
    if (p.status === 'hoan_thanh') stats.byMonth[month].done++;

    const isActive = active.includes(p.status);
    const pCost  = isActive ? (Number(p.pgCost) || 0) : 0;
    const psCost = isActive ? (Number(p.pgSalesCost) || 0) : 0;
    const lCost  = isActive ? (Number(p.locationCost) || 0) : 0;
    const gCost  = isActive ? (p.gifts||[]).reduce((s,g)=>(s+(Number(g.so_luong||0)*Number(g.gia_tri||0))),0) : 0;
    const totC   = pCost + psCost + lCost + gCost;
    stats.pgCost += pCost; stats.pgSalesCost += psCost; stats.locationCost += lCost; stats.giftCost += gCost;
    stats.totalCost += totC;
    stats.byMonth[month].cost += totC;

    const loc = p.locationName || '—';
    if (!stats.byLocation[loc]) stats.byLocation[loc] = { name:loc, events:0, tasters:0, sales:0, cost:0 };
    stats.byLocation[loc].events++;
    stats.byLocation[loc].cost += totC;

    (p.reports || []).forEach(r => {
      const t = Number(r.actualTasters) || 0;
      const s = (Number(r.actualSales) || 0) + (Number(r.campaignSales) || 0);
      stats.totalTasters += t; stats.totalSales += s; stats.reportCount++;
      stats.totalReached += Number(r.reached) || 0;
      stats.totalBuyers  += Number(r.buyers) || 0;
      stats.totalPacks   += Number(r.packsSold) || 0;
      stats.campaignSales += Number(r.campaignSales) || 0;
      stats.byMonth[month].tasters += t + (Number(r.reached) || 0);
      stats.byMonth[month].sales   += s;
      stats.byLocation[loc].tasters += t + (Number(r.reached) || 0);
      stats.byLocation[loc].sales   += s;
    });
  });

  stats.sortedMonths = Object.values(stats.byMonth).sort((a,b)=>a.month.localeCompare(b.month));
  stats.topLocations = Object.values(stats.byLocation).sort((a,b)=>b.tasters-a.tasters).slice(0, 8);
  const contacts = stats.totalTasters + stats.totalReached;
  stats.avgTasters = stats.done > 0 ? Math.round(contacts / Math.max(stats.reportCount, stats.done)) : 0;
  stats.cpContact  = contacts > 0 ? Math.round(stats.totalCost / contacts) : 0;
  stats.contacts   = contacts;
  return stats;
}

      </div>
      ${loc.tasters > 0 ? `<div style="margin-left:24px;"><div class="bar-track" style="height:6px;"><div class="bar-fill" style="width:${Math.round((loc.tasters/maxT)*100)}%;"></div></div></div>` : ''}
      <div style="margin-left:24px;font-size:11px;color:var(--gray2);margin-top:3px;">${loc.events} buổi · Doanh số: ${fmtCurrency(loc.sales)}</div>
    </div>`;
  });
  return html + `</div>`;
}

function buildNcdInsight(s) {
  if (!s.totalReached && !s.totalPacks) return '';
  const conv = s.totalReached ? Math.round(s.totalBuyers / s.totalReached * 100) : 0;
  return `<div class="insight-card purple">
    <div class="insight-title">🛒 Bán hàng PG xe đẩy</div>
    <div class="insight-text">${fmtNum(s.totalReached)} người tiếp cận · ${fmtNum(s.totalBuyers)} người mua (${conv}%) · ${fmtNum(s.totalPacks)} bịch · ${fmtCurrency(s.campaignSales)}
    ${s.pgSalesCost && s.totalPacks ? `<br>Chi phí PG bán hàng / bịch: <b>${fmtCurrency(Math.round(s.pgSalesCost / s.totalPacks))}</b>` : ''}</div>
  </div>`;
}

function upcomingHtml(plans) {
  const today = parseLocalDate(localToday());
  const upcoming = plans.filter(p => p.status === 'da_duyet' && parseLocalDate(p.dateEnd || p.date) >= today)
                     .sort((a,b) => String(a.date).localeCompare(String(b.date))).slice(0,3);
  if (!upcoming.length) return '';
  return sectionTitle('📅 Kế hoạch sắp tới') + '<div style="padding:0 16px 4px;">' + upcoming.map(p => `
    <div class="plan-card" style="margin:0 0 8px;" onclick="viewPlanDetail('${p.id}')">
      <div class="plan-card-top">
        <div>
          <div class="plan-card-name">${escHtml(p.locationName)}</div>
          <div style="font-size:11px;color:var(--gray2);">📅 ${fmtDateRange(p)} · ⏰ ${fmtTime(p.timeStart)}–${fmtTime(p.timeEnd)}</div>
          ${p.campaign ? `<div style="margin-top:3px;">${campaignChip(p)}</div>` : ''}
        </div>
        <span class="status-chip status-da_duyet">✅ Đã duyệt</span>
      </div>
    </div>`).join('') + '</div>';
}

function renderPersonalDash(el, plans, month) {
  const s = computePersonalStats(plans);
  const chLabel = currentUser.channel || currentUser.region || '';
  let html = `<div style="padding:8px 0 0;">
    <div style="background:linear-gradient(135deg,var(--red),var(--red-dark));padding:14px 16px 16px;color:#fff;">
      <div style="font-size:16px;font-weight:800;">${escHtml(currentUser.name)}</div>
      <div style="font-size:12px;opacity:0.85;margin-top:2px;">${currentUser.role} · ${escHtml(chLabel)}${month ? ` · Tháng ${month.substring(5,7)}/${month.substring(0,4)}` : ' · Tất cả'}</div>
    </div>`;

  html += `<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 16px 4px;">
    ${[
      {label:'Chờ duyệt', cnt:s.pending,  color:'var(--yellow2)'},
      {label:'Đã duyệt',  cnt:s.approved, color:'var(--teal)'},
      {label:'Hoàn thành',cnt:s.done,     color:'var(--green)'},
      {label:'Cần sửa',   cnt:s.needsEdit,color:'#c96a00'},
      {label:'Từ chối',   cnt:s.rejected, color:'var(--red)'},
    ].map(item => `<div style="background:var(--white);border-radius:8px;padding:8px 4px;text-align:center;box-shadow:var(--shadow);border-top:3px solid ${item.color};">
      <div style="font-size:18px;font-weight:800;color:${item.color};">${item.cnt}</div>
      <div style="font-size:8px;color:var(--gray2);margin-top:1px;line-height:1.3;">${item.label}</div>
    </div>`).join('')}
  </div>`;

  html += `<div class="dash-kpi-grid four">
    ${kpiCard('Người thử + tiếp cận', fmtNum(s.contacts), `${fmtNum(s.totalTasters)} thử · ${fmtNum(s.totalReached)} tiếp cận`, 'red', '👥')}
    ${kpiCard('Doanh số', fmtCurrency(s.totalSales), 'booth + bán hàng', 'teal', '💰')}
    ${kpiCard('Số bịch bán', fmtNum(s.totalPacks), 'PG xe đẩy', 'purple', '🛒')}
    ${kpiCard('CP/người', fmtCurrency(s.cpContact), 'chi phí / người', 'yellow', '🧮')}
  </div>`;

  html += buildNcdInsight(s);
  html += upcomingHtml(plans);
  html += sectionTitle('💰 Chi phí sampling') + buildCostSection(s);
  if (s.topLocations.length > 0) html += buildTopLocSection(s.topLocations);
  if (s.sortedMonths.length > 0) html += buildMonthTrendSection(s.sortedMonths);
  html += '<div class="spacer"></div></div>';
  el.innerHTML = html;
}

function afterApprovalAction(planId) {
  if (window._planCache) delete window._planCache[planId];
  const active = document.querySelector('.screen.active');
  const id = active ? active.id : '';
  if (id === 'screen-plan-detail') viewPlanDetail(planId);
  else if (id === 'screen-plans')  loadMyPlans();
  else                             loadDashboard();
  loadApprovalBadge();
}
function detailRequestEdit(planId) {
  const p = (window._planCache && window._planCache[planId]) || {};
  commentModal(planId, p.locationName || planId);
}

async function quickApprove(planId) {
  if (!confirm('Duyệt kế hoạch ' + planId + ' (không điều chỉnh)?')) return;
  loading(true, 'Đang duyệt...');
  try {
    const res = await api('POST', { action:'approvePlan', planId, data:{}, userCode: currentUser.code });
    if (res.success) { showToast('✅ Đã duyệt thành công!', 'success'); afterApprovalAction(planId); }
    else showToast(res.error, 'error');
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

function rejectModal(planId) {
  showModal('❌ Từ chối kế hoạch', `
    <div style="font-size:14px;color:var(--gray);margin-bottom:12px;">Kế hoạch: <b>${planId}</b></div>
    <div class="form-field"><label class="required">Lý do từ chối</label>
    <textarea class="form-input" id="reject-reason" placeholder="Nhập lý do..." style="min-height:100px;"></textarea></div>`,
    [
      { label: 'Hủy', action: 'closeModal()', cls: 'btn-secondary' },
      { label: '❌ Từ chối', action: `doReject('${planId}')`, cls: 'btn-danger' },
    ]
  );
}
async function doReject(planId) {
  const reason = document.getElementById('reject-reason')?.value?.trim();
  if (!reason) { showToast('Vui lòng nhập lý do', 'error'); return; }
  closeModal(); loading(true, 'Đang xử lý...');
  try {
    const res = await api('POST', { action:'rejectPlan', planId, reason, userCode: currentUser.code });
    if (res.success) { showToast('Đã từ chối kế hoạch', 'success'); afterApprovalAction(planId); }
    else showToast(res.error, 'error');
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

function commentModal(planId, locationName) {
  showModal(`💬 Yêu cầu chỉnh sửa — ${escHtml(locationName)}`, `
    <div style="font-size:13px;color:var(--gray2);margin-bottom:12px;">Kế hoạch: <b>${planId}</b><br>Kế hoạch sẽ chuyển sang "Cần chỉnh sửa", Sales Rep thấy nội dung này khi mở kế hoạch.</div>

    </div>`,

async function doComment(planId) {
  const notes = document.getElementById('comment-text')?.value?.trim();
  if (!notes) { showToast('Vui lòng nhập nội dung', 'error'); return; }
  closeModal(); loading(true);
  try {
    const res = await api('POST', { action:'requestEdit', planId, notes, userCode: currentUser.code });

    else showToast(res.error, 'error');
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

}
function calcInlinePgs() {

async function doInlineApprove(planId) {
  const plan = window._editingPlan;
  const adjustedSamples = (plan.samples||[]).map((s,i) => ({
    ma: s.ma, so_luong: parseInt(document.getElementById(`edit-sample-${i}`)?.value) || 0,
  })).filter(s => s.so_luong > 0);

  const pgCount = parseInt(document.getElementById('edit-pg-count')?.value) || plan.pgCount || 0;
  const pgStart = document.getElementById('edit-pg-start')?.value || '';
  const pgEnd   = document.getElementById('edit-pg-end')?.value   || '';
  const pgHours = pgStart && pgEnd ? calcHoursDiff(pgStart, pgEnd) : (plan.pgHours || 0);

  let approvedGifts = [];
  if (plan.hasGift && window._giftApproved) {
    approvedGifts.push({
      ten:      document.getElementById('edit-gift-name')?.value || '',
      so_luong: parseInt(document.getElementById('edit-gift-qty')?.value) || 0,
      gia_tri:  parseFloat(document.getElementById('edit-gift-value')?.value) || 0,
    });
  }

  const pgSales = _inlinePgsData();
  if (pgSales) {
    const err = validatePgSalesLocal(pgSales);
    if (err) { showToast(err, 'error'); return; }
  }
  const notes = document.getElementById('edit-approval-note')?.value?.trim() || '';

  closeModal();
  loading(true, 'Đang duyệt...');
  try {
    const res = await api('POST', {
      action: 'approvePlan', planId,
      data: { samples: adjustedSamples, pgCount, pgHours, pgStart, pgEnd, gifts: approvedGifts, notes, giftApproved: window._giftApproved, pgSales },
      userCode: currentUser.code,
    });
    if (res.success) { showToast('✅ Đã duyệt kế hoạch thành công!', 'success'); afterApprovalAction(planId); }
    else showToast(res.error || 'Có lỗi xảy ra', 'error');
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

let mgrTab = 'kpi';
let kpiData = null;
let kpiState = { period: '', ch: 'all', vg: 'all', cp: 'all', mx: 'ht', tb: 'sal', staffAll: false, cl: 'pk' };
const KPI_ACTIVE  = ['da_duyet', 'hoan_thanh'];
const KPI_VOID    = ['tu_choi', 'da_huy'];
const KPI_CH      = ['MT', 'GT'];
const KPI_VG      = ['Bắc', 'Trung', 'Nam', 'Toàn quốc'];
const KPI_LOADER  = '<div class="empty-state"><div class="ai-loader"></div><div class="empty-sub">Đang tải...</div></div>';

function setDashTitle(t) { const el = document.getElementById('dash-header-title'); if (el) el.textContent = t; }

function ymNow() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function ymAdd(ym, n) { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function ymLabel(ym) { return ym.substring(5, 7) + '/' + ym.substring(0, 4); }
function ymShort(ym) { return 'T' + Number(ym.substring(5, 7)) + '/' + ym.substring(2, 4); }
function ymList(from, to) { const a = []; let c = from; while (c <= to && a.length < 40) { a.push(c); c = ymAdd(c, 1); } return a; }
function daysBetween(a, b) { const x = parseLocalDate(a), y = parseLocalDate(b); return (x && y) ? Math.round((y - x) / 86400000) : 0; }

function kpiPeriod(v) {
  const [t, a] = String(v).split(':'); const cur = ymNow();
  if (t === 'c') {  // v2.10: toàn chương trình 'c:yyyy-mm|yyyy-mm'
    const [from, to0] = a.split('|'); const to = to0 > cur ? cur : to0;
    return { from, to, label: 'Toàn chương trình (' + ymShort(from) + ' → ' + ymShort(to0) + ')', prev: { from: '0000-00', to: '0000-00' }, noPrev: true, prevLabel: '' };
  }
  if (t === 'm') return { from: a, to: a, label: 'Tháng ' + ymLabel(a), prev: { from: ymAdd(a, -1), to: ymAdd(a, -1) }, prevLabel: 'so với tháng trước' };
  if (t === 'q') {
    const [y, q] = a.split('-').map(Number); const from = y + '-' + String((q - 1) * 3 + 1).padStart(2, '0');
    return { from, to: ymAdd(from, 2), label: 'Quý ' + q + '/' + y, prev: { from: ymAdd(from, -3), to: ymAdd(from, -1) }, prevLabel: 'so với quý trước' };
  }
  if (t === 'y') {
    const from = a + '-01', to = (a === cur.substring(0, 4)) ? cur : a + '-12';
    return { from, to, label: 'Năm ' + a + (to === cur ? ' (đến nay)' : ''), prev: { from: ymAdd(from, -12), to: ymAdd(to, -12) }, prevLabel: 'so với cùng kỳ năm trước' };
  }
  const n = Number(a) || 12, from = ymAdd(cur, -(n - 1));
  return { from, to: cur, label: n + ' tháng gần nhất', prev: { from: ymAdd(from, -n), to: ymAdd(cur, -n) }, prevLabel: 'so với ' + n + ' tháng trước đó' };
}

function kpiPeriodOptions(sel) {
  const cur = ymNow(), y = +cur.substring(0, 4); let q = Math.floor((+cur.substring(5, 7) - 1) / 3) + 1, yy = y;
  const opt = (v, l) => `<option value="${v}" ${v === sel ? 'selected' : ''}>${l}</option>`;
  let o = '';
  const cpv = kpiCampaignPeriod(kpiState.cp);
  if (cpv) o += '<optgroup label="Chương trình">' + opt(cpv, 'Toàn chương trình') + '</optgroup>';
  o += '<optgroup label="Tháng">';
  for (let i = 0; i < 12; i++) { const ym = ymAdd(cur, -i); o += opt('m:' + ym, 'Tháng ' + ymLabel(ym) + (i === 0 ? ' (hiện tại)' : '')); }
  o += '</optgroup><optgroup label="Quý">';
  for (let i = 0; i < 5; i++) { o += opt('q:' + yy + '-' + q, 'Quý ' + q + '/' + yy); q--; if (q < 1) { q = 4; yy--; } }
  o += '</optgroup><optgroup label="Năm / khác">' + opt('y:' + y, 'Năm ' + y + ' (đến nay)') + opt('y:' + (y - 1), 'Năm ' + (y - 1)) + opt('r:12', '12 tháng gần nhất') + '</optgroup>';
  return o;
}

function fM(n) {
  n = Number(n) || 0; const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(2).replace('.', ',') + ' tỷ';
  if (a >= 1e6) return (n / 1e6).toFixed(1).replace('.', ',') + ' tr';
  if (a >= 1e3) return Math.round(n / 1e3) + 'k';
  return a ? String(Math.round(n)) : '0';
}
function fN(n) { return n == null || isNaN(n) ? '—' : Math.round(n).toLocaleString('vi-VN'); }
function fP(x) { return x == null || isNaN(x) ? '—' : Math.round(x * 100) + '%'; }
function fX(x) { return x == null || isNaN(x) || !isFinite(x) ? '—' : x.toFixed(1).replace('.', ',') + 'x'; }
function rateCls(x) { return x == null ? '' : x >= 0.8 ? 'k-good' : x >= 0.5 ? 'k-warn' : 'k-bad'; }

async function loadKpiDashboard(force) {
  const el = document.getElementById('dash-content'); if (!el) return;
  setDashTitle('📊 Dashboard KPI');
  if (!kpiData || force) {
    el.innerHTML = KPI_LOADER;
    try {
      if (force) Object.keys(_apiCache).forEach(k => { if (k.indexOf('getDashboardKPI') !== -1) delete _apiCache[k]; });
      const res = await api('GET', { action: 'getDashboardKPI', months: 24 });
      if (!res || !res.success) throw new Error((res && res.error) || 'Không tải được dữ liệu');
      kpiData = res;
    } catch (e) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-text">Lỗi tải dashboard</div><div class="empty-sub">${e.message || e}</div><button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="loadKpiDashboard(true)">Thử lại</button></div>`;
      return;
    }
  }
  if (!kpiState.period) kpiState.period = 'm:' + ymNow();
  renderKpi();
