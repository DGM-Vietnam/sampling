/** Build cost breakdown section */
function buildCostSection(stats) {
  if (stats.totalCost === 0) return `<div class="info-banner">💰 Chưa có dữ liệu chi phí</div>`;
  const items = [
    { label: 'Chi phí PG',          val: stats.pgCost,       icon: '👥', color: 'var(--teal)' },
    { label: 'Chi phí địa điểm',    val: stats.locationCost, icon: '📍', color: 'var(--navy)' },
    { label: 'Quà tặng NTD',        val: stats.giftCost,     icon: '🎁', color: 'var(--yellow2)' },
  ];
  const maxVal = Math.max(...items.map(i=>i.val), 1);

  let html = `<div style="background:var(--white);border-radius:var(--radius);margin:0 16px 12px;box-shadow:var(--shadow);">
    <div style="padding:12px 16px 8px;border-bottom:1px solid var(--gray3);display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:13px;font-weight:700;color:var(--navy);">💰 Chi phí sampling</span>
      <span style="font-size:14px;font-weight:800;color:var(--red);">${fmtCurrency(stats.totalCost)}</span>
    </div>
    <div style="padding:12px 16px;">`;

  items.forEach(item => {
    const pct = Math.round((item.val/stats.totalCost)*100);
    const barW = Math.round((item.val/maxVal)*100);
    html += `<div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">
        <span>${item.icon} ${item.label}</span>
        <span style="font-weight:600;">${fmtCurrency(item.val)} <span style="color:var(--gray2);font-weight:400;">(${pct}%)</span></span>
      </div>
      <div class="bar-track" style="height:8px;">
        <div class="bar-fill" style="width:${barW}%;background:${item.color};height:100%;"></div>
      </div>
    </div>`;
  });

  if (stats.totalTasters > 0) {
    html += `<div style="border-top:1px solid var(--gray3);padding-top:10px;display:flex;justify-content:space-between;font-size:12px;">
      <span style="color:var(--gray2);">Chi phí / người thử</span>
      <span style="font-weight:700;color:var(--red);">${fmtCurrency(stats.cpContact)}</span>
    </div>`;
  }
  html += `</div></div>`;
  return html;
}

/** Build top locations section */
function buildTopLocSection(topLocations) {
  if (!topLocations || topLocations.length === 0) return '';
  const maxT = Math.max(...topLocations.map(l=>l.tasters), 1);
  let html = `<div style="background:var(--white);border-radius:var(--radius);margin:0 16px 12px;box-shadow:var(--shadow);">
    <div style="padding:12px 16px 8px;font-size:13px;font-weight:700;color:var(--navy);border-bottom:1px solid var(--gray3);">

    </div>`;
  const medals = ['🥇','🥈','🥉'];
  topLocations.slice(0,5).forEach((loc, i) => {
    const barW = Math.round((loc.tasters/maxT)*100);
    html += `<div style="padding:10px 16px;border-bottom:1px solid var(--gray3);">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
        <span style="font-size:16px;">${medals[i]||'·'}</span>
        <span style="font-size:13px;font-weight:600;flex:1;">${loc.name}</span>
        <span style="font-size:12px;font-weight:700;color:var(--red);">${fmtNum(loc.tasters)} người</span>
      </div>
      ${loc.tasters > 0 ? `<div style="margin-left:24px;"><div class="bar-track" style="height:6px;"><div class="bar-fill" style="width:${barW}%;background:var(--red);height:100%;"></div></div></div>` : ''}
      <div style="margin-left:24px;font-size:11px;color:var(--gray2);margin-top:3px;">
        ${loc.events} buổi · Doanh số: ${fmtCurrency(loc.sales)}

  });
  html += `</div>`;
  return html;
}

  if (outerTabBar) outerTabBar.style.display = isManager ? 'none' : 'flex';

  // Month filter row — show for rep/salesman, hide for manager
  const monthFilterRow = document.getElementById('dash-month-filter-row');
  if (monthFilterRow) monthFilterRow.style.display = isManager ? 'none' : 'flex';

  // Approval tab — only for marketing on mobile
  const approvalTabs = document.querySelectorAll('.dash-tab');
  approvalTabs.forEach(t => {
    if (t.textContent.includes('Duyệt')) t.style.display = isMarketing ? 'block' : 'none';
    if (t.textContent.includes('Hiệu quả')) t.style.display = (isRep || isMarketing) ? 'block' : 'none';
  });

  // Header titles
  const roleLabels = {
    'Sales Manager':        '📊 Manager Dashboard',
    'Marketing':            '📣 Marketing Overview',
    'Sales Representative': `📍 ${currentUser.name} · ${currentUser.channel || currentUser.region || ''}`,
    'Salesman':             `📋 ${currentUser.name} · ${currentUser.channel || currentUser.region || ''}`,
  };
  const titleEl = document.getElementById('dash-header-title');
  if (titleEl) titleEl.textContent = roleLabels[currentUser.role] || 'Dashboard';

  // VI/EN toggle — manager only
  const langParent = document.getElementById('lang-vi')?.parentElement;
  if (langParent) langParent.style.display = isManager ? 'flex' : 'none';
}
async function loadDashboard() {
  const month   = document.getElementById('dash-filter-month')?.value || '';
  const channel = document.getElementById('dash-filter-channel')?.value || '';
  const el = document.getElementById('dash-content');
  if (!el) return;
  el.innerHTML = '<div class="empty-state"><div class="ai-loader"></div><div class="empty-sub">Đang tải...</div></div>';

  const role = currentUser?.role || '';
  const isManager   = role === 'Sales Manager';
  const isMarketing = role === 'Marketing';
  const isRep       = role === 'Sales Representative';
  const isSalesman  = role === 'Salesman';

  // Manager has its own multi-tab sub-system inside dash-content
  if (isManager) {
    await loadManagerDashboard(el, month, channel);
    return;
  }

  // Approval tab — manager/marketing only
  if (currentDashTab === 'approval') {
    if (isManager || isMarketing) {
      try {
        const res = await api('GET', { action:'getPendingApprovals' });
        if (res.success) await renderDashApproval(res.data, el);
        else el.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">' + (res.error||'Lỗi') + '</div></div>';
      } catch(e) { el.innerHTML = '<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-text">Lỗi kết nối</div></div>'; }
      return;
    }
  }

  if (currentDashTab === 'overview' || currentDashTab === 'performance') {
    if (isMarketing) {
      // Marketing: use full channel data
      try {
        const [overRes, perfRes] = await Promise.all([
          api('GET', { action:'getDashboardOverview',    month, channel }),
          api('GET', { action:'getDashboardPerformance', month, channel }),
        ]);
        renderMarketingDash(el, overRes.success?overRes.data:null, perfRes.success?perfRes.data:null, month, channel);
      } catch(e) {
        el.innerHTML = '<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-text">Lỗi kết nối</div></div>';
      }
      return;
    }

    // Rep & Salesman: build stats purely from their own plans + plan details
    try {
      const myPlansRes = await api('GET', { action:'getMyPlans', userCode: currentUser.code, month });
      if (!myPlansRes.success) throw new Error(myPlansRes.error || 'API error');
      const myPlans = myPlansRes.data || [];

      // Fetch plan details (with reports) for completed plans in parallel
      const completedPlans = myPlans.filter(p =>
        p.status === 'hoan_thanh' || p.status === 'da_duyet'
      );
      const detailPromises = completedPlans.slice(0, 20).map(p =>
        api('GET', { action:'getPlanDetail', planId: p.id })
      );
      const details = await Promise.all(detailPromises);

      // Merge reports into myPlans
      const plansWithReports = myPlans.map(p => {
        const detail = details.find(d => d.success && d.data?.id === p.id);
        return { ...p, reports: detail?.data?.reports || [] };
      });

      if (isRep) {
        renderRepDashV2(el, plansWithReports, month);
      } else {
        renderSalesmanDashV2(el, plansWithReports, month);
      }
    } catch(e) {
      console.error('Dashboard load error:', e);
      el.innerHTML = '<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-text">Lỗi kết nối. Thử lại sau.</div></div>';
    }
  }
}

    <div class="pipeline-item"><div class="pipeline-num" style="color:var(--teal);">${s.hoan_thanh||0}</div><div class="pipeline-label">${lv?'Hoàn thành':'Done'}</div></div>

    <div class="kpi-card"><div class="kpi-label">${t('totalSales')}</div><div class="kpi-value green">${fmtCurrency(e.totalActualSales)}</div><div class="kpi-sub">&nbsp;</div></div>
    <div class="kpi-card"><div class="kpi-label">${t('costPerContact')}</div><div class="kpi-value teal">${fmtCurrency(e.costPerContact)}</div><div class="kpi-sub">&nbsp;</div></div>
  </div>`;

  // Cost breakdown
  html += `<div style="padding:14px 16px 4px;"><div class="card-title">${lv?'Chi phí':'Cost breakdown'}</div></div>
  <div class="cost-summary" style="margin:0 16px 14px;">
    <div class="cost-row"><span>PG</span><span>${fmtCurrency(c.pg)}</span></div>
    <div class="cost-row"><span>${lv?'Địa điểm':'Location'}</span><span>${fmtCurrency(c.location)}</span></div>
    <div class="cost-row"><span>${lv?'Quà tặng':'Gifts'}</span><span>${fmtCurrency(c.gifts)}</span></div>
    <div class="cost-row total"><span>${lv?'Tổng':'Total'}</span><span>${fmtCurrency(c.total)}</span></div>
  </div>`;

  // Top SKUs
  if (d.topSkus && d.topSkus.length > 0) {
    const maxQty = d.topSkus[0].qty;
    html += `<div style="padding:0 16px 4px;"><div class="card-title">${t('topSkus')}</div></div>
    <div class="card" style="margin:0 16px 12px;"><div class="card-body"><div class="bar-chart">`;
    d.topSkus.forEach(s => {
      const prod = masterData.products.find(p => p.ma === s.ma);
      const name = prod ? prod.ten : s.ma;
      html += `<div class="bar-row">
        <div class="bar-label" title="${name}">${name}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round((s.qty/maxQty)*100)}%"></div></div>
        <div class="bar-value">${fmtNum(s.qty)}</div>
      </div>`;
    });
    html += `</div></div></div>`;
  }

  // Channel breakdown
  const cb = d.channelBreakdown || {};
  const channels = Object.keys(cb);
  if (channels.length > 0) {
    const maxCount = Math.max(...channels.map(c => cb[c].count), 1);
    html += `<div style="padding:0 16px 4px;"><div class="card-title">${t('channelBreakdown')}</div></div>
    <div class="card" style="margin:0 16px 12px;"><div class="card-body"><div class="bar-chart">`;
    channels.forEach(ch => {
      html += `<div class="bar-row">
        <div class="bar-label">${ch}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round((cb[ch].count/maxCount)*100)}%;background:var(--teal);"></div></div>
        <div class="bar-value">${cb[ch].count} buổi</div>
      </div>`;
    });
    html += `</div></div></div>`;
  }

  // Monthly trend
  if (d.monthlyTrend && d.monthlyTrend.length > 1) {
    // Simple inline sparkline using emoji bars
    html += `<div style="padding:0 16px 4px;"><div class="card-title">${t('byMonth')}</div></div>
    <div class="card" style="margin:0 16px 12px;"><div class="card-body"><div class="bar-chart">`;
    const maxEv = Math.max(...d.monthlyTrend.map(m => m.events), 1);
    d.monthlyTrend.slice(-6).forEach(m => {
      html += `<div class="bar-row">
        <div class="bar-label">${m.month}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round((m.events/maxEv)*100)}%;background:var(--yellow2);"></div></div>
        <div class="bar-value">${m.events}</div>
      </div>`;
    });
    html += `</div></div></div>`;
  }

  html += '<div class="spacer"></div>';
  el.innerHTML = html;
}

// Cache for user name lookups
const _userNameCache = {};
async function getCreatorName(userCode) {
  if (_userNameCache[userCode]) return _userNameCache[userCode];
  try {
    const res = await api('GET', { action:'getUsers', channel:'', region:'' });
    if (res.success) {
      res.data.forEach(u => { _userNameCache[u.code] = u.name; });
    }
  } catch(e) {}
  return _userNameCache[userCode] || userCode;
}

// ── Approval view state ──
let _approvalView = 'kanban'; // 'kanban' | 'list'

async function renderDashApproval(plans, el) {
  // Also load cancel requests and show them as a separate section
  let cancelReqs = [];
  try {
    const cRes = await api('GET', { action: 'getCancelRequests' });
    if (cRes.success) cancelReqs = cRes.data || [];
  } catch(e) {}

  if ((!plans || plans.length === 0) && cancelReqs.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-text">Không có kế hoạch chờ duyệt</div><div class="empty-sub">Tất cả đã được xử lý 🎉</div></div>';
    const badge = document.getElementById('approval-badge');
    if (badge) badge.style.display = 'none';
    return;
  }

  // Update badges
  const badge = document.getElementById('approval-badge');
  if (badge) { badge.textContent = plans.length; badge.style.display = 'flex'; }
  const tabBadge = document.getElementById('approval-tab-badge');
  if (tabBadge) { tabBadge.textContent = plans.length; tabBadge.style.display = 'inline-flex'; }

  // Pre-load all user names
  try {
    const res = await api('GET', { action:'getUsers', channel:'', region:'' });
    if (res.success) res.data.forEach(u => { _userNameCache[u.code] = u.name; });
  } catch(e) {}

  // Store data for re-render + filtering
  window._lastApprovalPlans    = plans;
  window._lastApprovalPlansAll = plans;  // full unfiltered set
  window._lastCancelReqs       = cancelReqs;
  window._lastApprovalEl       = el;

  // Build channel options from plans
  const channels = [...new Set([...plans, ...cancelReqs].map(p => p.region || '').filter(Boolean))].sort();
  const channelOpts = channels.map(c => `<option value="${c}">${c}</option>`).join('');

  // Build month options
  const months = [...new Set([...plans, ...cancelReqs].map(p => p.date ? String(p.date).substring(0,7) : '').filter(Boolean))].sort().reverse();
  const monthOpts = months.map(m => {
    const [y, mo] = m.split('-');
    return `<option value="${m}">Tháng ${mo}/${y}</option>`;
  }).join('');

  let html = `
  <div style="padding:10px 16px 6px;">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
      <select id="approval-filter-month" onchange="_applyApprovalFilters()" style="flex:1;min-width:120px;padding:6px 10px;border-radius:8px;border:1px solid var(--gray3);font-size:12px;background:var(--white);">
        <option value="">Tất cả tháng</option>${monthOpts}
      </select>
      <select id="approval-filter-channel" onchange="_applyApprovalFilters()" style="flex:1;min-width:120px;padding:6px 10px;border-radius:8px;border:1px solid var(--gray3);font-size:12px;background:var(--white);">
        <option value="">Tất cả kênh</option>${channelOpts}
      </select>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div id="approval-count-label" style="font-size:13px;color:var(--gray2);font-weight:600;">${plans.length} chờ duyệt${cancelReqs.length > 0 ? ` · <span style="color:#c0392b;">${cancelReqs.length} yêu cầu hủy</span>` : ''}</div>
      <div class="view-toggle-bar">
        <button class="view-toggle-btn ${_approvalView==='kanban'?'active':''}" onclick="_approvalView='kanban';_rerenderApproval()">📋 Kanban</button>
        <button class="view-toggle-btn ${_approvalView==='list'?'active':''}" onclick="_approvalView='list';_rerenderApproval()">☰ Danh sách</button>
      </div>
    </div>
  </div>`;

  el.innerHTML = html + '<div id="approval-content-area"></div><div class="spacer"></div>';
  _renderApprovalContent(plans, cancelReqs, document.getElementById('approval-content-area'));
}

function _applyApprovalFilters() {
  const month   = (document.getElementById('approval-filter-month')  ||{}).value || '';
  const channel = (document.getElementById('approval-filter-channel')||{}).value || '';
  const all     = window._lastApprovalPlansAll || [];
  const filtered = all.filter(p => {
    const matchMonth   = !month   || (p.date && String(p.date).substring(0,7) === month);
    const matchChannel = !channel || p.region === channel;
    return matchMonth && matchChannel;
  });
  // filter cancel reqs too
  const allCancel     = window._lastCancelReqs || [];
  const filteredCancel= allCancel.filter(p => {
    const matchMonth   = !month   || (p.date && String(p.date).substring(0,7) === month);
    const matchChannel = !channel || p.region === channel;
    return matchMonth && matchChannel;
  });
  window._lastApprovalPlans = filtered;
  const lbl = document.getElementById('approval-count-label');
  if (lbl) lbl.innerHTML = `${filtered.length} chờ duyệt${filteredCancel.length>0?` · <span style="color:#c0392b;">${filteredCancel.length} yêu cầu hủy</span>`:''}`;
  _renderApprovalContent(filtered, filteredCancel, document.getElementById('approval-content-area'));
}

function _rerenderApproval() {
  const el = window._lastApprovalEl;
  if (!el) return;
  // Update toggle button states
  el.querySelectorAll('.view-toggle-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.includes('Kanban') ? _approvalView==='kanban' : _approvalView==='list');
  });
  _renderApprovalContent(window._lastApprovalPlans||[], window._lastCancelReqs||[], document.getElementById('approval-content-area'));
}

function _renderApprovalContent(plans, cancelReqs, el) {
  if (!el) return;
  if (_approvalView === 'kanban') {
    _renderApprovalKanban(plans, cancelReqs, el);
  } else {
    _renderApprovalList(plans, cancelReqs, el);
  }
}

function _renderApprovalKanban(plans, cancelReqs, el) {
  // Build a small kanban: Chờ duyệt | Cần chỉnh sửa | Yêu cầu hủy
  const cols = [
    { key:'cho_duyet',      label:'⏳ Chờ duyệt',       cls:'col-pending',  plans: plans },
    { key:'yeu_cau_huy',    label:'🚫 Yêu cầu hủy',     cls:'col-created',  plans: cancelReqs },
  ];

  let html = '<div class="kanban-board">';
  cols.forEach(col => {
    const items = col.plans || [];
    html += `<div class="kanban-col">
      <div class="kanban-col-header ${col.cls}">
        <span>${col.label}</span>
        <span class="kanban-col-count">${items.length}</span>
      </div>
      <div class="kanban-col-body">`;

    if (items.length === 0) {
      html += `<div class="kanban-empty"><div class="kanban-empty-icon">✅</div>Trống</div>`;
    } else {
      items.forEach(p => {
        const sampleList = (p.samples||[]).map(s => {
          const prod = masterData.products.find(pr => pr.ma === s.ma);
          return `${prod ? prod.ten : s.ma} ×${s.so_luong}`;
        }).join(', ') || '—';

        const isCancel = col.key === 'yeu_cau_huy';
        const cancelNote = isCancel
          ? ((p.notes||'').split('\n').reverse().find(l => l.includes('yêu cầu hủy') || l.includes('hủy')) || '')
          : '';

        html += `<div class="kanban-card kc-${p.status}" onclick="${isCancel ? `viewPlanDetail('${p.id}')` : `viewPlanDetail('${p.id}')`}">
          <div class="kc-name">${p.locationName}</div>
          <div class="kc-creator">👤 ${userName(p.creator)}</div>
          <div class="kc-meta">
            <span>📅 ${fmtDate(p.date)}</span>
            <span>⏰ ${fmtTime(p.timeStart)}–${fmtTime(p.timeEnd)}</span>
            <span>📍 ${p.region}</span>
          </div>
          <div class="kc-products">${sampleList}</div>
          ${p.hiresPg && p.pgCount > 0 ? `<div class="kc-meta" style="margin-top:3px;"><span>👥 ${p.pgCount} PG · ${p.pgHours||'?'}h/ngày</span></div>` : ''}
          ${isCancel && cancelNote ? `<div style="background:#fde8e8;border-radius:5px;padding:5px 7px;font-size:10px;color:#c0392b;margin-top:5px;">${cancelNote.substring(0,80)}${cancelNote.length>80?'…':''}</div>` : ''}
          <div class="kc-cost">${fmtCurrency(p.totalEstCost)}</div>
          <div class="kc-actions" onclick="event.stopPropagation()">
            ${isCancel ? `
              <button class="kc-btn kc-btn-approve" onclick="confirmCancelPlan('${p.id}')">✅ Xác nhận hủy</button>
              <button class="kc-btn kc-btn-edit" onclick="rejectCancelPlan('${p.id}')">↩ Giữ lại</button>
            ` : `
              <button class="kc-btn kc-btn-approve" onclick="quickApprove('${p.id}')">✅ Duyệt</button>
              <button class="kc-btn kc-btn-edit" onclick="inlineEditModal('${p.id}')">✏️ Sửa</button>
              <button class="kc-btn kc-btn-reject" onclick="rejectModal('${p.id}')">❌</button>
            `}
          </div>
        </div>`;
      });
    }
    html += `</div></div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function toggleGiftApproval() {

  if (btn) { btn.textContent = window._giftApproved ? '✅ Đồng ý' : 'Từ chối'; btn.style.background = window._giftApproved ? 'var(--green)' : 'var(--gray3)'; btn.style.color = window._giftApproved ? '#fff' : 'var(--navy)'; }

function addExtraGift() {
  const list = document.getElementById('extra-gifts-list');
  if (!list) return;
  const idx = window._extraGifts.length;
  window._extraGifts.push({ ten:'', so_luong:0, gia_tri:0 });
  const div = document.createElement('div');
  div.style.cssText = 'display:grid;grid-template-columns:1fr 60px 80px 28px;gap:6px;align-items:center;';
  div.innerHTML = `
    <input class="form-input" type="text" placeholder="Tên quà..." style="padding:8px;" oninput="window._extraGifts[${idx}].ten=this.value">

    <button style="width:28px;height:36px;border:none;background:var(--red-light);color:var(--red);border-radius:6px;font-size:16px;cursor:pointer;" onclick="this.parentElement.remove();window._extraGifts.splice(${idx},1)">×</button>`;

}

async function doInlineApprove(planId) {
  const plan = window._editingPlan;
  // Collect adjusted samples
  const adjustedSamples = (plan.samples||[]).map((s,i) => ({
    ma: s.ma,
    so_luong: parseInt(document.getElementById(`edit-sample-${i}`)?.value) || 0,
  })).filter(s => s.so_luong > 0);

  // Collect PG adjustments
  const pgCount = parseInt(document.getElementById('edit-pg-count')?.value) || plan.pgCount || 0;
  const pgStart = document.getElementById('edit-pg-start')?.value || '';
  const pgEnd   = document.getElementById('edit-pg-end')?.value   || '';
  const pgHours = pgStart && pgEnd ? calcHoursDiff(pgStart, pgEnd) : (plan.pgHours || 0);

  // Collect gift approval
  let approvedGifts = [];
  if (plan.hasGift && window._giftApproved) {
    approvedGifts.push({
      ten:       document.getElementById('edit-gift-name')?.value || '',
      so_luong:  parseInt(document.getElementById('edit-gift-qty')?.value) || 0,
      gia_tri:   parseFloat(document.getElementById('edit-gift-value')?.value) || 0,
    });
    approvedGifts = approvedGifts.concat(window._extraGifts.filter(g => g.ten));
  }

  const notes = document.getElementById('edit-approval-note')?.value?.trim() || '';

  closeModal();
  loading(true, 'Đang duyệt...');
  try {
    const res = await api('POST', {
      action: 'approvePlan', planId,
      data: { samples: adjustedSamples, pgCount, pgHours, pgStart, pgEnd, gifts: approvedGifts, notes, giftApproved: window._giftApproved },
      userCode: currentUser.code,
    });
    if (res.success) {
      showToast('✅ Đã duyệt kế hoạch thành công!', 'success');
      loadDashboard();
      loadApprovalBadge();
    } else showToast(res.error || 'Có lỗi xảy ra', 'error');
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

/**
 * Show cancel dialog — behavior depends on role + plan status
 */
async function initCancelPlan(planId, planStatus) {
  const isManager   = currentUser.role === 'Sales Manager';
  const isMarketing = currentUser.role === 'Marketing';
  const isRep       = currentUser.role === 'Sales Representative';

  // Determine if immediate cancel or needs confirmation
  const immediateCancel = isManager
    || (isRep && planStatus === 'cho_duyet');

  const modeNote = immediateCancel
    ? '⚡ Kế hoạch sẽ được hủy ngay sau khi xác nhận.'
    : '⏳ Yêu cầu hủy sẽ được gửi đến Manager/Marketing để xác nhận.\n\nCần ít nhất 1 người có thẩm quyền đồng ý trước khi hủy có hiệu lực.';

  const roleNote = isManager
    ? '🔑 Bạn là Sales Manager — hủy không cần xác nhận thêm.'
    : isMarketing
    ? '📣 Bạn là Marketing — cần Manager hoặc Sales Rep xác nhận.'
    : isRep && planStatus === 'cho_duyet'
    ? '📋 Kế hoạch chưa duyệt — bạn có thể tự hủy.'
    : '📋 Kế hoạch đã duyệt — cần Manager/Marketing xác nhận hủy.';

  showModal(
    '🚫 Hủy kế hoạch',
    `<div style="margin-bottom:12px;font-size:13px;color:var(--gray);line-height:1.6;">
       ${roleNote}
     </div>
     <div style="background:${immediateCancel?'var(--red-light)':'#fff3cd'};border-radius:8px;padding:10px 12px;font-size:12px;color:${immediateCancel?'var(--red)':'#856404'};margin-bottom:14px;white-space:pre-line;">
       ${modeNote}
     </div>
     <div class="form-field">
       <label class="required" style="font-size:13px;">Nguyên nhân hủy</label>
       <textarea id="cancel-reason-input" class="form-input" rows="3"
         placeholder="Ví dụ: Điểm bán không hợp tác, thay đổi kế hoạch kinh doanh..."
         style="resize:none;font-family:var(--font);"></textarea>
     </div>`,
    [
      {
        label: immediateCancel ? '🚫 Xác nhận hủy' : '📤 Gửi yêu cầu hủy',
        cls:   'btn btn-danger',
        onclick: `executeCancelPlan('${planId}', ${immediateCancel})`,
      },
      { label: 'Đóng', cls: 'btn btn-outline', onclick: 'closeModal()' },
    ]
  );

  // Focus textarea after modal renders
  setTimeout(() => {
    const ta = document.getElementById('cancel-reason-input');
    if (ta) ta.focus();
  }, 200);
}

async function executeCancelPlan(planId, isImmediate) {
  const reason = document.getElementById('cancel-reason-input')?.value?.trim();
  if (!reason) {
    // Shake the textarea
    const ta = document.getElementById('cancel-reason-input');
    if (ta) { ta.style.border = '2px solid var(--red)'; setTimeout(() => ta.style.border='', 1500); }
    showToast('Vui lòng nhập nguyên nhân hủy', 'error');
    return;
  }

  closeModal();
  loading(true, isImmediate ? 'Đang hủy kế hoạch...' : 'Đang gửi yêu cầu hủy...');

  try {
    const res = await api('POST', {
      action:   'cancelPlan',
      planId,
      reason,
      userCode: currentUser.code,
    });

    if (res.success) {
      const msg = res.immediate
        ? `✅ Kế hoạch ${planId} đã được hủy.`
        : `📤 Đã gửi yêu cầu hủy kế hoạch ${planId}. Chờ xác nhận.`;
      showToast(msg, 'success', 4000);
      // Reload plan detail to reflect new status
      await viewPlanDetail(planId);
    } else {
      showToast(res.error || 'Có lỗi xảy ra', 'error');
    }
  } catch(e) {
    showToast('Lỗi kết nối', 'error');
  } finally {
    loading(false);
  }
}

}

  content.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">${title}</div>
    ${bodyHtml}
    ${actHtml ? `<div class="modal-footer">${actHtml}</div>` : ''}
  `;
  overlay.classList.add('show');
  overlay.onclick = e => { if (e.target === overlay) closeModal(); };
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

// =====================================================
// INIT
// =====================================================
function goHome() {
  if (!currentUser) return;
  showScreen('home');
  sessionStorage.setItem('dgm_screen', 'home');
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('screen-' + name);
  if (el) el.classList.add('active');
  if (currentUser) sessionStorage.setItem('dgm_screen', name);
  updateSidebarActive();
  // Hide login sidebar
  const sidebar = document.getElementById('desktop-sidebar');
  if (sidebar) sidebar.style.display = (name === 'login' || !currentUser) ? 'none' : (isDesktop() ? 'flex' : 'none');
}

(function init() {
  // ── PWA Version Check — force reload when new version deployed ──
  const CURRENT_VERSION = '2.2.1';
  const storedVersion   = localStorage.getItem('dgm_app_version');
  if (storedVersion && storedVersion !== CURRENT_VERSION) {
    // New version detected — clear caches and reload
    localStorage.setItem('dgm_app_version', CURRENT_VERSION);
    // Clear all caches if Cache API available
    if ('caches' in window) {
      caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
    }
    window.location.reload(true); // hard reload
    return;
  }
  localStorage.setItem('dgm_app_version', CURRENT_VERSION);
  // Prevent pull-to-refresh on mobile — use CSS only, keep touch passive for iOS scroll performance
  document.addEventListener('touchstart', function(e){}, {passive:true});
  document.documentElement.style.overscrollBehavior = 'none';

  // Check session
  const saved = sessionStorage.getItem('dgm_user');
  const savedScreen = sessionStorage.getItem('dgm_screen');
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      loadMasterData().then(() => {
        setupHome();
        // Restore last screen (safe screens only)
        const safeScreens = ['home','plans','calendar','dashboard'];
        if (savedScreen && safeScreens.includes(savedScreen)) {
          showScreen(savedScreen);
          if (savedScreen === 'plans') loadMyPlans();
          else if (savedScreen === 'calendar') renderCalendar();
          else if (savedScreen === 'dashboard') loadDashboard();
        } else {
          showScreen('home');
        }
      });
    } catch(e) { sessionStorage.removeItem('dgm_user'); }
  }
  // Set today date min
  const today = new Date().toISOString().split('T')[0];
  document.querySelectorAll('input[type=date]').forEach(el => el.min = today);
})();
</script>
