let _plansView = 'list'; // 'list' | 'kanban' — default list, kanban only for manager/marketing

async function loadMyPlans() {
  if (!currentUser || !currentUser.code) {
    console.warn('loadMyPlans: no currentUser');
    return;
  }
  const isManagerRole = currentUser.role === 'Sales Manager' || currentUser.role === 'Marketing';
  const month = document.getElementById('plan-filter-month').value;
  const statusFilter = document.getElementById('plan-filter-status').value;
  const listEl = document.getElementById('plans-list');
  const toggleEl = document.getElementById('plans-view-toggle');

  // Show view toggle for manager/marketing
  if (toggleEl) {
    if (isManagerRole) {
      toggleEl.style.display = 'flex';
      toggleEl.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;margin:0 16px;flex-wrap:wrap;width:calc(100% - 32px);">
          <div class="view-toggle-bar" style="margin:0;">
            <button class="view-toggle-btn ${_plansView==='list'?'active':''}" onclick="_plansView='list';loadMyPlans()">☰ Danh sách</button>
            <button class="view-toggle-btn ${_plansView==='kanban'?'active':''}" onclick="_plansView='kanban';loadMyPlans()">📋 Kanban</button>
          </div>
          <button class="btn btn-primary btn-sm" style="margin-left:auto;" onclick="showScreen('create-plan');initCreatePlan().catch(()=>{})">＋ Lên kế hoạch</button>
        </div>`;
    } else {
      toggleEl.style.display = 'none';
    }
  }

  listEl.innerHTML = '<div class="empty-state"><div class="ai-loader"></div></div>';
  try {
    const res = await api('GET', { action:'getMyPlans', userCode:currentUser.code, month });
    if (!res.success) { listEl.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">${res.error}</div></div>`; return; }
    let plans = res.data;
    if (statusFilter) plans = plans.filter(p => p.status === statusFilter);
    if (plans.length === 0) {
      listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">Chưa có kế hoạch nào</div><div class="empty-sub">Nhấn + để tạo mới</div></div>';
      return;
    }
    plans.sort((a,b) => {
      // Sort by execution date ascending (upcoming first), then by createdAt desc as tiebreak
      const da = parseLocalDate(a.date), db = parseLocalDate(b.date);
      if (da && db && da.getTime() !== db.getTime()) return da - db;
      return new Date(b.createdAt) - new Date(a.createdAt);
    });
    if (!window._planCache) window._planCache = {};
    plans.forEach(p => { window._planCache[p.id] = p; });

    // Manager/Marketing: kanban view available
    if (isManagerRole && _plansView === 'kanban') {
      renderPlansKanban(plans, listEl);
    } else {
      listEl.innerHTML = plans.map(p => planCard(p)).join('');
    }
  } catch(e) {
    console.error('loadMyPlans error:', e);
    listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-text">Lỗi: ' + (e.message||e) + '</div></div>';
  }
}

function renderPlansKanban(plans, el) {
  // v2.6 #3 — 5 columns: Đã lên plan | Chờ duyệt | Đã duyệt | Hoàn thành | Đã hủy
  const cols = [
    {
      key: 'created', label: '📝 Đã lên plan', cls: 'col-created',
      statuses: ['yeu_cau_chinh_sua', 'tu_choi'],
    },
    {
      key: 'pending', label: '⏳ Chờ duyệt', cls: 'col-pending',
      statuses: ['cho_duyet'],
    },
    {
      key: 'approved', label: '✅ Đã duyệt', cls: 'col-approved',
      statuses: ['da_duyet'],
    },
    {
      key: 'done', label: '🏁 Hoàn thành', cls: 'col-done',
      statuses: ['hoan_thanh'],
    },
    {
      key: 'cancelled', label: '🚫 Đã hủy', cls: 'col-cancelled',
      statuses: ['yeu_cau_huy', 'da_huy'],
    },
  ];

  let html = '<div class="kanban-board">';
  cols.forEach(col => {
    const items = plans.filter(p => col.statuses.includes(p.status));
    html += `<div class="kanban-col">
      <div class="kanban-col-header ${col.cls}">
        <span>${col.label}</span>
        <span class="kanban-col-count">${items.length}</span>
      </div>
      <div class="kanban-col-body">`;

    if (items.length === 0) {
      html += `<div class="kanban-empty"><div class="kanban-empty-icon">—</div>Trống</div>`;
    } else {
      items.forEach(p => {
        const isManagerRole2 = currentUser.role === 'Sales Manager' || currentUser.role === 'Marketing';
        const canApproveThis  = isManagerRole2 && p.status === 'cho_duyet';
        const isExecutor2 = (p.executors||[]).map(String).includes(String(currentUser.code)) || String(p.creator) === String(currentUser.code);
        const canReport2  = (p.status === 'da_duyet' || p.status === 'hoan_thanh') && (isExecutor2 || isManagerRole2);

        const sampleList = (p.samples||[]).map(s => {
          const prod = masterData.products.find(pr => pr.ma === s.ma);
          return `${prod ? prod.ten : s.ma} ×${s.so_luong}`;
        }).join(', ') || '—';

        const isCancelCol = col.key === 'cancelled';
        const cancelNote = isCancelCol
          ? (String(p.notes||'').split('\n').reverse().find(l => l.toLowerCase().includes('hủy')) || '').replace(/\s*\[prev:[a-z_]+\]\s*/g, '')
          : '';
        const canConfirmCancel = isCancelCol && p.status === 'yeu_cau_huy' && isManagerRole2;

        html += `<div class="kanban-card kc-${p.status}" onclick="viewPlanDetail('${p.id}')">
          <div class="kc-name">${p.locationName}</div>
          <div class="kc-creator">👤 ${userName(p.creator)}</div>
          <div class="kc-meta">
            <span>📅 ${fmtDateRange(p)}</span>
            <span>📍 ${p.region}</span>
          </div>
          <div class="kc-meta"><span>⏰ ${fmtTime(p.timeStart)}–${fmtTime(p.timeEnd)}</span></div>
          <div class="kc-products">${sampleList}</div>
          ${p.hiresPg && p.pgCount > 0 ? `<div class="kc-meta" style="margin-top:3px;"><span>👥 ${p.pgCount} PG · ${p.pgHours||'?'}h/ngày</span></div>` : ''}
          ${isCancelCol ? `<div style="margin-top:4px;">${statusChip(p.status)}</div>` : ''}
          ${isCancelCol && cancelNote ? `<div style="background:${p.status==='yeu_cau_huy'?'#fde8e8':'#f0f0f0'};border-radius:5px;padding:5px 7px;font-size:10px;color:${p.status==='yeu_cau_huy'?'#c0392b':'#888'};margin-top:5px;">${cancelNote.substring(0,90)}${cancelNote.length>90?'…':''}</div>` : ''}
          <div class="kc-cost">${fmtCurrency(p.totalEstCost)}</div>
          ${canConfirmCancel ? `
          <div class="kc-actions" onclick="event.stopPropagation()">
            <button class="kc-btn kc-btn-approve" onclick="confirmCancelPlan('${p.id}')">✅ Xác nhận hủy</button>
            <button class="kc-btn kc-btn-edit" onclick="rejectCancelPlan('${p.id}')">↩ Giữ lại</button>
          </div>` : ''}
          ${(canApproveThis || canReport2) ? `
          <div class="kc-actions" onclick="event.stopPropagation()">
            ${canApproveThis ? `
              <button class="kc-btn kc-btn-approve" onclick="quickApprove('${p.id}')">✅ Duyệt</button>
              <button class="kc-btn kc-btn-edit" onclick="inlineEditModal('${p.id}')">✏️</button>
              <button class="kc-btn kc-btn-reject" onclick="rejectModal('${p.id}')">❌</button>
            ` : ''}
            ${canReport2 && !canApproveThis ? `
              <button class="kc-btn kc-btn-view" style="font-size:9px;" onclick="initReport('${p.id}')">📊 Báo cáo</button>
            ` : ''}
          </div>` : ''}
        </div>`;
      });
    }
    html += `</div></div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function planCard(p) {
  const isExecutor = (p.executors||[]).map(String).includes(String(currentUser.code)) || String(p.creator) === String(currentUser.code);
  const isManager  = currentUser.role === 'Sales Manager' || currentUser.role === 'Marketing';
  const canReport  = (p.status === 'da_duyet' || p.status === 'hoan_thanh') && (isExecutor || isManager);
  const reportLabel = p.status === 'hoan_thanh' ? '📊 Thêm báo cáo' : '📊 Báo cáo';
  const reportCount = (p.reports || []).length;

  // FIX #3: dùng tiền PG đã chốt từ backend (p.pgCost) — không tính lại ở client,
  // nên không còn lệ thuộc thời điểm tải bảng giá và không lệch ngày lễ/tết.
  let pgCostDisplay = '';
  if (p.hiresPg && p.pgCount > 0 && p.pgHours > 0 && p.pgCost > 0) {
    const numDays = p.numDays || 1;
    pgCostDisplay = fmtCurrency(p.pgCost) + (numDays > 1 ? ` (${numDays}N)` : '');
  }

  const statusLabel = p.status === 'hoan_thanh' && reportCount > 0
    ? `${statusChip(p.status)}<span style="font-size:10px;color:var(--gray2);"> ${reportCount} BC</span>`
    : statusChip(p.status);

  return `<div class="plan-card" onclick="viewPlanDetail('${p.id}')">
    <div class="plan-card-top">
      <div style="flex:1;">
        <div class="plan-card-name">${p.locationName}</div>
        <div style="font-size:11px;color:var(--gray2);margin-top:2px;">
          Tạo: ${fmtDate(p.createdAt)} &nbsp;·&nbsp; TH: ${fmtDateRange(p)}
        </div>
      </div>
      <div style="text-align:right;">${statusLabel}</div>
    </div>
    <div class="plan-card-meta">
      <div class="meta-chip">📍 ${p.region}</div>
      <div class="meta-chip">⏰ ${fmtTime(p.timeStart)}–${fmtTime(p.timeEnd)}</div>
      ${p.hiresPg && p.pgCount > 0
        ? `<div class="meta-chip">👥 ${p.pgCount} PG · ${p.pgHours}h${pgCostDisplay ? ' · ' + pgCostDisplay : ''}</div>`
        : ''}
      ${canReport
        ? `<div class="meta-chip" style="background:${p.status==='hoan_thanh'?'#d1f2eb;color:var(--green)':'var(--red-light);color:var(--red)'};font-weight:600;border:1px solid currentColor;" onclick="event.stopPropagation();initReport('${p.id}')">${reportLabel}</div>`
        : ''}
    </div>
  </div>`;
}

// =====================================================
// PLAN DETAIL
// =====================================================
async function viewPlanDetail(planId) {
  // v2.8: nhớ màn trước để nút ← quay đúng chỗ (Phê duyệt / Kế hoạch / Lịch)
  const prev = sessionStorage.getItem('dgm_screen');
  if (prev && prev !== 'plan-detail') window._detailReturn = prev;
  // v2.8: có sẵn dữ liệu từ danh sách → hiện NGAY, tải bản đầy đủ ở nền
  const cached = window._planCache && window._planCache[planId];
  if (cached) { renderPlanDetail(cached, true); showScreen('plan-detail'); }
  else loading(true, 'Đang tải...');
  try {
    const res = await api('GET', { action:'getPlanDetail', planId });
    if (!res.success) { if (!cached) showToast(res.error, 'error'); return; }
    const p = res.data;
    if (!window._planCache) window._planCache = {};
    window._planCache[planId] = p;
    const onThis = window._currentDetailId === planId &&
      document.getElementById('screen-plan-detail').classList.contains('active');
    if (!cached) { renderPlanDetail(p); showScreen('plan-detail'); }
    else if (onThis) renderPlanDetail(p);
  } catch(e) { if (!cached) showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

function goBackFromDetail() {
  const r = window._detailReturn || 'plans';
  if (r === 'dashboard')     { showScreen('dashboard'); loadDashboard(); }
  else if (r === 'calendar') { showScreen('calendar'); renderCalendar(); }
  else if (r === 'home')     { showScreen('home'); }
  else                       { showScreen('plans'); loadMyPlans(); }
}

function renderPlanDetail(p, isPreview) {
  window._currentDetailId = p.id;
  document.getElementById('plan-detail-title').textContent = p.locationName;
  const reportCnt = (p.reports||[]).length;
  document.getElementById('plan-detail-id').innerHTML =
    fmtDate(p.date) + ' · ' + p.id + (reportCnt > 0 ? ` · ${reportCnt} báo cáo` : '') +
    (isPreview ? ' <span class="detail-refreshing">· ⟳ đang cập nhật…</span>' : '');

  const back = document.getElementById('plan-detail-back');
  back.onclick = goBackFromDetail;

  const isManager   = currentUser.role === 'Sales Manager';
  const isMarketing = currentUser.role === 'Marketing';
  const isMgrOrMkt  = isManager || isMarketing;
  const canEdit = (p.creator === currentUser.code || isMgrOrMkt) &&
    (p.status === 'cho_duyet' || p.status === 'yeu_cau_chinh_sua');
  // Điều chỉnh giới hạn: plan ĐÃ DUYỆT & chưa qua ngày kết thúc (đang chờ/đang chạy)
  const _adjEnd   = p.dateEnd ? toInputDate(p.dateEnd) : toInputDate(p.date);
  const _adjToday = toInputDate(new Date().toISOString().split('T')[0]);
  const canAdjust = (p.creator === currentUser.code || isMgrOrMkt) &&
    p.status === 'da_duyet' && (!_adjEnd || _adjEnd >= _adjToday);
  const isExecutor = (p.executors||[]).includes(currentUser.code) || p.creator === currentUser.code;
  const canReport  = (p.status === 'da_duyet' || p.status === 'hoan_thanh') && (isExecutor || isMgrOrMkt);
  const reportLabel = p.status === 'hoan_thanh' ? '📊 Thêm báo cáo' : '📊 Báo cáo';

  // Check if there are differences between plan and approval
  let approvalDiff = '';
  if (p.approval && p.approval.result === 'da_duyet' && (p.status === 'da_duyet' || p.status === 'hoan_thanh')) {
    const origPg = p.pgCount, appPg = p.approval.pgCount;
    if (String(origPg) !== String(appPg)) {
      approvalDiff += `<div class="info-banner" style="margin-top:0;margin-bottom:8px;">⚠️ Số PG được duyệt thay đổi: <b>${origPg} → ${appPg}</b></div>`;
    }
  }

  const sampleNames = (p.samples || []).map(s => {
    const prod = masterData.products.find(pr => pr.ma === s.ma);
    return `${prod ? prod.ten : s.ma} × ${s.so_luong}`;
  }).join(', ');

  // v2.8: Manager/Marketing duyệt ngay trong màn chi tiết
  const canApproveHere = isMgrOrMkt && p.status === 'cho_duyet';
  const approveBox = canApproveHere ? `
    <div class="detail-approve-box">
      <div class="detail-approve-head">
        <span>⏳ Kế hoạch đang chờ duyệt</span>
        <span>Tổng chi phí: <b>${fmtCurrency(p.totalEstCost)}</b></span>
      </div>
      <div class="detail-approve-actions">
        <button class="btn btn-green" onclick="quickApprove('${p.id}')">✅ Duyệt</button>
        <button class="btn btn-secondary" onclick="inlineEditModal('${p.id}')">✏️ Điều chỉnh & duyệt</button>
        <button class="btn btn-outline" onclick="detailRequestEdit('${p.id}')">💬 Yêu cầu sửa</button>
        <button class="btn btn-danger" onclick="rejectModal('${p.id}')">❌ Từ chối</button>
      </div>
    </div>` : '';

  let html = `<div class="spacer" style="height:8px;"></div>
  <div class="detail-section">
    ${approvalDiff}
    ${statusChip(p.status)}
    <div class="spacer" style="height:10px;"></div>
    ${approveBox}`;

  // If needs edit — show reason
  if (p.approval && p.approval.result === 'yeu_cau_chinh_sua') {
    html += `<div class="info-banner" style="background:var(--red-light);border-color:var(--red);">
      ✏️ Yêu cầu chỉnh sửa: <b>${p.approval.notes || '—'}</b>
    </div>`;
  }
  if (p.approval && p.approval.result === 'tu_choi') {
    html += `<div class="info-banner" style="background:var(--red-light);border-color:var(--red);">
      ❌ Lý do từ chối: <b>${p.approval.notes || '—'}</b>
    </div>`;
  }

  html += `
    <div class="detail-section-title">Thông tin chung</div>
    <div class="card"><div class="card-body">
      ${dr('Khu vực / Kênh', p.region)}
      ${dr('Người tạo', userName(p.creator))}
      ${dr('Điểm sampling', p.locationName)}
      ${dr('Ngày thực hiện', fmtDateRange(p))}
      ${dr((p.days && p.days.length > 1) ? 'Lịch theo ngày' : 'Thời gian', daysScheduleHtml(p))}
      ${dr('Người thực hiện', userNames(p.executors))}
      ${dr('Người giám sát', userName(p.supervisor) || p.supervisor || '—')}
    </div></div>

    <div class="detail-section-title">Sản phẩm & Hoạt động</div>
    <div class="card"><div class="card-body">
      ${dr('Sản phẩm sampling', sampleNames || '—')}
      ${dr('Hình thức dùng thử', p.servingMethod || '—')}
      ${(p.dishes && p.dishes.length) ? dr('Món ăn sampling', p.dishes.map(d => {
        if (!d || !d.ten) return '';
        const prod = d.tu_mau ? masterData.products.find(pr => pr.ma === d.tu_mau) : null;
        return d.ten + (prod ? ' (mẫu: ' + prod.ten + ')' : (d.tu_mau ? ' (mẫu: ' + d.tu_mau + ')' : ''));
      }).filter(Boolean).join(', ') || '—') : ''}
      ${dr('Có chương trình KM', p.hasPromo ? '✅ Có' : 'Không')}
      ${dr('On/Off post', p.postType || '—')}
      ${dr('Ra ụ', p.hasKiosk ? '✅ Có' : 'Không')}
      ${dr('Loại booth', p.boothType || '—')}
    </div></div>

    <div class="detail-section-title">Nhân sự & Chi phí</div>
    <div class="card"><div class="card-body">
      ${dr('Thuê PG', p.hiresPg ? `✅ ${p.pgCount} PG · ${p.pgHours} giờ` : 'Không')}
      ${p.hiresPg ? dr('Ghi chú PG', p.pgNote || '—') : ''}
      ${dr('Chi phí địa điểm', p.locationCost ? fmtCurrency(p.locationCost) : 'Không')}
      ${p.locationCost ? dr('Loại chi phí', p.costType || '—') : ''}
      ${p.locationCost ? dr('Có hóa đơn', p.hasInvoice ? '✅ Có' : 'Không') : ''}
      ${dr('Tổng chi phí ước tính', `<b>${fmtCurrency(p.totalEstCost)}</b>`)}
    </div></div>

    <div class="detail-section-title">Mục tiêu</div>
    <div class="card"><div class="card-body">
      ${dr('Mục đích', p.purpose || '—')}
      ${dr('Dự kiến người thử', fmtNum(p.estTasters))}
      ${dr('Dự kiến doanh số', fmtCurrency(p.estSales))}
      ${dr('Ghi chú', p.notes || '—')}
    </div></div>
  `;

  // Reports section
  if (p.reports && p.reports.length > 0) {
    html += `<div class="detail-section-title">Báo cáo (${p.reports.length})</div>`;
    p.reports.forEach(r => {
      html += `<div class="card"><div class="card-body">
        ${dr('Người BC', userName(r.reporter))} ${dr('Thời gian', fmtDate(r.reportedAt))}
        ${dr('Số người thử', fmtNum(r.actualTasters))}
        ${dr('Doanh số thực tế', fmtCurrency(r.actualSales))}
        ${dr('Phản hồi KH', r.feedback || '—')}
        ${r.imgFolderUrl ? `<a href="${r.imgFolderUrl}" target="_blank" style="color:var(--teal);font-size:13px;">📁 Xem thư mục ảnh</a>` : ''}
      </div></div>`;
    });
  }

  // Determine cancel permission
  const cancellableStatuses = ['cho_duyet','da_duyet','yeu_cau_chinh_sua','yeu_cau_huy'];
  const canCancel = cancellableStatuses.includes(p.status) && (
    isManager ||
    (isMarketing && p.status !== 'da_huy') ||
    (currentUser.role === 'Sales Representative' && String(p.creator) === String(currentUser.code))
  );

  // Actions
  html += `<div style="display:flex;gap:8px;padding:0 16px;flex-wrap:wrap;">`;
  if (canApproveHere) html += `<button class="btn btn-green" style="flex:1;min-width:120px;" onclick="quickApprove('${p.id}')">✅ Duyệt</button>`;
  if (canEdit) html += `<button class="btn btn-outline" style="flex:1;min-width:120px;" onclick="initCreatePlan('${p.id}')">✏️ Chỉnh sửa</button>`;
  if (canAdjust) html += `<button class="btn btn-outline" style="flex:1;min-width:120px;" onclick="initAdjustPlan('${p.id}')">🔧 Điều chỉnh</button>`;
  if (canReport) {
    const bgStyle = p.status === 'hoan_thanh' ? 'background:var(--teal);' : '';
    html += `<button class="btn btn-primary" style="flex:1;min-width:120px;${bgStyle}" onclick="initReport('${p.id}')">${reportLabel}</button>`;
  }
  if (isMgrOrMkt && p.status === 'hoan_thanh') {
    html += `<button class="btn btn-secondary" style="flex:1;min-width:120px;" onclick="reopenPlan('${p.id}')">🔓 Mở lại</button>`;
  }
  if (canCancel && p.status !== 'yeu_cau_huy') {
    html += `<button class="btn btn-danger" style="flex:1;min-width:120px;" onclick="initCancelPlan('${p.id}','${p.status}')">🚫 Hủy</button>`;
  }
  html += `</div>`;

  // Cancel request pending banner + confirm/reject for manager/marketing
  if (p.status === 'yeu_cau_huy') {
    // Extract cancel reason from notes (last line starting with [ Rep/Marketing yêu cầu hủy])
    const cancelNote = (p.notes||'').split('\n').reverse()
      .find(l => l.includes('yêu cầu hủy') || l.includes('Manager hủy')) || '';
    html += `<div style="background:#fde8e8;border-left:4px solid #c0392b;border-radius:0 8px 8px 0;padding:12px 14px;margin:8px 16px 4px;font-size:12px;">
      <div style="font-weight:700;color:#c0392b;margin-bottom:4px;">⏳ Đang chờ xác nhận hủy</div>
      ${cancelNote ? `<div style="color:var(--gray);margin-bottom:8px;">${cancelNote}</div>` : ''}
      ${isMgrOrMkt ? `
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn btn-danger" style="flex:1;padding:8px;" onclick="confirmCancelPlan('${p.id}')">✅ Xác nhận hủy</button>
        <button class="btn btn-outline" style="flex:1;padding:8px;" onclick="rejectCancelPlan('${p.id}')">↩️ Giữ lại kế hoạch</button>
      </div>` : '<div style="color:var(--gray2);">Chờ Manager hoặc Marketing xác nhận.</div>'}
    </div>`;
  }

  if (p.status === 'da_huy') {
    const cancelNote = (p.notes||'').split('\n').reverse()
      .find(l => l.includes('hủy') || l.includes('Hủy')) || '';
    html += `<div style="background:#f5f5f5;border-left:4px solid #aaa;border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 16px 4px;font-size:12px;color:#888;">
      🚫 Kế hoạch đã bị hủy${cancelNote ? '<br><span style="font-size:11px;">' + cancelNote + '</span>' : ''}
    </div>`;
  }

  if (p.status === 'hoan_thanh') {
    const cnt = (p.reports||[]).length;
    html += `<div class="info-banner" style="margin-top:8px;">
      ✅ Hoàn thành · ${cnt} báo cáo đã gửi${isManager ? ' · Manager có thể "Mở lại" để nhân viên báo cáo thêm' : ''}
    </div>`;
  }
  html += `<div class="spacer"></div>`;
  document.getElementById('plan-detail-content').innerHTML = html;
}
function dr(key, val) {
  return `<div class="detail-row"><span class="detail-key">${key}</span><span class="detail-value">${val}</span></div>`;
}

// =====================================================
// CREATE PLAN FORM
// =====================================================
async function initCreatePlan(editPlanId = null) {
  currentPlanId = editPlanId;

  // Always reset first
  planFormData = {
    samples: [], dishes: [], gifts: [], executors: [], supervisors: [], servingMethods: [],
    days: [], date: '', hiresPg: false, hasPromo: false, hasKiosk: false,
    hasInvoice: false, hasGift: false, _pgHours: 0, _pgRate: 0, _pgStart: '', _pgEnd: ''
  };

  const todayStr = new Date().getFullYear() + '-'
    + String(new Date().getMonth()+1).padStart(2,'0') + '-'
    + String(new Date().getDate()).padStart(2,'0');

  if (editPlanId) {
    // ── EDIT MODE: load existing plan data ──
    loading(true, 'Đang tải kế hoạch...');
    try {
      const res = await api('GET', { action: 'getPlanDetail', planId: editPlanId });
      if (!res.success) { showToast(res.error || 'Không tải được kế hoạch', 'error'); loading(false); return; }
      const p = res.data;

      // Map plan → planFormData
      planFormData.samples   = p.samples   || [];
      planFormData.dishes    = p.dishes    || [];
      planFormData.gifts     = p.gifts     || [];
      // #5: dựng lại hình thức dùng thử từ chuỗi đã lưu ("Nấu/chế biến + Khui nắp dùng thử")
      planFormData.servingMethods = [];
      const _sm = String(p.servingMethod || '');
      if (_sm.includes('Nấu'))  planFormData.servingMethods.push('nau');
      if (_sm.includes('Khui')) planFormData.servingMethods.push('khui');
      planFormData.executors = (p.executors || []).map(String);
      planFormData.supervisorCode = p.supervisor || '';
      planFormData.supervisorName = userName(p.supervisor) || p.supervisor || '';
      planFormData.hiresPg   = p.hiresPg   || false;
      planFormData.hasPromo  = p.hasPromo  || false;
      planFormData.hasKiosk  = p.hasKiosk  || false;
      planFormData.hasInvoice= p.hasInvoice|| false;
      planFormData.hasGift   = (p.gifts || []).length > 0;
      planFormData.postType  = p.postType  || '';
      planFormData.boothType = p.boothType || '';
      planFormData.costType  = p.costType  || '';
      planFormData._pgHours  = p.pgHours   || 0;
      planFormData._pgStart  = p.pgStart   || '';
      planFormData._pgEnd    = p.pgEnd     || '';

      // Date: build days array across the FULL range (multi-day aware)
      const dateStr = toInputDate(p.date);
      const endStr  = p.dateEnd ? toInputDate(p.dateEnd) : dateStr;
      planFormData.date          = dateStr;
      planFormData._region       = p.region       || '';
      planFormData._pgCount      = p.pgCount       || 1;
      planFormData._locationCost = p.locationCost  || '';
      planFormData._costNote     = p.costNote      || '';
      planFormData._purpose      = p.purpose       || '';
      planFormData._estTasters   = p.estTasters    || '';
      planFormData._estSales     = p.estSales      || '';
      planFormData._notes        = p.notes         || '';
      const _editDates = dateRange(dateStr, endStr || dateStr);
      const _srcDays = (Array.isArray(p.days) && p.days.length > 0) ? p.days : null;
      planFormData.days = _editDates.map((ds, i) => {
        const src = _srcDays ? (_srcDays.find(d => toInputDate(d.date) === ds) || _srcDays[i]) : null;
        return {
          date:      ds,
          timeStart: (src && src.timeStart) || p.timeStart || '09:00',
          timeEnd:   (src && src.timeEnd)   || p.timeEnd   || '12:00',
        };
      });

      document.getElementById('create-plan-subtitle').textContent = 'Chỉnh sửa: ' + editPlanId;
      // Change header title for edit mode
      const titleEl = document.getElementById('create-plan-title');
      if (titleEl) titleEl.textContent = 'Chỉnh sửa kế hoạch';
    } catch(e) {
      showToast('Lỗi kết nối', 'error'); loading(false); return;
    }
    loading(false);
  } else {
    // ── CREATE MODE ──
    document.getElementById('create-plan-subtitle').textContent = 'Kế hoạch mới';
    const titleEl2 = document.getElementById('create-plan-title');
    if (titleEl2) titleEl2.textContent = 'Lên kế hoạch sampling';
  }

  renderCreatePlanForm();
  showScreen('create-plan');

  // Set min for date inputs
  const startEl = document.getElementById('f-date-start');
  const endEl   = document.getElementById('f-date-end');
  if (startEl) startEl.min = todayStr;
  if (endEl)   endEl.min   = todayStr;

  if (editPlanId && planFormData.days.length > 0) {
    // ── RESTORE DATE (multi-day aware) ──
    const _days = planFormData.days;
    const d = _days[0];
    const dEnd = _days[_days.length - 1];
    if (startEl) startEl.value = d.date;
    if (endEl)   endEl.value   = dEnd.date;
    // Pre-fill location name from cached plan
    const cachedPlan = window._planCache && window._planCache[editPlanId];
    if (cachedPlan) {
      const locNameEl = document.getElementById('f-location-name');
      const regionEl  = document.getElementById('f-region');
      if (locNameEl) {
        locNameEl.value    = cachedPlan.locationName || '';
        locNameEl.readOnly = true;
        locNameEl.style.background = 'var(--gray4)';
        locNameEl.style.color      = 'var(--gray2)';
      }
      if (regionEl && cachedPlan.region) regionEl.value = cachedPlan.region;
    }
    // Also store locationName in planFormData for submit
    planFormData._locationName = cachedPlan?.locationName || '';
    setTimeout(() => {
      onDateRangeChange();   // renders day cards
      restoreFormState();    // restores chips, products, toggles
    }, 80);
  } else {
    // Create mode: set today's date
    if (startEl) startEl.value = todayStr;
    if (endEl)   endEl.value   = todayStr;
    setTimeout(() => onDateRangeChange(), 50);
  }
}

/** Restore all interactive UI state from planFormData after form render */
function restoreFormState() {
  // ── Location name (read-only in edit mode) ──
  const locNameEl = document.getElementById('f-location-name');
  // We don't pre-fill f-location-name here because it's free-text
  // Location dropdown + name was set at plan creation; show as read-only hint

  // ── Region ──
  const regionEl = document.getElementById('f-region');
  if (regionEl && !regionEl.value && planFormData._region) {
    regionEl.value = planFormData._region;
  }

  // ── Products: mark checked + fill qty ──
  planFormData.samples.forEach(s => {
    const check   = document.querySelector(`#prod-${s.ma} .product-check`);
    const qtyWrap = document.getElementById(`qty-wrap-${s.ma}`);
    const qtyEl   = document.getElementById(`qty-${s.ma}`);
    if (check)   { check.classList.add('checked'); check.dataset.selected = '1'; }
    if (qtyWrap) qtyWrap.style.display = 'flex';
    if (qtyEl)   qtyEl.value = s.so_luong || '';
  });

  // ── Executor chips ──
  document.querySelectorAll('#executor-chips .chip-option').forEach(chip => {
    const code = chip.dataset.code;
    if (planFormData.executors.includes(String(code))) {
      chip.classList.add('selected');
    }
  });

  // ── Supervisor chip ──
  if (planFormData.supervisorCode) {
    document.querySelectorAll('#supervisor-chips .chip-option').forEach(chip => {
      if (chip.dataset.code === String(planFormData.supervisorCode)) {
        chip.classList.add('selected');
      }
    });
    // Update display name
    const supDisplay = document.getElementById('supervisor-display');
    if (supDisplay) supDisplay.textContent = planFormData.supervisorName || planFormData.supervisorCode;
  }

  // ── PG toggle ──
  if (planFormData.hiresPg) {
    const pgToggle = document.getElementById('toggle-pg');
    if (pgToggle) {
      pgToggle.checked = true;
      const pgSection = document.getElementById('pg-section');
      if (pgSection) pgSection.style.display = 'block';
      // Fill PG count
      const pgCount = document.getElementById('f-pg-count');
      if (pgCount) pgCount.value = planFormData._pgCount || 1;
      // PG time inputs
      const pgStart = document.getElementById('f-pg-start');

function calcHoursDiff(startTime, endTime) {
  if (!startTime || !endTime) return 0;
  const [sh, sm] = startTime.split(':').map(Number);
  const [eh, em] = endTime.split(':').map(Number);
  const diff = (eh * 60 + em) - (sh * 60 + sm);
  return Math.max(0, diff / 60);
}

function isHoliday(dateStr) {
  // Vietnamese public holidays per Bộ Luật Lao Động
  // Fixed solar holidays
  if (!dateStr) return false;
  const d = new Date(dateStr + 'T00:00:00');
  const mm = d.getMonth() + 1; // 1-12
  const dd = d.getDate();
  const yr = d.getFullYear();

  // Fixed-date public holidays (Điều 112 BLLĐ 2019)
  const fixedHolidays = [
    [1,  1],   // Tết Dương lịch
    [4, 30],   // Ngày Giải phóng miền Nam
    [5,  1],   // Ngày Quốc tế Lao động
    [9,  2],   // Quốc khánh
    [9,  3],   // Ngày nghỉ bù Quốc khánh (thường)
  ];
  const isFixed = fixedHolidays.some(([m, dy]) => mm === m && dd === dy);
  if (isFixed) return true;

  // Giỗ Tổ Hùng Vương: 10/3 âm lịch — approximate solar dates by year
  // Using known dates (update annually if needed)
  const gioToMap = {
    2024: '2024-04-18',
    2025: '2025-04-07',
    2026: '2026-03-28',
    2027: '2027-04-16',
  };
  if (gioToMap[yr]) {
    const gioTo = new Date(gioToMap[yr] + 'T00:00:00');
    if (d.getTime() === gioTo.getTime()) return true;
  }

  // Tết Nguyên Đán: typically 5-7 days holiday (approximate by year)
  // Days off: 29 tháng Chạp âm to Mùng 5 tháng Giêng âm
  // Known solar date ranges for Tết holiday period:
  const tetRanges = {
    2024: ['2024-02-08', '2024-02-14'],
    2025: ['2025-01-27', '2025-02-02'],
    2026: ['2026-02-15', '2026-02-21'],
    2027: ['2027-02-05', '2027-02-11'],
  };
  if (tetRanges[yr]) {
    const [start, end] = tetRanges[yr].map(s => new Date(s + 'T00:00:00'));
    if (d >= start && d <= end) return true;
  }

  return false;
}

function isSaturday(dateStr) {
  if (!dateStr) return false;
  return new Date(dateStr + 'T00:00:00').getDay() === 6;
}

function getDayType(dateStr, channel) {
  // Returns: 'holiday' | 'normal'
  // T7/CN = normal per DGM policy

function getPgRate(hours, dateStr, channel) {
  /**
   * Bảng giá DGM:
   *   MT Thường:  45,000đ/giờ/PG
   *   MT Lễ/Tết:  67,500đ/giờ/PG
   *   GT Thường:  50,000đ/giờ/PG
   *   GT Lễ/Tết:  75,000đ/giờ/PG
   *   T7/CN = Ngày thường (không phụ phí)
   *
   * Công thức: Tiền PG = Số PG × Số giờ × Đơn giá/giờ
   * Sheet columns: hours | ratePerPg | channel | note
   *   note "Thường"          → ngày thường
   *   note "Ngày lễ..."      → lễ/tết theo quy định
   */

  const pricing = masterData.pgPricing;

  // Detect day type — T7/CN = thường per DGM policy
  const isHol = isHoliday(dateStr); // only fixed public holidays
  const dayType = isHol ? 'Lễ/Tết' : 'Ngày thường';

  // Normalise channel input: "GT South"/"GT North"/"GT Central" → "GT"
  const normCh = (s) => {
    const u = (s || '').toUpperCase().trim();
    if (u === 'MT') return 'MT';
    if (u.startsWith('GT')) return 'GT';
    return null;
  };
  const ch = normCh(channel);

  // Hardcoded fallback rates (matches DGM bảng giá)
  const FALLBACK = {
    MT: { normal: 45000, holiday: 67500 },
    GT: { normal: 50000, holiday: 75000 },
  };

  let hourlyRate = 0;
  let rateSource = 'hardcoded';

  if (pricing && pricing.length > 0) {
    // Try sheet data first
    const normNote = (n) => (n || '').toLowerCase();
    const isHolRow = (row) => normNote(row.note).includes('lễ') ||
                               normNote(row.note).includes('le ') ||
                               normNote(row.note).includes('tết') ||
                               normNote(row.note).includes('tet');

    // Find best match: channel + day type
    let match = pricing.find(row => {
      const rowCh = normCh(row.channel || row.Channel || '');
      const dayMatch = isHol ? isHolRow(row) : !isHolRow(row);
      return rowCh === ch && dayMatch;
    });

    // Fallback 1: ignore channel, match day type only
    if (!match) {
      match = pricing.find(row => isHol ? isHolRow(row) : !isHolRow(row));
    }
    // Fallback 2: first row
    if (!match) match = pricing[0];

    if (match) {
      hourlyRate = Number(String(match.ratePerPg || match['Đơn Giá / PG (VNĐ)'] || 0).replace(/[^0-9]/g, '')) || 0;
      rateSource = 'sheet';
    }
  }

  // If sheet gave 0 or no data, use hardcoded fallback
  if (!hourlyRate) {
    const fb = ch ? FALLBACK[ch] : FALLBACK.MT;
    hourlyRate = isHol ? (fb?.holiday || 67500) : (fb?.normal || 45000);
    rateSource = 'default';
  }

  // Build display info
  const chLabel   = ch ? `Kênh ${ch}` : '';
  const dayLabel  = isHol ? '🎉 Lễ/Tết' : '📅 Ngày thường';
  const warnNote  = rateSource === 'default' ? ' ⚠️ Dùng giá mặc định — kiểm tra sheet GIA_THUE_PG' : '';
  const label     = `${hours.toFixed(1)}h × ${fmtCurrency(hourlyRate)}/giờ${ch ? ' · ' + ch : ''}`;

  return {
    hourlyRate,
    label,
    note:    `${dayLabel}${ch ? ' · ' + chLabel : ''}${warnNote}`,
    dayType,
    channel: ch,
    rateSource,
  };
}

function onDateRangeChange() {

  // Ensure end >= start
  const endEl = document.getElementById('f-date-end');

  if (endStr && startStr && endStr < startStr) {
    if (endEl) endEl.value = startStr;
  }

  const start = startStr;
  const end   = endEl?.value || startStr;

  if (!start) { renderDayCards([]); return; }
  const dates = dateRange(start, end || start);
  renderDayCards(dates);
}

function renderDayCards(dates) {
  const container = document.getElementById('day-cards-container');
  const summaryEl = document.getElementById('sampling-days-display');
  const summaryText = document.getElementById('sampling-days-text');

  if (dates.length === 0) {

  // Preserve existing times when re-rendering
  const existingTimes = {};

  });

  const channel = document.getElementById('f-region')?.value || currentUser?.channel || '';

  container.innerHTML = dates.map(dateStr => {

    const dayName = DAY_NAMES_VI[dayIdx];
    const isWE    = dayIdx === 0 || dayIdx === 6;
    const isHol   = isHoliday(dateStr);
    const cardCls = isHol ? 'holiday' : isWE ? 'weekend' : '';
    const typeLbl = isHol ? '🎉 Ngày lễ' : isWE ? '📅 Cuối tuần' : '';
    const existing = existingTimes[dateStr] || {};
    const tStart  = existing.timeStart || '09:00';
    const tEnd    = existing.timeEnd   || '12:00';

    return `<div class="day-card ${cardCls}" id="day-card-${dateStr}">
      <div class="day-card-header">
        <div class="day-badge ${cardCls}">${dayName}</div>
        <div class="day-date-label">${fmtDate(dateStr)}</div>

      <div class="day-time-row">

          <input class="form-input" type="time" value="${tStart}"

          <label style="font-size:11px;">Giờ kết thúc</label>

            id="day-end-${dateStr}"
            oninput="updateDayTime('${dateStr}')" style="padding:9px 10px;">
        </div>
      </div>
    </div>`;
  }).join('');

  // Update planFormData.days
  planFormData.days = dates.map(dateStr => ({
    date:      dateStr,
    timeStart: existingTimes[dateStr]?.timeStart || '09:00',
    timeEnd:   existingTimes[dateStr]?.timeEnd   || '12:00',
  }));
  planFormData.date = dates[0]; // backward compat

  // Summary badge
  if (summaryEl) summaryEl.style.display = 'flex';
  if (summaryText) summaryText.textContent = `${dates.length} ngày thực hiện`;

  // Trigger PG cost recalc for first day
  onPgTimeChange();
}

  if (day) { day.timeStart = tStart; day.timeEnd = tEnd; }

function onPgTimeChange() {
  const pgStart = document.getElementById('f-pg-start')?.value;
  const pgEnd   = document.getElementById('f-pg-end')?.value;
  const pgCount = parseInt(document.getElementById('f-pg-count')?.value) || 1;
  const channel = document.getElementById('f-region')?.value || currentUser?.channel || '';

  const pgStartEl = document.getElementById('f-pg-start');
  const pgEndEl   = document.getElementById('f-pg-end');
  if (pgStartEl) pgStartEl.dataset.manuallyChanged = '1';
  if (pgEndEl)   pgEndEl.dataset.manuallyChanged   = '1';

  const hoursPerDay = calcHoursDiff(pgStart, pgEnd);
  if (hoursPerDay <= 0) {
    const rateDisp = document.getElementById('pg-rate-display');
    if (rateDisp) rateDisp.style.display = 'none';
    planFormData._pgHours = 0; planFormData._pgRate = 0; planFormData._pgTotalCost = 0;
    calcCost(); return;
  }

  // Multi-day support: count days and detect if ANY day is holiday
  const days = planFormData.days || [];
  const numDays = Math.max(days.length, 1);
  // Use first day for rate reference; if any day is a holiday, flag it
  const firstDateStr = days.length > 0 ? days[0].date : (document.getElementById('f-date-start')?.value || '');
  const hasHoliday   = days.some(d => isHoliday(d.date));
  // Override dateStr passed to getPgRate to reflect holiday status
  const dateStrForRate = hasHoliday
    ? '2026-04-30' // known holiday to trigger holiday rate
    : (firstDateStr || '');

  // hourly rate based on channel + date holiday check
  const { hourlyRate, label, note, dayType, channel: ch, rateSource } = getPgRate(hoursPerDay, dateStrForRate, channel);

  // Tiền PG = Số PG × Giờ/ngày × Đơn giá/giờ × Số ngày
  const totalPgCost = pgCount * hoursPerDay * hourlyRate * numDays;

  const rateDisp = document.getElementById('pg-rate-display');
  if (rateDisp) rateDisp.style.display = 'block';

  const el = (id) => document.getElementById(id);
  const multiDayLabel = numDays > 1 ? ` × ${numDays} ngày` : '';
  if (el('pg-rate-label')) el('pg-rate-label').textContent =
    `Đơn giá/giờ/PG (${dayType}${ch ? ' · ' + ch : ''}):`;
  if (el('pg-rate-value')) el('pg-rate-value').textContent = fmtCurrency(hourlyRate) + '/giờ';
  if (el('pg-hours-calc')) el('pg-hours-calc').textContent =
    pgCount + ' PG × ' + hoursPerDay.toFixed(1) + 'h' + (numDays > 1 ? '/ngày × ' + numDays + ' ngày' : '') + ' × ' + fmtCurrency(hourlyRate) + '/giờ';
  if (el('pg-cost-calc'))  el('pg-cost-calc').textContent  = fmtCurrency(totalPgCost) + (numDays > 1 ? ` (${numDays} ngày)` : '');
  if (el('pg-rate-note'))  {
    el('pg-rate-note').textContent   = note + (hasHoliday && numDays > 1 ? ' ⚠️ Có ngày lễ trong kỳ' : '');
    el('pg-rate-note').style.display = note ? 'block' : 'none';
  }

  const dayBadge = el('pg-day-badge');
  if (dayBadge) {
    const colors = { 'Ngày thường': 'var(--teal)', 'Lễ/Tết': 'var(--red)' };
    dayBadge.textContent      = hasHoliday ? 'Có ngày Lễ/Tết' : dayType;
    dayBadge.style.background = hasHoliday ? 'var(--red)' : (colors[dayType] || 'var(--gray2)');
    dayBadge.style.display    = 'inline-flex';
  }

  planFormData._pgHours     = hoursPerDay;
  planFormData._pgNumDays   = numDays;
  planFormData._pgRate      = hourlyRate;
  planFormData._pgTotalCost = totalPgCost;
  planFormData._pgStart     = pgStart;
  planFormData._pgEnd       = pgEnd;
  planFormData._pgChannel   = channel;
  planFormData._pgDayType   = dayType;
  calcCost();
}

function selectSupervisor(el, code, encodedName) {
  document.querySelectorAll('#supervisor-chips .chip-option').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  planFormData.supervisorCode = code;
  try { planFormData.supervisorName = decodeURIComponent(encodedName); }
  catch(e) { planFormData.supervisorName = encodedName; }
}

function toggleExecutor(el, code) {
  el.classList.toggle('selected');
  if (el.classList.contains('selected')) {
    planFormData.executors.push(code);
  } else {
    planFormData.executors = planFormData.executors.filter(c => c !== code);
  }
}

function toggleProduct(ma) {
  const check = document.querySelector(`#prod-${ma} .product-check`);
  const qtyWrap = document.getElementById(`qty-wrap-${ma}`);
  const isChecked = check.classList.toggle('checked');
  qtyWrap.style.display = isChecked ? 'block' : 'none';
  if (isChecked) {
    document.getElementById(`qty-${ma}`).value = 1;
    planFormData.samples = planFormData.samples.filter(s => s.ma !== ma);
    planFormData.samples.push({ ma, so_luong: 1 });
  } else {
    planFormData.samples = planFormData.samples.filter(s => s.ma !== ma);
    document.getElementById(`qty-${ma}`).value = '';
  }
  calcCost();
  refreshDishSampleOptions(); // v2.6 #1: đồng bộ dropdown món ăn với SP mẫu
}

function updateSample(ma) {
  const qty = parseInt(document.getElementById(`qty-${ma}`).value) || 1;
  const idx = planFormData.samples.findIndex(s => s.ma === ma);
  if (idx >= 0) planFormData.samples[idx].so_luong = qty;
}

function addDish(initial) {
  const el = document.getElementById('dishes-list');
  const idx = planFormData.dishes.length;
  planFormData.dishes.push({ ten: (initial && initial.ten) || '', tu_mau: (initial && initial.tu_mau) || '' });
  const div = document.createElement('div');
  div.setAttribute('data-dish', '1');
  div.style.cssText = 'display:flex;flex-direction:column;gap:5px;border:1px solid var(--gray3);border-radius:8px;padding:8px;background:#fafbfc;';
  div.innerHTML = `
    <div style="display:flex;gap:6px;align-items:center;">
      <input class="form-input" type="text" placeholder="Tên món ăn..." style="flex:1;" value="${(initial && initial.ten) ? String(initial.ten).replace(/"/g,'&quot;') : ''}"
        oninput="planFormData.dishes[${idx}].ten = this.value">
      <button class="btn btn-secondary btn-sm" style="width:36px;padding:0;font-size:18px;" onclick="removeDish(this, ${idx})">×</button>
    </div>
    <select class="form-input dish-sample-select" data-dish-idx="${idx}" style="font-size:12px;padding:6px 10px;"
      onchange="planFormData.dishes[${idx}].tu_mau = this.value">
      ${_dishSampleOptions((initial && initial.tu_mau) || '')}
    </select>`;
  el.appendChild(div);
}

/** v2.6 #1: xóa món — đánh dấu _removed (không splice để tránh lệch index các dòng còn lại). */
function removeDish(btn, idx) {
  const row = btn.closest('div[data-dish]');
  if (row) row.remove();
  if (planFormData.dishes[idx]) planFormData.dishes[idx]._removed = true;
}

/** v2.6 #1: options dropdown "món này dùng mẫu SP nào" — đồng bộ theo SP mẫu đã chọn. */
function _dishSampleOptions(selected) {
  const opts = ['<option value="">— Chọn SP mẫu cho món này —</option>'];
  (planFormData.samples || []).forEach(s => {
    const prod = masterData.products.find(p => p.ma === s.ma);
    const name = prod ? prod.ten : s.ma;
    opts.push(`<option value="${s.ma}" ${String(selected) === String(s.ma) ? 'selected' : ''}>${name}</option>`);
  });
  if ((planFormData.samples || []).length === 0)
    opts.push('<option value="" disabled>(Chưa chọn sản phẩm mẫu nào)</option>');
  return opts.join('');
}

/** v2.6 #1: refresh dropdown SP mẫu của TẤT CẢ món khi thay đổi danh sách mẫu. */
function refreshDishSampleOptions() {
  document.querySelectorAll('.dish-sample-select').forEach(sel => {
    const i = Number(sel.getAttribute('data-dish-idx'));
    let cur = (planFormData.dishes[i] && planFormData.dishes[i].tu_mau) || '';
    // nếu SP mẫu đã bị bỏ chọn → reset liên kết
    if (cur && !(planFormData.samples || []).some(s => String(s.ma) === String(cur))) {
      cur = '';
      if (planFormData.dishes[i]) planFormData.dishes[i].tu_mau = '';
    }
    sel.innerHTML = _dishSampleOptions(cur);
  });
}

/** #5: bật/tắt 1 hình thức dùng thử (cho phép chọn cả 2). */
function toggleServingMethod(method) {
  planFormData.servingMethods = planFormData.servingMethods || [];
  const i = planFormData.servingMethods.indexOf(method);
  if (i >= 0) planFormData.servingMethods.splice(i, 1);
  else        planFormData.servingMethods.push(method);
  const tog = document.getElementById('toggle-serve-' + method);
  if (tog) tog.classList.toggle('on', planFormData.servingMethods.includes(method));
  const df = document.getElementById('dishes-field');
  if (df) df.style.display = planFormData.servingMethods.includes('nau') ? 'block' : 'none';
  const kn = document.getElementById('khui-note');
  if (kn) kn.style.display = (planFormData.servingMethods.includes('khui') && !planFormData.servingMethods.includes('nau')) ? 'block' : 'none';
}

/** #5: áp trạng thái hình thức dùng thử + danh sách món lên UI (dùng khi sửa kế hoạch). */
function applyServingMethodsUI() {
  const methods = planFormData.servingMethods || [];
  ['nau','khui'].forEach(m => {
    const tog = document.getElementById('toggle-serve-' + m);
    if (tog) tog.classList.toggle('on', methods.includes(m));
  });
  const df = document.getElementById('dishes-field');
  if (df) df.style.display = methods.includes('nau') ? 'block' : 'none';
  const kn = document.getElementById('khui-note');
  if (kn) kn.style.display = (methods.includes('khui') && !methods.includes('nau')) ? 'block' : 'none';
  // Dựng lại các dòng món đã lưu
  const list = document.getElementById('dishes-list');
  if (list && Array.isArray(planFormData.dishes) && planFormData.dishes.length) {
    const saved = planFormData.dishes.slice();
    planFormData.dishes = [];
    list.innerHTML = '';
    saved.forEach(d => addDish(d));
  }
}

function togglePg() {
  const tog = document.getElementById('toggle-pg');
  planFormData.hiresPg = !planFormData.hiresPg;
  tog.classList.toggle('on', planFormData.hiresPg);
  const fields = document.getElementById('pg-fields');
  fields.style.display = planFormData.hiresPg ? 'flex' : 'none';
  if (planFormData.hiresPg) {
    // Auto-fill PG times from first day card (date-range mode) or legacy f-start
    const days = planFormData.days || [];
    let sampStart = '09:00', sampEnd = '18:00';
    if (days.length > 0) {
      sampStart = days[0].timeStart || sampStart;
      sampEnd   = days[0].timeEnd   || sampEnd;
    } else {
      sampStart = document.getElementById('f-start')?.value || sampStart;
      sampEnd   = document.getElementById('f-end')?.value   || sampEnd;
    }
    const pgStartEl = document.getElementById('f-pg-start');
    const pgEndEl   = document.getElementById('f-pg-end');
    if (pgStartEl) { pgStartEl.value = sampStart; delete pgStartEl.dataset.manuallyChanged; }
    if (pgEndEl)   { pgEndEl.value   = sampEnd;   delete pgEndEl.dataset.manuallyChanged; }
    onPgTimeChange();
  }
  calcCost();
}

function calcCost() {
  // PG cost = Số PG × Số giờ × Đơn giá/giờ (pre-calculated in onPgTimeChange)
  const pgCost  = planFormData.hiresPg ? (planFormData._pgTotalCost || 0) : 0;
  const locCost = parseFloat(document.getElementById('f-location-cost')?.value) || 0;
  const giftQty = planFormData.hasGift ? (parseInt(document.getElementById('f-gift-qty')?.value) || 0) : 0;
  const giftVal2= planFormData.hasGift ? (parseFloat(document.getElementById('f-gift-value')?.value) || 0) : 0;
  const giftVal = giftQty * giftVal2;
  const total   = pgCost + locCost + giftVal;
  const set = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = fmtCurrency(val); };
  set('cs-pg', pgCost); set('cs-loc', locCost); set('cs-gift', giftVal); set('cs-total', total);
}

    gifts:         planFormData.hasGift ? [{
      so_luong:  parseInt(document.getElementById('f-gift-qty')?.value) || 0,
      gia_tri:   parseFloat(document.getElementById('f-gift-value')?.value) || 0,
      muc_dich:  document.getElementById('f-gift-purpose')?.value?.trim() || '',
      ghi_chu:   document.getElementById('f-gift-note')?.value?.trim() || '',
    }] : [],
    purpose:       document.getElementById('f-purpose')?.value?.trim(),
    estTasters:    parseInt(document.getElementById('f-est-tasters')?.value) || 0,
    estSales:      parseFloat(document.getElementById('f-est-sales')?.value) || 0,
    notes:         document.getElementById('f-notes')?.value?.trim(),
  };

  btn.disabled = true; btn.textContent = '⏳ Đang gửi...';
  loading(true, 'Đang lưu kế hoạch...');
  try {
    if (!data.servingMethods || data.servingMethods.length === 0) {
      showToast('Vui lòng chọn hình thức dùng thử (Nấu hoặc Khui nắp)', 'error');
      btn.disabled = false; btn.textContent = '📤 Gửi kế hoạch để duyệt'; loading(false);
      return;
    }
    const action = currentPlanId ? 'updatePlan' : 'createPlan';
    const res = await api('POST', { action, data, userCode: currentUser.code, planId: currentPlanId });
    if (res.success) {
      showToast(res.message || 'Thành công!', 'success', 4000);
      showScreen('plans');
      loadMyPlans();
    } else {
      showToast(res.error || 'Có lỗi xảy ra', 'error');
    }
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { btn.disabled = false; btn.textContent = '📤 Gửi kế hoạch để duyệt'; loading(false); }
}

function imageUploadBlock(key, title, required, maxAdd) {
  const reqDot = required ? '<div class="required-dot"></div>' : '';
  const optTag = !required
    ? '<span style="font-size:10px;background:var(--gray3);color:var(--gray2);border-radius:4px;padding:1px 6px;font-weight:600;">Tùy chọn</span>'
    : '';
  // iOS-safe pattern: <label> directly wraps visible UI + hidden input inside same label
  // iOS Safari respects label→input association when input is a direct child of the tapped label
  // Key: input must NOT use display:none — use opacity:0 + size:0 + position:absolute within label
  return `
    <div class="img-upload-section">
      <div class="img-upload-title">
        ${reqDot}${title} ${optTag}
        <span class="small text-gray" style="margin-left:auto;" id="count-${key}">0 / ${maxAdd} ảnh</span>
      </div>
      <div class="img-preview-grid" id="preview-${key}" style="min-height:0;"></div>
      <label id="upload-area-${key}" class="img-upload-area" style="display:block;margin-top:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;">
        <span class="img-upload-icon">📷</span>
        <span class="img-upload-text" id="upload-text-${key}" style="display:block;margin-top:4px;">Chụp / Chọn từ thư viện</span>
        <span style="display:block;font-size:11px;color:var(--gray2);margin-top:2px;">Nhấn nhiều lần để thêm nhiều ảnh</span>
        <input type="file"
          id="file-input-${key}"
          accept="image/*"
          multiple
          style="width:0.1px;height:0.1px;opacity:0;overflow:hidden;position:absolute;"
          onchange="handleImageSelect(event,'${key}',${maxAdd})">
      </label>
    </div>`;
}

async function handleImageSelect(event, key, maxAdd) {
  const files = Array.from(event.target.files);
  if (!files.length) return;

  const current   = reportFormData[key].length;
  const remaining = maxAdd - current;
  if (remaining <= 0) {
    showToast(`Đã đạt tối đa ${maxAdd} ảnh cho mục này`, 'error');
    event.target.value = '';
    return;
  }

  const toProcess = files.slice(0, remaining);
  const countEl   = document.getElementById(`count-${key}`);
  const previewEl = document.getElementById(`preview-${key}`);

  // Show processing indicator
  const processingEl = document.createElement('div');
  processingEl.style.cssText = 'font-size:11px;color:var(--gray2);padding:4px 0;grid-column:1/-1;';
  processingEl.textContent   = `⏳ Đang xử lý ${toProcess.length} ảnh...`;
  previewEl.appendChild(processingEl);

  for (const file of toProcess) {
    const compressed = await compressImage(file, TARGET_IMG_KB);
    reportFormData[key].push({ dataUrl: compressed.dataUrl, name: file.name, size: compressed.size });
    const idx  = reportFormData[key].length - 1;
    const item = document.createElement('div');
    item.className = 'img-preview-item';
    item.innerHTML = `
      <img src="${compressed.dataUrl}" style="width:100%;height:72px;object-fit:cover;border-radius:6px;display:block;">
      <div class="img-remove" onclick="removeImage('${key}',${idx},this.parentElement)">×</div>
      <div style="font-size:9px;color:var(--gray2);margin-top:2px;text-align:center;">${Math.round(compressed.size)}KB</div>`;
    previewEl.insertBefore(item, processingEl);
  }
  processingEl.remove();

  const total = reportFormData[key].length;
  if (countEl) countEl.textContent = `${total} / ${maxAdd} ảnh`;

  // Always reset input value — allows selecting same photo again on iOS
  event.target.value = '';

  if (files.length > remaining) {
    showToast(`Chỉ thêm được ${remaining} ảnh nữa (tối đa ${maxAdd})`, 'error');
  }

  // Update button text
  const textEl = document.getElementById(`upload-text-${key}`);
  if (textEl) {
    textEl.textContent = total >= maxAdd ? `Đã đủ ${maxAdd} ảnh` : `Thêm ảnh (${total}/${maxAdd})`;
  }
}

function removeImage(key, idx, el) {
  reportFormData[key].splice(idx, 1);
  el.remove();
  const maxMap = { imgLocation: 10, imgFood: 20, imgOverview: 20, imgOther: 40 };
  const maxAdd = maxMap[key] || 40;
  const total  = reportFormData[key].length;
  const countEl = document.getElementById(`count-${key}`);
  if (countEl) countEl.textContent = `${total} / ${maxAdd} ảnh`;
  const textEl = document.getElementById(`upload-text-${key}`);
  if (textEl) textEl.textContent = total > 0 ? `Thêm ảnh (${total}/${maxAdd})` : 'Chụp / Chọn từ thư viện';
}

// Client-side image compression using Canvas
function compressImage(file, targetKB) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const maxDim = 1280;
        if (w > maxDim || h > maxDim) {
          const ratio = Math.min(maxDim/w, maxDim/h);
          w = Math.round(w * ratio); h = Math.round(h * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);

        let quality = 0.85;
        const tryCompress = () => {
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          const sizeKB = Math.round((dataUrl.length * 3) / 4 / 1024);
          if (sizeKB <= targetKB || quality <= 0.3) {
            resolve({ dataUrl, size: sizeKB });
          } else {
            quality -= 0.1;
            tryCompress();
          }
        };
        tryCompress();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function submitReport() {
  const btn = document.getElementById('btn-submit-report');

  const isFirst = reportFormData._isFirstReport !== false;
  if (isFirst && reportFormData.imgLocation.length === 0) { showToast('Bắt buộc có hình tên địa điểm', 'error'); return; }
  if (isFirst && reportFormData.imgFood.length === 0)     { showToast('Bắt buộc có hình món ăn', 'error'); return; }
  if (isFirst && reportFormData.imgOverview.length === 0) { showToast('Bắt buộc có hình toàn cảnh', 'error'); return; }
  const actualTasters = parseInt(document.getElementById('r-tasters')?.value) || 0;
  if (isFirst && !actualTasters) { showToast('Vui lòng nhập số người thử', 'error'); return; }
  if (!isFirst && reportFormData.imgLocation.length === 0 && reportFormData.imgFood.length === 0 &&
      reportFormData.imgOverview.length === 0 && reportFormData.imgOther.length === 0 && !actualTasters) {
    showToast('Vui lòng nhập ít nhất số người thử hoặc 1 hình ảnh', 'error'); return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ Đang gửi...';

  // ── STEP 1: Upload ảnh lên Drive ──────────────────────────
  const totalImgCount = reportFormData.imgLocation.length + reportFormData.imgFood.length +
                        reportFormData.imgOverview.length + reportFormData.imgOther.length;
  const hasImages = totalImgCount > 0;
  let imgFolderUrl = '';
  let imgLocationUrls = [], imgFoodUrls = [], imgOverviewUrls = [], imgOtherUrls = [];
  let uploadOk = !hasImages; // if no images, treat as ok

  if (hasImages) {
    loading(true, `📤 Đang tải ${totalImgCount} ảnh lên Drive...`);
    try {
      const uploadRes = await api('POST', {
        action:   'uploadReportImages',
        planId:   currentPlanId,
        userCode: currentUser.code,
        images: {
          imgLocation: reportFormData.imgLocation.map(i => ({ name: i.name, dataUrl: i.dataUrl })),
          imgFood:     reportFormData.imgFood.map(i => ({ name: i.name, dataUrl: i.dataUrl })),
          imgOverview: reportFormData.imgOverview.map(i => ({ name: i.name, dataUrl: i.dataUrl })),
          imgOther:    reportFormData.imgOther.map(i => ({ name: i.name, dataUrl: i.dataUrl })),
        },
      });
      if (uploadRes.success && uploadRes.folders) {
        imgFolderUrl    = uploadRes.folders.root        || '';
        imgLocationUrls = uploadRes.folders.imgLocation || [];
        imgFoodUrls     = uploadRes.folders.imgFood     || [];
        imgOverviewUrls = uploadRes.folders.imgOverview || [];
        imgOtherUrls    = uploadRes.folders.imgOther    || [];
        uploadOk        = true;
        const uploaded  = uploadRes.uploaded || 0;
        const total     = uploadRes.total    || totalImgCount;
        if (uploaded < total) {
          // Partial upload — warn but continue (some images made it)
          showToast(`⚠️ Chỉ tải được ${uploaded}/${total} ảnh lên Drive. Báo cáo vẫn được ghi nhận.`, 'error', 6000);
        }
      } else {
        // Full upload failure — stop here, do not submit report
        loading(false);
        btn.disabled    = false;
        btn.textContent = '📊 Gửi báo cáo';
        const errMsg = uploadRes.error || 'Lỗi không xác định';
        showToast(`❌ Upload ảnh thất bại: ${errMsg}\nVui lòng thử lại.`, 'error', 8000);
        return;
      }
    } catch(e) {
      loading(false);
      btn.disabled    = false;
      btn.textContent = '📊 Gửi báo cáo';
      showToast('❌ Lỗi kết nối khi upload ảnh. Vui lòng kiểm tra mạng và thử lại.', 'error', 8000);
      console.error('[submitReport] upload error:', e.message);
      return;
    }
  }

  // ── STEP 2: Submit báo cáo với links ảnh ─────────────────
  loading(true, '📊 Đang lưu báo cáo...');
  const data = {
    actualTasters: actualTasters,
    actualSales:   parseFloat(document.getElementById('r-sales')?.value) || 0,
    feedback:      document.getElementById('r-feedback')?.value?.trim(),
    notes:         document.getElementById('r-notes')?.value?.trim(),
    samplesUsed:   reportFormData.samplesUsed,
    markCompleted: reportFormData.markCompleted,
    imgLocation:   imgLocationUrls,
    imgFood:       imgFoodUrls,
    imgOverview:   imgOverviewUrls,
    imgOther:      imgOtherUrls,
    imgFolderUrl:  imgFolderUrl,
  };
  try {
    const res = await api('POST', { action:'submitReport', planId: currentPlanId, data, userCode: currentUser.code });
    if (res.success) {
      const folderLink = imgFolderUrl
        ? ` <a href="${imgFolderUrl}" target="_blank" style="color:var(--teal);">📁 Xem ảnh</a>`
        : '';
      showToast('Báo cáo đã được ghi nhận! 🎉' + folderLink, 'success', 5000);
      showScreen('plans');
      loadMyPlans();
    } else {
      showToast(res.error || 'Có lỗi xảy ra', 'error');
    }
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { btn.disabled = false; btn.textContent = '📊 Gửi báo cáo'; loading(false); }
}

async function renderCalendar() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const monthStr = `${y}-${String(m+1).padStart(2,'0')}`;
  document.getElementById('cal-month-label').textContent =
    calMonth.toLocaleDateString('vi-VN', {month:'long', year:'numeric'});

  const el = document.getElementById('calendar-content');
  el.innerHTML = '<div class="empty-state"><div class="ai-loader"></div><div class="empty-sub">Đang tải lịch...</div></div>';

  try {
    const res = await api('GET', { action:'getCalendar', userCode: currentUser.code, month: monthStr });
    if (res.success && res.data) {
      calendarData = {};
      const rawKeys = Object.keys(res.data);

      Object.entries(res.data).forEach(([key, plans]) => {
        let normKey = key.trim();
        // Handle DD/MM/YYYY format
        if (/^\d{2}\/\d{2}\/\d{4}/.test(normKey)) {
          const parts = normKey.split('/');
          normKey = `${parts[2]}-${parts[1]}-${parts[0]}`;
        }
        // Handle DD/MM/YYYY HH:mm format
        else if (/^\d{2}\/\d{2}\/\d{4}\s/.test(normKey)) {
          const parts = normKey.substring(0,10).split('/');
          normKey = `${parts[2]}-${parts[1]}-${parts[0]}`;
        }
        // Trim to YYYY-MM-DD
        normKey = normKey.substring(0, 10);
        // Validate format
        if (!/^\d{4}-\d{2}-\d{2}$/.test(normKey)) {
          console.warn('[Calendar] Unexpected key format after normalize:', key, '->', normKey);
          // Try parsing as date if it's something else
          try {
            const d = new Date(key);
            if (!isNaN(d)) {
              const y = d.getFullYear(), mo = String(d.getMonth()+1).padStart(2,'0'), dy = String(d.getDate()).padStart(2,'0');
              normKey = `${y}-${mo}-${dy}`;
            }
          } catch(e2) {}
        }
        calendarData[normKey] = (calendarData[normKey] || []).concat(plans);
      });

      // Check if any keys match this month
      const matchingKeys = Object.keys(calendarData).filter(k => k.startsWith(monthStr));
    } else {
      console.warn('[Calendar] API returned no data:', res);
      calendarData = {};
    }
  } catch(e) { console.error('[Calendar] Load error:', e); calendarData = {}; }

  const today       = new Date(); today.setHours(0,0,0,0);
  const firstDay    = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const adjustedFirst = (firstDay + 6) % 7; // Mon=0

  // Status → color class mapping
  // cho_duyet=yellow, da_duyet=blue, hoan_thanh=green, tu_choi=gray, yeu_cau_chinh_sua=orange
  const getCalClass = (plans) => {
    if (!plans || plans.length === 0) return '';
    const statuses = plans.map(p => p.status);
    if (statuses.every(s => s === 'hoan_thanh')) return 'has-plan done';
    if (statuses.some(s => s === 'da_duyet'))    return 'has-plan approved';
    if (statuses.some(s => s === 'cho_duyet'))   return 'has-plan pending';
    if (statuses.some(s => s === 'yeu_cau_chinh_sua')) return 'has-plan needs-edit';
    return 'has-plan';
  };

  let html = `<div class="cal-grid">
    ${['T2','T3','T4','T5','T6','T7','CN'].map(d => `<div class="cal-day-label">${d}</div>`).join('')}
    ${Array(adjustedFirst).fill('<div class="cal-day empty"></div>').join('')}`;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${monthStr}-${String(d).padStart(2,'0')}`;
    const plans   = calendarData[dateStr] || calendarData[dateStr.replace(/-/g,'/')] || [];
    const isToday = new Date(y,m,d).getTime() === today.getTime();
    const hasPlan = plans.length > 0;
    const calCls  = isToday ? 'today' : getCalClass(plans);

    html += `<div class="cal-day ${calCls}" onclick="showCalDay('${dateStr}',${d})">
      <span>${d}</span>
      ${hasPlan ? `<div class="cal-dot"></div>` : ''}
      ${hasPlan && plans.length > 1 ? `<div style="font-size:8px;opacity:0.8;">${plans.length}</div>` : ''}
    </div>`;
  }
  html += '</div>';

  // Legend with all statuses
  html += `<div style="padding:8px 16px 4px;font-size:11px;font-weight:700;color:var(--gray2);text-transform:uppercase;">Chú thích</div>

// TIME FORMATTER
// =====================================================
function fmtTime(t) {
  if (!t) return '—';
  const s = String(t).trim();
  // Backend v2.3 trả về "HH:mm" chuẩn 24h (giờ VN) — hiển thị nguyên
  const hm = s.match(/^(\d{1,2}):(\d{2})/);
  if (hm) return ('0' + hm[1]).slice(-2) + ':' + hm[2];
  // Dữ liệu ISO cũ "1899-12-30T07:00..." — lấy đúng phần giờ, KHÔNG cộng bù
  const iso = s.match(/T(\d{1,2}):(\d{2})/);
  if (iso) return ('0' + iso[1]).slice(-2) + ':' + iso[2];
  return s.substring(0, 5);
}

    <div class="dash-kpi-value">${value}</div>

}

/** Compute all stats from a list of plans + their reports */
function computePersonalStats(plans) {
  const stats = {
    total:        plans.length,
    done:         plans.filter(p => p.status === 'hoan_thanh').length,
    approved:     plans.filter(p => p.status === 'da_duyet').length,
    pending:      plans.filter(p => p.status === 'cho_duyet').length,
    needsEdit:    plans.filter(p => p.status === 'yeu_cau_chinh_sua').length,
    rejected:     plans.filter(p => p.status === 'tu_choi').length,
    locations:    new Set(plans.map(p => p.locationName)).size,

    // Cost aggregates (from plan estimates)
    totalCost:    0, pgCost: 0, locationCost: 0, giftCost: 0,

    // Effectiveness from reports
    totalTasters:  0, totalSales: 0, reportCount: 0,

    // By location: { name: { tasters, sales, events, cost } }
    byLocation: {},

    // Monthly breakdown: { 'YYYY-MM': { events, done, tasters, sales, cost } }
    byMonth: {},
  };

  plans.forEach(p => {
    const month = String(p.date || '').substring(0, 7);
    if (!stats.byMonth[month]) stats.byMonth[month] = { month, events:0, done:0, tasters:0, sales:0, cost:0 };
    stats.byMonth[month].events++;
    if (p.status === 'hoan_thanh') stats.byMonth[month].done++;

    const ch = (p.region||'').toUpperCase().startsWith('GT') ? 'GT' : 'MT';
    const pgRate = ch === 'GT' ? 50000 : 45000;
    const pCost  = p.hiresPg ? (p.pgCount||0)*(p.pgHours||0)*pgRate : 0;
    const lCost  = Number(p.locationCost) || 0;
    const gCost  = (p.gifts||[]).reduce((s,g)=>(s+(Number(g.so_luong||0)*Number(g.gia_tri||0))),0);
    const totC   = pCost + lCost + gCost;

    stats.pgCost       += pCost;
    stats.locationCost += lCost;
    stats.giftCost     += gCost;
    stats.totalCost    += totC;
    stats.byMonth[month].cost += totC;

    // Reports
    (p.reports || []).forEach(r => {
      const t = Number(r.actualTasters) || 0;
      const s = Number(r.actualSales)   || 0;
      stats.totalTasters  += t;
      stats.totalSales    += s;
      stats.reportCount++;
      stats.byMonth[month].tasters += t;
      stats.byMonth[month].sales   += s;
    });

    // By location
    const loc = p.locationName || '—';
    if (!stats.byLocation[loc]) stats.byLocation[loc] = { name:loc, events:0, tasters:0, sales:0, cost:0 };
    stats.byLocation[loc].events++;
    stats.byLocation[loc].cost += totC;
    (p.reports||[]).forEach(r => {
      stats.byLocation[loc].tasters += Number(r.actualTasters)||0;
      stats.byLocation[loc].sales   += Number(r.actualSales)||0;
    });
  });

  // Sort months
  stats.sortedMonths = Object.values(stats.byMonth).sort((a,b)=>a.month.localeCompare(b.month));

  // Top locations by tasters
  stats.topLocations = Object.values(stats.byLocation)
    .sort((a,b)=>b.tasters-a.tasters).slice(0, 8);

  // Effectiveness
  const donePlans = plans.filter(p => p.status === 'hoan_thanh');
  stats.effRate   = plans.length > 0 ? Math.round((stats.done/plans.length)*100) : 0;
  stats.avgTasters = donePlans.length > 0
    ? Math.round(stats.totalTasters / Math.max(stats.reportCount, donePlans.length)) : 0;
  stats.cpContact  = stats.totalTasters > 0
    ? Math.round(stats.totalCost / stats.totalTasters) : 0;

  return stats;
}

/** Build cost breakdown section */
function buildCostSection(stats) {
  if (stats.totalCost === 0) return `<div class="info-banner">💰 Chưa có dữ liệu chi phí</div>`;
  const items = [
    { label: 'Chi phí PG',          val: stats.pgCost,       icon: '👥', color: 'var(--teal)' },
    { label: 'Chi phí địa điểm',    val: stats.locationCost, icon: '📍', color: 'var(--navy)' },
    { label: 'Quà tặng NTD',        val: stats.giftCost,     icon: '🎁', color: 'var(--yellow2)' },
  ];
  const maxVal = Math.max(...items.map(i=>i.val), 1);

  let html = `<div style="background:var(--white);border-radius:var(--radius);margin:0 16px 12px;box-shadow:var(--shadow);">
    <div style="padding:12px 16px 8px;border-bottom:1px solid var(--gray3);display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:13px;font-weight:700;color:var(--navy);">💰 Chi phí sampling</span>
      <span style="font-size:14px;font-weight:800;color:var(--red);">${fmtCurrency(stats.totalCost)}</span>
    </div>
    <div style="padding:12px 16px;">`;

  items.forEach(item => {
    const pct = Math.round((item.val/stats.totalCost)*100);
    const barW = Math.round((item.val/maxVal)*100);
    html += `<div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">
        <span>${item.icon} ${item.label}</span>
        <span style="font-weight:600;">${fmtCurrency(item.val)} <span style="color:var(--gray2);font-weight:400;">(${pct}%)</span></span>
      </div>
      <div class="bar-track" style="height:8px;">
        <div class="bar-fill" style="width:${barW}%;background:${item.color};height:100%;"></div>
      </div>
    </div>`;
  });

  if (stats.totalTasters > 0) {
    html += `<div style="border-top:1px solid var(--gray3);padding-top:10px;display:flex;justify-content:space-between;font-size:12px;">
      <span style="color:var(--gray2);">Chi phí / người thử</span>
      <span style="font-weight:700;color:var(--red);">${fmtCurrency(stats.cpContact)}</span>
    </div>`;
  }
  html += `</div></div>`;
  return html;
}

/** Build top locations section */
function buildTopLocSection(topLocations) {
  if (!topLocations || topLocations.length === 0) return '';
  const maxT = Math.max(...topLocations.map(l=>l.tasters), 1);
  let html = `<div style="background:var(--white);border-radius:var(--radius);margin:0 16px 12px;box-shadow:var(--shadow);">
    <div style="padding:12px 16px 8px;font-size:13px;font-weight:700;color:var(--navy);border-bottom:1px solid var(--gray3);">
      🏆 Điểm sampling hiệu quả nhất
    </div>`;
  const medals = ['🥇','🥈','🥉'];
  topLocations.slice(0,5).forEach((loc, i) => {
    const barW = Math.round((loc.tasters/maxT)*100);
    html += `<div style="padding:10px 16px;border-bottom:1px solid var(--gray3);">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
        <span style="font-size:16px;">${medals[i]||'·'}</span>
        <span style="font-size:13px;font-weight:600;flex:1;">${loc.name}</span>
        <span style="font-size:12px;font-weight:700;color:var(--red);">${fmtNum(loc.tasters)} người</span>
      </div>
      ${loc.tasters > 0 ? `<div style="margin-left:24px;"><div class="bar-track" style="height:6px;"><div class="bar-fill" style="width:${barW}%;background:var(--red);height:100%;"></div></div></div>` : ''}
      <div style="margin-left:24px;font-size:11px;color:var(--gray2);margin-top:3px;">
        ${loc.events} buổi · Doanh số: ${fmtCurrency(loc.sales)}

    </div>`;
  });
  html += `</div>`;
  return html;
}

      <div style="font-size:8px;color:var(--gray2);margin-top:1px;line-height:1.3;">${item.label}</div>
    </div>`).join('')}
  </div>`;

  // ── KPI CARDS ──
  html += `<div class="dash-kpi-grid four">
    ${kpiCard('Tổng buổi', s.total, s.done + ' hoàn thành', 'red', '📋')}
    ${kpiCard('Khách tiếp cận', fmtNum(s.totalTasters), 'người thử mẫu', 'green', '👥')}

  // Alerts
  if (s.pending > 0 || s.needsEdit > 0) {
    html += `<div style="padding:0 16px 6px;display:flex;gap:6px;flex-wrap:wrap;">`;
    if (s.pending > 0)   html += `<div class="status-chip status-cho_duyet" style="padding:5px 12px;">⏳ ${s.pending} chờ duyệt</div>`;
    if (s.needsEdit > 0) html += `<div class="status-chip status-yeu_cau_chinh_sua" style="padding:5px 12px;">✏️ ${s.needsEdit} cần chỉnh sửa</div>`;
    html += `</div>`;
  }

  // ── UPCOMING ──
  if (upcoming.length > 0) {
    html += sectionTitle('📅 Kế hoạch sắp thực hiện');
    html += '<div style="padding:0 16px 4px;">';
    upcoming.forEach(p => {
      html += `<div class="plan-card" style="margin:0 0 8px;" onclick="viewPlanDetail('${p.id}')">
        <div class="plan-card-top">
          <div>
            <div class="plan-card-name">${p.locationName}</div>
            <div style="font-size:11px;color:var(--gray2);">📅 ${fmtDateRange(p)} · ⏰ ${fmtTime(p.timeStart)}–${fmtTime(p.timeEnd)}</div>
          </div>
          <span class="status-chip status-da_duyet">✅ Đã duyệt</span>
        </div>
      </div>`;
    });
    html += '</div>';
  }

  // ── COST ──
  html += sectionTitle('💰 Chi phí sampling');
  html += buildCostSection(s);

  // ── TOP LOCATIONS ──
  if (s.topLocations.length > 0) html += buildTopLocSection(s.topLocations);

  // ── MONTHLY ──
  if (s.sortedMonths.length > 0) html += buildMonthTrendSection(s.sortedMonths, month);

  html += '<div class="spacer"></div></div>';
  el.innerHTML = html;
}

/** v2.8: sau duyệt/từ chối/yêu cầu sửa → làm tươi ĐÚNG màn đang mở + badge. */
function afterApprovalAction(planId) {
  if (window._planCache) delete window._planCache[planId];
  const active = document.querySelector('.screen.active');
  const id = active ? active.id : '';
  if (id === 'screen-plan-detail') viewPlanDetail(planId);
  else if (id === 'screen-plans')  loadMyPlans();
  else                             loadDashboard();
  loadApprovalBadge();
}
function detailRequestEdit(planId) {
  const p = (window._planCache && window._planCache[planId]) || {};
  commentModal(planId, String(p.locationName || planId).replace(/'/g, "\\'"));
}

async function quickApprove(planId) {
  if (!confirm('Duyệt kế hoạch ' + planId + ' (không điều chỉnh)?')) return;
  loading(true, 'Đang duyệt...');
  try {
    const res = await api('POST', { action:'approvePlan', planId, data:{}, userCode: currentUser.code });
    if (res.success) {
      showToast('✅ Đã duyệt thành công!', 'success');
      afterApprovalAction(planId);
    } else showToast(res.error, 'error');
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

function rejectModal(planId) {
  showModal('❌ Từ chối kế hoạch', `
    <div style="font-size:14px;color:var(--gray);margin-bottom:12px;">Kế hoạch: <b>${planId}</b></div>
    <div class="form-field"><label class="required">Lý do từ chối</label>
    <textarea class="form-input" id="reject-reason" placeholder="Nhập lý do..." style="min-height:100px;"></textarea></div>`,
    [
      { label: 'Hủy', action: 'closeModal()', cls: 'btn-secondary' },
      { label: '❌ Từ chối', action: `doReject('${planId}')`, cls: 'btn-danger' },
    ]
  );
}
async function doReject(planId) {
  const reason = document.getElementById('reject-reason')?.value?.trim();
  if (!reason) { showToast('Vui lòng nhập lý do', 'error'); return; }
  closeModal(); loading(true, 'Đang xử lý...');
  try {
    const res = await api('POST', { action:'rejectPlan', planId, reason, userCode: currentUser.code });
    if (res.success) { showToast('Đã từ chối kế hoạch', 'success'); afterApprovalAction(planId); }
    else showToast(res.error, 'error');
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

function toggleGiftApproval() {

  if (btn) { btn.textContent = window._giftApproved ? '✅ Đồng ý' : 'Từ chối'; btn.style.background = window._giftApproved ? 'var(--green)' : 'var(--gray3)'; btn.style.color = window._giftApproved ? '#fff' : 'var(--navy)'; }

function addExtraGift() {
  const list = document.getElementById('extra-gifts-list');
  if (!list) return;
  const idx = window._extraGifts.length;
  window._extraGifts.push({ ten:'', so_luong:0, gia_tri:0 });
  const div = document.createElement('div');
  div.style.cssText = 'display:grid;grid-template-columns:1fr 60px 80px 28px;gap:6px;align-items:center;';
  div.innerHTML = `
    <input class="form-input" type="text" placeholder="Tên quà..." style="padding:8px;" oninput="window._extraGifts[${idx}].ten=this.value">

}

async function doInlineApprove(planId) {
  const plan = window._editingPlan;
  // Collect adjusted samples
  const adjustedSamples = (plan.samples||[]).map((s,i) => ({
    ma: s.ma,
    so_luong: parseInt(document.getElementById(`edit-sample-${i}`)?.value) || 0,
  })).filter(s => s.so_luong > 0);

  // Collect PG adjustments
  const pgCount = parseInt(document.getElementById('edit-pg-count')?.value) || plan.pgCount || 0;
  const pgStart = document.getElementById('edit-pg-start')?.value || '';
  const pgEnd   = document.getElementById('edit-pg-end')?.value   || '';
  const pgHours = pgStart && pgEnd ? calcHoursDiff(pgStart, pgEnd) : (plan.pgHours || 0);

  // Collect gift approval
  let approvedGifts = [];
  if (plan.hasGift && window._giftApproved) {
    approvedGifts.push({
      ten:       document.getElementById('edit-gift-name')?.value || '',
      so_luong:  parseInt(document.getElementById('edit-gift-qty')?.value) || 0,
      gia_tri:   parseFloat(document.getElementById('edit-gift-value')?.value) || 0,
    });
    approvedGifts = approvedGifts.concat(window._extraGifts.filter(g => g.ten));
  }

  const notes = document.getElementById('edit-approval-note')?.value?.trim() || '';

  closeModal();
  loading(true, 'Đang duyệt...');
  try {
    const res = await api('POST', {
      action: 'approvePlan', planId,
      data: { samples: adjustedSamples, pgCount, pgHours, pgStart, pgEnd, gifts: approvedGifts, notes, giftApproved: window._giftApproved },
      userCode: currentUser.code,
    });
    if (res.success) {
      showToast('✅ Đã duyệt kế hoạch thành công!', 'success');
      afterApprovalAction(planId);
    } else showToast(res.error || 'Có lỗi xảy ra', 'error');
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
  finally { loading(false); }
}

// =====================================================
// DASHBOARD KPI (v2.7) — Manager & Marketing
//   1 lần gọi getDashboardKPI (24 tháng) → mọi bộ lọc tính ngay trên máy, không gọi lại server.
//   Biểu đồ tự vẽ bằng CSS (không thư viện ngoài) — ưu tiên bảng.
// =====================================================
let kpiData = null;
let kpiState = { period: '', ch: 'all', vg: 'all', mx: 'ht', tb: 'sal', staffAll: false };
const KPI_ACTIVE  = ['da_duyet', 'hoan_thanh'];       // chi phí cam kết (đã duyệt + hoàn thành)
const KPI_VOID    = ['tu_choi', 'da_huy'];            // không tính vào kế hoạch
const KPI_CH      = ['MT', 'GT'];
const KPI_VG      = ['Bắc', 'Trung', 'Nam', 'Toàn quốc'];
const KPI_LOADER  = '<div class="empty-state"><div class="ai-loader"></div><div class="empty-sub">Đang tải...</div></div>';

function setDashTitle(t) { const el = document.getElementById('dash-header-title'); if (el) el.textContent = t; }

function openKpiDashboard() {
  showScreen('dashboard'); mgrTab = 'kpi'; setupDashboardForRole(); updateSidebarActive(); loadKpiDashboard();
  ['home','plans','approval','dashboard'].forEach(k => { const b = document.getElementById('mnav-' + k); if (b) b.classList.toggle('active', k === 'dashboard'); });
}
function openApprovalBoard() {
